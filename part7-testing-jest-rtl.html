<script>var CARDS = [{"sect": 1, "num": "✓", "kicker": "Part 7 · Testing", "h": "Jest &amp; React Testing Library, <span class=\"grad\">properly<\/span>", "p": "How Jest actually runs your tests, how jsdom fakes a browser, mocks vs spies, time and async, then React Testing Library the way its authors intend: queries, userEvent, act(), MSW, hooks, and flake. Ends with a lab.", "badge": "~38 min · 64 cards · 8 quizzes", "first": true}, {"sect": 1, "num": "1", "kicker": "Section 1 · The runtime", "h": "What happens when you type <span class=\"grad\">npx jest<\/span>", "p": "Before writing a single assertion, know the machine: discovery, transforms, isolated module registries, and the fake DOM."}, {"k": "Big picture", "h": "Where unit and component tests sit", "v": "<svg viewBox=\"0 0 320 180\"><polygon class=\"pop\" style=\"--d:.6s\" points=\"160,10 200,60 120,60\" fill=\"rgba(255,92,138,.3)\" stroke=\"#ff5c8a\"/><text x=\"160\" y=\"50\" fill=\"#fff\" font-size=\"9\" text-anchor=\"middle\">E2E<\/text><polygon class=\"pop\" style=\"--d:.3s\" points=\"120,64 200,64 245,118 75,118\" fill=\"rgba(78,168,255,.25)\" stroke=\"#4ea8ff\"/><text x=\"160\" y=\"96\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\">Component / integration (RTL)<\/text><polygon class=\"pop\" points=\"72,122 248,122 300,174 20,174\" fill=\"rgba(61,220,151,.22)\" stroke=\"#3ddc97\"/><text x=\"160\" y=\"152\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\">Unit (pure functions, hooks)<\/text><text x=\"300\" y=\"34\" fill=\"#5d6680\" font-size=\"9\" text-anchor=\"end\">Playwright (Part 11)<\/text><\/svg>", "p": "<b>Jest<\/b> is a test runner, assertion library and mocking framework in one package. <b>React Testing Library (RTL)<\/b> is a small layer that renders React components into a fake DOM and lets you query it like a user. Most frontend confidence comes from the middle band: render a real component tree, fake only the network.", "an": "Roughly JUnit + Mockito, or RSpec + rspec-mocks, in one dependency."}, {"k": "Step by step", "h": "The life of one test run", "v": "<ol class=\"steps\"><li style=\"--d:0.0s\"><span>Read config; find test files via <code>testMatch<\/code> (<code>*.test.tsx<\/code>, <code>__tests__/<\/code>)<\/span><\/li><li style=\"--d:0.6s\"><span>Spawn <b>worker processes<\/b> (CPU cores − 1); one file runs in one worker<\/span><\/li><li style=\"--d:1.2s\"><span>Per file: fresh <b>module registry<\/b> + fresh <b>environment<\/b> (node or jsdom)<\/span><\/li><li style=\"--d:1.8s\"><span>Run <code>setupFiles<\/code>, then <code>setupFilesAfterEnv<\/code> (jest-dom, MSW server)<\/span><\/li><li style=\"--d:2.4s\"><span><b>Transform<\/b> imports (TS/JSX → JS) via Babel, ts-jest or SWC, cached<\/span><\/li><li style=\"--d:3.0s\"><span>Collect <code>describe<\/code>/<code>it<\/code>, run hooks and tests, report, exit non-zero on failure<\/span><\/li><\/ol>", "p": "Key consequence: test files are isolated from each other (separate registries and globals), but tests <b>inside<\/b> one file share module state. Leaks happen within a file, not across files."}, {"k": "Isolation", "h": "Each file gets its own world", "v": "<svg viewBox=\"0 0 320 170\"><g class=\"rise\"><rect x=\"8\" y=\"10\" width=\"96\" height=\"150\" rx=\"12\" fill=\"#13243a\" stroke=\"#4ea8ff\"/><text x=\"56\" y=\"30\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\">worker 1<\/text><rect x=\"18\" y=\"42\" width=\"76\" height=\"48\" rx=\"8\" fill=\"#0d111b\" stroke=\"#2a3145\"/><text x=\"56\" y=\"62\" fill=\"#cfd6ea\" font-size=\"9\" text-anchor=\"middle\">a.test.tsx<\/text><text x=\"56\" y=\"76\" fill=\"#5d6680\" font-size=\"8\" text-anchor=\"middle\">jsdom + registry<\/text><rect x=\"18\" y=\"100\" width=\"76\" height=\"48\" rx=\"8\" fill=\"#0d111b\" stroke=\"#2a3145\"/><text x=\"56\" y=\"120\" fill=\"#cfd6ea\" font-size=\"9\" text-anchor=\"middle\">c.test.tsx<\/text><text x=\"56\" y=\"134\" fill=\"#5d6680\" font-size=\"8\" text-anchor=\"middle\">fresh again<\/text><\/g><g class=\"rise\" style=\"--d:.3s\"><rect x=\"112\" y=\"10\" width=\"96\" height=\"150\" rx=\"12\" fill=\"#13243a\" stroke=\"#4ea8ff\"/><text x=\"160\" y=\"30\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\">worker 2<\/text><rect x=\"122\" y=\"42\" width=\"76\" height=\"48\" rx=\"8\" fill=\"#0d111b\" stroke=\"#2a3145\"/><text x=\"160\" y=\"62\" fill=\"#cfd6ea\" font-size=\"9\" text-anchor=\"middle\">b.test.ts<\/text><text x=\"160\" y=\"76\" fill=\"#5d6680\" font-size=\"8\" text-anchor=\"middle\">node env<\/text><\/g><g class=\"rise\" style=\"--d:.6s\"><rect x=\"216\" y=\"10\" width=\"96\" height=\"150\" rx=\"12\" fill=\"rgba(255,92,138,.1)\" stroke=\"#ff5c8a\"/><text x=\"264\" y=\"30\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\">inside 1 file<\/text><text x=\"264\" y=\"60\" fill=\"#cfd6ea\" font-size=\"9\" text-anchor=\"middle\">test A sets cache<\/text><text x=\"264\" y=\"80\" fill=\"#ff5c8a\" font-size=\"12\" text-anchor=\"middle\" class=\"blink\">↓ leaks<\/text><text x=\"264\" y=\"100\" fill=\"#cfd6ea\" font-size=\"9\" text-anchor=\"middle\">test B sees it<\/text><text x=\"264\" y=\"132\" fill=\"#5d6680\" font-size=\"8\" text-anchor=\"middle\">reset in afterEach<\/text><\/g><\/svg>", "p": "Module-level singletons (a cache, a store, a QueryClient created at import time) survive between tests in the same file. Create them per test, or reset in <code>afterEach<\/code>."}, {"k": "Config", "h": "A realistic jest.config.ts", "cmp": [["TS", "import type { Config } from 'jest';\n\nconst config: Config = {\n  testEnvironment: 'jsdom',            // browser-like globals\n  setupFilesAfterEnv: ['<rootDir>/jest.setup.ts'],\n  transform: { '^.+\\\\.(t|j)sx?$': '@swc/jest' }, // or ts-jest / babel-jest\n  moduleNameMapper: {\n    '\\\\.(css|scss)$': 'identity-obj-proxy', // CSS imports\n    '^@/(.*)$': '<rootDir>/src/$1',          // path alias\n  },\n  clearMocks: true,                    // reset call history each test\n  restoreMocks: true,                  // undo spyOn each test\n};\nexport default config;", "jest.config.ts"], ["TS", "// jest.setup.ts\nimport '@testing-library/jest-dom'; // toBeInTheDocument etc.", "setup"]], "p": "<code>moduleNameMapper<\/code> must mirror your bundler/tsconfig aliases, or imports that work in the app fail in tests. Jest does not read <code>tsconfig<\/code> paths on its own."}, {"k": "Transforms", "h": "Jest does not type-check", "v": "<div class=\"g2\"><div class=\"box rise ok\" style=\"--d:0.00s\"><b>babel-jest / @swc/jest<\/b><br><small>strip types, fast, no type errors reported<\/small><\/div><div class=\"box rise \" style=\"--d:0.12s\"><b>ts-jest<\/b><br><small>can type-check, slower; <code>isolatedModules<\/code> makes it fast but skips checks<\/small><\/div><div class=\"box rise warn\" style=\"--d:0.24s\"><b>ESM packages<\/b><br><small><code>node_modules<\/code> is not transformed by default; ESM-only deps crash<\/small><\/div><div class=\"box rise \" style=\"--d:0.36s\"><b>fix<\/b><br><small>add them to <code>transformIgnorePatterns<\/code> exceptions, or use Vitest<\/small><\/div><\/div>", "p": "A green Jest run says nothing about types. Run <code>tsc --noEmit<\/code> separately in CI. \"Unexpected token export\" almost always means an ESM-only dependency was not transformed."}, {"k": "jsdom", "h": "A browser without a screen", "v": "<div class=\"g2\"><div class=\"box rise ok\" style=\"--d:0.00s\"><b>Has<\/b><br><small><code>document<\/code>, <code>window<\/code>, events, <code>localStorage<\/code>, forms, <code>fetch<\/code> (Node 18+)<\/small><\/div><div class=\"box rise warn\" style=\"--d:0.12s\"><b>Missing<\/b><br><small>layout (sizes are 0), <code>IntersectionObserver<\/code>, <code>matchMedia<\/code>, <code>ResizeObserver<\/code>, canvas, real navigation<\/small><\/div><div class=\"box rise \" style=\"--d:0.24s\"><b>Consequence<\/b><br><small>anything that depends on measuring elements cannot be tested here<\/small><\/div><div class=\"box rise \" style=\"--d:0.36s\"><b>Use instead<\/b><br><small>Playwright for layout, scrolling, real CSS<\/small><\/div><\/div>", "p": "jsdom is a JavaScript implementation of the DOM spec running in Node. It parses HTML and dispatches events, but never paints. <code>getBoundingClientRect()<\/code> returns zeros."}, {"k": "jsdom", "h": "Polyfilling what is missing", "cmp": [["TS", "// jest.setup.ts\nObject.defineProperty(window, 'matchMedia', {\n  writable: true,\n  value: (query: string) => ({\n    matches: false, media: query, onchange: null,\n    addEventListener: jest.fn(), removeEventListener: jest.fn(),\n    addListener: jest.fn(), removeListener: jest.fn(), dispatchEvent: jest.fn(),\n  }),\n});\n\nclass IO { observe() {} unobserve() {} disconnect() {} }\n(globalThis as any).IntersectionObserver = IO;", "setup"]], "p": "Keep polyfills in one setup file so every test sees the same environment. If a component needs a real observer to behave, that behaviour belongs in an E2E test."}, {"k": "Runtime gotchas", "h": "Caveats &amp; gotchas", "v": "<ul class=\"chk\"><li class=\"rise\" style=\"--d:0.00s\"><b>Watch mode<\/b> (<code>jest --watch<\/code>) only reruns files related to changed files via git; use <code>--watchAll<\/code> if it misses something.<\/li><li class=\"rise\" style=\"--d:0.12s\"><code>testEnvironment: node<\/code> for pure logic is faster than jsdom. Set it per file with a <code>/** @jest-environment node */<\/code> docblock.<\/li><li class=\"rise\" style=\"--d:0.24s\"><code>clearMocks<\/code> resets calls; <code>resetMocks<\/code> also drops implementations; <code>restoreMocks<\/code> undoes <code>spyOn<\/code>. Know which one your config uses.<\/li><li class=\"rise\" style=\"--d:0.36s\">Coverage counts lines executed, not behaviour verified. 90% coverage with no assertions is possible.<\/li><li class=\"rise\" style=\"--d:0.48s\">Worker crashes on CI are often memory: try <code>--maxWorkers=50%<\/code> or <code>--runInBand<\/code> to diagnose.<\/li><\/ul>"}, {"quiz": true, "k": "Quiz 1 / 8 · Runtime", "h": "Test B fails only when test A in the <b>same file<\/b> runs first. Most likely cause?", "opts": [["Jest runs files in random order", 0], ["Shared module-level state that A mutated", 1], ["jsdom is shared across all files", 0]], "right": "Files are isolated from each other; tests within a file share the module registry. Reset or recreate state per test.", "wrong": "It is <b>shared state inside the file<\/b>. Each file gets its own jsdom and registry, but tests in that file share them."}, {"k": "Section 1 · Go deeper", "h": "Go deeper", "v": "<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.00s;text-decoration:none;display:block\" href=\"https://jestjs.io/docs/configuration\" target=\"_blank\" rel=\"noopener\"><b>Jest docs: Configuring Jest ↗<\/b><br><small>every option above, with defaults<\/small><\/a><a class=\"box rise\" style=\"--d:0.15s;text-decoration:none;display:block\" href=\"https://jestjs.io/docs/getting-started\" target=\"_blank\" rel=\"noopener\"><b>Jest docs: Getting Started ↗<\/b><br><small>Babel/TypeScript setup and transforms<\/small><\/a><a class=\"box rise\" style=\"--d:0.30s;text-decoration:none;display:block\" href=\"https://frontendmasters.com/courses/testing/\" target=\"_blank\" rel=\"noopener\"><b>Frontend Masters: Testing Fundamentals ↗<\/b><br><small>a full course on unit and integration testing<\/small><\/a><\/div>", "p": "Optional, but worth it. Tap a card to open it in a new tab."}, {"sect": 1, "num": "2", "kicker": "Section 2 · Assertions &amp; doubles", "h": "Matchers, mocks and spies", "p": "The assertion vocabulary, then the three kinds of test double Jest gives you and when each one is the right tool."}, {"k": "Matchers", "h": "Equality is three different questions", "v": "<div class=\"vs\" style=\"grid-template-columns:86px 1fr 1fr\"><div class=\"vl\"><\/div><div class=\"vh data\">passes when<\/div><div class=\"vh code\">use for<\/div><div class=\"vl\" style=\"display:block;align-self:center;word-break:break-word;text-transform:none;letter-spacing:0;font-size:11px;color:#cfd6ea\"><code>toBe<\/code><\/div><div class=\"rise\" style=\"--d:0.0s\">same reference (<code>Object.is<\/code>)<\/div><div class=\"rise\" style=\"--d:0.0s\">primitives<\/div><div class=\"vl\" style=\"display:block;align-self:center;word-break:break-word;text-transform:none;letter-spacing:0;font-size:11px;color:#cfd6ea\"><code>toEqual<\/code><\/div><div class=\"rise\" style=\"--d:0.2s\">same structure<\/div><div class=\"rise\" style=\"--d:0.2s\">objects, arrays<\/div><div class=\"vl\" style=\"display:block;align-self:center;word-break:break-word;text-transform:none;letter-spacing:0;font-size:11px;color:#cfd6ea\"><code>toStrictEqual<\/code><\/div><div class=\"rise\" style=\"--d:0.4s\">+ undefined keys, class<\/div><div class=\"rise\" style=\"--d:0.4s\">exact shapes<\/div><\/div>", "cmp": [["TS", "expect(2 + 2).toBe(4);\nexpect({ id: 1 }).toEqual({ id: 1 });        // structural\nexpect({ id: 1, x: undefined }).toEqual({ id: 1 });       // passes\nexpect({ id: 1, x: undefined }).toStrictEqual({ id: 1 }); // fails\nexpect(user).toMatchObject({ role: 'admin' }); // subset\nexpect(list).toContainEqual({ id: 3 });\nexpect(fn).toThrow(/not found/);\nexpect(value).toBeCloseTo(0.3);              // floats", "matchers"]], "p": "Asymmetric matchers let you be loose where it does not matter: <code>expect.any(String)<\/code>, <code>expect.objectContaining({...})<\/code>, <code>expect.stringMatching(/id-/)<\/code>.", "lab": true}, {"k": "Matchers", "h": "jest-dom: assertions about the DOM", "cmp": [["TSX", "expect(screen.getByRole('button', { name: 'Save' })).toBeDisabled();\nexpect(screen.getByText('Saved')).toBeVisible();\nexpect(screen.getByRole('textbox')).toHaveValue('hello');\nexpect(screen.getByRole('alert')).toHaveTextContent(/failed/i);\nexpect(screen.queryByRole('dialog')).not.toBeInTheDocument();\nexpect(link).toHaveAttribute('href', '/tasks/1');\nexpect(input).toHaveAccessibleName('Email');", "@testing-library/jest-dom"]], "p": "These give readable failure messages (\"expected button to be disabled\") instead of <code>expected false to be true<\/code>. Prefer them to <code>expect(el.disabled).toBe(true)<\/code>."}, {"k": "Test doubles", "h": "Three tools, three jobs", "v": "<div class=\"g2\"><div class=\"box rise \" style=\"--d:0.00s\"><b><code>jest.fn()<\/code><\/b><br><small>a standalone fake function: records calls, returns what you tell it<\/small><\/div><div class=\"box rise ok\" style=\"--d:0.12s\"><b><code>jest.spyOn(obj, \"m\")<\/code><\/b><br><small>wraps a real method on a real object; can pass through or override<\/small><\/div><div class=\"box rise warn\" style=\"--d:0.24s\"><b><code>jest.mock(\"./mod\")<\/code><\/b><br><small>replaces a whole module for every importer in this file<\/small><\/div><div class=\"box rise \" style=\"--d:0.36s\"><b>rule of thumb<\/b><br><small>fn for callbacks you pass in · spyOn for one method · mock for boundaries you cannot inject<\/small><\/div><\/div>", "p": "Pick the smallest double that isolates what you need. Mocking whole modules is powerful but makes tests lie when the real module changes."}, {"k": "jest.fn", "h": "Callbacks and return values", "cmp": [["TSX", "const onSave = jest.fn();\nrender(<TaskForm onSave={onSave} />);\nawait user.type(screen.getByLabelText('Title'), 'Write docs');\nawait user.click(screen.getByRole('button', { name: 'Save' }));\n\nexpect(onSave).toHaveBeenCalledTimes(1);\nexpect(onSave).toHaveBeenCalledWith({ title: 'Write docs' });\n\nconst getId = jest.fn()\n  .mockReturnValueOnce('a')\n  .mockReturnValue('z');      // a, z, z, ...\nconst load = jest.fn().mockResolvedValue({ ok: true }); // async", "jest.fn"]], "p": "<code>mock.calls<\/code> is an array of argument arrays if you need to dig in: <code>onSave.mock.calls[0][0]<\/code>."}, {"k": "jest.mock", "h": "How module mocking really works", "v": "<ol class=\"steps\"><li style=\"--d:0.0s\"><span>Babel/SWC <b>hoists<\/b> <code>jest.mock(...)<\/code> calls above your imports<\/span><\/li><li style=\"--d:0.6s\"><span>When any file imports <code>./api<\/code>, the registry hands back the mock instead<\/span><\/li><li style=\"--d:1.2s\"><span>With a factory, you control the exports; without one, Jest <b>automocks<\/b> every export to <code>jest.fn()<\/code><\/span><\/li><li style=\"--d:1.8s\"><span><code>jest.requireActual<\/code> lets you keep the real parts (partial mock)<\/span><\/li><\/ol>", "cmp": [["TS", "jest.mock('./api', () => ({\n  ...jest.requireActual('./api'),\n  fetchTasks: jest.fn(),        // only this one is fake\n}));\nimport { fetchTasks } from './api';\nconst mocked = jest.mocked(fetchTasks); // typed\nmocked.mockResolvedValue([{ id: 1, title: 'A' }]);", "partial mock"]], "p": "Because of hoisting, a factory cannot reference outer variables unless their names start with <code>mock<\/code> (a deliberate Jest guard).", "lab": true}, {"k": "spyOn", "h": "Keep the object, intercept one method", "cmp": [["TS", "import * as analytics from './analytics';\n\nconst spy = jest.spyOn(analytics, 'track');      // calls through\nspy.mockImplementation(() => {});              // or silence it\n\njest.spyOn(console, 'error').mockImplementation(() => {});\njest.spyOn(Date, 'now').mockReturnValue(1_700_000_000_000);\n\nafterEach(() => jest.restoreAllMocks());       // undo", "spyOn"]], "p": "Spying on an ES module namespace works with CommonJS transforms but can fail under native ESM, where exports are read-only bindings. That is a common source of \"Cannot redefine property\".", "an": "Mockito <code>spy()<\/code> / RSpec <code>allow(obj).to receive(:m)<\/code>: a partial double on a real object."}, {"k": "Doubles · AI", "h": "What AI often gets wrong", "v": "<div class=\"vwrap\"><div class=\"box warn rise\" style=\"--d:0.00s\">✗ Mocks the component under test's own child hooks so the test passes<br><small style=\"color:#3ddc97\">✓ mock at the boundary (network) and let real hooks run<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.15s\">✗ <code>jest.mock<\/code> with an inline object that drifts from the real module's shape<br><small style=\"color:#3ddc97\">✓ partial mock with <code>requireActual<\/code>, typed with <code>jest.mocked<\/code><\/small><\/div><div class=\"box warn rise\" style=\"--d:0.30s\">✗ Asserts <code>toHaveBeenCalled()<\/code> only<br><small style=\"color:#3ddc97\">✓ assert arguments too: <code>toHaveBeenCalledWith(...)<\/code><\/small><\/div><div class=\"box warn rise\" style=\"--d:0.45s\">✗ Never restores spies on <code>console<\/code> or <code>Date<\/code><br><small style=\"color:#3ddc97\">✓ <code>restoreMocks: true<\/code> in config or <code>afterEach(restoreAllMocks)<\/code><\/small><\/div><\/div>", "p": "When reviewing a generated test, ask: if I broke the real code, would this test fail? Over-mocked tests often would not."}, {"quiz": true, "k": "Quiz 2 / 8 · Doubles", "h": "You want to assert <code>analytics.track<\/code> was called but keep every other analytics function real. Best tool?", "opts": [["<code>jest.mock(\"./analytics\")<\/code>", 0], ["<code>jest.spyOn(analytics, \"track\")<\/code>", 1], ["<code>jest.fn()<\/code> assigned to a local variable", 0]], "right": "<code>spyOn<\/code> intercepts one method and leaves the rest of the module real.", "wrong": "Use <b>spyOn<\/b>. <code>jest.mock<\/code> replaces the whole module; a local <code>jest.fn()<\/code> is never called by the real code."}, {"quiz": true, "k": "Quiz 3 / 8 · Matchers", "h": "Which passes?", "code": "const a = { id: 1, note: undefined };\nconst b = { id: 1 };", "opts": [["<code>expect(a).toBe(b)<\/code>", 0], ["<code>expect(a).toEqual(b)<\/code>", 1], ["<code>expect(a).toStrictEqual(b)<\/code>", 0]], "right": "<code>toEqual<\/code> ignores <code>undefined<\/code>-valued keys; <code>toStrictEqual<\/code> does not, and <code>toBe<\/code> needs the same reference.", "wrong": "Only <b>toEqual<\/b>. Different objects fail <code>toBe<\/code>; the <code>undefined<\/code> key fails <code>toStrictEqual<\/code>."}, {"k": "Section 2 · Go deeper", "h": "Go deeper", "v": "<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.00s;text-decoration:none;display:block\" href=\"https://jestjs.io/docs/expect\" target=\"_blank\" rel=\"noopener\"><b>Jest docs: Expect ↗<\/b><br><small>the full matcher list, including asymmetric matchers<\/small><\/a><a class=\"box rise\" style=\"--d:0.15s;text-decoration:none;display:block\" href=\"https://jestjs.io/docs/mock-functions\" target=\"_blank\" rel=\"noopener\"><b>Jest docs: Mock Functions ↗<\/b><br><small>jest.fn, mock.calls, module mocks<\/small><\/a><a class=\"box rise\" style=\"--d:0.30s;text-decoration:none;display:block\" href=\"https://jestjs.io/docs/jest-object\" target=\"_blank\" rel=\"noopener\"><b>Jest docs: The Jest Object ↗<\/b><br><small>jest.mock, spyOn, requireActual, timers API<\/small><\/a><\/div>", "p": "Optional, but worth it. Tap a card to open it in a new tab."}, {"sect": 1, "num": "3", "kicker": "Section 3 · Time &amp; async", "h": "Fake timers, promises and snapshots", "p": "Most flaky frontend tests are really about time. Learn to control it instead of waiting for it."}, {"k": "Async tests", "h": "Return or await, or the test lies", "cmp": [["TS", "// ✗ passes even if the promise rejects: nobody waits\nit('loads', () => { loadTasks().then(t => expect(t).toHaveLength(2)); });\n\n// ✓ await it\nit('loads', async () => {\n  const t = await loadTasks();\n  expect(t).toHaveLength(2);\n});\n\n// ✓ promise matchers\nawait expect(loadTasks()).resolves.toHaveLength(2);\nawait expect(saveTask({})).rejects.toThrow('title required');", "async"]], "p": "A test function finishes when its returned promise settles. Forget to return/await, and assertions run after Jest has already marked the test green. <code>expect.assertions(n)<\/code> guards against this in catch-heavy tests."}, {"k": "Fake timers", "h": "Step by step: a debounced search", "v": "<ol class=\"steps\"><li style=\"--d:0.0s\"><span><code>jest.useFakeTimers()<\/code> replaces <code>setTimeout<\/code>, <code>setInterval<\/code>, <code>Date<\/code> with a controllable clock<\/span><\/li><li style=\"--d:0.6s\"><span>Render, type \"re\": the component schedules a fetch in 300 ms<\/span><\/li><li style=\"--d:1.2s\"><span>Nothing happens yet: the fake clock is frozen<\/span><\/li><li style=\"--d:1.8s\"><span><code>jest.advanceTimersByTime(300)<\/code> runs callbacks due in that window<\/span><\/li><li style=\"--d:2.4s\"><span>Assert the request fired once with \"re\"<\/span><\/li><li style=\"--d:3.0s\"><span><code>jest.useRealTimers()<\/code> in <code>afterEach<\/code><\/span><\/li><\/ol>", "cmp": [["TSX", "jest.useFakeTimers();\nconst user = userEvent.setup({ advanceTimers: jest.advanceTimersByTime });\nrender(<Search />);\nawait user.type(screen.getByRole('searchbox'), 're');\nact(() => { jest.advanceTimersByTime(300); });\nexpect(await screen.findByText('react')).toBeInTheDocument();", "debounce"]], "p": "With fake timers, tell <code>userEvent<\/code> how to advance time, or its internal delays will hang the test.", "lab": true}, {"k": "Fake timers", "h": "The timer API in one card", "v": "<div class=\"vs\" style=\"grid-template-columns:130px 1fr\"><div class=\"vl\"><\/div><div class=\"vh data\">does<\/div><div class=\"vl\" style=\"display:block;align-self:center;word-break:break-word;text-transform:none;letter-spacing:0;font-size:11px;color:#cfd6ea\"><code>advanceTimersByTime(ms)<\/code><\/div><div class=\"rise\" style=\"--d:0.0s\">runs timers due in the next ms<\/div><div class=\"vl\" style=\"display:block;align-self:center;word-break:break-word;text-transform:none;letter-spacing:0;font-size:11px;color:#cfd6ea\"><code>runOnlyPendingTimers()<\/code><\/div><div class=\"rise\" style=\"--d:0.2s\">runs what is queued now, not new ones<\/div><div class=\"vl\" style=\"display:block;align-self:center;word-break:break-word;text-transform:none;letter-spacing:0;font-size:11px;color:#cfd6ea\"><code>runAllTimers()<\/code><\/div><div class=\"rise\" style=\"--d:0.4s\">loops until empty; hangs on <code>setInterval<\/code><\/div><div class=\"vl\" style=\"display:block;align-self:center;word-break:break-word;text-transform:none;letter-spacing:0;font-size:11px;color:#cfd6ea\"><code>*Async<\/code> variants<\/div><div class=\"rise\" style=\"--d:0.6s\">also flush promises between timers<\/div><div class=\"vl\" style=\"display:block;align-self:center;word-break:break-word;text-transform:none;letter-spacing:0;font-size:11px;color:#cfd6ea\"><code>setSystemTime(d)<\/code><\/div><div class=\"rise\" style=\"--d:0.8s\">moves <code>Date.now()<\/code><\/div><\/div>", "p": "Prefer <code>advanceTimersByTime<\/code> with a number that matches your intent. <code>runAllTimers<\/code> on a polling component is an infinite loop."}, {"k": "Event loop", "h": "Why promises and timers interleave oddly", "v": "<svg viewBox=\"0 0 320 150\"><rect x=\"8\" y=\"10\" width=\"304\" height=\"36\" rx=\"10\" fill=\"#13243a\" stroke=\"#4ea8ff\"/><text x=\"20\" y=\"32\" fill=\"#fff\" font-size=\"10\">call stack: your test code<\/text><rect x=\"8\" y=\"58\" width=\"148\" height=\"80\" rx=\"10\" fill=\"rgba(61,220,151,.12)\" stroke=\"#3ddc97\"/><text x=\"82\" y=\"76\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\">microtasks<\/text><text x=\"82\" y=\"94\" fill=\"#cfd6ea\" font-size=\"9\" text-anchor=\"middle\">promise .then / await<\/text><text x=\"82\" y=\"110\" fill=\"#cfd6ea\" font-size=\"9\" text-anchor=\"middle\">drained fully first<\/text><rect x=\"164\" y=\"58\" width=\"148\" height=\"80\" rx=\"10\" fill=\"rgba(247,208,70,.12)\" stroke=\"#f7d046\"/><text x=\"238\" y=\"76\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\">macrotasks<\/text><text x=\"238\" y=\"94\" fill=\"#cfd6ea\" font-size=\"9\" text-anchor=\"middle\">setTimeout, I/O<\/text><text x=\"238\" y=\"110\" fill=\"#cfd6ea\" font-size=\"9\" text-anchor=\"middle\">fake timers control these<\/text><circle class=\"mv\" style=\"--tx:0px;--ty:-48px\" cx=\"82\" cy=\"126\" r=\"5\" fill=\"#3ddc97\"/><circle class=\"mv\" style=\"--tx:0px;--ty:-48px;--d:1.5s\" cx=\"238\" cy=\"126\" r=\"5\" fill=\"#f7d046\"/><\/svg>", "p": "Fake timers control macrotasks. Promise callbacks still need a turn of the microtask queue, which is why <code>await<\/code>-ing (or the <code>Async<\/code> timer variants) is needed when code mixes <code>setTimeout<\/code> and <code>await fetch<\/code>."}, {"k": "Snapshots", "h": "What a snapshot test really asserts", "cmp": [["TSX", "it('renders', () => {\n  const { asFragment } = render(<Badge status=\"done\" />);\n  expect(asFragment()).toMatchSnapshot();   // writes __snapshots__/...\n});\n\n// small, intentional: inline snapshots\nexpect(formatDuration(3700)).toMatchInlineSnapshot(`\"1h 1m 40s\"`);", "snapshot"]], "p": "First run writes the output; later runs diff against it. It asserts \"nothing changed\", not \"this is correct\". <code>jest -u<\/code> blindly accepts all new output."}, {"k": "Snapshot caveats", "h": "Snapshot caveats", "v": "<ul class=\"chk\"><li class=\"rise\" style=\"--d:0.00s\">Large DOM snapshots break on every harmless markup tweak, so people press <code>-u<\/code> without reading. That is a test that never fails for real.<\/li><li class=\"rise\" style=\"--d:0.12s\">Snapshots of objects with dates, random IDs or generated class names are flaky by design.<\/li><li class=\"rise\" style=\"--d:0.24s\">Use them for <b>small, stable outputs<\/b>: a formatter, a serializer, an error message, a config object.<\/li><li class=\"rise\" style=\"--d:0.36s\">Review snapshot diffs in PRs like code. A 400-line <code>.snap<\/code> change deserves questions.<\/li><li class=\"rise\" style=\"--d:0.48s\">Prefer explicit assertions for behaviour: \"shows 3 rows\" beats \"matches 200 lines of HTML\".<\/li><\/ul>"}, {"k": "Time · AI", "h": "What AI often gets wrong", "v": "<div class=\"vwrap\"><div class=\"box warn rise\" style=\"--d:0.00s\">✗ <code>await new Promise(r =&gt; setTimeout(r, 500))<\/code> to \"wait for the UI\"<br><small style=\"color:#3ddc97\">✓ <code>findBy*<\/code> / <code>waitFor<\/code>, or fake timers<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.15s\">✗ Calls <code>jest.useFakeTimers()<\/code> but never restores real timers<br><small style=\"color:#3ddc97\">✓ <code>afterEach(() =&gt; jest.useRealTimers())<\/code><\/small><\/div><div class=\"box warn rise\" style=\"--d:0.30s\">✗ Snapshots an entire page component<br><small style=\"color:#3ddc97\">✓ assert the 2-3 things a user would notice<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.45s\">✗ <code>it('...', () =&gt; { promise.then(...) })<\/code> with no return<br><small style=\"color:#3ddc97\">✓ <code>async<\/code> + <code>await<\/code><\/small><\/div><\/div>"}, {"quiz": true, "k": "Quiz 4 / 8 · Time", "h": "A component polls every 5 s with <code>setInterval<\/code>. Which call hangs the test?", "opts": [["<code>jest.advanceTimersByTime(5000)<\/code>", 0], ["<code>jest.runOnlyPendingTimers()<\/code>", 0], ["<code>jest.runAllTimers()<\/code>", 1]], "right": "<code>runAllTimers<\/code> keeps running until no timers remain; an interval always schedules another.", "wrong": "It is <b>runAllTimers<\/b>: an interval reschedules forever. Advance by a specific time instead."}, {"k": "Section 3 · Go deeper", "h": "Go deeper", "v": "<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.00s;text-decoration:none;display:block\" href=\"https://jestjs.io/docs/timer-mocks\" target=\"_blank\" rel=\"noopener\"><b>Jest docs: Timer Mocks ↗<\/b><br><small>fake timers, step by step<\/small><\/a><a class=\"box rise\" style=\"--d:0.15s;text-decoration:none;display:block\" href=\"https://jestjs.io/docs/asynchronous\" target=\"_blank\" rel=\"noopener\"><b>Jest docs: Testing Asynchronous Code ↗<\/b><br><small>promises, async/await, resolves/rejects<\/small><\/a><a class=\"box rise\" style=\"--d:0.30s;text-decoration:none;display:block\" href=\"https://kentcdodds.com/blog/effective-snapshot-testing\" target=\"_blank\" rel=\"noopener\"><b>Kent C. Dodds: Effective Snapshot Testing ↗<\/b><br><small>when snapshots help and when they hurt<\/small><\/a><\/div>", "p": "Optional, but worth it. Tap a card to open it in a new tab."}, {"sect": 1, "num": "4", "kicker": "Section 4 · React Testing Library", "h": "Test what the user sees", "p": "RTL's one idea: the more your tests resemble the way your software is used, the more confidence they give you. Everything else follows from that."}, {"k": "Philosophy", "h": "Behaviour, not implementation", "v": "<div class=\"g2\"><div class=\"box rise warn\" style=\"--d:0.00s\"><b>Implementation details<\/b><br><small>state values, hook calls, child component props, CSS class names, internal method calls<\/small><\/div><div class=\"box rise ok\" style=\"--d:0.12s\"><b>Observable behaviour<\/b><br><small>text on screen, roles, enabled/disabled, what happens after a click, requests sent<\/small><\/div><\/div>", "p": "RTL deliberately gives you no API to read component state. If you refactor a <code>useState<\/code> into a <code>useReducer<\/code>, a good test does not notice. If you break the button, it does.", "an": "Like testing a REST controller through HTTP instead of calling private methods: refactors stay green, real bugs go red."}, {"k": "render", "h": "render, screen and providers", "cmp": [["TSX", "function renderWithProviders(ui: React.ReactElement) {\n  const client = new QueryClient({\n    defaultOptions: { queries: { retry: false } }, // fail fast in tests\n  });\n  return render(\n    <QueryClientProvider client={client}>\n      <MemoryRouter>{ui}<\/MemoryRouter>\n    <\/QueryClientProvider>,\n  );\n}\n\nrenderWithProviders(<TaskList />);\nscreen.getByRole('heading', { name: 'Tasks' });", "test-utils.tsx"]], "p": "Create a <b>new<\/b> QueryClient per test (shared caches leak data between tests) and disable retries, or error-state tests wait through three retries and time out."}, {"k": "Queries", "h": "The query priority, and why", "v": "<div class=\"vwrap\"><div class=\"box ok rise\"><b>1 · Accessible to everyone<\/b><br><small><code>ByRole<\/code> (with `name`) › <code>ByLabelText<\/code> › <code>ByPlaceholderText<\/code> › <code>ByText<\/code> › <code>ByDisplayValue<\/code><\/small><\/div><div class=\"box rise\" style=\"--d:.2s\"><b>2 · Semantic<\/b><br><small><code>ByAltText<\/code> › <code>ByTitle<\/code><\/small><\/div><div class=\"box warn rise\" style=\"--d:.4s\"><b>3 · Escape hatch<\/b><br><small><code>ByTestId<\/code>: invisible to users; use when nothing else is stable<\/small><\/div><\/div>", "p": "<code>getByRole('button', { name: 'Save' })<\/code> finds what a screen reader announces. If you cannot find it by role, the element probably has an accessibility bug, and the test just told you."}, {"k": "Queries", "h": "get, query, find: three variants", "v": "<div class=\"vs\" style=\"grid-template-columns:66px 1fr 1fr\"><div class=\"vl\"><\/div><div class=\"vh data\">0 matches<\/div><div class=\"vh code\">async?<\/div><div class=\"vl\" style=\"display:block;align-self:center;word-break:break-word;text-transform:none;letter-spacing:0;font-size:11px;color:#cfd6ea\">getBy<\/div><div class=\"rise\" style=\"--d:0.0s\">throws<\/div><div class=\"rise\" style=\"--d:0.0s\">no<\/div><div class=\"vl\" style=\"display:block;align-self:center;word-break:break-word;text-transform:none;letter-spacing:0;font-size:11px;color:#cfd6ea\">queryBy<\/div><div class=\"rise\" style=\"--d:0.2s\">returns null<\/div><div class=\"rise\" style=\"--d:0.2s\">no · assert absence<\/div><div class=\"vl\" style=\"display:block;align-self:center;word-break:break-word;text-transform:none;letter-spacing:0;font-size:11px;color:#cfd6ea\">findBy<\/div><div class=\"rise\" style=\"--d:0.4s\">rejects after timeout<\/div><div class=\"rise\" style=\"--d:0.4s\">yes · retries ~1 s<\/div><\/div>", "cmp": [["TSX", "screen.getByRole('button', { name: /save/i });\nexpect(screen.queryByRole('alert')).not.toBeInTheDocument();\nexpect(await screen.findByText('Saved')).toBeVisible();\nscreen.getAllByRole('row');           // *All* variants return arrays", "variants"]], "p": "Use <code>getBy<\/code> when it should be there now, <code>findBy<\/code> when it will appear, <code>queryBy<\/code> only to assert something is <b>not<\/b> there.", "lab": true}, {"k": "Roles", "h": "Common roles you will query", "v": "<div class=\"g2\"><div class=\"box rise\" style=\"--d:0.00s\"><b>button<\/b><br><small><code>&lt;button&gt;<\/code>, <code>role=\"button\"<\/code><\/small><\/div><div class=\"box rise\" style=\"--d:0.12s\"><b>link<\/b><br><small><code>&lt;a href&gt;<\/code> (no href = no role)<\/small><\/div><div class=\"box rise\" style=\"--d:0.24s\"><b>textbox<\/b><br><small><code>&lt;input type=text&gt;<\/code>, <code>&lt;textarea&gt;<\/code><\/small><\/div><div class=\"box rise\" style=\"--d:0.36s\"><b>checkbox / radio<\/b><br><small>with <code>{ checked: true }<\/code><\/small><\/div><div class=\"box rise\" style=\"--d:0.48s\"><b>combobox<\/b><br><small><code>&lt;select&gt;<\/code>, autocomplete inputs<\/small><\/div><div class=\"box rise\" style=\"--d:0.60s\"><b>heading<\/b><br><small><code>h1<\/code>-<code>h6<\/code>, filter with <code>{ level: 2 }<\/code><\/small><\/div><div class=\"box rise\" style=\"--d:0.72s\"><b>dialog<\/b><br><small>modals with <code>role=\"dialog\"<\/code><\/small><\/div><div class=\"box rise\" style=\"--d:0.84s\"><b>alert / status<\/b><br><small>live regions for errors and toasts<\/small><\/div><\/div>", "p": "Stuck? <code>screen.logTestingPlaygroundURL()<\/code> or <code>screen.debug()<\/code> prints the DOM; <code>getByRole<\/code> errors list every available role with its name."}, {"k": "userEvent", "h": "userEvent vs fireEvent", "v": "<div class=\"vs\" style=\"grid-template-columns:86px 1fr 1fr\"><div class=\"vl\"><\/div><div class=\"vh data\">fires<\/div><div class=\"vh code\">use when<\/div><div class=\"vl\" style=\"display:block;align-self:center;word-break:break-word;text-transform:none;letter-spacing:0;font-size:11px;color:#cfd6ea\">fireEvent.click<\/div><div class=\"rise\" style=\"--d:0.0s\">one synthetic <code>click<\/code> event<\/div><div class=\"rise\" style=\"--d:0.0s\">rarely; low-level<\/div><div class=\"vl\" style=\"display:block;align-self:center;word-break:break-word;text-transform:none;letter-spacing:0;font-size:11px;color:#cfd6ea\">user.click<\/div><div class=\"rise\" style=\"--d:0.2s\">pointerdown, mousedown, focus, mouseup, click<\/div><div class=\"rise\" style=\"--d:0.2s\">almost always<\/div><\/div>", "cmp": [["TSX", "const user = userEvent.setup();     // once per test, before render\nrender(<LoginForm />);\nawait user.type(screen.getByLabelText('Email'), 'a@b.co');\nawait user.keyboard('{Tab}');\nawait user.click(screen.getByRole('button', { name: 'Sign in' }));\nawait user.selectOptions(screen.getByRole('combobox'), 'Admin');", "userEvent v14"]], "p": "<code>userEvent<\/code> respects disabled elements, focus order and <code>maxLength<\/code>, like a real user. <code>fireEvent.click<\/code> on a disabled button still fires, so the test can pass while users are blocked. Every userEvent call returns a promise: always <code>await<\/code>.", "lab": true}, {"k": "Async UI", "h": "findBy and waitFor, step by step", "v": "<ol class=\"steps\"><li style=\"--d:0.0s\"><span>Click \"Save\": component sets loading state and starts a fetch<\/span><\/li><li style=\"--d:0.6s\"><span>The fetch resolves on a later tick<\/span><\/li><li style=\"--d:1.2s\"><span>React re-renders with \"Saved\"<\/span><\/li><li style=\"--d:1.8s\"><span><code>findByText('Saved')<\/code> polls the DOM (default every 50 ms up to 1000 ms) until it appears<\/span><\/li><li style=\"--d:2.4s\"><span>Assertion passes; no sleep, no race<\/span><\/li><\/ol>", "cmp": [["TSX", "expect(await screen.findByText('Saved')).toBeInTheDocument();\n\nawait waitFor(() => {\n  expect(onSave).toHaveBeenCalledTimes(1);   // one assertion inside\n});\nawait waitForElementToBeRemoved(() => screen.queryByText('Loading…'));", "async utils"]], "p": "Put <b>one<\/b> assertion in <code>waitFor<\/code> and no side effects (no clicks): the callback runs many times.", "lab": true}, {"k": "act()", "h": "What the act(...) warning really means", "v": "<ol class=\"steps\"><li style=\"--d:0.0s\"><span>React batches updates and effects; <code>act()<\/code> says \"flush everything before I assert\"<\/span><\/li><li style=\"--d:0.6s\"><span>RTL already wraps <code>render<\/code>, <code>userEvent<\/code> and <code>waitFor<\/code>/<code>findBy<\/code> in act<\/span><\/li><li style=\"--d:1.2s\"><span>The warning appears when a state update happens <b>after<\/b> your test stopped watching, e.g. a fetch resolved after the last assertion<\/span><\/li><li style=\"--d:1.8s\"><span>Fix: wait for the final UI state (<code>findBy...<\/code>) instead of wrapping random lines in <code>act<\/code><\/span><\/li><\/ol>", "p": "Treat the warning as \"your test ended before the component settled\". Silencing it with an empty <code>act()<\/code> hides real race conditions."}, {"k": "RTL gotchas", "h": "Caveats &amp; gotchas", "v": "<ul class=\"chk\"><li class=\"rise\" style=\"--d:0.00s\"><code>getByText('Save')<\/code> matches full text content by default; use a regex (<code>/save/i<\/code>) or <code>{ exact: false }<\/code> for partial.<\/li><li class=\"rise\" style=\"--d:0.12s\"><code>screen.getByRole<\/code> with hidden elements: <code>display:none<\/code> content is excluded. Use <code>{ hidden: true }<\/code> only deliberately.<\/li><li class=\"rise\" style=\"--d:0.24s\">Destructuring queries from <code>render()<\/code> works but <code>screen<\/code> is preferred: nothing to keep in sync.<\/li><li class=\"rise\" style=\"--d:0.36s\"><code>cleanup<\/code> (unmount) runs automatically after each test; never call it manually with modern RTL.<\/li><li class=\"rise\" style=\"--d:0.48s\">Testing a portal (modal, tooltip)? <code>screen<\/code> searches <code>document.body<\/code>, so it just works.<\/li><\/ul>"}, {"k": "RTL · AI", "h": "What AI often gets wrong", "v": "<div class=\"vwrap\"><div class=\"box warn rise\" style=\"--d:0.00s\">✗ <code>container.querySelector('.btn-primary')<\/code><br><small style=\"color:#3ddc97\">✓ <code>screen.getByRole('button', { name: ... })<\/code><\/small><\/div><div class=\"box warn rise\" style=\"--d:0.15s\">✗ <code>fireEvent.change(input, { target: { value } })<\/code> everywhere<br><small style=\"color:#3ddc97\">✓ <code>await user.type(...)<\/code><\/small><\/div><div class=\"box warn rise\" style=\"--d:0.30s\">✗ Wraps every line in <code>act(...)<\/code> to silence warnings<br><small style=\"color:#3ddc97\">✓ await the final UI with <code>findBy<\/code><\/small><\/div><div class=\"box warn rise\" style=\"--d:0.45s\">✗ <code>expect(getByText(...)).toBeTruthy()<\/code><br><small style=\"color:#3ddc97\">✓ <code>getBy<\/code> already throws; use <code>toBeInTheDocument()<\/code> for intent<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.60s\">✗ <code>waitFor(() =&gt; user.click(...))<\/code><br><small style=\"color:#3ddc97\">✓ side effects outside <code>waitFor<\/code>, assertions inside<\/small><\/div><\/div>", "p": "Kent C. Dodds' \"common mistakes\" article (Go deeper) is basically this card in long form."}, {"quiz": true, "k": "Quiz 5 / 8 · Queries", "h": "After submit, assert the error message is <b>not<\/b> shown. Which query?", "opts": [["<code>getByRole(\"alert\")<\/code>", 0], ["<code>queryByRole(\"alert\")<\/code>", 1], ["<code>findByRole(\"alert\")<\/code>", 0]], "right": "<code>queryBy<\/code> returns null instead of throwing, so it is the right tool for absence.", "wrong": "Use <b>queryBy<\/b>. <code>getBy<\/code> throws before your assertion runs; <code>findBy<\/code> waits for it to appear."}, {"quiz": true, "k": "Quiz 6 / 8 · Events", "h": "A test uses <code>fireEvent.click<\/code> on a submit button that is visually disabled via <code>aria-disabled<\/code> and CSS. It passes. What is the risk?", "opts": [["None, fireEvent is the recommended API", 0], ["fireEvent dispatches regardless of what a user could do; userEvent models real interaction", 1], ["fireEvent is async and needs await", 0]], "right": "<code>fireEvent<\/code> is a raw dispatch. <code>userEvent<\/code> checks pointer-events and disabled state like a browser.", "wrong": "The test is <b>too permissive<\/b>. Switch to <code>userEvent<\/code> so it fails when users cannot click."}, {"k": "Section 4 · Go deeper", "h": "Go deeper", "v": "<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.00s;text-decoration:none;display:block\" href=\"https://testing-library.com/docs/queries/about\" target=\"_blank\" rel=\"noopener\"><b>Testing Library: About Queries ↗<\/b><br><small>official priority order and query types<\/small><\/a><a class=\"box rise\" style=\"--d:0.15s;text-decoration:none;display:block\" href=\"https://testing-library.com/docs/user-event/intro\" target=\"_blank\" rel=\"noopener\"><b>Testing Library: user-event ↗<\/b><br><small>why it beats fireEvent, setup() API<\/small><\/a><a class=\"box rise\" style=\"--d:0.30s;text-decoration:none;display:block\" href=\"https://kentcdodds.com/blog/common-mistakes-with-react-testing-library\" target=\"_blank\" rel=\"noopener\"><b>Kent C. Dodds: Common mistakes with React Testing Library ↗<\/b><br><small>the review checklist for generated tests<\/small><\/a><\/div>", "p": "Optional, but worth it. Tap a card to open it in a new tab."}, {"sect": 1, "num": "5", "kicker": "Section 5 · Network, hooks, strategy", "h": "MSW, hooks, flake and what not to test", "p": "Fake the network, not your code. Then decide where tests pay for themselves."}, {"k": "MSW", "h": "Mock the network, not fetch", "v": "<svg viewBox=\"0 0 320 120\"><rect x=\"6\" y=\"40\" width=\"80\" height=\"40\" rx=\"10\" fill=\"#13243a\" stroke=\"#4ea8ff\"/><text x=\"46\" y=\"64\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\">component<\/text><rect x=\"120\" y=\"34\" width=\"80\" height=\"52\" rx=\"10\" fill=\"rgba(167,139,250,.25)\" stroke=\"#a78bfa\"/><text x=\"160\" y=\"58\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\">MSW<\/text><text x=\"160\" y=\"72\" fill=\"#cfd6ea\" font-size=\"8\" text-anchor=\"middle\">handlers<\/text><rect x=\"234\" y=\"40\" width=\"80\" height=\"40\" rx=\"10\" fill=\"#151a27\" stroke=\"#2a3145\" stroke-dasharray=\"4 3\"/><text x=\"274\" y=\"64\" fill=\"#5d6680\" font-size=\"10\" text-anchor=\"middle\">real API ✗<\/text><line x1=\"86\" y1=\"60\" x2=\"120\" y2=\"60\" stroke=\"#2a3145\" stroke-width=\"2\"/><circle class=\"mv\" style=\"--tx:30px\" cx=\"88\" cy=\"56\" r=\"5\" fill=\"#f7d046\"/><circle class=\"mv\" style=\"--tx:-30px;--d:1.5s\" cx=\"118\" cy=\"66\" r=\"5\" fill=\"#3ddc97\"/><text x=\"160\" y=\"108\" fill=\"#5d6680\" font-size=\"9\" text-anchor=\"middle\">requests are intercepted at the network layer; app code unchanged<\/text><\/svg>", "p": "Mock Service Worker intercepts requests (in Node via interceptors, in the browser via a Service Worker). Your fetch wrapper, axios or React Query all run for real, so you test URL building, headers and error parsing too.", "an": "WebMock / WireMock for the browser: the HTTP client is real, the server is a fixture."}, {"k": "MSW", "h": "Handlers: happy path by default, override per test", "cmp": [["TS", "// mocks/handlers.ts\nexport const handlers = [\n  http.get('/api/tasks', () =>\n    HttpResponse.json([{ id: 1, title: 'Write docs' }])),\n];\n// jest.setup.ts\nexport const server = setupServer(...handlers);\nbeforeAll(() => server.listen({ onUnhandledRequest: 'error' }));\nafterEach(() => server.resetHandlers());\nafterAll(() => server.close());", "msw v2"], ["TSX", "it('shows an error when the API fails', async () => {\n  server.use(http.get('/api/tasks', () => new HttpResponse(null, { status: 500 })));\n  renderWithProviders(<TaskList />);\n  expect(await screen.findByRole('alert')).toHaveTextContent(/could not load/i);\n});", "override"]], "p": "<code>onUnhandledRequest: 'error'<\/code> turns a forgotten mock into a loud failure instead of a mystery hang."}, {"k": "Hooks", "h": "Testing custom hooks", "cmp": [["TSX", "import { renderHook, act } from '@testing-library/react';\n\nit('toggles', () => {\n  const { result } = renderHook(() => useToggle(false));\n  act(() => result.current.toggle());\n  expect(result.current.on).toBe(true);\n});\n\n// hooks that need providers\nrenderHook(() => useTasks(), { wrapper: Providers });", "renderHook"]], "p": "Only test a hook directly when it is reusable logic with its own contract (a library-like hook). Hooks used by one component are better tested <b>through<\/b> that component."}, {"k": "Flake", "h": "Where flaky tests come from", "v": "<div class=\"g2\"><div class=\"box rise warn\" style=\"--d:0.00s\"><b>Shared state<\/b><br><small>module singletons, a shared QueryClient, leaked MSW overrides<\/small><\/div><div class=\"box rise warn\" style=\"--d:0.12s\"><b>Real time<\/b><br><small>sleeps, <code>Date.now()<\/code>, timezones, debounces<\/small><\/div><div class=\"box rise warn\" style=\"--d:0.24s\"><b>Unawaited work<\/b><br><small>missing <code>await<\/code> on userEvent or promises<\/small><\/div><div class=\"box rise warn\" style=\"--d:0.36s\"><b>Order dependence<\/b><br><small>test passes alone, fails in the suite<\/small><\/div><div class=\"box rise \" style=\"--d:0.48s\"><b>Randomness<\/b><br><small><code>Math.random<\/code>, generated IDs in snapshots<\/small><\/div><div class=\"box rise \" style=\"--d:0.60s\"><b>Environment<\/b><br><small>CI is slower: 1 s <code>findBy<\/code> timeouts that pass locally<\/small><\/div><\/div>", "p": "Reproduce with <code>jest --runInBand --randomize<\/code> (random order) or by running the file 20 times. Then fix the cause; raising timeouts just moves the flake."}, {"k": "Strategy", "h": "What to test, what to skip", "v": "<div class=\"g2\"><div class=\"box rise ok\" style=\"--d:0.00s\"><b>Test<\/b><br><small>every UI state: loading, empty, error, success · validation · permissions · what is sent to the API · keyboard access<\/small><\/div><div class=\"box rise warn\" style=\"--d:0.12s\"><b>Skip<\/b><br><small>that React re-renders · library internals · CSS class names · exact markup · trivial props pass-through<\/small><\/div><\/div>", "p": "A few rich tests per feature that read like specs (\"shows an error when saving fails\") beat dozens of tiny tests that each assert one prop."}, {"k": "Vitest", "h": "A note on Vitest", "v": "<div class=\"g2\"><div class=\"box rise ok\" style=\"--d:0.00s\"><b>Same API<\/b><br><small><code>describe/it/expect<\/code>, <code>vi.fn<\/code>, <code>vi.mock<\/code>, <code>vi.spyOn<\/code>, fake timers<\/small><\/div><div class=\"box rise \" style=\"--d:0.12s\"><b>Different engine<\/b><br><small>uses Vite's transform pipeline: native ESM and TS, shares your app's config<\/small><\/div><div class=\"box rise \" style=\"--d:0.24s\"><b>Migration<\/b><br><small>mostly <code>jest.<\/code> → <code>vi.<\/code>; mock hoisting and <code>requireActual<\/code> → <code>importActual<\/code> differ<\/small><\/div><div class=\"box rise ok\" style=\"--d:0.36s\"><b>RTL + MSW<\/b><br><small>work the same; only the runner changes<\/small><\/div><\/div>", "p": "New Vite-based projects usually pick Vitest; many established apps stay on Jest. Everything in this lesson transfers."}, {"k": "Strategy · AI", "h": "What AI often gets wrong", "v": "<div class=\"vwrap\"><div class=\"box warn rise\" style=\"--d:0.00s\">✗ Generates one test per prop, asserting it renders<br><small style=\"color:#3ddc97\">✓ one test per user-visible behaviour<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.15s\">✗ Stubs <code>global.fetch<\/code> with a hand-written fake response<br><small style=\"color:#3ddc97\">✓ MSW handlers with real status codes<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.30s\">✗ Tests a hook by mocking <code>useState<\/code><br><small style=\"color:#3ddc97\">✓ <code>renderHook<\/code> or test through the component<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.45s\">✗ Bumps <code>timeout<\/code> to 10 s to fix a flaky test<br><small style=\"color:#3ddc97\">✓ find the race or the shared state<\/small><\/div><\/div>"}, {"quiz": true, "k": "Quiz 7 / 8 · Flake", "h": "The success test passes alone but fails after the error test runs first. Most likely cause?", "opts": [["jsdom is reset between tests", 0], ["A <code>server.use<\/code> override leaked because handlers were not reset", 1], ["userEvent is too slow", 0]], "right": "Overrides persist until <code>resetHandlers()<\/code>; add it to <code>afterEach<\/code>.", "wrong": "It is a <b>leaked MSW override<\/b>. Add <code>afterEach(() =&gt; server.resetHandlers())<\/code>."}, {"k": "Section 5 · Go deeper", "h": "Go deeper", "v": "<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.00s;text-decoration:none;display:block\" href=\"https://mswjs.io/docs/\" target=\"_blank\" rel=\"noopener\"><b>MSW documentation ↗<\/b><br><small>setupServer, handlers, overrides<\/small><\/a><a class=\"box rise\" style=\"--d:0.15s;text-decoration:none;display:block\" href=\"https://www.youtube.com/watch?v=Fha2bVoC8SE\" target=\"_blank\" rel=\"noopener\"><b>Talk: Kent C. Dodds, Write tests. Not too many. Mostly integration. ↗<\/b><br><small>the talk behind the testing trophy (video)<\/small><\/a><a class=\"box rise\" style=\"--d:0.30s;text-decoration:none;display:block\" href=\"https://vitest.dev/guide/migration\" target=\"_blank\" rel=\"noopener\"><b>Vitest: Migration Guide ↗<\/b><br><small>exact Jest → Vitest differences<\/small><\/a><\/div>", "p": "Optional, but worth it. Tap a card to open it in a new tab."}, {"sect": 1, "num": "6", "kicker": "Section 6 · Lab", "h": "Test a task list and form", "p": "A small feature under test: a list that loads from an API and a form that creates a task. Write the tests a reviewer would want."}, {"k": "Lab 1 / 4 · Code under test", "h": "TaskList &amp; NewTaskForm", "cmp": [["TSX", "export function TaskList() {\n  const q = useQuery({ queryKey: ['tasks'], queryFn: () => api.get('/api/tasks') });\n  if (q.isPending) return <p>Loading…<\/p>;\n  if (q.isError) return <p role=\"alert\">Could not load tasks<\/p>;\n  if (q.data.length === 0) return <p>No tasks yet<\/p>;\n  return (\n    <ul aria-label=\"Tasks\">\n      {q.data.map(t => <li key={t.id}>{t.title}<\/li>)}\n    <\/ul>\n  );\n}\n\nexport function NewTaskForm({ onCreated }: { onCreated: (t: Task) => void }) {\n  const [title, setTitle] = useState('');\n  const [error, setError] = useState<string | null>(null);\n  async function submit(e: React.FormEvent) {\n    e.preventDefault();\n    if (!title.trim()) return setError('Title is required');\n    const res = await fetch('/api/tasks', { method: 'POST', body: JSON.stringify({ title }) });\n    if (!res.ok) return setError('Save failed');\n    onCreated(await res.json());\n  }\n  return (\n    <form onSubmit={submit}>\n      <label>Title <input value={title} onChange={e => setTitle(e.target.value)} /><\/label>\n      {error && <p role=\"alert\">{error}<\/p>}\n      <button>Create<\/button>\n    <\/form>\n  );\n}", "src/tasks.tsx"]], "p": "Scroll the code. Note the accessible hooks: <code>aria-label<\/code> on the list, <code>role=\"alert\"<\/code> for errors, a real <code>&lt;label&gt;<\/code>.", "lab": true}, {"k": "Lab 2 / 4 · Test the list", "h": "Loading, data, empty, error", "cmp": [["TSX", "describe('TaskList', () => {\n  it('shows loading then tasks', async () => {\n    renderWithProviders(<TaskList />);\n    expect(screen.getByText('Loading…')).toBeInTheDocument();\n    const list = await screen.findByRole('list', { name: 'Tasks' });\n    expect(within(list).getAllByRole('listitem')).toHaveLength(1);\n  });\n\n  it('shows the empty state', async () => {\n    server.use(http.get('/api/tasks', () => HttpResponse.json([])));\n    renderWithProviders(<TaskList />);\n    expect(await screen.findByText('No tasks yet')).toBeInTheDocument();\n  });\n\n  it('shows an error when the API fails', async () => {\n    server.use(http.get('/api/tasks', () => new HttpResponse(null, { status: 500 })));\n    renderWithProviders(<TaskList />);\n    expect(await screen.findByRole('alert')).toHaveTextContent('Could not load tasks');\n  });\n});", "TaskList.test.tsx"]], "p": "One test per state. <code>within(list)<\/code> scopes queries to a region, like <code>within<\/code> in Capybara.", "lab": true}, {"k": "Lab 3 / 4 · Test the form", "h": "Validation, success, failure", "cmp": [["TSX", "describe('NewTaskForm', () => {\n  it('requires a title', async () => {\n    const user = userEvent.setup();\n    const onCreated = jest.fn();\n    render(<NewTaskForm onCreated={onCreated} />);\n    await user.click(screen.getByRole('button', { name: 'Create' }));\n    expect(screen.getByRole('alert')).toHaveTextContent('Title is required');\n    expect(onCreated).not.toHaveBeenCalled();\n  });\n\n  it('posts and reports the created task', async () => {\n    let body: unknown;\n    server.use(http.post('/api/tasks', async ({ request }) => {\n      body = await request.json();\n      return HttpResponse.json({ id: 9, title: 'Ship it' }, { status: 201 });\n    }));\n    const user = userEvent.setup();\n    const onCreated = jest.fn();\n    render(<NewTaskForm onCreated={onCreated} />);\n    await user.type(screen.getByLabelText('Title'), 'Ship it');\n    await user.click(screen.getByRole('button', { name: 'Create' }));\n    await waitFor(() => expect(onCreated).toHaveBeenCalledWith({ id: 9, title: 'Ship it' }));\n    expect(body).toEqual({ title: 'Ship it' });\n  });\n\n  it('shows an error when saving fails', async () => {\n    server.use(http.post('/api/tasks', () => new HttpResponse(null, { status: 500 })));\n    const user = userEvent.setup();\n    render(<NewTaskForm onCreated={jest.fn()} />);\n    await user.type(screen.getByLabelText('Title'), 'x');\n    await user.click(screen.getByRole('button', { name: 'Create' }));\n    expect(await screen.findByRole('alert')).toHaveTextContent('Save failed');\n  });\n});", "NewTaskForm.test.tsx"]], "p": "We assert the <b>contract<\/b>: what was sent, what the parent was told, what the user saw.", "lab": true}, {"k": "Lab 4 / 4 · Break it on purpose", "h": "Prove the tests can fail", "v": "<ul class=\"chk\"><li class=\"rise\" style=\"--d:0.00s\">Rename the label to \"Name\": the form tests fail with a list of available labels. Good.<\/li><li class=\"rise\" style=\"--d:0.12s\">Return 500 from the default handler: the success test fails, the error test still passes.<\/li><li class=\"rise\" style=\"--d:0.24s\">Remove <code>e.preventDefault()<\/code>: jsdom logs \"form submission not implemented\" and the test catches it.<\/li><li class=\"rise\" style=\"--d:0.36s\">Delete <code>role=\"alert\"<\/code>: the error tests fail, which is an accessibility regression caught.<\/li><li class=\"rise\" style=\"--d:0.48s\">Run <code>jest --randomize<\/code>: all green means no order dependence.<\/li><\/ul>", "p": "A test you have never seen fail is a test you do not know works. Do this for AI-written tests too."}, {"quiz": true, "k": "Quiz 8 / 8 · Lab", "h": "Why does the lab create a new QueryClient inside <code>renderWithProviders<\/code> instead of once at the top of the file?", "opts": [["QueryClient cannot be imported at module level", 0], ["A shared client caches data between tests, so the empty-state test could see the previous test's tasks", 1], ["It makes tests run in parallel", 0]], "right": "Shared caches are shared state. Fresh client per test, retries off.", "wrong": "It is <b>cache isolation<\/b>. One shared client would serve cached tasks to the next test."}, {"recap": true, "h": "Testing on one card", "items": ["<b>Jest<\/b> runs each file in a worker with its own jsdom and module registry; tests in a file share state.", "<code>toEqual<\/code> for structure, jest-dom matchers for the DOM. <code>fn<\/code> for callbacks, <code>spyOn<\/code> for one method, <code>mock<\/code> for boundaries.", "Control time with fake timers; always <code>await<\/code>; snapshots only for small stable outputs.", "RTL: query by role, <code>userEvent<\/code> over <code>fireEvent<\/code>, <code>findBy<\/code> for async; act warnings mean the test ended too early.", "MSW fakes the network; reset handlers; test every UI state; prove each test can fail."], "next": "Next: <b>Part 8<\/b>, Node, npm and Yarn."}];
</script>
<script>(function(){
  "use strict";
  var KW='const|let|var|function|return|if|else|async|await|new|class|interface|type|import|export|default|from|def|end|public|private|static|final|void|try|catch|throw|typeof|record|enum|module|for|of|in|null|undefined|true|false|this|self|nil|package|implements|extends|describe|it|test|expect|before|beforeEach|afterEach|require|do';
  var RE=new RegExp('(\\/\\/[^\\n]*|#(?!\\{)[^\\n]*)|("[^"\\n]*"|\'[^\'\\n]*\'|`[^`]*`)|\\b('+KW+')\\b','g');
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function hl(src){ var out='',last=0,m; RE.lastIndex=0;
    while((m=RE.exec(src))){ out+=esc(src.slice(last,m.index)); out+= m[1]?'<span class="c">'+esc(m[1])+'</span>': m[2]?'<span class="s">'+esc(m[2])+'</span>':'<span class="k">'+m[3]+'</span>'; last=RE.lastIndex; }
    return out+esc(src.slice(last)); }
  var LC={JS:['#2a2510','#f7d046'],TS:['#13243a','#4ea8ff'],JSX:['#102a2a','#4ee6e0'],TSX:['#102a2a','#4ee6e0'],Java:['#2a1a14','#ff7a45'],JUnit:['#2a1a14','#ff7a45'],Ruby:['#3a1624','#ff5c8a'],RSpec:['#3a1624','#ff5c8a'],Bash:['#1a2a1a','#3ddc97'],Rails:['#3a1624','#ff5c8a'],JSON:['#22183a','#a78bfa']};
  var stage=document.getElementById('stage'), anchor=document.getElementById('bottomBar');
  CARDS.forEach(function(c){
    var s=document.createElement('section'); s.className='card'; var h='';
    if(c.sect){ s.className+=' sect';
      h='<div class="visual"><div class="num pop">'+c.num+'</div></div>'+(c.badge?'<div class="titlebadge"><i></i>'+c.badge+'</div>':'')+'<div class="kicker">'+c.kicker+'</div><h1>'+c.h+'</h1><p>'+c.p+'</p>'+(c.first?'<div class="tapme">Tap the right side or swipe left →</div>':'');
    } else if(c.quiz){ s.className+=' quiz'; s.setAttribute('data-quiz','');
      h='<div class="kicker">'+c.k+'</div><h2>'+c.h+'</h2>'+(c.code?'<div class="qcode">'+hl(c.code)+'</div>':'<div style="height:10px"></div>')+'<div class="opts">'+c.opts.map(function(o,i){return '<button class="opt" type="button" data-ok="'+o[1]+'"><span class="l">'+'ABCD'[i]+'</span>'+o[0]+'</button>';}).join('')+'</div><div class="fb"></div>';
    } else if(c.recap){
      h='<div class="kicker">Recap</div><h2>'+c.h+'</h2><ul class="take">'+
        c.items.map(function(t,i){return '<li class="rise" style="--d:'+(i*0.15)+'s">'+t+'</li>';}).join('')+
        '</ul><div class="score" id="score"></div><p style="font-size:13px;margin-top:8px">'+c.next+'</p><a class="btn ghost" href="index.html" style="margin-top:6px">← Course home</a>';
    } else {
      var inner='';
      if(c.cmp){ inner='<div class="stack">'+c.cmp.map(function(b,i){ var col=LC[b[0]]||LC.JS; return '<div class="cb rise" style="--d:'+(i*0.25)+'s"><div class="cb-h">'+(b[2]||(i===0?'modern':'compare'))+' <span class="tagc" style="background:'+col[0]+';color:'+col[1]+'">'+b[0]+'</span></div><pre>'+hl(b[1])+'</pre></div>'; }).join('')+'</div>'; }
      if(c.v){ inner=c.v+inner; }
      if(c.lab){ s.className+=' lab'; inner='<div class="scrollv demo">'+inner+'</div>'; }
      h='<div class="kicker">'+c.k+'</div><div class="visual">'+inner+'</div><h2>'+c.h+'</h2>'+(c.p?'<p>'+c.p+'</p>':'')+(c.an?'<div class="analogy"><span>'+c.an+'</span></div>':'');
    }
    s.innerHTML=h; if(c.quiz){ var fb=s.querySelector('.fb'); fb.setAttribute('data-right',c.right); fb.setAttribute('data-wrong',c.wrong); }
    stage.insertBefore(s, anchor);
  });
})();
</script>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var stage=$('stage'), cards=[].slice.call(document.querySelectorAll('.card')), segsEl=$('segs'), countEl=$('count'), prevBtn=$('prev'), nextBtn=$('next');
  var cur=0, N=cards.length, answered=0, correct=0, NQ=document.querySelectorAll('[data-quiz]').length;
  cards.forEach(function(){ var s=document.createElement('div'); s.className='seg'; s.appendChild(document.createElement('i')); segsEl.appendChild(s); });
  var segs=segsEl.children;
  function go(n){
    n=Math.max(0,Math.min(N-1,n));
    cards.forEach(function(c,k){ c.classList.toggle('past',k<n); if(k!==n) c.classList.remove('active'); c.setAttribute('aria-hidden',k!==n); });
    var card=cards[n]; card.classList.remove('active'); void card.offsetWidth; card.classList.add('active');
    for(var k=0;k<N;k++) segs[k].classList.toggle('done',k<=n);
    countEl.textContent=(n+1)+' / '+N; prevBtn.disabled=n===0; nextBtn.disabled=n===N-1; cur=n; try{var _k='lp:'+location.pathname.split('/').pop(),_o=JSON.parse(localStorage.getItem(_k)||'{}');localStorage.setItem(_k,JSON.stringify({max:Math.max(_o.max||0,n+1),total:N}));}catch(_e){} updateScore();
    try{ history.replaceState(null,'','#'+(n+1)); }catch(e){}
  }
  function next(){ if(cur<N-1) go(cur+1); } function prev(){ if(cur>0) go(cur-1); }
  prevBtn.addEventListener('click',function(e){e.stopPropagation();prev();});
  nextBtn.addEventListener('click',function(e){e.stopPropagation();next();});
  
  var lastSwipe=0;
  stage.addEventListener('click',function(e){
    if(Date.now()-lastSwipe<450) return;
    if(e.target.closest('button, a, .opts, .demo, textarea, iframe')) return;
    var r=stage.getBoundingClientRect(); if((e.clientX-r.left)/r.width<0.3) prev(); else next();
  });
  var sx=0,sy=0,tr=false;
  stage.addEventListener('touchstart',function(e){ if(e.target.closest('textarea')) return; var t=e.touches[0]; sx=t.clientX; sy=t.clientY; tr=true; },{passive:true});
  stage.addEventListener('touchend',function(e){ if(!tr) return; tr=false; var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){ lastSwipe=Date.now(); if(dx<0) next(); else prev(); } },{passive:true});
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='TEXTAREA') return;
    if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter')) return;
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
    else if(e.key==='Home') go(0); else if(e.key==='End') go(N-1);
  });
  [].forEach.call(document.querySelectorAll('[data-quiz]'),function(q){
    var opts=q.querySelector('.opts'), fb=q.querySelector('.fb');
    [].forEach.call(opts.querySelectorAll('.opt'),function(b){
      b.addEventListener('click',function(e){
        e.stopPropagation(); if(opts.classList.contains('done')) return;
        opts.classList.add('done'); answered++;
        var ok=b.getAttribute('data-ok')==='1'; if(ok) correct++; else b.classList.add('wrong');
        opts.querySelector('[data-ok="1"]').classList.add('right');
        fb.innerHTML='<span class="tag" style="color:'+(ok?'var(--green)':'var(--pink)')+'">'+(ok?'✓ Correct.':'✗ Not quite.')+'</span> '+fb.getAttribute(ok?'data-right':'data-wrong')+'<br><span style="color:var(--dim);font-size:12px">Tap or swipe to continue →</span>';
        fb.classList.add('show');
      });
    });
  });
  function updateScore(){ var s=$('score'); s.textContent=answered?('Quiz score: '+correct+' / '+NQ+(answered<NQ?' ('+(NQ-answered)+' skipped)':'')):''; }

  var start=parseInt((location.hash||'').slice(1),10); go(isNaN(start)?0:start-1);
})();
</script>
