<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07080d"><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Part 6 · Deeper React Patterns</title><style>
:root{
  --bg:#07080d; --panel:#121622; --panel2:#181d2b; --line:#2a3145; --text:#eef1f8; --muted:#a3acc2; --dim:#5d6680;
  --html:#ff7a45; --css:#4ea8ff; --js:#f7d046; --green:#3ddc97; --purple:#a78bfa; --pink:#ff5c8a; --cyan:#4ee6e0;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
.app{position:fixed;inset:0;display:flex;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#141a2e 0,transparent 60%),var(--bg)}
.stage{position:relative;width:100%;max-width:460px;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y}
@media (min-width:600px){.stage{height:min(100%,900px);margin:auto;border-radius:28px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 300px at 85% 10%,rgba(167,139,250,.10),transparent 70%),radial-gradient(500px 300px at 0% 90%,rgba(78,168,255,.08),transparent 70%);pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
.segs{display:flex;gap:3px}
.seg{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--css),var(--purple));transition:width .35s ease}
.seg.done i{width:100%}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.meta b{color:var(--text);font-weight:600}
.card{position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 58px) 22px calc(env(safe-area-inset-bottom) + 64px);display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(40px) scale(.98);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s linear .45s}
.card.past{transform:translateX(-40px) scale(.98)}
.card.active{opacity:1;visibility:visible;transform:none;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
.kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);margin-bottom:6px}
.visual{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;margin:4px 0 14px}
.visual svg{width:100%;height:100%;max-height:330px;overflow:visible}
h1,h2{margin:0 0 10px;line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(30px,9vw,40px)}
h2{font-size:clamp(22px,6.4vw,28px)}
p{margin:0 0 8px;font-size:clamp(15px,4.2vw,17px);line-height:1.5;color:var(--muted)}
p b,p strong{color:var(--text);font-weight:600}
code,.mono{font-family:var(--mono);font-size:.9em}
p code,.analogy code{background:#1b2131;border:1px solid var(--line);padding:1px 5px;border-radius:6px;color:#dfe5f5}
.analogy{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,rgba(78,168,255,.10),rgba(167,139,250,.10));border:1px solid rgba(120,140,255,.25);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;color:#cfd6ea;margin-top:6px}
.analogy::before{content:"⚙";font-size:15px;color:var(--css);line-height:1.3}
.analogy b{color:#fff}
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:0 14px calc(env(safe-area-inset-bottom) + 12px)}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(18,22,34,.8);color:var(--text);font-size:20px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
.nav:disabled{opacity:.3}
.hint{font-size:12px;color:var(--dim)}
svg *{transform-box:fill-box;transform-origin:center}
.active .pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.35) both;animation-delay:var(--d,0s)}
.active .fade{animation:fade .6s ease both;animation-delay:var(--d,0s)}
.active .rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.growx{transform-origin:left center}
.active .growx{animation:growx .6s ease both;animation-delay:var(--d,0s)}
.active .draw{stroke-dasharray:var(--len,300);animation:draw 1s ease both;animation-delay:var(--d,0s)}
.flow{stroke-dasharray:4 6;animation:flow 1s linear infinite}
.pulse{animation:pulse 2s ease-in-out infinite;animation-delay:var(--pd,0s)}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:var(--len,300)}to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes goR{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(60px);opacity:0}}
@keyframes goL{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(-72px);opacity:0}}
.req{animation:goR 2.4s ease-in-out infinite}
.chunk{opacity:0;animation:goL 2.4s linear infinite;animation-delay:var(--d,0s)}
.titlebadge{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;margin-bottom:14px;align-self:flex-start;background:rgba(255,255,255,.03)}
.titlebadge i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.tapme{margin-top:6px;font-size:13px;color:var(--dim);animation:pulse 1.8s infinite}
.grad{background:linear-gradient(90deg,var(--html),var(--js) 35%,var(--css) 70%,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.lay{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.lay-frame{width:100%;border:1px solid var(--line);border-radius:14px;padding:8px;background:#0d111b;display:flex;flex-direction:column;gap:6px;animation:resize 5s ease-in-out infinite alternate;position:relative}
@keyframes resize{0%,15%{width:100%}85%,100%{width:52%}}
.lay .b{border-radius:8px;font:600 11px/1 var(--mono);display:flex;align-items:center;justify-content:center;color:#0b0e16;padding:0 4px;overflow:hidden;white-space:nowrap}
.lay .hdr{height:26px;background:var(--css)}
.lay-row{display:flex;gap:6px}
.lay .side{flex:0 0 26%;height:54px;background:var(--purple)}
.lay .main{flex:1;height:54px;background:var(--green)}
.lay-cards{display:flex;flex-wrap:wrap;gap:6px}
.lay .c{flex:1 1 64px;height:30px;background:var(--js)}
.ruler{font:12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.ruler span{display:inline-block;height:2px;width:40px;background:linear-gradient(90deg,var(--pink),var(--js));border-radius:2px}
.comp{position:relative;width:250px;height:230px;perspective:800px}
.comp-in{position:absolute;inset:0;transform-style:preserve-3d}
.layer{position:absolute;left:25px;top:30px;width:200px;height:170px;border-radius:14px;border:1px solid rgba(255,255,255,.18);transform-origin:center;animation:explode 6s ease-in-out infinite;--z:0px;display:flex;align-items:flex-end;justify-content:flex-end;padding:8px;font:600 10px var(--mono);color:rgba(255,255,255,.85)}
.l1{--z:-60px;background-color:#151b30;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:16px 16px}
.l2{--z:0px;background:rgba(78,168,255,.18)}
.l2::before{content:"";position:absolute;left:66px;top:16px;width:112px;height:10px;border-radius:5px;background:rgba(255,255,255,.75);box-shadow:0 22px 0 rgba(255,255,255,.4),0 40px 0 rgba(255,255,255,.4),0 58px 0 rgba(255,255,255,.4),0 86px 0 -1px rgba(61,220,151,.7)}
.l3{--z:60px;width:56px;background:rgba(167,139,250,.6);animation-name:explode3;align-items:flex-start;justify-content:center;padding-top:10px;text-align:center}
@keyframes explode{0%,22%,100%{transform:rotateX(56deg) rotateZ(-38deg) translateZ(var(--z))}48%,80%{transform:rotateX(0) rotateZ(0) translateZ(0)}}
@keyframes explode3{0%,22%,100%{transform:rotateX(56deg) rotateZ(-38deg) translateZ(var(--z))}48%{transform:translateX(-60px)}62%,80%{transform:translateX(0)}}
.comp-tag{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font:12px var(--mono);color:var(--muted)}
.cost{width:100%;display:grid;grid-template-columns:92px repeat(5,1fr);gap:6px;font-size:10.5px;align-items:center}
.cost .h{color:var(--dim);text-align:center;font-weight:600;letter-spacing:.02em}
.cost .lbl{font:600 11px var(--mono);color:var(--text);line-height:1.3}
.cost .lbl small{display:block;color:var(--dim);font-weight:400}
.cell{height:30px;border-radius:8px;background:#151a27;border:1px dashed #262d40}
.cell.on{background:var(--c);border:0;box-shadow:0 0 14px var(--c)}
.active .cell.on{animation:light .45s ease both;animation-delay:var(--d,0s)}
@keyframes light{from{opacity:.1;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.costtag{grid-column:2/7;font-size:11px;color:var(--muted);text-align:right;margin-top:-2px}
.qcode{font:13px/1.55 var(--mono);background:#0d111b;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0 14px;color:#cdd5ea;white-space:pre;overflow-x:auto}
.qcode .k{color:var(--purple)}.qcode .s{color:var(--green)}.qcode .t{color:var(--html)}.qcode .c{color:var(--dim)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:15px;line-height:1.35;cursor:pointer;transition:transform .15s,border-color .2s,background .2s,opacity .2s}
.opt:active{transform:scale(.98)}
.opt:focus-visible{outline:2px solid var(--css)}
.opt .l{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#1e2436;font:700 12px var(--mono);color:var(--muted)}
.opt code{font-size:13px}
.opt.right{border-color:var(--green);background:rgba(61,220,151,.12)}
.opt.right .l{background:var(--green);color:#06210f}
.opt.wrong{border-color:var(--pink);background:rgba(255,92,138,.12);animation:shake .4s}
.opt.wrong .l{background:var(--pink);color:#2a0612}
.opts.done .opt:not(.right):not(.wrong){opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.fb{margin-top:12px;font-size:14px;line-height:1.45;color:var(--muted);opacity:0;transform:translateY(8px);transition:.3s}
.fb.show{opacity:1;transform:none}
.fb b{color:var(--text)}
.fb code{background:#1b2131;padding:1px 4px;border-radius:5px;color:#dfe5f5}
.fb .tag{display:inline-block;font-weight:800;margin-right:4px}
.qspacer{flex:1}
.rx{width:100%;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.rx-row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.rx-box{flex:1;background:#0d111b;border:1px solid var(--line);border-radius:12px;padding:10px 8px;font:11px/1.4 var(--mono);color:#cdd5ea;min-height:62px;display:flex;flex-direction:column;justify-content:center}
.rx-box .cap{font:700 9px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.rx-arrow{color:var(--purple);font:700 13px var(--mono);flex:0 0 auto}
.rx-f{flex:0 0 auto;background:linear-gradient(135deg,rgba(167,139,250,.25),rgba(78,168,255,.2));border:1px solid rgba(167,139,250,.5);border-radius:12px;padding:10px 7px;font:700 12px var(--mono)}
.rx-ui{background:#f5f6fa;color:#141824;border-radius:14px;padding:9px 10px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);min-height:62px}
.rx-ui .bar{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.rx-ui .badge{background:#ff5c1a;color:#fff;border-radius:999px;padding:1px 8px;font-size:11px}
.rx-ui ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.rx-ui li{background:#e7e9f2;border-radius:6px;padding:3px 6px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px #3ddc97}100%{box-shadow:0 0 0 0 transparent}}
.rx-note{font-size:12px;color:var(--dim);text-align:center}
.btn{all:unset;cursor:pointer;align-self:center;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,var(--purple),var(--css));color:#fff;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(120,120,255,.35)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--text);align-self:flex-start}
.flowchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;width:100%}
.chip{padding:7px 10px;border-radius:10px;font:700 12px var(--mono);color:#0b0e16;display:inline-block}
.arr{color:var(--dim);font-size:12px}
.take{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px;width:100%}
.take li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.4;color:#cfd6ea}
.take li b{color:#fff}
.score{font-size:13px;color:var(--muted);margin-top:10px}
.next-tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.next-tags span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);font-family:var(--mono)}
@media (max-height:700px){.visual svg{max-height:230px}.qcode{font-size:12px;padding:8px 10px;margin:4px 0 8px}.opt{padding:10px 12px}.analogy{font-size:13px;padding:8px 10px}p{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ---- lesson 1b additions ---- */
.net{width:100%;background:#0d111b;border:1px solid var(--line);border-radius:12px;overflow:hidden;font:10.5px/1.2 var(--mono)}
.net-h,.net-r{display:grid;grid-template-columns:1.35fr 46px 40px 1fr;gap:6px;align-items:center;padding:6px 9px}
.net-h{color:var(--dim);font:700 8.5px system-ui;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line);background:#121622}
.net-r{border-bottom:1px solid #161b28;color:#cdd5ea}
.net-r:last-of-type{border-bottom:0}
.net-r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net-r .t{color:var(--muted);font-size:9.5px}
.net-r .z{color:var(--muted);text-align:right;font-size:9.5px}
.net-r.dim{color:#59627a}.net-r.dim .t,.net-r.dim .z{color:#454d63}.net-r.dim .wf i{opacity:.35}
.net-r.hl{background:rgba(78,168,255,.09);box-shadow:inset 3px 0 0 var(--css)}

.wf i{position:absolute;top:0;height:100%;border-radius:3px;left:var(--s);width:var(--w);background:var(--c);transform-origin:left center}
.active .net-r{animation:rise .4s ease both;animation-delay:var(--d,0s)}
.active .wf i{animation:growx .5s ease both;animation-delay:calc(var(--d,0s) + .15s)}
.net-foot{padding:5px 9px;color:var(--dim);font-size:9px;display:flex;justify-content:space-between;border-top:1px solid var(--line);background:#121622}
.netwrap{width:100%;display:flex;flex-direction:column;gap:10px}
.cb{width:100%;font:11.5px/1.5 var(--mono);background:#0d111b;border:1px solid var(--line);border-radius:12px;color:#cdd5ea;overflow:hidden}

.cb-h{display:flex;justify-content:space-between;align-items:center;padding:5px 11px;background:#121622;border-bottom:1px solid var(--line);font:700 9px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.cb-h .tagc{font:700 9.5px var(--mono);letter-spacing:0;text-transform:none;padding:2px 7px;border-radius:999px}
.k{color:var(--purple)}.s{color:var(--green)}.t{color:var(--html)}.c{color:var(--dim)}.y{color:var(--js)}.bl{color:var(--css)}
.mk{background:rgba(247,208,70,.18);color:var(--js);border-radius:4px;padding:0 2px}
.stack{width:100%;display:flex;flex-direction:column;gap:8px}
.down{align-self:center;color:var(--purple);font:700 13px var(--mono);line-height:1}
/* phone mock */
.phone{width:178px;height:300px;border-radius:26px;border:2px solid #2a3145;background:#0b0e16;padding:12px 10px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.5);flex:0 0 auto;display:flex;flex-direction:column;gap:8px;overflow:hidden}

/* comparison table */

<script>var CARDS = [{"sect": 1, "num": "R+", "kicker": "Part 6 · React, deeper", "h": "Hooks &amp; patterns <span class=\"grad\">you'll meet in review<\/span>", "p": "Memoization (and when not to), refs, context, reducers, custom hooks, composition, server state, error boundaries, Suspense, accessibility, structure, and a thorough checklist for AI-written React.", "first": true, "badge": "~40 min · 53 cards · 7 quizzes"}, {"sect": 1, "num": "1", "kicker": "Section 1 · Memoization", "h": "useMemo, useCallback, <span class=\"grad\">memo<\/span>", "p": "Tools for skipping work. Mostly misused, so learn exactly what they do.", "first": false}, {"k": "Recap · why things re-render", "h": "Memo exists because children render with their parent", "p": "When a component renders, all its children render too (Part 4). Usually that's cheap. Memoization lets React <b>skip<\/b> work when inputs are unchanged, compared with <code>Object.is<\/code>: primitives by value, objects/arrays/functions by <b>reference<\/b>.", "cmp": [["TS", "Object.is(1, 1)            // true\nObject.is('a', 'a')        // true\nObject.is({}, {})          // false: two different objects\nObject.is(() => {}, () => {}) // false\n// so a `{}` or arrow written in render is 'new' every time", "the comparison"]]}, {"k": "useMemo", "h": "Cache a computed value between renders", "cmp": [["TSX", "const visible = useMemo(\n  () => projects.filter(p => p.name.includes(query)).sort(byDueDate),\n  [projects, query]      // recompute only when one of these changes\n);", "example"]], "steps": ["Render 1: run the function, store result + deps", "Render 2, deps identical: return the stored result, skip the function", "Render 3, <code>query<\/code> changed: run again, store new result"], "p": "Two legitimate uses: (1) skipping a genuinely <b>expensive<\/b> calculation (measure: <code>console.time<\/code>, roughly &gt;1ms), (2) keeping an object's <b>identity stable<\/b> because it's passed to a <code>memo<\/code> child or used as an effect/hook dependency."}, {"k": "useCallback & memo", "h": "Stable functions for memoized children", "cmp": [["TSX", "const ProjectRow = memo(function ProjectRow({ project, onSelect }: RowProps) {\n  return <tr onClick={() => onSelect(project.id)}>…<\/tr>;\n});\n\nfunction Table({ projects }: { projects: Project[] }) {\n  const [selected, setSelected] = useState<string | null>(null);\n  const onSelect = useCallback((id: string) => setSelected(id), []);\n  return projects.map(p => <ProjectRow key={p.id} project={p} onSelect={onSelect} />);\n}", "they work as a pair"]], "p": "<code>memo(Component)<\/code> skips rendering when every prop is <code>Object.is<\/code>-equal to last time. <code>useCallback(fn, deps)<\/code> is just <code>useMemo(() =&gt; fn, deps)<\/code>. <b>Either one alone is usually useless<\/b>: useCallback without a memo child (or a deps consumer) saves nothing, and memo with an inline arrow prop never skips."}, {"k": "Try it · memo vs inline props", "h": "Watch the child render counters", "v": "<div class=\"sim demo\"><div class=\"row\"><button type=\"button\" id=\"mmTick\">parent setState (typing)<\/button><button type=\"button\" id=\"mmReset\">reset<\/button><\/div><div class=\"g3\"><div class=\"box\" id=\"mmA\"><b>Row<\/b><br><small>no memo<\/small><br><span class=\"ctr\">renders: <span>1<\/span><\/span><\/div><div class=\"box\" id=\"mmB\"><b>memo(Row)<\/b><br><small>onSelect={() =&gt; …}<\/small><br><span class=\"ctr\">renders: <span>1<\/span><\/span><\/div><div class=\"box\" id=\"mmC\"><b>memo(Row)<\/b><br><small>useCallback prop<\/small><br><span class=\"ctr\">renders: <span>1<\/span><\/span><\/div><\/div><\/div>", "p": "Only the third column skips: memo plus props that are actually stable. The middle one pays memo's comparison cost and still renders every time, which is the most common AI pattern."}, {"k": "When NOT to memoize", "h": "Most memo in AI code is noise", "cmp": [["TSX", "const total = useMemo(() => a + b, [a, b]);           // ✗ cheaper than the memo\nconst onClick = useCallback(() => setOpen(true), []);  // ✗ passed to a plain <button>\nconst style = useMemo(() => ({ padding: 8 }), []);     // ✗ just hoist it to module scope\nexport default memo(Page);                             // ✗ rarely re-rendered by a parent", "✗ AI often writes"], ["TSX", "const total = a + b;\nconst STYLE = { padding: 8 };            // module constant\n<button onClick={() => setOpen(true)}>", "✓ Good"]], "p": "Memoization costs memory, a deps comparison every render, and readability, and wrong deps create stale bugs. Ask for a reason: an expensive calc, a memo child, or a dependency of an effect."}, {"k": "Better fixes first", "h": "Restructure before you memoize", "cmp": [["TSX", "// ✗ typing in the input re-renders <ExpensiveTree>\nfunction App() {\n  const [color, setColor] = useState('red');\n  return (<div>\n    <input value={color} onChange={e => setColor(e.target.value)} />\n    <ExpensiveTree />\n  <\/div>);\n}", "problem"], ["TSX", "// ✓ 1. move state down into the part that uses it\nfunction ColorPicker() {\n  const [color, setColor] = useState('red');\n  return <input value={color} onChange={e => setColor(e.target.value)} />;\n}\nfunction App() { return <><ColorPicker /><ExpensiveTree /><\/>; }\n\n// ✓ 2. or lift content up as children: elements created by the\n//    parent don't re-render when ColorBox's state changes\n<ColorBox><ExpensiveTree /><\/ColorBox>", "✓ Good"]], "p": "Also: virtualise long lists (TanStack Virtual) instead of memoizing 5,000 rows. The <b>React Compiler<\/b> can now insert memoization automatically at build time; if a codebase uses it, hand-written <code>useMemo<\/code>/<code>useCallback<\/code> is mostly unnecessary."}, {"quiz": true, "k": "Quiz 1 / 7 · Memo", "h": "Why does <code>memo(Row)<\/code> still render on every parent render?", "opts": [["memo is broken in React 18", 0], ["style and onSelect are new objects/functions every render", 1], ["Row needs a key", 0]], "right": "Inline <code>{{…}}<\/code> and arrows are <b>new references<\/b> each render, so the shallow compare fails. Hoist the style and use <code>useCallback<\/code>, or drop memo.", "wrong": "The inline <b>object and arrow are new every render<\/b>, so memo's shallow compare always sees changed props.", "code": "<Row project={p} style={{ padding: 8 }}\n     onSelect={id => setSel(id)} />"}, {"k": "Go deeper · Memoization", "h": "Go deeper", "links": [["Before You memo()", "https://overreacted.io/before-you-memo/", "Dan Abramov. The two restructuring tricks that beat memo."], ["When to useMemo and useCallback", "https://kentcdodds.com/blog/usememo-and-usecallback", "Kent C. Dodds. Why memoizing everything makes things slower."], ["useMemo reference", "https://react.dev/reference/react/useMemo", "react.dev. Includes \"Should you add useMemo everywhere?\" and how to measure."]]}, {"sect": 1, "num": "2", "kicker": "Section 2 · Refs", "h": "useRef: a box React <span class=\"grad\">doesn't watch<\/span>", "p": "For DOM nodes and values that must persist without causing renders.", "first": false}, {"k": "Refs vs state", "h": "Same persistence, different reactivity", "v": "<div class=\"g2\"><div class=\"box rise\"><b>useState<\/b><br><small>change → re-render. Value is a snapshot per render.<\/small><br><code>setCount(c+1)<\/code> <span class=\"pill\" style=\"background:#3a1624;color:#ff5c8a\">render!<\/span><\/div><div class=\"box rise\" style=\"--d:.3s\"><b>useRef<\/b><br><small>change → nothing. Always the latest value, mutable.<\/small><br><code>ref.current++<\/code> <span class=\"pill\" style=\"background:#10261c;color:#3ddc97\">silent<\/span><\/div><\/div>", "cmp": [["TSX", "const inputRef = useRef<HTMLInputElement>(null);\n<input ref={inputRef} />\nfunction focus() { inputRef.current?.focus(); }     // DOM access in a handler\n\nconst timer = useRef<number | undefined>(undefined);\ntimer.current = window.setTimeout(save, 500);       // instance-like value", "two uses"]], "an": "Like a private mutable instance field: it survives between calls but nobody is notified when it changes."}, {"k": "Ref gotchas", "h": "Rules AI code breaks", "cmp": [["TSX", "const count = useRef(0);\nreturn <button onClick={() => count.current++}>{count.current}<\/button>;\n// ✗ UI never updates: refs don't trigger renders\n\nfunction Row() {\n  renders.current++;            // ✗ writing a ref during render\n  if (ref.current.offsetHeight > 100) …  // ✗ reading DOM during render: null on first render\n}", "✗ AI often writes"]], "bul": ["If it's <b>shown on screen<\/b>, it's state, not a ref.", "Read/write <code>ref.current<\/code> in <b>handlers and effects<\/b>, not during render.", "DOM refs are <code>null<\/code> until after commit.", "To pass a ref to your own component: React 19 accepts <code>ref<\/code> as a normal prop; React 18 needs <code>forwardRef<\/code>."], "g": true}, {"quiz": true, "k": "Quiz 2 / 7 · Refs", "h": "You need the latest WebSocket instance for cleanup, and it never appears in the UI. Which hook?", "opts": [["useState", 0], ["useRef", 1], ["useMemo", 0]], "right": "<code>useRef<\/code> persists across renders without re-rendering. Perfect for sockets, timers and DOM nodes.", "wrong": "It's <b>useRef<\/b>. useState would re-render needlessly; useMemo is a cache React may discard, not storage."}, {"k": "Go deeper · Refs", "h": "Go deeper", "links": [["Referencing Values with Refs", "https://react.dev/learn/referencing-values-with-refs", "react.dev. When to use refs vs state, with examples and pitfalls."], ["Escape Hatches", "https://react.dev/learn/escape-hatches", "react.dev. The whole chapter on refs, effects and custom hooks."]]}, {"sect": 1, "num": "3", "kicker": "Section 3 · Context", "h": "Context and its <span class=\"grad\">pitfalls<\/span>", "p": "Great for dependency injection of slow-changing values; a trap as a general state store.", "first": false}, {"k": "What context does", "h": "Make a value available to a whole subtree", "cmp": [["TSX", "type Auth = { user: User; signOut: () => void };\nconst AuthContext = createContext<Auth | null>(null);\n\nexport function AuthProvider({ children }: { children: React.ReactNode }) {\n  const [user, setUser] = useState<User>(initialUser);\n  const value = useMemo(() => ({ user, signOut: () => setUser(guest) }), [user]);\n  return <AuthContext.Provider value={value}>{children}<\/AuthContext.Provider>;\n}\n\nexport function useAuth() {\n  const ctx = useContext(AuthContext);\n  if (!ctx) throw new Error('useAuth must be used inside <AuthProvider>');\n  return ctx;\n}", "✓ the good pattern"]], "p": "Export a <b>provider<\/b> and a <b>custom hook<\/b>, never the raw context. The hook's null check turns \"forgot the provider\" into a clear error instead of <code>undefined<\/code> bugs.", "an": "Like a request-scoped bean or Rails <code>CurrentAttributes<\/code>: available anywhere below the provider without being passed explicitly."}, {"k": "Pitfall · every consumer re-renders", "h": "Value changes fan out to the whole subtree", "cmp": [["TSX", "<Ctx.Provider value={{ user, theme, cursorX }}>   // ✗ new object every render,\n                                                 //   and cursorX changes constantly", "✗ AI often writes"], ["TSX", "<UserContext.Provider value={user}>          // slow-changing\n  <ThemeContext.Provider value={theme}>      // separate contexts\n    {children}\n  <\/ThemeContext.Provider>\n<\/UserContext.Provider>\n// fast-changing state stays local, or in a store with selectors (Zustand)", "✓ Good"]], "bul": ["Every component calling <code>useContext(Ctx)<\/code> re-renders when the value's identity changes, even if it only uses one field. <code>memo<\/code> doesn't stop this.", "An inline object value is a new identity on every provider render: wrap in <code>useMemo<\/code>.", "Split unrelated values into separate contexts.", "Context is not a cache for server data; use TanStack Query."], "g": true}, {"quiz": true, "k": "Quiz 3 / 7 · Context", "h": "A context holds <code>{ user, cursorX, cursorY }<\/code>, updated on every mousemove. What's the problem?", "opts": [["Nothing, context is optimised for this", 0], ["Every consumer re-renders on every mouse move", 1], ["Context can't hold numbers", 0]], "right": "Any change to the value re-renders <b>all<\/b> consumers. Split fast-changing data out, or use a store with selectors.", "wrong": "<b>All consumers<\/b> re-render on each change. Keep fast-changing values out of broad contexts."}, {"k": "Go deeper · Context", "h": "Go deeper", "links": [["How to use React Context effectively", "https://kentcdodds.com/blog/how-to-use-react-context-effectively", "Kent C. Dodds. The provider + custom hook pattern shown above."], ["Passing Data Deeply with Context", "https://react.dev/learn/passing-data-deeply-with-context", "react.dev. Use cases and \"before you use context\" alternatives."]]}, {"sect": 1, "num": "4", "kicker": "Section 4 · Reducers & custom hooks", "h": "Organising <span class=\"grad\">stateful logic<\/span>", "p": "useReducer for complex transitions, custom hooks for reuse.", "first": false}, {"k": "useReducer", "h": "State transitions as named events", "cmp": [["TSX", "type State =\n  | { status: 'idle' }\n  | { status: 'saving' }\n  | { status: 'saved'; id: string }\n  | { status: 'error'; error: string };\ntype Action =\n  | { type: 'submit' } | { type: 'success'; id: string } | { type: 'fail'; error: string };\n\nfunction reducer(state: State, action: Action): State {\n  switch (action.type) {\n    case 'submit':  return { status: 'saving' };\n    case 'success': return { status: 'saved', id: action.id };\n    case 'fail':    return { status: 'error', error: action.error };\n  }\n}\nconst [state, dispatch] = useReducer(reducer, { status: 'idle' });\ndispatch({ type: 'submit' });", "example"]], "p": "A reducer is a <b>pure<\/b> function <code>(state, action) → newState<\/code>, unit-testable without React. Reach for it when several fields change together or the next state depends on the event type. A discriminated union makes impossible states (saved <i>and<\/i> error) unrepresentable.", "an": "A small state machine. If you know AASM in Rails, the shape will feel familiar."}, {"k": "Reducer gotchas", "h": "Keep it pure", "g": true, "bul": ["No side effects inside the reducer (no fetch, no toast, no <code>Date.now()<\/code>/<code>Math.random()<\/code>); StrictMode calls it twice.", "Return new objects; never mutate <code>state<\/code>.", "Handle unknown actions; with TS unions, an exhaustive switch catches missing cases.", "Don't convert every <code>useState<\/code> to a reducer. Two independent fields don't need one."]}, {"k": "Custom hooks", "h": "Extract and share stateful logic", "cmp": [["TSX", "function useDebouncedValue<T>(value: T, delay = 300): T {\n  const [debounced, setDebounced] = useState(value);\n  useEffect(() => {\n    const t = setTimeout(() => setDebounced(value), delay);\n    return () => clearTimeout(t);\n  }, [value, delay]);\n  return debounced;\n}\n\n// in a component\nconst q = useDebouncedValue(search);\nconst { data } = useProjects(q);", "✓ Good"]], "steps": ["Name starts with <code>use<\/code>, so the linter applies the Rules of Hooks", "Calls hooks only at the top level: no if/loop/after early return", "Each component calling it gets its <b>own<\/b> state; it shares logic, not data", "Returns what callers need: a value, a tuple, or an object"], "p": "Good hooks have a narrow purpose and honest dependencies. Watch for AI hooks that wrap a single <code>useState<\/code> for no reason, or hide effects without cleanup."}, {"quiz": true, "k": "Quiz 4 / 7 · Custom hooks", "h": "Two components both call <code>useCart()<\/code>, which uses <code>useState<\/code> internally. Do they share the cart?", "opts": [["Yes, hooks are singletons", 0], ["No, each call has its own independent state", 1], ["Only if they're siblings", 0]], "right": "Custom hooks share <b>logic<\/b>, not state. To share data, lift it up, use context, or an external store.", "wrong": "<b>No<\/b>. Each call gets its own state. Sharing data needs a common owner, context or a store."}, {"k": "Go deeper · Reducers & hooks", "h": "Go deeper", "links": [["Extracting State Logic into a Reducer", "https://react.dev/learn/extracting-state-logic-into-a-reducer", "react.dev. Converting useState to useReducer step by step."], ["Reusing Logic with Custom Hooks", "https://react.dev/learn/reusing-logic-with-custom-hooks", "react.dev. When to extract a hook and how to name it."]]}, {"sect": 1, "num": "5", "kicker": "Section 5 · Composition", "h": "Composition over <span class=\"grad\">configuration<\/span>", "p": "How to build components that stay simple as requirements grow.", "first": false}, {"k": "children and slots", "h": "Pass UI, not flags", "cmp": [["TSX", "<Card title=\"RFIs\" showIcon iconType=\"warn\" hasFooter footerText=\"View all\"\n      footerAlign=\"right\" isCompact headerVariant=\"bold\" />   // ✗ prop explosion", "✗ AI often writes"], ["TSX", "<Card>\n  <Card.Header icon={<WarnIcon />}>RFIs<\/Card.Header>\n  <RfiList />\n  <Card.Footer><Link to=\"/rfis\">View all<\/Link><\/Card.Footer>\n<\/Card>\n\n// or named slots as props\n<PageLayout sidebar={<Filters />} actions={<Button>New<\/Button>}>\n  <ProjectsTable />\n<\/PageLayout>", "✓ Good"]], "p": "Every boolean prop doubles the number of states to test. Accepting <code>children<\/code> or element props (slots) lets callers compose, and keeps the component small."}, {"k": "Compound components", "h": "Related parts that share implicit state", "cmp": [["TSX", "const TabsCtx = createContext<{ active: string; set(v: string): void } | null>(null);\nexport function Tabs({ defaultValue, children }) {\n  const [active, set] = useState(defaultValue);\n  return <TabsCtx.Provider value={{ active, set }}>{children}<\/TabsCtx.Provider>;\n}\nTabs.Tab = function Tab({ value, children }) {\n  const ctx = useContext(TabsCtx)!;\n  return <button role=\"tab\" aria-selected={ctx.active === value}\n                 onClick={() => ctx.set(value)}>{children}<\/button>;\n};\n// usage: <Tabs defaultValue=\"open\"><Tabs.Tab value=\"open\">Open<\/Tabs.Tab>…<\/Tabs>", "pattern"]], "p": "Used by most design systems (Radix, Headless UI). Older patterns you'll see: <b>render props<\/b> (<code>&lt;Data render={d =&gt; …} /&gt;<\/code>) and <b>HOCs<\/b> (<code>withAuth(Page)<\/code>); custom hooks replace both in new code."}, {"k": "Go deeper · Composition", "h": "Go deeper", "links": [["Compound Components with React Hooks", "https://kentcdodds.com/blog/compound-components-with-react-hooks", "Kent C. Dodds. Building the Tabs pattern from scratch."], ["Thinking in React", "https://react.dev/learn/thinking-in-react", "react.dev. Breaking a UI into a component hierarchy and placing state."]]}, {"sect": 1, "num": "6", "kicker": "Section 6 · Server state", "h": "TanStack Query vs <span class=\"grad\">global stores<\/span>", "p": "Most \"global state\" is really a cache of server data. Treat it like one.", "first": false}, {"k": "Two kinds of state", "h": "Different problems, different tools", "v": "<div class=\"g2\"><div class=\"box rise\"><b>Server state<\/b><br><small>projects, users, RFIs. Lives in the DB; you hold a copy that can go stale. Needs caching, dedup, refetch, invalidation.<\/small><br><span class=\"pill\" style=\"background:#13243a;color:#4ea8ff\">TanStack Query<\/span><\/div><div class=\"box rise\" style=\"--d:.3s\"><b>Client state<\/b><br><small>open modal, selected tab, form draft. Owned by the browser.<\/small><br><span class=\"pill\" style=\"background:#22183a;color:#a78bfa\">useState / context / Zustand<\/span><\/div><\/div>"}, {"k": "useQuery", "h": "A declarative cache keyed by query key", "cmp": [["TSX", "function useProjects(companyId: string, status: Status) {\n  return useQuery({\n    queryKey: ['projects', companyId, { status }],   // every input in the key\n    queryFn: ({ signal }) =>\n      api.get(`/companies/${companyId}/projects`, { params: { status }, signal }),\n    staleTime: 30_000,\n  });\n}\nconst { data, isPending, isError, error } = useProjects(id, 'open');", "✓ Good"]], "steps": ["First mount: no cache → fetch, <code>isPending<\/code> true", "Data arrives, stored under the key; all components using the key share it", "Another component mounts with the same key: served from cache, no duplicate request", "After <code>staleTime<\/code>, data is <b>stale<\/b>: shown instantly, refetched in background on mount/focus/reconnect", "No observers for <code>gcTime<\/code> (default 5 min): removed from memory"], "an": "A read-through cache with expiry, like <code>Rails.cache.fetch(key, expires_in:)<\/code>, plus automatic background refresh."}, {"k": "Mutations & invalidation", "h": "Writes bust the cache", "cmp": [["TSX", "const qc = useQueryClient();\nconst create = useMutation({\n  mutationFn: (p: NewProject) => api.post('/projects', p),\n  onSuccess: () => qc.invalidateQueries({ queryKey: ['projects'] }), // prefix match\n});\n<button disabled={create.isPending} onClick={() => create.mutate(draft)}>Save<\/button>", "example"]], "p": "Invalidating marks matching queries stale and refetches active ones. For instant UI, do an <b>optimistic update<\/b> with rollback in <code>onError<\/code>."}, {"k": "Hand-rolled fetching vs a query", "h": "What AI often generates", "cmp": [["TSX", "const [data, setData] = useState<Project[]>([]);\nconst [loading, setLoading] = useState(false);\nuseEffect(() => {\n  setLoading(true);\n  fetch('/api/projects').then(r => r.json()).then(setData)\n    .finally(() => setLoading(false));\n}, []);   // ✗ no error state, no race handling, no cache,\n          //   refetched by every component that needs it", "✗ AI often writes"], ["TSX", "const { data = [], isPending, isError } = useQuery({\n  queryKey: ['projects'], queryFn: fetchProjects });\nif (isPending) return <Skeleton />;\nif (isError) return <ErrorState onRetry={…} />;\nif (data.length === 0) return <EmptyState />;", "✓ Good"]], "bul": ["<b>Missing key inputs<\/b>: <code>queryKey: ['projects']<\/code> while the fn uses <code>status<\/code> → wrong cached data.", "<b>Copying query data into useState<\/b> → stops receiving updates.", "Use <code>enabled<\/code> for dependent queries instead of conditional hook calls.", "A global store (Redux, Zustand) is for complex <b>client<\/b> workflows, not for API caches."], "g": true}, {"quiz": true, "k": "Quiz 5 / 7 · Server state", "h": "Changing the status filter shows the same projects as before. The query is below. Why?", "opts": [["staleTime is too long", 0], ["status is used by the fetcher but missing from the queryKey", 1], ["useQuery doesn't support params", 0]], "right": "The key identifies the cache entry. If <code>status<\/code> isn't in it, every filter shares one entry. Put all inputs in the key.", "wrong": "The <b>queryKey<\/b> must include <code>status<\/code>; otherwise the cached result for the old filter is reused.", "code": "useQuery({\n  queryKey: ['projects'],\n  queryFn: () => fetchProjects({ status }),\n});"}, {"k": "Go deeper · Server state", "h": "Go deeper", "links": [["TanStack Query overview", "https://tanstack.com/query/latest/docs/framework/react/overview", "Official docs: why server state is different, and the core API."], ["Practical React Query", "https://tkdodo.eu/blog/practical-react-query", "TkDodo (a Query maintainer). Defaults, keys and patterns that hold up in real apps."], ["Application State Management with React", "https://kentcdodds.com/blog/application-state-management-with-react", "Kent C. Dodds. Why most apps need far less global state than they think."]]}, {"sect": 1, "num": "7", "kicker": "Section 7 · Errors & loading", "h": "Error boundaries and <span class=\"grad\">Suspense<\/span>", "p": "Declarative handling for \"it broke\" and \"it's not ready yet\".", "first": false}, {"k": "Error boundaries", "h": "Catch render errors in a subtree", "cmp": [["TSX", "import { ErrorBoundary } from 'react-error-boundary';\n\n<ErrorBoundary\n  fallbackRender={({ error, resetErrorBoundary }) => (\n    <div role=\"alert\">Couldn't load RFIs. <button onClick={resetErrorBoundary}>Retry<\/button><\/div>\n  )}\n  onError={(e) => reportToMonitoring(e)}\n>\n  <RfiPanel />\n<\/ErrorBoundary>", "✓ Good"]], "p": "Without a boundary, an error thrown while rendering unmounts the <b>whole app<\/b> (white screen). Boundaries are class components under the hood; the <code>react-error-boundary<\/code> package wraps that. Place them per widget/route so one failure doesn't take down the page.", "bul": ["They <b>don't<\/b> catch errors in event handlers, async code (promises, timeouts) or the boundary itself: use try/catch there.", "TanStack Query can rethrow to the nearest boundary with <code>throwOnError<\/code>."], "g": true}, {"k": "Suspense", "h": "Declare a loading fallback for a subtree", "v": "<div class=\"tree\">&lt;Page&gt;\n  &lt;Header /&gt;                   <span class=\"c\"># renders immediately<\/span>\n  <span class=\"new\">&lt;Suspense fallback={&lt;Skeleton/&gt;}&gt;<\/span>\n    &lt;ProjectStats /&gt;   <span class=\"c\"># suspends while loading<\/span>\n    &lt;RecentRfis /&gt;     <span class=\"c\"># shown together when both ready<\/span>\n  &lt;/Suspense&gt;\n&lt;/Page&gt;<\/div>", "p": "A component \"suspends\" while lazy code (<code>React.lazy<\/code>) or Suspense-enabled data (<code>useSuspenseQuery<\/code>, framework loaders, React 19 <code>use<\/code>) is loading; the nearest <code>&lt;Suspense&gt;<\/code> shows its fallback. Boundary placement is a UX decision: one big boundary = one big spinner; many small ones = popcorn UI. Pair with an error boundary around it."}, {"quiz": true, "k": "Quiz 6 / 7 · Errors", "h": "A click handler calls <code>await api.save()<\/code>, which throws. Will the surrounding ErrorBoundary show its fallback?", "opts": [["Yes, boundaries catch everything below them", 0], ["No, boundaries only catch errors thrown during rendering", 1], ["Only in production", 0]], "right": "Errors in handlers and async code aren't caught. Use try/catch (or a mutation's onError) and set error state.", "wrong": "<b>No<\/b>. Boundaries catch render/lifecycle errors, not event handler or async errors."}, {"k": "Go deeper · Errors & Suspense", "h": "Go deeper", "links": [["Use react-error-boundary to handle errors in React", "https://kentcdodds.com/blog/use-react-error-boundary-to-handle-errors-in-react", "Kent C. Dodds. Patterns for fallbacks, resets and async errors."], ["Suspense reference", "https://react.dev/reference/react/Suspense", "react.dev. Fallbacks, nesting, and what can suspend."]]}, {"sect": 1, "num": "8", "kicker": "Section 8 · Quality", "h": "Accessibility &amp; <span class=\"grad\">structure<\/span>", "p": "Two things AI code gets wrong quietly.", "first": false}, {"k": "Accessibility basics", "h": "Semantic HTML does most of the work", "cmp": [["TSX", "<div onClick={save}>Save<\/div>          // ✗ no keyboard, no role\n<input placeholder=\"Name\" />           // ✗ placeholder is not a label\n<img src={logo} />                     // ✗ no alt\n<span onClick={close}>×<\/span>         // ✗ unnamed icon button", "✗ AI often writes"], ["TSX", "<button type=\"button\" onClick={save}>Save<\/button>\n<label htmlFor=\"name\">Name<\/label><input id=\"name\" />\n<img src={logo} alt=\"Company logo\" />\n<button type=\"button\" aria-label=\"Close dialog\" onClick={close}>×<\/button>", "✓ Good"]], "bul": ["Use real elements: <code>button<\/code> for actions, <code>a<\/code>/<code>Link<\/code> for navigation, headings in order.", "Everything works with <b>Tab, Enter, Space, Escape<\/b>; focus stays visible.", "Modals: move focus in, trap it, return it on close (use a tested dialog component).", "Don't rely on colour alone; announce async results (<code>role=\"status\"<\/code>).", "The first rule of ARIA: don't add ARIA when a native element exists."], "an": "Bonus: Testing Library's <code>getByRole<\/code> queries only work when the markup is accessible, so good a11y and good tests reinforce each other."}, {"k": "Folder structure", "h": "Group by feature, not by file type", "v": "<div class=\"tree\">src/\n  <span class=\"new\">features/<\/span>\n    projects/\n      api.ts            <span class=\"c\"># fetchers + query hooks<\/span>\n      components/       <span class=\"c\"># ProjectTable, ProjectCard<\/span>\n      hooks/            <span class=\"c\"># useProjectFilters<\/span>\n      ProjectsPage.tsx\n      projects.test.tsx\n    rfis/ …\n  <span class=\"new\">shared/<\/span>\n    ui/  hooks/  lib/\n  app/ (routes, providers)<\/div>", "p": "Top-level <code>components/<\/code>, <code>hooks/<\/code>, <code>utils/<\/code> folders scale badly. <b>Feature folders<\/b> keep a slice's UI, hooks, API and tests together; features import from <code>shared<\/code>, not from each other's internals. Colocate: put code as close as possible to where it's used."}, {"k": "Go deeper · Quality", "h": "Go deeper", "links": [["ARIA Authoring Practices Guide", "https://www.w3.org/WAI/ARIA/apg/", "W3C. Keyboard and ARIA patterns for tabs, dialogs, menus and more."], ["React Accessibility (Frontend Masters)", "https://frontendmasters.com/courses/react-accessibility/", "Marcy Sutton's course on building accessible React apps."], ["Bulletproof React", "https://github.com/alan2207/bulletproof-react", "A widely referenced example architecture with feature folders."]]}, {"sect": 1, "num": "9", "kicker": "Section 9 · Review", "h": "Reviewing <span class=\"grad\">AI-written React<\/span>", "p": "AI code usually compiles and demos fine. The bugs hide in effects, state, keys, missing states and accessibility.", "first": false}, {"k": "Checklist · correctness", "h": "Go through this on every PR", "bul": ["<b>Effects<\/b>: each one syncs with something external; deps complete (no lint disables); cleanup for subscriptions, timers, fetches.", "<b>No derived state<\/b>: nothing computed from props/state is stored in state or synced with an effect.", "<b>Event logic in handlers<\/b>, not in effects watching flags.", "<b>Immutable updates<\/b>; updater form when based on previous state.", "<b>Keys<\/b>: stable ids, never index on dynamic lists or random.", "<b>Async UI<\/b>: loading, error, empty and success states all handled; races handled.", "<b>Server data<\/b> via TanStack Query with complete query keys, not copied into useState."]}, {"k": "Checklist · design & quality", "h": "Second pass", "bul": ["<b>Types<\/b>: no <code>any<\/code>, no unchecked <code>as<\/code> casts; API responses validated (e.g. zod) at the boundary.", "<b>State placement<\/b>: as low as possible, lifted only to the common parent; no giant contexts.", "<b>Memo<\/b>: only with a reason; no useCallback without a memo consumer.", "<b>Components<\/b>: small, composable, not a pile of boolean props; hooks extracted where logic repeats.", "<b>A11y<\/b>: real buttons/links/labels, keyboard path, focus management.", "<b>Errors<\/b>: error boundaries around risky widgets; try/catch in async handlers.", "<b>Fit<\/b>: uses the team's design system, folder layout and conventions; tests query by role.", "<b>Size<\/b>: no huge new dependency for a one-liner; lazy-load heavy screens."]}, {"k": "Prompts for better output", "h": "Give it the context a new teammate would need", "cmp": [["Text", "You are writing React 18 + TypeScript (strict).\nContext:\n- Server state: @tanstack/react-query v5; API = GET /api/projects?status=\n- UI: our design-system components only, no inline styles\n- Tests: Jest + React Testing Library, query by role\nTask: build <ProjectsTable> with search + status filter.\nConstraints:\n- No useEffect for derived data; no any; complete query keys\n- Handle loading, error and empty states\n- Accessible: labelled inputs, keyboard usable\nOutput: component, hook and test file. Then list\nassumptions and anything you were unsure about.", "prompt template"]], "p": "Name versions, libraries, constraints and expected files. Asking for <b>assumptions<\/b> surfaces the guesses you need to check. Then: \"review this against the checklist and fix issues\"."}, {"quiz": true, "k": "Quiz 7 / 7 · Review", "h": "AI wrote this. What's the main issue?", "opts": [["Missing cleanup function", 0], ["Derived state in an effect: just compute it in render", 1], ["Should use useRef", 0]], "right": "<code>const full = first + ' ' + last<\/code> is enough. The effect adds an extra render and a frame of stale UI.", "wrong": "It's <b>derived state<\/b>. Compute it during render; effects are for syncing with external systems.", "code": "const [full, setFull] = useState('');\nuseEffect(() => {\n  setFull(first + ' ' + last);\n}, [first, last]);"}, {"k": "Go deeper · Review", "h": "Go deeper", "links": [["You Might Not Need an Effect", "https://react.dev/learn/you-might-not-need-an-effect", "react.dev. Most of the effect-related review comments you'll write are on this page."], ["Fix the slow render before you fix the re-render", "https://kentcdodds.com/blog/fix-the-slow-render-before-you-fix-the-re-render", "Kent C. Dodds. A sane way to judge performance claims in a PR."], ["Intermediate React, v6 (Frontend Masters)", "https://frontendmasters.com/courses/intermediate-react-v6/", "Brian Holt on performance, server components and advanced patterns."]]}, {"recap": true, "h": "Deeper React on one card", "items": ["<b>useMemo/useCallback/memo<\/b> skip work only with stable inputs; restructure first, memoize with a reason.", "<b>useRef<\/b>: mutable, persistent, no renders; not for anything shown on screen.", "<b>Context<\/b>: provider + custom hook; split values; every consumer re-renders on change.", "<b>useReducer<\/b> for event-driven transitions; <b>custom hooks<\/b> share logic, not state; compose with children and slots.", "<b>TanStack Query<\/b> for server state (complete keys, invalidate on write); small client state stays local.", "<b>Error boundaries<\/b> for render errors, <b>Suspense<\/b> for loading; semantic HTML; feature folders; review AI code with the checklist."], "next": "Next: <b>Part 7<\/b>, testing with Jest &amp; RTL."}];

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var stage=$('stage'), cards=[].slice.call(document.querySelectorAll('.card')), segsEl=$('segs'), countEl=$('count'), prevBtn=$('prev'), nextBtn=$('next');
  var cur=0, N=cards.length, answered=0, correct=0, NQ=document.querySelectorAll('[data-quiz]').length;
  cards.forEach(function(){ var s=document.createElement('div'); s.className='seg'; s.appendChild(document.createElement('i')); segsEl.appendChild(s); });
  var segs=segsEl.children;
  function go(n){
    n=Math.max(0,Math.min(N-1,n));
    cards.forEach(function(c,k){ c.classList.toggle('past',k<n); if(k!==n) c.classList.remove('active'); c.setAttribute('aria-hidden',k!==n); });
    var card=cards[n]; card.classList.remove('active'); void card.offsetWidth; card.classList.add('active');
    for(var k=0;k<N;k++) segs[k].classList.toggle('done',k<=n);
    countEl.textContent=(n+1)+' / '+N; prevBtn.disabled=n===0; nextBtn.disabled=n===N-1; cur=n; try{var _k='lp:'+location.pathname.split('/').pop(),_o=JSON.parse(localStorage.getItem(_k)||'{}');localStorage.setItem(_k,JSON.stringify({max:Math.max(_o.max||0,n+1),total:N}));}catch(_e){} updateScore();
    try{ history.replaceState(null,'','#'+(n+1)); }catch(e){}
  }
  function next(){ if(cur<N-1) go(cur+1); } function prev(){ if(cur>0) go(cur-1); }
  prevBtn.addEventListener('click',function(e){e.stopPropagation();prev();});
  nextBtn.addEventListener('click',function(e){e.stopPropagation();next();});
  
  var lastSwipe=0;
  stage.addEventListener('click',function(e){
    if(Date.now()-lastSwipe<450) return;
    if(e.target.closest('button, a, .opts, .demo, textarea, iframe')) return;
    var r=stage.getBoundingClientRect(); if((e.clientX-r.left)/r.width<0.3) prev(); else next();
  });
  var sx=0,sy=0,tr=false;
  stage.addEventListener('touchstart',function(e){ if(e.target.closest('textarea')) return; var t=e.touches[0]; sx=t.clientX; sy=t.clientY; tr=true; },{passive:true});
  stage.addEventListener('touchend',function(e){ if(!tr) return; tr=false; var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){ lastSwipe=Date.now(); if(dx<0) next(); else prev(); } },{passive:true});
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='TEXTAREA') return;
    if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter')) return;
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
    else if(e.key==='Home') go(0); else if(e.key==='End') go(N-1);
  });
  [].forEach.call(document.querySelectorAll('[data-quiz]'),function(q){
    var opts=q.querySelector('.opts'), fb=q.querySelector('.fb');
    [].forEach.call(opts.querySelectorAll('.opt'),function(b){
      b.addEventListener('click',function(e){
        e.stopPropagation(); if(opts.classList.contains('done')) return;
        opts.classList.add('done'); answered++;
        var ok=b.getAttribute('data-ok')==='1'; if(ok) correct++; else b.classList.add('wrong');
        opts.querySelector('[data-ok="1"]').classList.add('right');
        fb.innerHTML='<span class="tag" style="color:'+(ok?'var(--green)':'var(--pink)')+'">'+(ok?'✓ Correct.':'✗ Not quite.')+'</span> '+fb.getAttribute(ok?'data-right':'data-wrong')+'<br><span style="color:var(--dim);font-size:12px">Tap or swipe to continue →</span>';
        fb.classList.add('show');
      });
    });
  });
  function updateScore(){ var s=$('score'); s.textContent=answered?('Quiz score: '+correct+' / '+NQ+(answered<NQ?' ('+(NQ-answered)+' skipped)':'')):''; }

  var start=parseInt((location.hash||'').slice(1),10); go(isNaN(start)?0:start-1);
})();
</script>
