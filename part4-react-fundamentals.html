<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07080d"><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Part 4 · React Fundamentals</title><style>
:root{
  --bg:#07080d; --panel:#121622; --panel2:#181d2b; --line:#2a3145; --text:#eef1f8; --muted:#a3acc2; --dim:#5d6680;
  --html:#ff7a45; --css:#4ea8ff; --js:#f7d046; --green:#3ddc97; --purple:#a78bfa; --pink:#ff5c8a; --cyan:#4ee6e0;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
.app{position:fixed;inset:0;display:flex;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#141a2e 0,transparent 60%),var(--bg)}
.stage{position:relative;width:100%;max-width:460px;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y}
@media (min-width:600px){.stage{height:min(100%,900px);margin:auto;border-radius:28px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 300px at 85% 10%,rgba(167,139,250,.10),transparent 70%),radial-gradient(500px 300px at 0% 90%,rgba(78,168,255,.08),transparent 70%);pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
.segs{display:flex;gap:3px}
.seg{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--css),var(--purple));transition:width .35s ease}
.seg.done i{width:100%}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.meta b{color:var(--text);font-weight:600}
.card{position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 58px) 22px calc(env(safe-area-inset-bottom) + 64px);display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(40px) scale(.98);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s linear .45s}
.card.past{transform:translateX(-40px) scale(.98)}
.card.active{opacity:1;visibility:visible;transform:none;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
.kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);margin-bottom:6px}
.visual{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;margin:4px 0 14px}
.visual svg{width:100%;height:100%;max-height:330px;overflow:visible}
h1,h2{margin:0 0 10px;line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(30px,9vw,40px)}
h2{font-size:clamp(22px,6.4vw,28px)}
p{margin:0 0 8px;font-size:clamp(15px,4.2vw,17px);line-height:1.5;color:var(--muted)}
p b,p strong{color:var(--text);font-weight:600}
code,.mono{font-family:var(--mono);font-size:.9em}
p code,.analogy code{background:#1b2131;border:1px solid var(--line);padding:1px 5px;border-radius:6px;color:#dfe5f5}
.analogy{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,rgba(78,168,255,.10),rgba(167,139,250,.10));border:1px solid rgba(120,140,255,.25);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;color:#cfd6ea;margin-top:6px}
.analogy::before{content:"⚙";font-size:15px;color:var(--css);line-height:1.3}
.analogy b{color:#fff}
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:0 14px calc(env(safe-area-inset-bottom) + 12px)}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(18,22,34,.8);color:var(--text);font-size:20px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
.nav:disabled{opacity:.3}
.hint{font-size:12px;color:var(--dim)}
svg *{transform-box:fill-box;transform-origin:center}
.active .pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.35) both;animation-delay:var(--d,0s)}
.active .fade{animation:fade .6s ease both;animation-delay:var(--d,0s)}
.active .rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.growx{transform-origin:left center}
.active .growx{animation:growx .6s ease both;animation-delay:var(--d,0s)}
.active .draw{stroke-dasharray:var(--len,300);animation:draw 1s ease both;animation-delay:var(--d,0s)}
.flow{stroke-dasharray:4 6;animation:flow 1s linear infinite}
.pulse{animation:pulse 2s ease-in-out infinite;animation-delay:var(--pd,0s)}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:var(--len,300)}to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes goR{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(60px);opacity:0}}
@keyframes goL{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(-72px);opacity:0}}
.req{animation:goR 2.4s ease-in-out infinite}
.chunk{opacity:0;animation:goL 2.4s linear infinite;animation-delay:var(--d,0s)}
.titlebadge{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;margin-bottom:14px;align-self:flex-start;background:rgba(255,255,255,.03)}
.titlebadge i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.tapme{margin-top:6px;font-size:13px;color:var(--dim);animation:pulse 1.8s infinite}
.grad{background:linear-gradient(90deg,var(--html),var(--js) 35%,var(--css) 70%,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.lay{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.lay-frame{width:100%;border:1px solid var(--line);border-radius:14px;padding:8px;background:#0d111b;display:flex;flex-direction:column;gap:6px;animation:resize 5s ease-in-out infinite alternate;position:relative}
@keyframes resize{0%,15%{width:100%}85%,100%{width:52%}}
.lay .b{border-radius:8px;font:600 11px/1 var(--mono);display:flex;align-items:center;justify-content:center;color:#0b0e16;padding:0 4px;overflow:hidden;white-space:nowrap}
.lay .hdr{height:26px;background:var(--css)}
.lay-row{display:flex;gap:6px}
.lay .side{flex:0 0 26%;height:54px;background:var(--purple)}
.lay .main{flex:1;height:54px;background:var(--green)}
.lay-cards{display:flex;flex-wrap:wrap;gap:6px}
.lay .c{flex:1 1 64px;height:30px;background:var(--js)}
.ruler{font:12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.ruler span{display:inline-block;height:2px;width:40px;background:linear-gradient(90deg,var(--pink),var(--js));border-radius:2px}
.comp{position:relative;width:250px;height:230px;perspective:800px}
.comp-in{position:absolute;inset:0;transform-style:preserve-3d}
.layer{position:absolute;left:25px;top:30px;width:200px;height:170px;border-radius:14px;border:1px solid rgba(255,255,255,.18);transform-origin:center;animation:explode 6s ease-in-out infinite;--z:0px;display:flex;align-items:flex-end;justify-content:flex-end;padding:8px;font:600 10px var(--mono);color:rgba(255,255,255,.85)}
.l1{--z:-60px;background-color:#151b30;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:16px 16px}
.l2{--z:0px;background:rgba(78,168,255,.18)}
.l2::before{content:"";position:absolute;left:66px;top:16px;width:112px;height:10px;border-radius:5px;background:rgba(255,255,255,.75);box-shadow:0 22px 0 rgba(255,255,255,.4),0 40px 0 rgba(255,255,255,.4),0 58px 0 rgba(255,255,255,.4),0 86px 0 -1px rgba(61,220,151,.7)}
.l3{--z:60px;width:56px;background:rgba(167,139,250,.6);animation-name:explode3;align-items:flex-start;justify-content:center;padding-top:10px;text-align:center}
@keyframes explode{0%,22%,100%{transform:rotateX(56deg) rotateZ(-38deg) translateZ(var(--z))}48%,80%{transform:rotateX(0) rotateZ(0) translateZ(0)}}
@keyframes explode3{0%,22%,100%{transform:rotateX(56deg) rotateZ(-38deg) translateZ(var(--z))}48%{transform:translateX(-60px)}62%,80%{transform:translateX(0)}}
.comp-tag{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font:12px var(--mono);color:var(--muted)}
.cost{width:100%;display:grid;grid-template-columns:92px repeat(5,1fr);gap:6px;font-size:10.5px;align-items:center}
.cost .h{color:var(--dim);text-align:center;font-weight:600;letter-spacing:.02em}
.cost .lbl{font:600 11px var(--mono);color:var(--text);line-height:1.3}
.cost .lbl small{display:block;color:var(--dim);font-weight:400}
.cell{height:30px;border-radius:8px;background:#151a27;border:1px dashed #262d40}
.cell.on{background:var(--c);border:0;box-shadow:0 0 14px var(--c)}
.active .cell.on{animation:light .45s ease both;animation-delay:var(--d,0s)}
@keyframes light{from{opacity:.1;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.costtag{grid-column:2/7;font-size:11px;color:var(--muted);text-align:right;margin-top:-2px}
.qcode{font:13px/1.55 var(--mono);background:#0d111b;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0 14px;color:#cdd5ea;white-space:pre;overflow-x:auto}
.qcode .k{color:var(--purple)}.qcode .s{color:var(--green)}.qcode .t{color:var(--html)}.qcode .c{color:var(--dim)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:15px;line-height:1.35;cursor:pointer;transition:transform .15s,border-color .2s,background .2s,opacity .2s}
.opt:active{transform:scale(.98)}
.opt:focus-visible{outline:2px solid var(--css)}
.opt .l{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#1e2436;font:700 12px var(--mono);color:var(--muted)}
.opt code{font-size:13px}
.opt.right{border-color:var(--green);background:rgba(61,220,151,.12)}
.opt.right .l{background:var(--green);color:#06210f}
.opt.wrong{border-color:var(--pink);background:rgba(255,92,138,.12);animation:shake .4s}
.opt.wrong .l{background:var(--pink);color:#2a0612}
.opts.done .opt:not(.right):not(.wrong){opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.fb{margin-top:12px;font-size:14px;line-height:1.45;color:var(--muted);opacity:0;transform:translateY(8px);transition:.3s}
.fb.show{opacity:1;transform:none}
.fb b{color:var(--text)}
.fb code{background:#1b2131;padding:1px 4px;border-radius:5px;color:#dfe5f5}
.fb .tag{display:inline-block;font-weight:800;margin-right:4px}
.qspacer{flex:1}
.rx{width:100%;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.rx-row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.rx-box{flex:1;background:#0d111b;border:1px solid var(--line);border-radius:12px;padding:10px 8px;font:11px/1.4 var(--mono);color:#cdd5ea;min-height:62px;display:flex;flex-direction:column;justify-content:center}
.rx-box .cap{font:700 9px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.rx-arrow{color:var(--purple);font:700 13px var(--mono);flex:0 0 auto}
.rx-f{flex:0 0 auto;background:linear-gradient(135deg,rgba(167,139,250,.25),rgba(78,168,255,.2));border:1px solid rgba(167,139,250,.5);border-radius:12px;padding:10px 7px;font:700 12px var(--mono)}
.rx-ui{background:#f5f6fa;color:#141824;border-radius:14px;padding:9px 10px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);min-height:62px}
.rx-ui .bar{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.rx-ui .badge{background:#ff5c1a;color:#fff;border-radius:999px;padding:1px 8px;font-size:11px}
.rx-ui ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.rx-ui li{background:#e7e9f2;border-radius:6px;padding:3px 6px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px #3ddc97}100%{box-shadow:0 0 0 0 transparent}}
.rx-note{font-size:12px;color:var(--dim);text-align:center}
.btn{all:unset;cursor:pointer;align-self:center;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,var(--purple),var(--css));color:#fff;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(120,120,255,.35)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--text);align-self:flex-start}
.flowchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;width:100%}
.chip{padding:7px 10px;border-radius:10px;font:700 12px var(--mono);color:#0b0e16;display:inline-block}
.arr{color:var(--dim);font-size:12px}
.take{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px;width:100%}
.take li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.4;color:#cfd6ea}
.take li b{color:#fff}
.score{font-size:13px;color:var(--muted);margin-top:10px}
.next-tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.next-tags span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);font-family:var(--mono)}
@media (max-height:700px){.visual svg{max-height:230px}.qcode{font-size:12px;padding:8px 10px;margin:4px 0 8px}.opt{padding:10px 12px}.analogy{font-size:13px;padding:8px 10px}p{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ---- lesson 1b additions ---- */
.net{width:100%;background:#0d111b;border:1px solid var(--line);border-radius:12px;overflow:hidden;font:10.5px/1.2 var(--mono)}
.net-h,.net-r{display:grid;grid-template-columns:1.35fr 46px 40px 1fr;gap:6px;align-items:center;padding:6px 9px}
.net-h{color:var(--dim);font:700 8.5px system-ui;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line);background:#121622}
.net-r{border-bottom:1px solid #161b28;color:#cdd5ea}
.net-r:last-of-type{border-bottom:0}
.net-r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net-r .t{color:var(--muted);font-size:9.5px}
.net-r .z{color:var(--muted);text-align:right;font-size:9.5px}
.net-r.dim{color:#59627a}.net-r.dim .t,.net-r.dim .z{color:#454d63}.net-r.dim .wf i{opacity:.35}
.net-r.hl{background:rgba(78,168,255,.09);box-shadow:inset 3px 0 0 var(--css)}
.wf{position:relative;height:9px;background:repeating-linear-gradient(90deg,transparent 0 19.6%,#1a2030 19.6% 20%)}
.wf i{position:absolute;top:0;height:100%;border-radius:3px;left:var(--s);width:var(--w);background:var(--c);transform-origin:left center}
.active .net-r{animation:rise .4s ease both;animation-delay:var(--d,0s)}
.active .wf i{animation:growx .5s ease both;animation-delay:calc(var(--d,0s) + .15s)}
.net-foot{padding:5px 9px;color:var(--dim);font-size:9px;display:flex;justify-content:space-between;border-top:1px solid var(--line);background:#121622}
.netwrap{width:100%;display:flex;flex-direction:column;gap:10px}
.cb{width:100%;font:11.5px/1.5 var(--mono);background:#0d111b;border:1px solid var(--line);border-radius:12px;color:#cdd5ea;overflow:hidden}
.cb pre{margin:0;padding:9px 11px;white-space:pre;overflow-x:auto;font:inherit}
.cb-h{display:flex;justify-content:space-between;align-items:center;padding:5px 11px;background:#121622;border-bottom:1px solid var(--line);font:700 9px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.cb-h .tagc{font:700 9.5px var(--mono);letter-spacing:0;text-transform:none;padding:2px 7px;border-radius:999px}
.k{color:var(--purple)}.s{color:var(--green)}.t{color:var(--html)}.c{color:var(--dim)}.y{color:var(--js)}.bl{color:var(--css)}
.mk{background:rgba(247,208,70,.18);color:var(--js);border-radius:4px;padding:0 2px}
.stack{width:100%;display:flex;flex-direction:column;gap:8px}
.down{align-self:center;color:var(--purple);font:700 13px var(--mono);line-height:1}
/* phone mock */
.phone{width:178px;height:300px;border-radius:26px;border:2px solid #2a3145;background:#0b0e16;padding:12px 10px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.5);flex:0 0 auto;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.url{font:10px var(--mono);background:#181d2b;border-radius:8px;padding:6px 8px;color:var(--muted);white-space:nowrap;overflow:hidden}
.url b{color:var(--text);font-weight:600}
.pg{flex:1;border-radius:12px;background:#f3f5fa;padding:10px 9px;display:flex;flex-direction:column;gap:7px;color:#141824;font-size:11px;overflow:hidden;position:relative}
.pg.blank{background:#fff}
.pg .ttl{font-weight:800;font-size:12.5px;display:flex;justify-content:space-between;align-items:center}
.sk{height:30px;border-radius:8px;background:linear-gradient(90deg,#e1e5ee 0,#f0f2f7 40%,#e1e5ee 80%);background-size:250% 100%;animation:shimmer 1.3s linear infinite}
.sk.sm{height:12px;width:60%}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-150% 0}}
.prow{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e3e6ee;border-radius:8px;padding:7px 8px;font-size:10.5px;font-weight:600;color:#141824;cursor:pointer}
.prow span{font-weight:500;font-size:9px;color:#fff;background:#3ddc97;border-radius:999px;padding:1px 6px}
.prow span.pl{background:#f7a046}
.prow.tapme2{box-shadow:0 0 0 0 rgba(255,92,26,.6);animation:ring 1.6s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,92,26,.55)}70%{box-shadow:0 0 0 8px rgba(255,92,26,0)}100%{box-shadow:0 0 0 0 rgba(255,92,26,0)}}
.dom{font:10.5px/1.55 var(--mono);color:#cdd5ea;background:#0d111b;border:1px solid var(--line);border-radius:12px;padding:10px;flex:1;min-width:0;white-space:pre;overflow:hidden}
.row2{display:flex;gap:12px;align-items:center;width:100%;justify-content:center}
.swap-a{animation:none}
.active .later{animation:fade .5s ease both;animation-delay:var(--d,1.5s)}
.active .gone{animation:gone .4s ease both;animation-delay:var(--d,1.5s)}
@keyframes gone{to{opacity:0;height:0;margin:0;padding:0}}
/* comparison table */
.vs{width:100%;display:grid;grid-template-columns:76px 1fr 1fr;gap:5px;font-size:12px;line-height:1.3}
.vs div{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 8px;color:#cfd6ea}
.vs .vh{font-weight:800;text-align:center;border:0}
.vs .vh.code{background:rgba(247,208,70,.14);color:var(--js)}
.vs .vh.data{background:rgba(61,220,151,.14);color:var(--green)}
.vs .vl{background:transparent;border:0;color:var(--dim);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;padding:0}
.trio{width:100%;display:flex;flex-direction:column;gap:7px}
.trio .cb pre{padding:6px 10px;font-size:10.5px}
.find{font-size:12px;color:var(--muted);text-align:center}

<script>var CARDS = [{"sect": 1, "num": "4", "kicker": "Part 4 · React", "h": "React <span class=\"grad\">fundamentals<\/span>", "p": "How React actually renders: the render/commit cycle, state as a snapshot, batching, closures, keys, effects done right, and state design. Then a hands-on Projects app you can edit and run.", "first": true, "badge": "~45 min · 62 cards · 6 quizzes"}, {"sect": 1, "num": "1", "kicker": "Section 1 · Building blocks", "h": "Components, JSX, props", "p": "The three ideas everything else builds on. Quick, because the rest of this lesson depends on them.", "first": false}, {"k": "Components", "h": "A component is a function that returns UI", "cmp": [["TSX", "type Props = { name: string; rfis: number };\n\nfunction ProjectCard({ name, rfis }: Props) {\n  return (\n    <div className=\"card\">\n      <h3>{name}<\/h3>\n      <span>{rfis} open RFIs<\/span>\n    <\/div>\n  );\n}\n\n// used like a tag; capital letter = component\n<ProjectCard name=\"Riverside Tower\" rfis={3} />", "component"]], "p": "React calls <code>ProjectCard<\/code> with a <b>props object<\/b> and gets back a description of what should be on screen. Names must start with a capital letter: lowercase tags (<code>div<\/code>) are DOM elements, capitalised ones are your functions."}, {"k": "JSX", "h": "JSX is just function calls that build objects", "cmp": [["TSX", "<h3 className=\"title\">{name}<\/h3>", "you write"], ["JS", "// what the compiler emits (React 17+ automatic runtime)\njsx('h3', { className: 'title', children: name })\n\n// …which returns a plain object, roughly:\n{ type: 'h3', props: { className: 'title', children: 'Riverside Tower' } }", "compiled"]], "p": "JSX is not HTML and not a template language. It compiles to calls that return <b>plain JS objects<\/b> (\"React elements\"). That is why you use <code>className<\/code>, why <code>{expressions}<\/code> work anywhere, and why you can store JSX in variables, arrays and props.", "bul": ["<b>Conditionals<\/b>: <code>{cond &amp;&amp; &lt;X/&gt;}<\/code> or a ternary. Careful: <code>{count &amp;&amp; …}<\/code> renders a literal <code>0<\/code> when count is 0.", "<b>Lists<\/b>: <code>{items.map(i =&gt; &lt;Row key={i.id} … /&gt;)}<\/code>.", "A component returns <b>one<\/b> root; use <code>&lt;&gt;…&lt;/&gt;<\/code> (Fragment) to group without a wrapper div."], "g": true}, {"k": "Props", "h": "Props are read-only inputs, passed top-down", "cmp": [["TSX", "function Badge({ status }: { status: 'open' | 'closed' }) {\n  status = 'closed';          // ✗ never reassign / mutate props\n  return <span>{status}<\/span>;\n}", "✗ AI sometimes writes"], ["TSX", "function Badge({ status, onClose }: {\n  status: 'open' | 'closed';\n  onClose: () => void;           // child asks parent to change\n}) {\n  return <button onClick={onClose}>{status}<\/button>;\n}", "✓ Good"]], "p": "Data flows <b>down<\/b> as props; requests to change it flow <b>up<\/b> as callback props. A child never edits its props, it asks the owner of the data."}, {"raw": "<section class=\"card\"><div class=\"kicker\">The big idea<\/div><div class=\"visual\"><div class=\"demo\"><div class=\"rx\"><div class=\"rx-row\"><div class=\"rx-box\"><span class=\"cap\">state<\/span><span id=\"fsState\">{ rfis: 3 }<\/span><\/div><span class=\"rx-f\">f()<\/span><div class=\"rx-ui\" id=\"fsUi\" style=\"flex:1\"><div class=\"bar\">RFIs <span class=\"badge\" id=\"fsN\">3<\/span><\/div><ul><li>Render #<span id=\"fsR\">1<\/span><\/li><\/ul><\/div><\/div><div class=\"tg\"><button type=\"button\" id=\"fsDec\">− rfi<\/button><button type=\"button\" id=\"fsInc\">+ rfi<\/button><\/div><div class=\"rx-note\">You never touch the DOM. Change state, and React calls f() again.<\/div><\/div><\/div><\/div><h2>UI = f(state)<\/h2><p>You describe what the UI looks like <b>for a given state<\/b>. When state changes, React re-runs your function and updates the page to match.<\/p><div class=\"analogy\"><span>Like a pure view: <code>render(model) → HTML<\/code>. You don't write \"insert row 3\"; you re-render from the model, and React works out the minimal changes.<\/span><\/div><\/section>\n"}, {"sect": 1, "num": "2", "kicker": "Section 2 · The rendering model", "h": "Render vs <span class=\"grad\">commit<\/span>", "p": "What React really does when something changes. Getting this right makes every other topic (effects, memo, keys) make sense.", "first": false}, {"k": "Three steps", "h": "Trigger → Render → Commit", "steps": ["<b>Trigger<\/b>: initial mount, or a <code>setState<\/code> somewhere in the tree", "<b>Render<\/b>: React <b>calls your component functions<\/b> to get new element trees", "<b>Diff<\/b>: compare new tree with the previous one (reconciliation)", "<b>Commit<\/b>: apply the minimal DOM changes (insert, update attributes, remove)", "<b>Paint<\/b>: the browser draws; then React runs your effects"], "p": "\"Render\" in React means <b>calling your function<\/b>. It produces objects; it touches nothing on screen. Only the <b>commit<\/b> phase touches the DOM, and only for the parts that differ.", "an": "Think of render as computing a diff and commit as applying a migration: rendering is cheap planning, committing is the real write."}, {"k": "Render is a calculation", "h": "Your component must be pure during render", "cmp": [["TSX", "let renders = 0;\nfunction Row({ project }) {\n  renders++;                       // ✗ mutating outside state\n  project.seen = true;             // ✗ mutating a prop\n  fetch('/api/track');             // ✗ side effect in render\n  document.title = project.name;   // ✗ touching the DOM\n  return <li>{project.name}<\/li>;\n}", "✗ AI often writes"], ["TSX", "function Row({ project }) {\n  const label = project.name.toUpperCase();   // ✓ pure computation\n  return <li>{label}<\/li>;\n}\n// side effects belong in event handlers,\n// or in useEffect when syncing with the outside world", "✓ Good"]], "p": "Given the same props and state, a component must return the same JSX and change nothing else. React relies on this: it may render a component <b>more than once<\/b>, abandon a render halfway (concurrent rendering), or render twice in development (StrictMode)."}, {"k": "When re-renders happen", "h": "Exactly three triggers", "v": "<svg viewBox=\"0 0 320 170\"><g stroke=\"#2a3145\" stroke-width=\"2\"><line x1=\"160\" y1=\"38\" x2=\"90\" y2=\"80\"/><line x1=\"160\" y1=\"38\" x2=\"230\" y2=\"80\"/><line x1=\"90\" y1=\"100\" x2=\"50\" y2=\"138\"/><line x1=\"90\" y1=\"100\" x2=\"130\" y2=\"138\"/><line x1=\"230\" y1=\"100\" x2=\"230\" y2=\"138\"/><\/g><rect x=\"115\" y=\"14\" width=\"90\" height=\"26\" rx=\"8\" fill=\"#151a27\" stroke=\"#2a3145\"/><text x=\"160\" y=\"31\" fill=\"#a3acc2\" font-size=\"9\" text-anchor=\"middle\">App<\/text><rect class=\"flashr\" x=\"50\" y=\"80\" width=\"80\" height=\"22\" rx=\"7\" stroke=\"#ff5c8a\"/><text x=\"90\" y=\"95\" fill=\"#fff\" font-size=\"9\" text-anchor=\"middle\">List (setState)<\/text><rect x=\"190\" y=\"80\" width=\"80\" height=\"22\" rx=\"7\" fill=\"#151a27\" stroke=\"#2a3145\"/><text x=\"230\" y=\"95\" fill=\"#a3acc2\" font-size=\"9\" text-anchor=\"middle\">Sidebar<\/text><rect class=\"flashr\" style=\"--d:.25s\" x=\"14\" y=\"138\" width=\"72\" height=\"22\" rx=\"7\" stroke=\"#ff5c8a\"/><text x=\"50\" y=\"153\" fill=\"#fff\" font-size=\"9\" text-anchor=\"middle\">Row<\/text><rect class=\"flashr\" style=\"--d:.25s\" x=\"94\" y=\"138\" width=\"72\" height=\"22\" rx=\"7\" stroke=\"#ff5c8a\"/><text x=\"130\" y=\"153\" fill=\"#fff\" font-size=\"9\" text-anchor=\"middle\">Row<\/text><rect x=\"190\" y=\"138\" width=\"80\" height=\"22\" rx=\"7\" fill=\"#151a27\" stroke=\"#2a3145\"/><text x=\"230\" y=\"153\" fill=\"#a3acc2\" font-size=\"9\" text-anchor=\"middle\">Menu<\/text><\/svg>", "bul": ["<b>Its own state changed<\/b> (a setter was called with a new value).", "<b>Its parent re-rendered<\/b>: by default every child of a rendering component renders too, whether or not its props changed.", "<b>A context it reads changed<\/b>."], "p": "State changes flow <b>down<\/b> the tree, never up or sideways: above, <code>List<\/code> updates, so its Rows render; App and Sidebar don't. \"Props changed\" is not a trigger by itself; the parent rendering is."}, {"k": "Re-render ≠ DOM update", "h": "Rendering is usually cheap; DOM work is what's expensive", "steps": ["setState in <code>List<\/code> → List and Rows <b>render<\/b> (functions called)", "React diffs: 1 of 50 rows has a new <code>name<\/code>", "<b>Commit<\/b>: one text node updated, 49 rows untouched in the DOM"], "p": "Many re-renders are fine. Worry only when the Profiler shows a slow render (heavy computation, huge lists). Don't accept AI code that sprinkles <code>useMemo<\/code>/<code>memo<\/code> everywhere \"for performance\" without a measured problem. Part 6 covers when memo helps."}, {"quiz": true, "k": "Quiz 1 / 6 · Rendering", "h": "<code>&lt;Parent&gt;<\/code> calls <code>setOpen(true)<\/code>. <code>&lt;Child title=\"Hi\" /&gt;<\/code> receives the same props. Does Child render?", "opts": [["No, its props didn't change", 0], ["Yes: when a parent renders, its children render by default", 1], ["Only if Child uses useEffect", 0]], "right": "By default a parent's render renders all its children. Only <code>memo(Child)<\/code> lets React skip when props are shallow-equal.", "wrong": "It <b>does<\/b> render. Children render whenever the parent renders, unless wrapped in <code>memo<\/code>. Rendering is cheap; the DOM is only touched if output differs."}, {"k": "Go deeper · Rendering", "h": "Go deeper", "links": [["Render and Commit", "https://react.dev/learn/render-and-commit", "React docs (react.dev). The official walkthrough of trigger, render, commit."], ["Why React Re-Renders", "https://www.joshwcomeau.com/react/why-react-re-renders/", "Josh W. Comeau. Animated, interactive explanation of exactly when components render."], ["React as a UI Runtime", "https://overreacted.io/react-as-a-ui-runtime/", "Dan Abramov. The deep mental model: elements, reconciliation, purity, batching."]]}, {"sect": 1, "num": "3", "kicker": "Section 3 · State", "h": "State is a <span class=\"grad\">snapshot<\/span>", "p": "Why <code>console.log(count)<\/code> right after <code>setCount<\/code> shows the old value, and how React batches updates.", "first": false}, {"k": "useState", "h": "State is memory that survives between renders", "cmp": [["TSX", "function Counter() {\n  const [count, setCount] = useState(0);\n  //     ^value  ^setter          ^initial value (used on first render only)\n  return <button onClick={() => setCount(count + 1)}>{count}<\/button>;\n}", "example"]], "p": "Local variables are recreated on every call, so they can't remember anything. <code>useState<\/code> asks React to keep a value <b>for this component instance<\/b> and hand it back on each render. Calling the setter stores a new value and <b>schedules<\/b> a re-render.", "bul": ["Hooks are matched by <b>call order<\/b>, so never call them inside if/loops/after an early return.", "The initial value is only read once. <code>useState(expensive())<\/code> still calls <code>expensive()<\/code> every render; use <code>useState(() =&gt; expensive())<\/code>."], "g": true}, {"k": "Snapshot", "h": "Within one render, state never changes", "cmp": [["TSX", "function Counter() {\n  const [count, setCount] = useState(0);\n  function handleClick() {\n    setCount(count + 1);\n    console.log(count);   // 0  (still this render's value!)\n    setTimeout(() => alert(count), 3000); // 0, even 3s later\n  }\n  …\n}", "walkthrough"]], "steps": ["Render #1: React gives <code>count = 0<\/code>; your handler is created and closes over 0", "Click: <code>setCount(0 + 1)<\/code> <b>requests<\/b> a new render; it doesn't change the local <code>count<\/code>", "The log and the timeout both read this render's <code>count<\/code>: 0", "Render #2 runs: a <b>new<\/b> function call with <code>count = 1<\/code> and new handlers"], "p": "Each render is a separate function call with its own props, state and handlers. State is a <b>snapshot<\/b> fixed at render time. Setting state changes what the <b>next<\/b> render sees."}, {"k": "Try it · batching", "h": "Three setters, one render", "v": "<div class=\"sim demo\" id=\"bt\"><div class=\"row\"><span>count =<\/span><span class=\"big\" id=\"btN\">0<\/span><span class=\"ctr\" id=\"btR\">renders: 1<\/span><\/div><div class=\"row\"><button type=\"button\" id=\"btA\">setCount(count + 1) ×3<\/button><button type=\"button\" id=\"btB\">setCount(c =&gt; c + 1) ×3<\/button><button type=\"button\" id=\"btZ\">reset<\/button><\/div><div class=\"lg\" id=\"btL\"><div class=\"c\">// tap a button<\/div><\/div><\/div>", "p": "Both buttons call a setter three times in one click handler. React <b>batches<\/b> them into a single render. With <code>count + 1<\/code> every call reads the same snapshot, so you get +1. With the <b>updater function<\/b> <code>c =&gt; c + 1<\/code>, React queues the functions and runs each on the result of the previous one: +3."}, {"k": "Updater functions", "h": "When the next value depends on the previous one", "cmp": [["TSX", "setCount(count + 1);              // ✗ reads a possibly stale snapshot\nsetItems([...items, newItem]);     // ✗ same problem in async code", "✗ AI often writes"], ["TSX", "setCount(c => c + 1);             // ✓ always based on the latest value\nsetItems(prev => [...prev, newItem]);", "✓ Good when based on previous state"]], "p": "Use the updater form when the new value is derived from the old one, especially inside async callbacks, timers and subscriptions. When you're just setting a fresh value (<code>setName(e.target.value)<\/code>), the plain form is fine."}, {"k": "Automatic batching", "h": "React 18+ batches everywhere", "cmp": [["TSX", "async function save() {\n  setSaving(true);\n  const res = await api.save(draft);\n  setSaving(false);      // these two are batched into\n  setSaved(res.id);      // ONE render (React 18+)\n}", "example"]], "p": "Since React 18, updates are batched inside promises, timeouts and native handlers too, not only React events. You rarely need <code>flushSync<\/code>; if AI code reaches for it, ask why.", "an": "Like a database transaction: several writes, one commit. Nobody sees the half-updated state in between."}, {"k": "Immutability", "h": "Replace state, never mutate it", "cmp": [["TSX", "const [project, setProject] = useState(p);\nproject.name = 'New';          // ✗ mutation\nsetProject(project);           // ✗ same reference → React bails out\n\nitems.push(x); setItems(items); // ✗ same array, nothing re-renders", "✗ AI often writes"], ["TSX", "setProject(prev => ({ ...prev, name: 'New' }));\nsetItems(prev => [...prev, x]);                    // add\nsetItems(prev => prev.filter(i => i.id !== id));   // remove\nsetItems(prev => prev.map(i =>\n  i.id === id ? { ...i, done: true } : i));        // update one\nconst sorted = [...items].sort(byName);            // sort a copy", "✓ Good"]], "p": "React compares old and new state with <code>Object.is<\/code> (reference equality for objects). Mutate in place and the reference is the same, so React may skip the render, and memoized children will show stale data. Watch for <code>push<\/code>, <code>splice<\/code>, <code>sort<\/code>, <code>reverse<\/code> and nested writes like <code>state.a.b = 1<\/code>."}, {"quiz": true, "k": "Quiz 2 / 6 · Snapshot", "h": "<code>count<\/code> is 5. What does the screen show after the click?", "opts": [["8", 0], ["6", 1], ["5", 0]], "right": "All three calls read the same snapshot (5) and request 6. Use <code>c =&gt; c + 1<\/code> to get 8.", "wrong": "It's <b>6<\/b>. Each <code>setCount(count + 1)<\/code> uses this render's count, 5. Batched, the last write wins: 6.", "code": "function onClick() {\n  setCount(count + 1);\n  setCount(count + 1);\n  setCount(count + 1);\n}"}, {"k": "Go deeper · State", "h": "Go deeper", "links": [["State as a Snapshot", "https://react.dev/learn/state-as-a-snapshot", "React docs (react.dev). With interactive examples of exactly this behaviour."], ["Queueing a Series of State Updates", "https://react.dev/learn/queueing-a-series-of-state-updates", "React docs (react.dev). Batching and updater functions step by step."], ["Complete Intro to React (Frontend Masters)", "https://frontendmasters.com/courses/complete-react-v9/", "Brian Holt's video course: builds a full app with hooks, effects and TypeScript-friendly patterns."]]}, {"sect": 1, "num": "4", "kicker": "Section 4 · Closures", "h": "Stale <span class=\"grad\">closures<\/span>", "p": "The bug behind most \"it shows the old value\" reports in hook code.", "first": false}, {"k": "Closures, in 30 seconds", "h": "A function remembers the variables around it", "cmp": [["JS", "function makeLogger(name) {\n  return () => console.log(name);   // captures `name`\n}\nconst logA = makeLogger('A');\nlogA();   // 'A', even though makeLogger has returned", "plain JavaScript"]], "p": "In React, every render creates <b>new<\/b> handler and effect functions that capture that render's props and state. That's usually what you want. It becomes a bug when an <b>old<\/b> function keeps running after newer renders happened.", "an": "Like a Java lambda capturing an effectively-final local: it sees the value at the moment it was created, not later changes."}, {"k": "Try it · stale interval", "h": "An effect that ran once, reading count forever", "v": "<div class=\"sim demo\"><div class=\"row\"><span>UI count =<\/span><span class=\"big\" id=\"scN\">0<\/span><span class=\"ctr\" id=\"scS\"><\/span><\/div><div class=\"row\"><button type=\"button\" id=\"scGo\">start interval<\/button><button type=\"button\" id=\"scFix\">mode: deps [] + count+1<\/button><button type=\"button\" id=\"scStop\">stop<\/button><\/div><div class=\"lg\" id=\"scL\"><div class=\"c\">// start the interval<\/div><\/div><\/div>", "cmp": [["TSX", "useEffect(() => {\n  const id = setInterval(() => {\n    setCount(count + 1);   // `count` captured from render #1 = 0\n  }, 1000);\n  return () => clearInterval(id);\n}, []);                    // effect never re-runs → closure never refreshes", "✗ the bug"]], "p": "Run the buggy mode: the counter goes to 1 and stays there, because the interval callback was created in the first render and always computes <code>0 + 1<\/code>. Toggle the mode to the fix and run again."}, {"k": "Fixing stale closures", "h": "Three correct options, pick by intent", "cmp": [["TSX", "// 1. Updater: no need to read count at all (best here)\nsetInterval(() => setCount(c => c + 1), 1000);  // deps: []\n\n// 2. Declare the dependency: effect re-subscribes when it changes\nuseEffect(() => { …uses count… }, [count]);\n\n// 3. Ref for 'latest value' in long-lived callbacks\nconst latest = useRef(onTick);\nuseEffect(() => { latest.current = onTick; });\nuseEffect(() => {\n  const id = setInterval(() => latest.current(), 1000);\n  return () => clearInterval(id);\n}, []);", "✓ Good"]], "p": "Never \"fix\" it by deleting the dependency or disabling the lint rule. The <code>react-hooks/exhaustive-deps<\/code> ESLint rule exists precisely to catch stale closures; an <code>// eslint-disable-next-line<\/code> on a deps array in AI code is a red flag."}, {"quiz": true, "k": "Quiz 3 / 6 · Closures", "h": "A search box debounces with this code. Users report results for what they typed <i>earlier<\/i>. Why?", "opts": [["setTimeout is unreliable", 0], ["The callback captured an old query; the deps array is missing query", 1], ["React batches the fetch", 0]], "right": "The effect only ran on mount, so its timer callback closes over the first <code>query<\/code>. Put <code>query<\/code> in deps and clear the timeout in cleanup.", "wrong": "It's a <b>stale closure<\/b>: deps <code>[]<\/code> means the callback still sees the first render's <code>query<\/code>.", "code": "useEffect(() => {\n  const t = setTimeout(() => search(query), 300);\n  return () => clearTimeout(t);\n}, []);"}, {"k": "Go deeper · Closures & effects", "h": "Go deeper", "links": [["A Complete Guide to useEffect", "https://overreacted.io/a-complete-guide-to-useeffect/", "Dan Abramov. Long, but the definitive explanation of \"each render has its own everything\"."], ["Lifecycle of Reactive Effects", "https://react.dev/learn/lifecycle-of-reactive-effects", "React docs (react.dev). Why dependencies are not optional and how the linter helps."]]}, {"sect": 1, "num": "5", "kicker": "Section 5 · Reconciliation", "h": "Keys and <span class=\"grad\">identity<\/span>", "p": "How React decides whether to update, keep or recreate a component, and why it decides by position and key.", "first": false}, {"k": "Reconciliation rules", "h": "Same type at the same position = same component", "steps": ["Compare old and new trees <b>level by level<\/b>", "Same element type at the same spot → <b>keep<\/b> the instance and its state, update props", "Different type (<code>&lt;Form&gt;<\/code> → <code>&lt;Spinner&gt;<\/code>) → <b>destroy<\/b> the old subtree (state lost) and mount new", "In lists, match children by <b>key<\/b> instead of index"], "p": "State is not stored \"in\" your component function. React stores it at a <b>position in the tree<\/b>. Keep the same component at the same position and its state survives; change the type or key and the state is thrown away."}, {"k": "Gotcha · state follows position", "h": "Conditional rendering can keep or lose state unexpectedly", "cmp": [["TSX", "{isAdmin ? <Editor mode=\"admin\" /> : <Editor mode=\"user\" />}\n// same type, same position → SAME instance; draft text carries over!\n\n{isAdmin && <Banner />}\n<Editor />   // fine: && leaves a 'hole' so Editor keeps its slot", "surprising"], ["TSX", "// Want a fresh form per project? Give it a key.\n<ProjectForm key={projectId} projectId={projectId} />\n// new key → React unmounts the old one and mounts a clean instance", "✓ Reset with a key"]], "p": "<code>key<\/code> isn't only for lists. Changing a key is the idiomatic way to <b>reset<\/b> a component's state when an identity changes, instead of a <code>useEffect<\/code> that clears fields."}, {"k": "Lists & keys", "h": "Keys tell React which item is which", "cmp": [["TSX", "{projects.map((p, i) => <Row key={i} project={p} />)}       // ✗ index\n{projects.map(p => <Row key={Math.random()} project={p} />)} // ✗ new key each render", "✗ AI often writes"], ["TSX", "{projects.map(p => <Row key={p.id} project={p} />)}  // ✓ stable, unique id", "✓ Good"]], "bul": ["Keys must be <b>stable<\/b> (same item, same key across renders) and <b>unique among siblings<\/b>.", "Index keys are OK only for static lists that never reorder, filter or insert.", "Random keys remount every row on every render: lost input, lost focus, slow."], "g": true}, {"k": "Try it · index keys", "h": "Prepend a row and watch the input text", "v": "<div class=\"sim demo\"><div class=\"row\"><button type=\"button\" id=\"kyAdd\">prepend a project<\/button><button type=\"button\" id=\"kyMode\">key = index<\/button><button type=\"button\" id=\"kyReset\">reset<\/button><\/div><div id=\"kyList\"><\/div><div class=\"c\" style=\"font-size:11px;color:var(--dim)\">Type a note in a row, then prepend.<\/div><\/div>", "p": "Each row has its own internal state (the note input). With <code>key={index}<\/code>, React thinks row 0 is still row 0, so the note stays at position 0 while the project names shift: <b>notes end up on the wrong project<\/b>. Switch to <code>key={id}<\/code> and React moves the state with its item."}, {"quiz": true, "k": "Quiz 4 / 6 · Keys", "h": "When a user switches from project A to project B, the edit form still shows A's unsaved draft. Cleanest fix?", "opts": [["A useEffect that resets every field when projectId changes", 0], ["Render <code>&lt;EditForm key={projectId} /&gt;<\/code>", 1], ["Store the draft in a global variable", 0]], "right": "A new key tells React it's a different form, so it mounts fresh state. No effect, no extra render with stale data.", "wrong": "Use <code>key={projectId}<\/code>. Resetting with an effect renders once with stale data first, and it's easy to forget a field."}, {"k": "Go deeper · Reconciliation", "h": "Go deeper", "links": [["Preserving and Resetting State", "https://react.dev/learn/preserving-and-resetting-state", "React docs (react.dev). Interactive examples of state tied to tree position and keys."], ["Rendering Lists", "https://react.dev/learn/rendering-lists", "React docs (react.dev). Keys, and why not index or random."], ["Understanding React's key prop", "https://kentcdodds.com/blog/understanding-reacts-key-prop", "Kent C. Dodds. Short demos of key-driven remounting."]]}, {"sect": 1, "num": "6", "kicker": "Section 6 · Effects", "h": "useEffect <span class=\"grad\">done right<\/span>", "p": "Effects are an escape hatch for syncing with things outside React. Most AI-written effects shouldn't exist.", "first": false}, {"k": "What effects are for", "h": "Synchronise with an external system", "bul": ["Subscribing to a WebSocket, a browser event, a store outside React", "Starting/stopping a timer, an animation, a third-party widget (map, chart)", "Fetching data when there's no data library (prefer TanStack Query, Part 6)", "Imperative DOM APIs: focus, measuring, <code>document.title<\/code>"], "p": "If nothing outside React is involved, you probably don't need an effect. An effect means \"after this render is on screen, make the outside world match\". It is not a lifecycle hook and not an \"on change\" callback."}, {"k": "Anatomy & timing", "h": "When the code actually runs", "cmp": [["TSX", "useEffect(() => {\n  const conn = createConnection(roomId);   // setup\n  conn.connect();\n  return () => conn.disconnect();          // cleanup\n}, [roomId]);                              // re-sync when roomId changes", "example"]], "steps": ["Render with <code>roomId = 'a'<\/code> → commit → paint", "Effect setup runs: connect to <b>a<\/b>", "<code>roomId<\/code> becomes <b>b<\/b> → render → commit", "<b>Cleanup<\/b> of the previous effect runs: disconnect <b>a<\/b>", "Setup runs again with the new value: connect <b>b<\/b>", "Unmount → final cleanup: disconnect <b>b<\/b>"], "p": "Dependencies are compared with <code>Object.is<\/code>. No array = run after every render; <code>[]<\/code> = only on mount (and cleanup on unmount); <code>[a, b]<\/code> = when a or b changed."}, {"k": "Gotcha · object deps", "h": "New objects every render = effect every render", "cmp": [["TSX", "const options = { serverUrl, roomId };   // new object each render\nuseEffect(() => {\n  connect(options);\n}, [options]);     // ✗ always 'changed' → reconnect on every render\n\nuseEffect(() => {\n  fetch(url).then(r => r.json()).then(setData);\n});                // ✗ no deps + setState → infinite loop", "✗ AI often writes"], ["TSX", "useEffect(() => {\n  const options = { serverUrl, roomId };   // create inside the effect\n  const c = connect(options);\n  return () => c.close();\n}, [serverUrl, roomId]);                    // primitives as deps", "✓ Good"]], "p": "Objects, arrays and functions created during render get a new identity every time. Depend on the <b>primitive values<\/b> they're built from, or create them inside the effect."}, {"k": "Fetching in an effect", "h": "Handle races and unmounts", "cmp": [["TSX", "useEffect(() => {\n  fetch(`/api/projects/${id}`)\n    .then(r => r.json())\n    .then(setProject);          // ✗ slow response for an old id can\n}, [id]);                       //   overwrite the newer one", "✗ race condition"], ["TSX", "useEffect(() => {\n  const ctrl = new AbortController();\n  setStatus('loading');\n  fetch(`/api/projects/${id}`, { signal: ctrl.signal })\n    .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })\n    .then(p => { setProject(p); setStatus('done'); })\n    .catch(e => { if (e.name !== 'AbortError') setStatus('error'); });\n  return () => ctrl.abort();      // cancel when id changes or on unmount\n}, [id]);", "✓ Good (or just use TanStack Query)"]], "p": "Responses can arrive out of order. Cleanup must cancel or ignore the stale request. Also check <code>res.ok<\/code>: <code>fetch<\/code> only rejects on network failure, not on 404/500."}, {"k": "You might not need an effect", "h": "The most common AI mistakes", "bul": ["<b>Deriving data<\/b> (filtering, totals, full names): compute during render.", "<b>Resetting state when a prop changes<\/b>: use a <code>key<\/code>.", "<b>Responding to a user action<\/b> (submit, click → POST, toast): do it in the event handler.", "<b>Chains of effects<\/b> that set state that triggers another effect: compute it all in one handler.", "<b>Notifying the parent<\/b> (<code>useEffect(() =&gt; onChange(v), [v])<\/code>): call <code>onChange<\/code> in the handler that changed v.", "<b>Caching an expensive calculation<\/b>: <code>useMemo<\/code>, not effect + state."], "g": true, "p": "Each of these adds an extra render with stale UI in between, and more places for bugs to hide."}, {"k": "Derived data", "h": "Compute it, don't sync it", "cmp": [["TSX", "const [visible, setVisible] = useState<Project[]>([]);\nuseEffect(() => {\n  setVisible(projects.filter(p => p.name.includes(query)));\n}, [projects, query]);   // ✗ extra render, briefly stale, duplicate state", "✗ AI often writes"], ["TSX", "const visible = projects.filter(p => p.name.includes(query));\n// if (and only if) it is measurably slow:\nconst visible = useMemo(\n  () => projects.filter(p => p.name.includes(query)),\n  [projects, query]);", "✓ Good"]], "p": "If a value can be computed from props or state, it is not state. Keeping a copy means keeping two sources of truth in sync forever."}, {"k": "Event logic belongs in handlers", "h": "Effects run because something rendered, not because a user did something", "cmp": [["TSX", "const [submitted, setSubmitted] = useState(false);\nuseEffect(() => {\n  if (submitted) {\n    api.post('/rfis', form);          // ✗ fires again on remount,\n    toast('Saved');                   //   in StrictMode, on dep changes…\n  }\n}, [submitted, form]);", "✗ AI often writes"], ["TSX", "async function handleSubmit(e: React.FormEvent) {\n  e.preventDefault();\n  await api.post('/rfis', form);     // ✓ runs exactly once per submit\n  toast('Saved');\n}", "✓ Good"]], "p": "Ask: \"Why does this code run?\" If the answer is \"because the user clicked\", it goes in the handler. If it's \"because the component is on screen\", it's an effect."}, {"k": "StrictMode", "h": "Why your effect runs twice in development", "steps": ["Dev only: React mounts the component", "Immediately runs cleanup (simulated unmount)", "Mounts again: setup runs a <b>second<\/b> time", "Production: runs once. Nothing doubles"], "cmp": [["TSX", "<StrictMode><App /><\/StrictMode>   // usually in main.tsx\n// dev console:\n// connect a → disconnect a → connect a", "what you see"]], "p": "StrictMode also <b>calls your component functions twice<\/b> to surface impure renders. It's a stress test: if double-running breaks something (two POSTs, a leaked subscription), your cleanup is missing or the logic belongs in an event handler. Never \"fix\" it with a <code>didRun<\/code> ref or by removing StrictMode."}, {"quiz": true, "k": "Quiz 5 / 6 · Effects", "h": "Which of these genuinely needs <code>useEffect<\/code>?", "opts": [["Showing <code>firstName + \" \" + lastName<\/code>", 0], ["Sending analytics when the Save button is clicked", 0], ["Subscribing to <code>window<\/code> resize and unsubscribing on unmount", 1]], "right": "A browser event subscription is an external system with setup and cleanup: the textbook effect. The others are render computation and event-handler logic.", "wrong": "Only the <b>resize subscription<\/b>. Full name is derived data; the analytics call belongs in the click handler."}, {"k": "Go deeper · Effects", "h": "Go deeper", "links": [["You Might Not Need an Effect", "https://react.dev/learn/you-might-not-need-an-effect", "React docs (react.dev). The single most useful page for reviewing AI-written React."], ["Synchronizing with Effects", "https://react.dev/learn/synchronizing-with-effects", "React docs (react.dev). Setup/cleanup, deps, StrictMode double-run, fetching."], ["Goodbye, useEffect (video)", "https://www.youtube.com/watch?v=HPoC-k7Rxwo", "David Khourshid's talk on where effect code should really live."]]}, {"sect": 1, "num": "7", "kicker": "Section 7 · State design", "h": "Where state <span class=\"grad\">lives<\/span>", "p": "Derived state, controlled vs uncontrolled inputs, and lifting state up.", "first": false}, {"k": "Choosing state structure", "h": "Minimal state, everything else derived", "cmp": [["TSX", "const [items, setItems] = useState<Item[]>([]);\nconst [selected, setSelected] = useState<Item | null>(null); // ✗ copy of an item\nconst [count, setCount] = useState(0);                       // ✗ = items.length\nconst [isLoading, setLoading] = useState(false);\nconst [isError, setError] = useState(false);                 // ✗ both true possible", "✗ AI often writes"], ["TSX", "const [items, setItems] = useState<Item[]>([]);\nconst [selectedId, setSelectedId] = useState<string | null>(null);\nconst selected = items.find(i => i.id === selectedId);  // derived, always fresh\nconst count = items.length;\nconst [status, setStatus] =\n  useState<'idle' | 'loading' | 'error' | 'done'>('idle'); // one union, no impossible combos", "✓ Good"]], "bul": ["Don't store what you can compute.", "Store <b>ids<\/b>, not copies of objects that also live in a list.", "Replace related booleans with one <b>status union<\/b>.", "Don't mirror props in state (<code>useState(props.x)<\/code> only reads the first value)."], "g": true}, {"raw": "<section class=\"card\"><div class=\"kicker\">Controlled forms<\/div><div class=\"visual\"><div class=\"demo\" style=\"width:100%\"><div class=\"cb rise\" style=\"--d:0s\"><div class=\"cb-h\">TSX <span class=\"tagc\" style=\"background:#13243a;color:#4ea8ff\">TSX<\/span><\/div><pre><span class=\"k\">const<\/span> [name, setName] = useState(<span class=\"s\">''<\/span>);\n&lt;input value={name}\n  onChange={e =&gt; setName(e.target.value)} /&gt;<\/pre><\/div><div class=\"mini\" style=\"margin-top:8px\"><input id=\"cfIn\" placeholder=\"Type a project name\" style=\"width:100%;padding:8px;border:1px solid #ccd;border-radius:8px;font:14px system-ui\"><div style=\"margin-top:6px;font:11px ui-monospace,monospace;color:#5b6378\">state: <b id=\"cfOut\">{ name: \"\" }<\/b><\/div><\/div><\/div><\/div><h2>State is the source of truth<\/h2><p>A <b>controlled<\/b> input shows <code>value<\/code> from state and reports every keystroke via <code>onChange<\/code>. Type above: the state updates, and the input re-renders from it.<\/p><div class=\"analogy\"><span>Like a form object (Rails <code>form_with model:<\/code>) that is updated on every keystroke instead of only on submit, so validation can run live.<\/span><\/div><\/section>\n"}, {"k": "Controlled vs uncontrolled", "h": "Who owns the input's value?", "cmp": [["TSX", "// Controlled: React state is the source of truth\nconst [name, setName] = useState('');\n<input value={name} onChange={e => setName(e.target.value)} />", "controlled"], ["TSX", "// Uncontrolled: the DOM holds the value; read it when needed\n<form onSubmit={e => {\n  e.preventDefault();\n  const data = new FormData(e.currentTarget);\n  save(data.get('name'));\n}}>\n  <input name=\"name\" defaultValue=\"\" />\n<\/form>", "uncontrolled"]], "p": "Controlled inputs make validation, formatting and conditional UI easy. Uncontrolled inputs are simpler and fast for big forms (libraries like React Hook Form use them). Both are valid; mixing them is the bug.", "bul": ["<code>value<\/code> without <code>onChange<\/code> = a read-only input that ignores typing.", "<code>value={maybeUndefined}<\/code> switches uncontrolled → controlled: React warns. Use <code>value={x ?? ''}<\/code>.", "Use <code>defaultValue<\/code> (not <code>value<\/code>) for uncontrolled initial values.", "Checkboxes use <code>checked<\/code>/<code>defaultChecked<\/code>."], "g": true}, {"k": "Lifting state up", "h": "Two components need the same data → move it to their common parent", "v": "<svg viewBox=\"0 0 320 150\"><rect x=\"110\" y=\"10\" width=\"100\" height=\"30\" rx=\"8\" fill=\"rgba(167,139,250,.3)\" stroke=\"#a78bfa\"/><text x=\"160\" y=\"29\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-family=\"monospace\">App: projects<\/text><line x1=\"140\" y1=\"40\" x2=\"80\" y2=\"100\" stroke=\"#2a3145\" stroke-width=\"2\"/><line x1=\"180\" y1=\"40\" x2=\"240\" y2=\"100\" stroke=\"#2a3145\" stroke-width=\"2\"/><path class=\"flow\" d=\"M150 42 L86 98\" stroke=\"#4ea8ff\" fill=\"none\"/><path class=\"flow\" d=\"M170 42 L234 98\" stroke=\"#4ea8ff\" fill=\"none\"/><path class=\"flow\" d=\"M100 100 L160 44\" stroke=\"#3ddc97\" fill=\"none\"/><rect x=\"20\" y=\"100\" width=\"120\" height=\"30\" rx=\"8\" fill=\"#151a27\" stroke=\"#2a3145\"/><text x=\"80\" y=\"119\" fill=\"#a3acc2\" font-size=\"10\" text-anchor=\"middle\">NewProjectForm<\/text><rect x=\"180\" y=\"100\" width=\"120\" height=\"30\" rx=\"8\" fill=\"#151a27\" stroke=\"#2a3145\"/><text x=\"240\" y=\"119\" fill=\"#a3acc2\" font-size=\"10\" text-anchor=\"middle\">ProjectList<\/text><text x=\"160\" y=\"146\" fill=\"#5d6680\" font-size=\"9\" text-anchor=\"middle\">blue: props down · green: onCreate callback up<\/text><\/svg>", "cmp": [["TSX", "function App() {\n  const [projects, setProjects] = useState<Project[]>([]);\n  return (<>\n    <NewProjectForm onCreate={p => setProjects(ps => [...ps, p])} />\n    <ProjectList projects={projects} />\n  <\/>);\n}", "✓ one owner"]], "p": "One owner, props down, callbacks up. The opposite also matters: keep state as <b>low<\/b> as possible (colocation). State in App re-renders the whole app on every keystroke."}, {"k": "Go deeper · State design", "h": "Go deeper", "links": [["Choosing the State Structure", "https://react.dev/learn/choosing-the-state-structure", "React docs (react.dev). Principles for avoiding redundant and contradictory state."], ["Sharing State Between Components", "https://react.dev/learn/sharing-state-between-components", "React docs (react.dev). Lifting state up, controlled vs uncontrolled components."], ["Don't Sync State. Derive It!", "https://kentcdodds.com/blog/dont-sync-state-derive-it", "Kent C. Dodds. The derived-state rule with a worked example."]]}, {"raw": "<section class=\"card sect\"><div class=\"visual\"><div class=\"num pop\">8<\/div><\/div><div class=\"kicker\">Hands-on lab<\/div><h1>Lab: a <span class=\"grad\">Projects app<\/span><\/h1><p>A list, a detail view and a create form. Five small steps, then edit and run it live.<\/p><\/section>\n"}, {"raw": "<section class=\"card\"><div class=\"kicker\">Lab · step 1<\/div><div class=\"visual\"><div class=\"cb rise\" style=\"--d:0s\"><div class=\"cb-h\"> <span class=\"tagc\" style=\"background:#13243a;color:#4ea8ff\">TS<\/span><\/div><pre><span class=\"k\">export<\/span> <span class=\"k\">interface<\/span> Project {\n  id: number; name: string;\n  status: <span class=\"s\">'open'<\/span> | <span class=\"s\">'closed'<\/span>; rfis: number;\n}\n<span class=\"k\">const<\/span> db: Project[] = [\n  { id: 1, name: <span class=\"s\">'Riverside Tower'<\/span>, status: <span class=\"s\">'open'<\/span>, rfis: 12 },\n  { id: 2, name: <span class=\"s\">'Harbor Clinic'<\/span>, status: <span class=\"s\">'closed'<\/span>, rfis: 3 },\n];\n<span class=\"k\">export<\/span> <span class=\"k\">const<\/span> api = {\n  list: () =&gt; delay(600).then(() =&gt; [...db]),\n};<\/pre><\/div><\/div><h2>Types and a fake API<\/h2><p>Start with the <b>data contract<\/b>, as you would with a DTO. The fake API returns a Promise after a delay so loading states are visible.<\/p><\/section>\n"}, {"raw": "<section class=\"card\"><div class=\"kicker\">Lab · step 2<\/div><div class=\"visual\"><div class=\"cb rise\" style=\"--d:0s\"><div class=\"cb-h\"> <span class=\"tagc\" style=\"background:#13243a;color:#4ea8ff\">TSX<\/span><\/div><pre><span class=\"k\">function<\/span> ProjectList({ projects, onSelect }: {\n  projects: Project[];\n  onSelect: (id: number) =&gt; <span class=\"k\">void<\/span>;\n}) {\n  <span class=\"k\">return<\/span> (\n    &lt;ul&gt;\n      {projects.map(p =&gt; (\n        &lt;li key={p.id} onClick={() =&gt; onSelect(p.id)}&gt;\n          {p.name} &lt;span className={p.status}&gt;{p.status}&lt;/span&gt;\n        &lt;/li&gt;))}\n    &lt;/ul&gt;);\n}<\/pre><\/div><\/div><h2>ProjectList<\/h2><p>Pure and stateless: it renders props and reports clicks upward. Easy to test, like a pure function.<\/p><\/section>\n"}, {"raw": "<section class=\"card\"><div class=\"kicker\">Lab · step 3<\/div><div class=\"visual\"><div class=\"cb rise\" style=\"--d:0s\"><div class=\"cb-h\"> <span class=\"tagc\" style=\"background:#13243a;color:#4ea8ff\">TSX<\/span><\/div><pre><span class=\"k\">function<\/span> ProjectDetail({ project, onBack }: {\n  project: Project;\n  onBack: () =&gt; <span class=\"k\">void<\/span>;\n}) {\n  <span class=\"k\">return<\/span> (\n    &lt;section&gt;\n      &lt;button onClick={onBack}&gt;← Back&lt;/button&gt;\n      &lt;h2&gt;{project.name}&lt;/h2&gt;\n      &lt;p&gt;{project.rfis} open RFIs · {project.status}&lt;/p&gt;\n    &lt;/section&gt;);\n}<\/pre><\/div><\/div><h2>ProjectDetail<\/h2><p>Another pure view. Notice it doesn't fetch anything: the parent decides <b>which<\/b> project to show.<\/p><\/section>\n"}, {"raw": "<section class=\"card\"><div class=\"kicker\">Lab · step 4<\/div><div class=\"visual\"><div class=\"cb rise\" style=\"--d:0s\"><div class=\"cb-h\"> <span class=\"tagc\" style=\"background:#13243a;color:#4ea8ff\">TSX<\/span><\/div><pre><span class=\"k\">function<\/span> NewProjectForm({ onCreate }: {\n  onCreate: (name: string) =&gt; <span class=\"k\">void<\/span>;\n}) {\n  <span class=\"k\">const<\/span> [name, setName] = useState(<span class=\"s\">''<\/span>);\n  <span class=\"k\">const<\/span> submit = (e: React.FormEvent) =&gt; {\n    e.preventDefault();\n    <span class=\"k\">if<\/span> (!name.trim()) <span class=\"k\">return<\/span>;\n    onCreate(name.trim()); setName(<span class=\"s\">''<\/span>);\n  };\n  <span class=\"k\">return<\/span> (&lt;form onSubmit={submit}&gt;\n    &lt;input value={name} onChange={e =&gt; setName(e.target.value)} /&gt;\n    &lt;button disabled={!name.trim()}&gt;Add&lt;/button&gt;&lt;/form&gt;);\n}<\/pre><\/div><\/div><h2>NewProjectForm (controlled)<\/h2><p>The form owns only its draft text. On submit it calls <code>onCreate<\/code> and clears itself; the list itself lives in the parent.<\/p><\/section>\n"}, {"raw": "<section class=\"card\"><div class=\"kicker\">Lab · step 5<\/div><div class=\"visual\"><div class=\"cb rise\" style=\"--d:0s\"><div class=\"cb-h\"> <span class=\"tagc\" style=\"background:#13243a;color:#4ea8ff\">TSX<\/span><\/div><pre><span class=\"k\">function<\/span> App() {\n  <span class=\"k\">const<\/span> [projects, setProjects] = useState&lt;Project[] | <span class=\"k\">null<\/span>&gt;(<span class=\"k\">null<\/span>);\n  <span class=\"k\">const<\/span> [error, setError] = useState&lt;string | <span class=\"k\">null<\/span>&gt;(<span class=\"k\">null<\/span>);\n  <span class=\"k\">const<\/span> [selectedId, setSelectedId] = useState&lt;number | <span class=\"k\">null<\/span>&gt;(<span class=\"k\">null<\/span>);\n  useEffect(() =&gt; { api.list().then(setProjects)\n    .<span class=\"k\">catch<\/span>(e =&gt; setError(String(e))); }, []);\n  <span class=\"k\">if<\/span> (error) <span class=\"k\">return<\/span> &lt;p&gt;Error: {error}&lt;/p&gt;;\n  <span class=\"k\">if<\/span> (!projects) <span class=\"k\">return<\/span> &lt;p&gt;Loading…&lt;/p&gt;;\n  <span class=\"k\">const<\/span> sel = projects.find(p =&gt; p.id === selectedId);\n  <span class=\"k\">if<\/span> (sel) <span class=\"k\">return<\/span> &lt;ProjectDetail project={sel} onBack={() =&gt; setSelectedId(<span class=\"k\">null<\/span>)} /&gt;;\n  <span class=\"k\">return<\/span> (&lt;&gt;\n    &lt;NewProjectForm onCreate={name =&gt; setProjects(ps =&gt; [...ps!,\n      { id: Date.now(), name, status: <span class=\"s\">'open'<\/span>, rfis: 0 }])} /&gt;\n    &lt;ProjectList projects={projects} onSelect={setSelectedId} /&gt;&lt;/&gt;);\n}<\/pre><\/div><\/div><h2>App: state lifted, data fetched<\/h2><p><code>App<\/code> owns the shared state (the list and the selection), handles loading and error, and wires children together with props and callbacks.<\/p><\/section>\n"}, {"raw": "<section class=\"card\"><div class=\"kicker\">Lab · live<\/div><div class=\"visual\"><div class=\"lab demo\" style=\"width:100%;display:flex;flex-direction:column;gap:8px\"><textarea id=\"labSrc\" spellcheck=\"false\">// Live lab: same app as steps 1-5, in plain JS.\n// h(tag, props, ...children) is what JSX compiles to.\n// MiniReact is a tiny in-page stand-in with the same hook API.\nconst { h, useState, useEffect, mount } = MiniReact;\n\nconst db = [\n  { id: 1, name: &#x27;Riverside Tower&#x27;, status: &#x27;open&#x27;, rfis: 12 },\n  { id: 2, name: &#x27;Harbor Clinic&#x27;, status: &#x27;closed&#x27;, rfis: 3 },\n];\nconst api = { list: () =&gt; new Promise(r =&gt; setTimeout(() =&gt; r([...db]), 600)) };\n\nfunction ProjectList({ projects, onSelect }) {\n  return h(&#x27;ul&#x27;, null, projects.map(p =&gt;\n    h(&#x27;li&#x27;, { key: p.id, onClick: () =&gt; onSelect(p.id) },\n      p.name, &#x27; &#x27;, h(&#x27;span&#x27;, { className: &#x27;b &#x27; + p.status }, p.status))));\n}\n\nfunction ProjectDetail({ project, onBack }) {\n  return h(&#x27;section&#x27;, null,\n    h(&#x27;button&#x27;, { onClick: onBack }, &#x27;← Back&#x27;),\n    h(&#x27;h2&#x27;, null, project.name),\n    h(&#x27;p&#x27;, null, project.rfis + &#x27; open RFIs · &#x27; + project.status));\n}\n\nfunction NewProjectForm({ onCreate }) {\n  const [name, setName] = useState(&#x27;&#x27;);\n  const submit = e =&gt; {\n    e.preventDefault();\n    if (!name.trim()) return;\n    onCreate(name.trim()); setName(&#x27;&#x27;);\n  };\n  return h(&#x27;form&#x27;, { onSubmit: submit },\n    h(&#x27;input&#x27;, { id: &#x27;name&#x27;, value: name, placeholder: &#x27;New project&#x27;,\n      onChange: e =&gt; setName(e.target.value) }),\n    h(&#x27;button&#x27;, { disabled: !name.trim() }, &#x27;Add&#x27;));\n}\n\nfunction App() {\n  const [projects, setProjects] = useState(null);\n  const [selectedId, setSelectedId] = useState(null);\n  useEffect(() =&gt; { api.list().then(setProjects); }, []);\n  if (!projects) return h(&#x27;p&#x27;, null, &#x27;Loading…&#x27;);\n  const sel = projects.find(p =&gt; p.id === selectedId);\n  if (sel) return h(ProjectDetail, { project: sel, onBack: () =&gt; setSelectedId(null) });\n  return h(&#x27;div&#x27;, null,\n    h(&#x27;h3&#x27;, null, &#x27;Projects (&#x27; + projects.length + &#x27;)&#x27;),\n    h(NewProjectForm, { onCreate: name =&gt; setProjects(ps =&gt;\n      [...ps, { id: Date.now(), name, status: &#x27;open&#x27;, rfis: 0 }]) }),\n    h(ProjectList, { projects, onSelect: setSelectedId }));\n}\n\nmount(App);\n// Try it: change &#x27;open&#x27; badges to show RFIs, or add a &quot;Close project&quot; button.\n<\/textarea><div class=\"tg\"><button type=\"button\" id=\"labRun\" class=\"on\">▶ Run<\/button><button type=\"button\" id=\"labReset\">Reset<\/button><\/div><iframe id=\"labOut\" sandbox=\"allow-scripts\" title=\"Live preview\"><\/iframe><\/div><\/div><h2>Edit it and run it here<\/h2><p>The preview runs a ~70-line <b>MiniReact<\/b> written into this page (no downloads), with the same <code>useState<\/code>/<code>useEffect<\/code>/props model. Real React adds the virtual-DOM diff, keys-based reconciliation and JSX compilation.<\/p><\/section>\n"}, {"raw": "<section class=\"card\"><div class=\"kicker\">Lab · real React<\/div><div class=\"visual\"><div class=\"demo\" style=\"width:   var start=parseInt((location.hash||'').slice(1),10); go(isNaN(start)?0:start-1);
})();
</script>
