<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07080d"><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Part 10 · Building AI/chat UIs in React</title><style>
:root{
  --bg:#07080d; --panel:#121622; --panel2:#181d2b; --line:#2a3145; --text:#eef1f8; --muted:#a3acc2; --dim:#5d6680;
  --html:#ff7a45; --css:#4ea8ff; --js:#f7d046; --green:#3ddc97; --purple:#a78bfa; --pink:#ff5c8a; --cyan:#4ee6e0;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
.app{position:fixed;inset:0;display:flex;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#141a2e 0,transparent 60%),var(--bg)}
.stage{position:relative;width:100%;max-width:460px;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y}
@media (min-width:600px){.stage{height:min(100%,900px);margin:auto;border-radius:28px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 300px at 85% 10%,rgba(167,139,250,.10),transparent 70%),radial-gradient(500px 300px at 0% 90%,rgba(78,168,255,.08),transparent 70%);pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
.segs{display:flex;gap:3px}
.seg{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--css),var(--purple));transition:width .35s ease}
.seg.done i{width:100%}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.meta b{color:var(--text);font-weight:600}
.card{position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 58px) 22px calc(env(safe-area-inset-bottom) + 64px);display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(40px) scale(.98);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s linear .45s}
.card.past{transform:translateX(-40px) scale(.98)}
.card.active{opacity:1;visibility:visible;transform:none;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
.kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);margin-bottom:6px}
.visual{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;margin:4px 0 14px}
.visual svg{width:100%;height:100%;max-height:330px;overflow:visible}
h1,h2{margin:0 0 10px;line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(30px,9vw,40px)}
h2{font-size:clamp(22px,6.4vw,28px)}
p{margin:0 0 8px;font-size:clamp(15px,4.2vw,17px);line-height:1.5;color:var(--muted)}
p b,p strong{color:var(--text);font-weight:600}
code,.mono{font-family:var(--mono);font-size:.9em}
p code,.analogy code{background:#1b2131;border:1px solid var(--line);padding:1px 5px;border-radius:6px;color:#dfe5f5}
.analogy{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,rgba(78,168,255,.10),rgba(167,139,250,.10));border:1px solid rgba(120,140,255,.25);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;color:#cfd6ea;margin-top:6px}
.analogy::before{content:"⚙";font-size:15px;color:var(--css);line-height:1.3}
.analogy b{color:#fff}
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:0 14px calc(env(safe-area-inset-bottom) + 12px)}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(18,22,34,.8);color:var(--text);font-size:20px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
.nav:disabled{opacity:.3}
.hint{font-size:12px;color:var(--dim)}
svg *{transform-box:fill-box;transform-origin:center}
.active .pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.35) both;animation-delay:var(--d,0s)}
.active .fade{animation:fade .6s ease both;animation-delay:var(--d,0s)}
.active .rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.growx{transform-origin:left center}
.active .growx{animation:growx .6s ease both;animation-delay:var(--d,0s)}
.active .draw{stroke-dasharray:var(--len,300);animation:draw 1s ease both;animation-delay:var(--d,0s)}
.flow{stroke-dasharray:4 6;animation:flow 1s linear infinite}
.pulse{animation:pulse 2s ease-in-out infinite;animation-delay:var(--pd,0s)}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:var(--len,300)}to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes goR{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(60px);opacity:0}}
@keyframes goL{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(-72px);opacity:0}}
.req{animation:goR 2.4s ease-in-out infinite}
.chunk{opacity:0;animation:goL 2.4s linear infinite;animation-delay:var(--d,0s)}
.titlebadge{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;margin-bottom:14px;align-self:flex-start;background:rgba(255,255,255,.03)}
.titlebadge i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.tapme{margin-top:6px;font-size:13px;color:var(--dim);animation:pulse 1.8s infinite}
.grad{background:linear-gradient(90deg,var(--html),var(--js) 35%,var(--css) 70%,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.lay{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.lay-frame{width:100%;border:1px solid var(--line);border-radius:14px;padding:8px;background:#0d111b;display:flex;flex-direction:column;gap:6px;animation:resize 5s ease-in-out infinite alternate;position:relative}
@keyframes resize{0%,15%{width:100%}85%,100%{width:52%}}
.lay .b{border-radius:8px;font:600 11px/1 var(--mono);display:flex;align-items:center;justify-content:center;color:#0b0e16;padding:0 4px;overflow:hidden;white-space:nowrap}
.lay .hdr{height:26px;background:var(--css)}
.lay-row{display:flex;gap:6px}
.lay .side{flex:0 0 26%;height:54px;background:var(--purple)}
.lay .main{flex:1;height:54px;background:var(--green)}
.lay-cards{display:flex;flex-wrap:wrap;gap:6px}
.lay .c{flex:1 1 64px;height:30px;background:var(--js)}
.ruler{font:12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.ruler span{display:inline-block;height:2px;width:40px;background:linear-gradient(90deg,var(--pink),var(--js));border-radius:2px}
.comp{position:relative;width:250px;height:230px;perspective:800px}
.comp-in{position:absolute;inset:0;transform-style:preserve-3d}
.layer{position:absolute;left:25px;top:30px;width:200px;height:170px;border-radius:14px;border:1px solid rgba(255,255,255,.18);transform-origin:center;animation:explode 6s ease-in-out infinite;--z:0px;display:flex;align-items:flex-end;justify-content:flex-end;padding:8px;font:600 10px var(--mono);color:rgba(255,255,255,.85)}
.l1{--z:-60px;background-color:#151b30;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:16px 16px}
.l2{--z:0px;background:rgba(78,168,255,.18)}
.l2::before{content:"";position:absolute;left:66px;top:16px;width:112px;height:10px;border-radius:5px;background:rgba(255,255,255,.75);box-shadow:0 22px 0 rgba(255,255,255,.4),0 40px 0 rgba(255,255,255,.4),0 58px 0 rgba(255,255,255,.4),0 86px 0 -1px rgba(61,220,151,.7)}
.l3{--z:60px;width:56px;background:rgba(167,139,250,.6);animation-name:explode3;align-items:flex-start;justify-content:center;padding-top:10px;text-align:center}
@keyframes explode{0%,22%,100%{transform:rotateX(56deg) rotateZ(-38deg) translateZ(var(--z))}48%,80%{transform:rotateX(0) rotateZ(0) translateZ(0)}}
@keyframes explode3{0%,22%,100%{transform:rotateX(56deg) rotateZ(-38deg) translateZ(var(--z))}48%{transform:translateX(-60px)}62%,80%{transform:translateX(0)}}
.comp-tag{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font:12px var(--mono);color:var(--muted)}
.cost{width:100%;display:grid;grid-template-columns:92px repeat(5,1fr);gap:6px;font-size:10.5px;align-items:center}
.cost .h{color:var(--dim);text-align:center;font-weight:600;letter-spacing:.02em}
.cost .lbl{font:600 11px var(--mono);color:var(--text);line-height:1.3}
.cost .lbl small{display:block;color:var(--dim);font-weight:400}
.cell{height:30px;border-radius:8px;background:#151a27;border:1px dashed #262d40}
.cell.on{background:var(--c);border:0;box-shadow:0 0 14px var(--c)}
.active .cell.on{animation:light .45s ease both;animation-delay:var(--d,0s)}
@keyframes light{from{opacity:.1;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.costtag{grid-column:2/7;font-size:11px;color:var(--muted);text-align:right;margin-top:-2px}
.qcode{font:13px/1.55 var(--mono);background:#0d111b;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0 14px;color:#cdd5ea;white-space:pre;overflow-x:auto}
.qcode .k{color:var(--purple)}.qcode .s{color:var(--green)}.qcode .t{color:var(--html)}.qcode .c{color:var(--dim)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:15px;line-height:1.35;cursor:pointer;transition:transform .15s,border-color .2s,background .2s,opacity .2s}
.opt:active{transform:scale(.98)}
.opt:focus-visible{outline:2px solid var(--css)}
.opt .l{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#1e2436;font:700 12px var(--mono);color:var(--muted)}
.opt code{font-size:13px}
.opt.right{border-color:var(--green);background:rgba(61,220,151,.12)}
.opt.right .l{background:var(--green);color:#06210f}
.opt.wrong{border-color:var(--pink);background:rgba(255,92,138,.12);animation:shake .4s}
.opt.wrong .l{background:var(--pink);color:#2a0612}
.opts.done .opt:not(.right):not(.wrong){opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.fb{margin-top:12px;font-size:14px;line-height:1.45;color:var(--muted);opacity:0;transform:translateY(8px);transition:.3s}
.fb.show{opacity:1;transform:none}
.fb b{color:var(--text)}
.fb code{background:#1b2131;padding:1px 4px;border-radius:5px;color:#dfe5f5}
.fb .tag{display:inline-block;font-weight:800;margin-right:4px}
.qspacer{flex:1}
.rx{width:100%;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.rx-row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.rx-box{flex:1;background:#0d111b;border:1px solid var(--line);border-radius:12px;padding:10px 8px;font:11px/1.4 var(--mono);color:#cdd5ea;min-height:62px;display:flex;flex-direction:column;justify-content:center}
.rx-box .cap{font:700 9px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.rx-arrow{color:var(--purple);font:700 13px var(--mono);flex:0 0 auto}
.rx-f{flex:0 0 auto;background:linear-gradient(135deg,rgba(167,139,250,.25),rgba(78,168,255,.2));border:1px solid rgba(167,139,250,.5);border-radius:12px;padding:10px 7px;font:700 12px var(--mono)}
.rx-ui{background:#f5f6fa;color:#141824;border-radius:14px;padding:9px 10px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);min-height:62px}
.rx-ui .bar{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.rx-ui .badge{background:#ff5c1a;color:#fff;border-radius:999px;padding:1px 8px;font-size:11px}
.rx-ui ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.rx-ui li{background:#e7e9f2;border-radius:6px;padding:3px 6px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px #3ddc97}100%{box-shadow:0 0 0 0 transparent}}
.rx-note{font-size:12px;color:var(--dim);text-align:center}
.btn{all:unset;cursor:pointer;align-self:center;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,var(--purple),var(--css));color:#fff;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(120,120,255,.35)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--text);align-self:flex-start}
.flowchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;width:100%}
.chip{padding:7px 10px;border-radius:10px;font:700 12px var(--mono);color:#0b0e16;display:inline-block}
.arr{color:var(--dim);font-size:12px}
.take{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px;width:100%}
.take li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.4;color:#cfd6ea}
.take li b{color:#fff}
.score{font-size:13px;color:var(--muted);margin-top:10px}
.next-tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.next-tags span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);font-family:var(--mono)}
@media (max-height:700px){.visual svg{max-height:230px}.qcode{font-size:12px;padding:8px 10px;margin:4px 0 8px}.opt{padding:10px 12px}.analogy{font-size:13px;padding:8px 10px}p{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ---- lesson 1b additions ---- */
.net{width:100%;background:#0d111b;border:1px solid var(--line);border-radius:12px;overflow:hidden;font:10.5px/1.2 var(--mono)}
.net-h,.net-r{display:grid;grid-template-columns:1.35fr 46px 40px 1fr;gap:6px;align-items:center;padding:6px 9px}
.net-h{color:var(--dim);font:700 8.5px system-ui;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line);background:#121622}
.net-r{border-bottom:1px solid #161b28;color:#cdd5ea}
.net-r:last-of-type{border-bottom:0}
.net-r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net-r .t{color:var(--muted);font-size:9.5px}
.net-r .z{color:var(--muted);text-align:right;font-size:9.5px}
.net-r.dim{color:#59627a}.net-r.dim .t,.net-r.dim .z{color:#454d63}.net-r.dim .wf i{opacity:.35}
.net-r.hl{background:rgba(78,168,255,.09);box-shadow:inset 3px 0 0 var(--css)}
.wf{position:relative;height:9px;background:repeating-linear-gradient(90deg,transparent 0 19.6%,#1a2030 19.6% 20%)}
.wf i{position:absolute;top:0;height:100%;border-radius:3px;left:var(--s);width:var(--w);background:var(--c);transform-origin:left center}
.active .net-r{animation:rise .4s ease both;animation-delay:var(--d,0s)}
.active .wf i{animation:growx .5s ease both;animation-delay:calc(var(--d,0s) + .15s)}
.net-foot{padding:5px 9px;color:var(--dim);font-size:9px;display:flex;justify-content:space-between;border-top:1px solid var(--line);background:#121622}
.netwrap{width:100%;display:flex;flex-direction:column;gap:10px}
.cb{width:100%;font:11.5px/1.5 var(--mono);background:#0d111b;border:1px solid var(--line);border-radius:12px;color:#cdd5ea;overflow:hidden}
.cb pre{margin:0;padding:9px 11px;white-space:pre;overflow-x:auto;font:inherit}
.cb-h{display:flex;justify-content:space-between;align-items:center;padding:5px 11px;background:#121622;border-bottom:1px solid var(--line);font:700 9px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.cb-h .tagc{font:700 9.5px var(--mono);letter-spacing:0;text-transform:none;padding:2px 7px;border-radius:999px}
.k{color:var(--purple)}.s{color:var(--green)}.t{color:var(--html)}.c{color:var(--dim)}.y{color:var(--js)}.bl{color:var(--css)}
.mk{background:rgba(247,208,70,.18);color:var(--js);border-radius:4px;padding:0 2px}
.stack{width:100%;display:flex;flex-direction:column;gap:8px}
.down{align-self:center;color:var(--purple);font:700 13px var(--mono);line-height:1}
/* phone mock */
.phone{width:178px;height:300px;border-radius:26px;border:2px solid #2a3145;background:#0b0e16;padding:12px 10px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.5);flex:0 0 auto;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.url{font:10px var(--mono);background:#181d2b;border-radius:8px;padding:6px 8px;color:var(--muted);white-space:nowrap;overflow:hidden}
.url b{color:var(--text);font-weight:600}
.pg{flex:1;border-radius:12px;background:#f3f5fa;padding:10px 9px;display:flex;flex-direction:column;gap:7px;color:#141824;font-size:11px;overflow:hidden;position:relative}

.pg .ttl{font-weight:800;font-size:12.5px;display:flex;justify-content:space-between;align-items:center}

.sk.sm{height:12px;width:60%}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-150% 0}}
.prow{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e3e6ee;border-radius:8px;padding:7px 8px;font-size:10.5px;font-weight:600;color:#141824;cursor:pointer}
.prow span{font-weight:500;font-size:9px;color:#fff;background:#3ddc97;border-radius:999px;padding:1px 6px}
.prow span.pl{background:#f7a046}
.prow.tapme2{box-shadow:0 0 0 0 rgba(255,92,26,.6);animation:ring 1.6s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,92,26,.55)}70%{box-shadow:0 0 0 8px rgba(255,92,26,0)}100%{box-shadow:0 0 0 0 rgba(255,92,26,0)}}
.dom{font:10.5px/1.55 var(--mono);color:#cdd5ea;background:#0d111b;border:1px solid var(--line);border-radius:12px;padding:10px;flex:1;min-width:0;white-space:pre;overflow:hidden}
.row2{display:flex;gap:12px;align-items:center;width:100%;justify-content:center}
.swap-a{animation:none}
.active .later{animation:fade .5s ease both;animation-delay:var(--d,1.5s)}
.active .gone{animation:gone .4s ease both;animation-delay:var(--d,1.5s)}
@keyframes gone{to{opacity:0;height:0;margin:0;padding:0}}
/* comparison table */
.vs{width:100%;display:grid;grid-template-columns:76px 1fr 1fr;gap:5px;font-size:12px;line-height:1.3}
.vs div{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 8px;color:#cfd6ea}
.vs .vh{font-weight:800;text-align:center;border:0}
.vs .vh.code{background:rgba(247,208,70,.14);color:var(--js)}
.vs .vh.data{background:rgba(61,220,151,.14);color:var(--green)}
.vs .vl{background:transparent;border:0;color:var(--dim);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;padding:0}
.trio{width:100%;display:flex;flex-direction:column;gap:7px}
.trio .cb pre{padding:6px 10px;font-size:10.5px}
.find{font-size:12px;color:var(--muted);text-align:center}

<script>var CARDS = [{"sect": 1, "num": "AI", "kicker": "Part 10 · AI &amp; chat UIs", "h": "Building AI/chat UIs <span class=\"grad\">in React<\/span>", "p": "Streaming tokens into the DOM, SSE and fetch streams, embedding a chat app in an iframe with a postMessage bridge, auth handoff, optimistic UI, safe markdown, rules for coding agents, and shipping it safely.", "badge": "~29 min · 49 cards · 7 quizzes", "first": true}, {"sect": 1, "num": "1", "kicker": "Section 1 · Streaming", "h": "Why chat UIs stream", "p": "A model can take 10+ seconds to finish. Streaming shows the first words in a few hundred milliseconds, which changes how the UI must be built."}, {"k": "First principles", "h": "Request/response vs streaming", "v": "<svg viewBox=\"0 0 320 170\"><text x=\"8\" y=\"18\" fill=\"#a3acc2\" font-size=\"10\" font-weight=\"700\">classic<\/text><rect x=\"8\" y=\"26\" width=\"304\" height=\"22\" rx=\"6\" fill=\"#151a27\" stroke=\"#2a3145\"/><rect class=\"growx\" x=\"8\" y=\"26\" width=\"250\" height=\"22\" rx=\"6\" fill=\"rgba(255,92,138,.25)\"/><text x=\"16\" y=\"41\" fill=\"#cfd6ea\" font-size=\"9\">waiting… waiting… waiting…<\/text><rect class=\"pop\" style=\"--d:1s\" x=\"262\" y=\"26\" width=\"50\" height=\"22\" rx=\"6\" fill=\"#3ddc97\"/><text x=\"287\" y=\"41\" fill=\"#06210f\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"700\">all<\/text><text x=\"8\" y=\"80\" fill=\"#a3acc2\" font-size=\"10\" font-weight=\"700\">streamed<\/text><g><rect class=\"pop\" style=\"--d:0.2s\" x=\"8\" y=\"88\" width=\"34\" height=\"22\" rx=\"6\" fill=\"rgba(78,168,255,.35)\" stroke=\"#4ea8ff\"/><rect class=\"pop\" style=\"--d:0.5s\" x=\"46\" y=\"88\" width=\"34\" height=\"22\" rx=\"6\" fill=\"rgba(78,168,255,.35)\" stroke=\"#4ea8ff\"/><rect class=\"pop\" style=\"--d:0.7s\" x=\"84\" y=\"88\" width=\"34\" height=\"22\" rx=\"6\" fill=\"rgba(78,168,255,.35)\" stroke=\"#4ea8ff\"/><rect class=\"pop\" style=\"--d:0.9s\" x=\"122\" y=\"88\" width=\"34\" height=\"22\" rx=\"6\" fill=\"rgba(78,168,255,.35)\" stroke=\"#4ea8ff\"/><rect class=\"pop\" style=\"--d:1.2s\" x=\"160\" y=\"88\" width=\"34\" height=\"22\" rx=\"6\" fill=\"rgba(78,168,255,.35)\" stroke=\"#4ea8ff\"/><rect class=\"pop\" style=\"--d:1.4s\" x=\"198\" y=\"88\" width=\"34\" height=\"22\" rx=\"6\" fill=\"rgba(78,168,255,.35)\" stroke=\"#4ea8ff\"/><rect class=\"pop\" style=\"--d:1.7s\" x=\"236\" y=\"88\" width=\"34\" height=\"22\" rx=\"6\" fill=\"rgba(78,168,255,.35)\" stroke=\"#4ea8ff\"/><rect class=\"pop\" style=\"--d:1.9s\" x=\"274\" y=\"88\" width=\"34\" height=\"22\" rx=\"6\" fill=\"rgba(78,168,255,.35)\" stroke=\"#4ea8ff\"/><\/g><text x=\"8\" y=\"130\" fill=\"#5d6680\" font-size=\"9\">first token at ~300 ms; the user starts reading immediately<\/text><text x=\"8\" y=\"150\" fill=\"#5d6680\" font-size=\"9\">but now the UI must handle partial text, cancel, errors mid-stream<\/text><\/svg>", "p": "The server sends chunks as the model produces them. The client appends each chunk to a message that is still \"in progress\". Everything interesting (scroll, markdown, retries, stop button) comes from that in-progress state."}, {"k": "Transports", "h": "Three ways to get a stream", "v": "<div class=\"vs\" style=\"grid-template-columns:92px 1fr 1fr\"><div class=\"vl\"><\/div><div class=\"vh data\">how<\/div><div class=\"vh code\">good for<\/div><div class=\"vl\" style=\"display:block;align-self:center;word-break:break-word;text-transform:none;letter-spacing:0;font-size:11px;color:#cfd6ea\">SSE (<code>EventSource<\/code>)<\/div><div class=\"rise\" style=\"--d:0.0s\"><code>text/event-stream<\/code>, GET only, auto-reconnect<\/div><div class=\"rise\" style=\"--d:0.0s\">server → client feeds<\/div><div class=\"vl\" style=\"display:block;align-self:center;word-break:break-word;text-transform:none;letter-spacing:0;font-size:11px;color:#cfd6ea\"><code>fetch<\/code> + ReadableStream<\/div><div class=\"rise\" style=\"--d:0.2s\">any method (POST a prompt), you parse chunks<\/div><div class=\"rise\" style=\"--d:0.2s\">most chat APIs<\/div><div class=\"vl\" style=\"display:block;align-self:center;word-break:break-word;text-transform:none;letter-spacing:0;font-size:11px;color:#cfd6ea\">WebSocket<\/div><div class=\"rise\" style=\"--d:0.4s\">full duplex, own protocol<\/div><div class=\"rise\" style=\"--d:0.4s\">multiplayer, voice<\/div><\/div>", "p": "Most chat backends accept a POST with the conversation and reply with <code>text/event-stream<\/code>. Since <code>EventSource<\/code> cannot POST or set headers, clients usually read it with <code>fetch<\/code> and parse the SSE format by hand (or with a small library)."}, {"k": "SSE format", "h": "What is actually on the wire", "cmp": [["Bash", "HTTP/1.1 200 OK\nContent-Type: text/event-stream\nCache-Control: no-cache\n\ndata: {\"type\":\"delta\",\"text\":\"Hel\"}\n\ndata: {\"type\":\"delta\",\"text\":\"lo!\"}\n\nevent: done\ndata: {\"usage\":{\"tokens\":42}}\n\n", "raw stream"]], "p": "Events are separated by a <b>blank line<\/b>. Lines start with <code>data:<\/code>, <code>event:<\/code>, <code>id:<\/code> or <code>retry:<\/code>. A network chunk may contain half an event, or three events: never assume one chunk = one message.", "an": "Like reading a length-delimited protocol off a socket in Java: you buffer bytes until you have a full frame."}, {"k": "Step by step", "h": "Reading a fetch stream", "v": "<ol class=\"steps\"><li style=\"--d:0.0s\"><span><code>fetch(url, { method: 'POST', body, signal })<\/code><\/span><\/li><li style=\"--d:0.6s\"><span><code>res.body.getReader()<\/code> gives a reader of <code>Uint8Array<\/code> chunks<\/span><\/li><li style=\"--d:1.2s\"><span>A <code>TextDecoder<\/code> turns bytes into text (with <code>stream: true<\/code> so multi-byte characters split across chunks survive)<\/span><\/li><li style=\"--d:1.8s\"><span>Append to a buffer; split on <code>\\n\\n<\/code>; keep the last partial piece in the buffer<\/span><\/li><li style=\"--d:2.4s\"><span>Parse each complete event and dispatch it<\/span><\/li><li style=\"--d:3.0s\"><span>Stop on <code>done<\/code>, error, or when the user aborts<\/span><\/li><\/ol>", "cmp": [["TS", "async function* sseEvents(res: Response) {\n  const reader = res.body!.getReader();\n  const decoder = new TextDecoder();\n  let buf = '';\n  for (;;) {\n    const { value, done } = await reader.read();\n    if (done) break;\n    buf += decoder.decode(value, { stream: true });\n    const parts = buf.split('\\n\\n');\n    buf = parts.pop()!;                 // keep the partial event\n    for (const p of parts) {\n      const data = p.split('\\n').filter(l => l.startsWith('data:'))\n        .map(l => l.slice(5).trimStart()).join('\\n');\n      if (data) yield JSON.parse(data);\n    }\n  }\n}", "stream.ts"]], "lab": true}, {"k": "React", "h": "A useChat hook, minimal and correct", "cmp": [["TSX", "function useChat() {\n  const [messages, setMessages] = useState<Msg[]>([]);\n  const [status, setStatus] = useState<'idle' | 'streaming' | 'error'>('idle');\n  const abortRef = useRef<AbortController | null>(null);\n\n  async function send(text: string) {\n    const id = crypto.randomUUID();\n    setMessages(m => [...m, { id: id + 'u', role: 'user', text },\n                          { id, role: 'assistant', text: '' }]);\n    const ac = new AbortController(); abortRef.current = ac;\n    setStatus('streaming');\n    try {\n      const res = await fetch('/api/chat', { method: 'POST', signal: ac.signal,\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify({ text }) });\n      if (!res.ok) throw new Error(`HTTP ${res.status}`);\n      for await (const ev of sseEvents(res)) {\n        if (ev.type === 'delta')\n          setMessages(m => m.map(x => x.id === id ? { ...x, text: x.text + ev.text } : x));\n      }\n      setStatus('idle');\n    } catch (e) {\n      setStatus(ac.signal.aborted ? 'idle' : 'error');\n    }\n  }\n  const stop = () => abortRef.current?.abort();\n  return { messages, status, send, stop };\n}", "useChat.ts"]], "p": "Note the <b>functional updater<\/b> <code>setMessages(m =&gt; ...)<\/code>: each delta must build on the latest state, not the <code>messages<\/code> captured when <code>send<\/code> started.", "lab": true}, {"k": "Rendering", "h": "Keeping the stream smooth", "v": "<div class=\"g2\"><div class=\"box rise ok\" style=\"--d:0.00s\"><b>Batch deltas<\/b><br><small>50 tokens/s = 50 renders/s. Buffer and flush once per animation frame<\/small><\/div><div class=\"box rise \" style=\"--d:0.12s\"><b>Stable keys<\/b><br><small>key messages by id, never by index, or React remounts them<\/small><\/div><div class=\"box rise ok\" style=\"--d:0.24s\"><b>Memoize old messages<\/b><br><small><code>React.memo<\/code> the bubble so only the streaming one re-renders<\/small><\/div><div class=\"box rise \" style=\"--d:0.36s\"><b>Auto-scroll<\/b><br><small>stick to bottom only if the user is already near the bottom<\/small><\/div><\/div>", "p": "Re-parsing a whole markdown document on every token is the usual performance killer. Parse completed blocks once; re-render only the tail."}, {"k": "Streaming gotchas", "h": "Caveats &amp; gotchas", "v": "<ul class=\"chk\"><li class=\"rise\" style=\"--d:0.00s\">Proxies and some hosting platforms <b>buffer<\/b> responses: the stream arrives all at once. Check <code>Cache-Control: no-cache<\/code> and proxy buffering settings.<\/li><li class=\"rise\" style=\"--d:0.12s\">Unmounting while streaming: abort the request in an effect cleanup, or you update state on a dead component.<\/li><li class=\"rise\" style=\"--d:0.24s\">A 200 status does not mean success: errors can arrive <b>mid-stream<\/b> as an event. Handle both.<\/li><li class=\"rise\" style=\"--d:0.36s\">React Strict Mode runs effects twice in development; an effect that starts a stream will start two.<\/li><li class=\"rise\" style=\"--d:0.48s\"><code>EventSource<\/code> reconnects automatically; for chat that can resend a prompt. Usually not what you want.<\/li><\/ul>"}, {"k": "Streaming · AI", "h": "What AI often gets wrong", "v": "<div class=\"vwrap\"><div class=\"box warn rise\" style=\"--d:0.00s\">✗ <code>setMessages([...messages, delta])<\/code> inside the read loop<br><small style=\"color:#3ddc97\">✓ functional updater: <code>setMessages(m =&gt; ...)<\/code><\/small><\/div><div class=\"box warn rise\" style=\"--d:0.15s\">✗ Assumes each chunk is exactly one JSON event<br><small style=\"color:#3ddc97\">✓ buffer and split on blank lines<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.30s\">✗ No <code>AbortController<\/code>, no stop button<br><small style=\"color:#3ddc97\">✓ pass <code>signal<\/code>, abort on stop and unmount<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.45s\">✗ <code>new EventSource(url + '?prompt=' + text)<\/code> with secrets in the URL<br><small style=\"color:#3ddc97\">✓ POST with fetch; keep tokens in headers<\/small><\/div><\/div>"}, {"quiz": true, "k": "Quiz 1 / 7 · Streaming", "h": "Your parser does <code>JSON.parse(decoder.decode(value))<\/code> on every chunk. It works locally but throws in production. Why?", "opts": [["Production uses a different JSON format", 0], ["Chunks do not align with events; one chunk can hold half an event or several", 1], ["TextDecoder is not available in production browsers", 0]], "right": "Network chunking is arbitrary. Buffer, split on the event delimiter, keep the remainder.", "wrong": "The chunk ≠ event assumption breaks over real networks. <b>Buffer and split<\/b>."}, {"k": "Section 1 · Go deeper", "h": "Go deeper", "v": "<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.00s;text-decoration:none;display:block\" href=\"https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events\" target=\"_blank\" rel=\"noopener\"><b>MDN: Using server-sent events ↗<\/b><br><small>the event-stream format and EventSource<\/small><\/a><a class=\"box rise\" style=\"--d:0.15s;text-decoration:none;display:block\" href=\"https://developer.mozilla.org/en-US/docs/Web/API/Streams_API/Using_readable_streams\" target=\"_blank\" rel=\"noopener\"><b>MDN: Using readable streams ↗<\/b><br><small>getReader, chunks, cancellation<\/small><\/a><a class=\"box rise\" style=\"--d:0.30s;text-decoration:none;display:block\" href=\"https://ai-sdk.dev/docs/introduction\" target=\"_blank\" rel=\"noopener\"><b>Vercel AI SDK docs ↗<\/b><br><small>a widely used useChat implementation to compare against<\/small><\/a><\/div>", "p": "Optional, but worth it. Tap a card to open it in a new tab."}, {"sect": 1, "num": "2", "kicker": "Section 2 · Embedding", "h": "Iframes and postMessage bridges", "p": "Chat assistants are often built as a separate app and embedded into a host product. The browser's security model decides how that works."}, {"k": "First principles", "h": "The same-origin policy", "v": "<svg viewBox=\"0 0 320 170\"><rect class=\"rise\" x=\"8\" y=\"14\" width=\"140\" height=\"140\" rx=\"12\" fill=\"#13243a\" stroke=\"#4ea8ff\"/><text x=\"78\" y=\"36\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\">app.example.com<\/text><text x=\"78\" y=\"56\" fill=\"#cfd6ea\" font-size=\"9\" text-anchor=\"middle\">DOM · cookies · storage<\/text><rect class=\"rise\" style=\"--d:.3s\" x=\"172\" y=\"14\" width=\"140\" height=\"140\" rx=\"12\" fill=\"rgba(167,139,250,.15)\" stroke=\"#a78bfa\"/><text x=\"242\" y=\"36\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\">chat.vendor.io<\/text><text x=\"242\" y=\"56\" fill=\"#cfd6ea\" font-size=\"9\" text-anchor=\"middle\">DOM · cookies · storage<\/text><text x=\"160\" y=\"92\" fill=\"#ff5c8a\" font-size=\"18\" text-anchor=\"middle\" class=\"blink\">✗<\/text><text x=\"160\" y=\"112\" fill=\"#5d6680\" font-size=\"8\" text-anchor=\"middle\">no reads<\/text><line class=\"flow\" x1=\"148\" y1=\"132\" x2=\"172\" y2=\"132\" stroke=\"#3ddc97\" stroke-width=\"2\"/><text x=\"160\" y=\"148\" fill=\"#3ddc97\" font-size=\"8\" text-anchor=\"middle\">postMessage<\/text><\/svg>", "p": "An <b>origin<\/b> is scheme + host + port. Script on one origin cannot read another origin's DOM, cookies or storage, even when one is inside the other as an iframe. The only sanctioned channel between them is <code>postMessage<\/code>.", "an": "Two processes with separate memory: you need explicit IPC with a schema."}, {"k": "Iframes", "h": "The iframe attributes that matter", "cmp": [["TSX", "<iframe\n  src={`https://chat.vendor.io/embed?locale=${locale}`}\n  title=\"Assistant\"                  // accessible name, required\n  sandbox=\"allow-scripts allow-same-origin allow-forms allow-popups\"\n  allow=\"clipboard-write\"\n  referrerPolicy=\"strict-origin-when-cross-origin\"\n  style={{ border: 0, width: '100%', height: '100%' }}\n/>", "host app"]], "p": "<code>sandbox<\/code> starts from \"deny everything\"; add only what the embedded app needs. Never combine <code>allow-scripts<\/code> and <code>allow-same-origin<\/code> on <b>same-origin<\/b> content you do not trust: it can remove its own sandbox. On the embedded side, <code>Content-Security-Policy: frame-ancestors<\/code> decides who may embed it."}, {"k": "postMessage", "h": "Sending and receiving safely", "cmp": [["TS", "// host → iframe: always name the target origin\niframe.contentWindow?.postMessage({ type: 'CONTEXT', page: '/tasks/42' }, CHAT_ORIGIN);\n\n// iframe → host: validate origin, source and shape\nwindow.addEventListener('message', (e) => {\n  if (e.origin !== HOST_ORIGIN) return;          // who sent it\n  if (e.source !== window.parent) return;        // which window\n  const msg = BridgeMessage.safeParse(e.data);   // e.g. zod schema\n  if (!msg.success) return;\n  handle(msg.data);\n});", "bridge"]], "p": "The second argument of <code>postMessage<\/code> is a delivery guard: the browser drops the message unless the receiver is on that origin. <code>'*'<\/code> delivers to whoever is there now, which may not be who you think after a navigation."}, {"k": "Protocol design", "h": "A typed bridge protocol", "cmp": [["TS", "type BridgeMessage =\n  | { v: 1; type: 'READY' }\n  | { v: 1; type: 'CONTEXT'; page: string; selection?: string }\n  | { v: 1; type: 'AUTH_TOKEN'; token: string; expiresAt: number }\n  | { v: 1; type: 'RESIZE'; height: number }\n  | { v: 1; type: 'OPEN_LINK'; url: string };\n\n// handshake: iframe posts READY, host replies with CONTEXT + AUTH_TOKEN", "bridge-protocol.ts"]], "p": "Use a discriminated union with a version field, publish it as a shared package or copy it with a contract test, and only ever <b>add<\/b> message types or optional fields. Old and new versions will be live at the same time.", "an": "An event contract between two services: versioned schema, additive changes, consumers tolerate unknown fields."}, {"k": "Step by step", "h": "The READY handshake", "v": "<ol class=\"steps\"><li style=\"--d:0.0s\"><span>Host renders the iframe and starts listening for messages<\/span><\/li><li style=\"--d:0.6s\"><span>Iframe boots, attaches its listener, then posts <code>READY<\/code> to the parent<\/span><\/li><li style=\"--d:1.2s\"><span>Host checks origin + source, then sends <code>CONTEXT<\/code> and credentials<\/span><\/li><li style=\"--d:1.8s\"><span>Iframe acknowledges; from now on both sides exchange typed messages<\/span><\/li><li style=\"--d:2.4s\"><span>Host sends updates when the page changes; iframe sends <code>RESIZE<\/code>, <code>OPEN_LINK<\/code><\/span><\/li><\/ol>", "p": "Without a handshake, the host's first message often arrives before the iframe has a listener and is silently lost. A race that only appears on slow networks."}, {"k": "Embedding gotchas", "h": "Caveats &amp; gotchas", "v": "<ul class=\"chk\"><li class=\"rise\" style=\"--d:0.00s\">Third-party cookies are blocked or partitioned in most browsers: a cross-site iframe usually cannot rely on its own session cookie.<\/li><li class=\"rise\" style=\"--d:0.12s\"><code>OPEN_LINK<\/code> from the iframe must be validated (allowlist schemes and hosts) before the host navigates. Otherwise it is an open redirect.<\/li><li class=\"rise\" style=\"--d:0.24s\">Iframes do not size to content. The child reports its height; the host sets it.<\/li><li class=\"rise\" style=\"--d:0.36s\">Keyboard focus and screen readers cross the frame boundary; test tab order end to end.<\/li><li class=\"rise\" style=\"--d:0.48s\">CSP on the host (<code>frame-src<\/code>) and on the child (<code>frame-ancestors<\/code>) must both allow the pairing.<\/li><\/ul>"}, {"k": "Embedding · AI", "h": "What AI often gets wrong", "v": "<div class=\"vwrap\"><div class=\"box warn rise\" style=\"--d:0.00s\">✗ <code>postMessage(data, '*')<\/code><br><small style=\"color:#3ddc97\">✓ explicit target origin from config<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.15s\">✗ Listener with no <code>e.origin<\/code> check<br><small style=\"color:#3ddc97\">✓ check origin and source, then validate shape<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.30s\">✗ <code>e.data<\/code> used as typed with <code>as BridgeMessage<\/code><br><small style=\"color:#3ddc97\">✓ runtime schema validation<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.45s\">✗ Sends the token in the iframe URL query string<br><small style=\"color:#3ddc97\">✓ send it over the bridge after READY<\/small><\/div><\/div>"}, {"quiz": true, "k": "Quiz 2 / 7 · Security", "h": "A PR adds <code>iframe.contentWindow.postMessage(pageContext, '*')<\/code>. Verdict?", "opts": [["Fine, the iframe is ours", 0], ["Request changes: name the target origin", 1], ["Fine if the message is JSON", 0]], "right": "If the frame navigated, a wildcard delivers page data to whatever origin is now there.", "wrong": "Always an <b>explicit origin<\/b>. The payload contains user data; a wildcard can leak it."}, {"k": "Section 2 · Go deeper", "h": "Go deeper", "v": "<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.00s;text-decoration:none;display:block\" href=\"https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage\" target=\"_blank\" rel=\"noopener\"><b>MDN: Window.postMessage() ↗<\/b><br><small>targetOrigin, security concerns<\/small><\/a><a class=\"box rise\" style=\"--d:0.15s;text-decoration:none;display:block\" href=\"https://developer.mozilla.org/en-US/docs/Web/HTML/Element/iframe\" target=\"_blank\" rel=\"noopener\"><b>MDN: &lt;iframe&gt; ↗<\/b><br><small>sandbox, allow, referrerpolicy<\/small><\/a><a class=\"box rise\" style=\"--d:0.30s;text-decoration:none;display:block\" href=\"https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html\" target=\"_blank\" rel=\"noopener\"><b>OWASP: HTML5 Security Cheat Sheet ↗<\/b><br><small>postMessage and sandboxed frames<\/small><\/a><\/div>", "p": "Optional, but worth it. Tap a card to open it in a new tab."}, {"sect": 1, "num": "3", "kicker": "Section 3 · Auth handoff", "h": "Getting the user signed in inside the embed", "p": "The embedded app needs to know who the user is, but it cannot read the host's cookies. Here are the standard patterns."}, {"k": "First principles", "h": "Why cookies are not enough", "v": "<svg viewBox=\"0 0 320 160\"><rect class=\"rise\" x=\"8\" y=\"14\" width=\"304\" height=\"136\" rx=\"12\" fill=\"#13243a\" stroke=\"#4ea8ff\"/><text x=\"18\" y=\"32\" fill=\"#fff\" font-size=\"10\" font-weight=\"700\">app.example.com (top level)<\/text><text x=\"18\" y=\"48\" fill=\"#3ddc97\" font-size=\"9\">🍪 session cookie: sent<\/text><rect class=\"rise\" style=\"--d:.3s\" x=\"40\" y=\"62\" width=\"240\" height=\"76\" rx=\"10\" fill=\"rgba(167,139,250,.15)\" stroke=\"#a78bfa\"/><text x=\"52\" y=\"80\" fill=\"#fff\" font-size=\"10\" font-weight=\"700\">iframe: chat.vendor.io<\/text><text x=\"52\" y=\"98\" fill=\"#ff5c8a\" font-size=\"9\">third-party cookies: blocked / partitioned<\/text><text x=\"52\" y=\"116\" fill=\"#ff5c8a\" font-size=\"9\">SameSite=Lax cookies: not sent in cross-site frames<\/text><\/svg>", "p": "<code>SameSite=Lax<\/code> (the browser default) cookies are not sent on cross-site subrequests, including iframe loads. Browsers also restrict third-party cookies. So \"just log in inside the iframe\" usually fails or loops."}, {"k": "Patterns", "h": "Three common auth handoffs", "v": "<div class=\"g2\"><div class=\"box rise ok\" style=\"--d:0.00s\"><b>Token over bridge<\/b><br><small>host gets a short-lived, audience-scoped token from its backend and posts it after READY<\/small><\/div><div class=\"box rise \" style=\"--d:0.12s\"><b>Popup OAuth<\/b><br><small>iframe opens a top-level popup for the OAuth flow; popup returns via postMessage<\/small><\/div><div class=\"box rise \" style=\"--d:0.24s\"><b>Same-site subdomain<\/b><br><small>serve the embed from <code>chat.example.com<\/code> so first-party cookies apply<\/small><\/div><div class=\"box rise warn\" style=\"--d:0.36s\"><b>Avoid<\/b><br><small>long-lived tokens in URLs, localStorage tokens readable by any script on that origin<\/small><\/div><\/div>", "p": "The token-over-bridge pattern is the most common for embedded assistants. The host already has a session; its backend exchanges it for a token valid only for the chat API, for minutes."}, {"k": "Step by step", "h": "Token over the bridge", "v": "<ol class=\"steps\"><li style=\"--d:0.0s\"><span>Iframe posts <code>READY<\/code><\/span><\/li><li style=\"--d:0.6s\"><span>Host calls its own backend: <code>POST /embed-token<\/code> (session cookie, same origin)<\/span><\/li><li style=\"--d:1.2s\"><span>Backend mints a short-lived token: audience = chat API, scope = this user, ~5 min<\/span><\/li><li style=\"--d:1.8s\"><span>Host posts <code>AUTH_TOKEN<\/code> to the iframe's exact origin<\/span><\/li><li style=\"--d:2.4s\"><span>Iframe keeps it <b>in memory<\/b> and attaches it as <code>Authorization: Bearer<\/code><\/span><\/li><li style=\"--d:3.0s\"><span>Before expiry, iframe posts <code>TOKEN_REFRESH_NEEDED<\/code>; host repeats from step 2<\/span><\/li><\/ol>", "an": "Service-to-service token exchange, except the broker is the host page in the browser."}, {"k": "OAuth refresher", "h": "Authorization code + PKCE", "v": "<ol class=\"steps\"><li style=\"--d:0.0s\"><span>App generates a random <code>code_verifier<\/code> and its hash <code>code_challenge<\/code><\/span><\/li><li style=\"--d:0.6s\"><span>Browser goes to the identity provider with the challenge<\/span><\/li><li style=\"--d:1.2s\"><span>User signs in; provider redirects back with a one-time <code>code<\/code><\/span><\/li><li style=\"--d:1.8s\"><span>App exchanges <code>code<\/code> + <code>code_verifier<\/code> for tokens<\/span><\/li><li style=\"--d:2.4s\"><span>Provider checks the hash matches: a stolen code is useless<\/span><\/li><\/ol>", "p": "PKCE is the standard for browser apps; the implicit flow (tokens in the URL fragment) is deprecated. You will see this on the popup pattern."}, {"k": "Auth gotchas", "h": "Caveats &amp; gotchas", "v": "<ul class=\"chk\"><li class=\"rise\" style=\"--d:0.00s\">Tokens in <code>localStorage<\/code> are readable by any XSS on that origin. In-memory plus refresh is safer for embeds.<\/li><li class=\"rise\" style=\"--d:0.12s\">Validate the origin of <code>AUTH_TOKEN<\/code> messages in the iframe, or an attacker page that frames you can inject its own token.<\/li><li class=\"rise\" style=\"--d:0.24s\">Plan the logged-out state: what does the iframe show if no token arrives within N seconds?<\/li><li class=\"rise\" style=\"--d:0.36s\">Clock skew: use <code>expiresAt<\/code> from the server and refresh early, not exactly at expiry.<\/li><\/ul>"}, {"quiz": true, "k": "Quiz 3 / 7 · Auth", "h": "Why does the embedded chat (on a different site) fail to log itself in via a redirect inside the iframe?", "opts": [["OAuth does not support iframes by specification", 0], ["The identity provider's session cookie is not sent in a cross-site iframe, so the user looks logged out", 1], ["postMessage blocks redirects", 0]], "right": "No cookie means the login form, often in a frame that refuses to be framed. Hence token handoff or a popup.", "wrong": "It is <b>cookie policy<\/b>: cross-site frames arrive without the session."}, {"k": "Section 3 · Go deeper", "h": "Go deeper", "v": "<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.00s;text-decoration:none;display:block\" href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies\" target=\"_blank\" rel=\"noopener\"><b>MDN: Using HTTP cookies ↗<\/b><br><small>SameSite, third-party cookies<\/small><\/a><a class=\"box rise\" style=\"--d:0.15s;text-decoration:none;display:block\" href=\"https://oauth.net/2/pkce/\" target=\"_blank\" rel=\"noopener\"><b>oauth.net: PKCE ↗<\/b><br><small>why every browser app should use it<\/small><\/a><a class=\"box rise\" style=\"--d:0.30s;text-decoration:none;display:block\" href=\"https://datatracker.ietf.org/doc/html/draft-ietf-oauth-browser-based-apps\" target=\"_blank\" rel=\"noopener\"><b>IETF: OAuth 2.0 for Browser-Based Applications ↗<\/b><br><small>current best-practice draft<\/small><\/a><\/div>", "p": "Optional, but worth it. Tap a card to open it in a new tab."}, {"sect": 1, "num": "4", "kicker": "Section 4 · UX &amp; safety", "h": "Optimistic UI and safe markdown", "p": "Chat feels fast when your message appears instantly, and it stays safe when model output is treated as untrusted input."}, {"k": "Optimistic UI", "h": "Show it before the server confirms", "v": "<ol class=\"steps\"><li style=\"--d:0.0s\"><span>User hits Send: append the message with <code>status: 'pending'<\/code> immediately<\/span><\/li><li style=\"--d:0.6s\"><span>Clear the input, keep focus<\/span><\/li><li style=\"--d:1.2s\"><span>Request goes out; the bubble shows a subtle sending indicator<\/span><\/li><li style=\"--d:1.8s\"><span>Success: replace the temp id with the server id, mark <code>sent<\/code><\/span><\/li><li style=\"--d:2.4s\"><span>Failure: mark <code>failed<\/code>, show <b>Retry<\/b>; never silently drop the user's text<\/span><\/li><\/ol>", "cmp": [["TSX", "const [optimistic, addOptimistic] = useOptimistic(\n  messages,\n  (state, text: string) => [...state, { id: 'temp', role: 'user', text, pending: true }],\n);", "React 19 useOptimistic"]], "p": "TanStack Query offers the same idea via <code>onMutate<\/code> / <code>onError<\/code> rollback. The rule: every optimistic state needs a defined failure state.", "lab": true}, {"k": "Markdown", "h": "Model output is untrusted input", "v": "<div class=\"g2\"><div class=\"box rise warn\" style=\"--d:0.00s\"><b>Threat<\/b><br><small>a prompt-injected response contains <code>&lt;img src=x onerror=...&gt;<\/code> or a <code>javascript:<\/code> link<\/small><\/div><div class=\"box rise warn\" style=\"--d:0.12s\"><b>Never<\/b><br><small><code>dangerouslySetInnerHTML={{ __html: marked(text) }}<\/code> without sanitizing<\/small><\/div><div class=\"box rise ok\" style=\"--d:0.24s\"><b>Prefer<\/b><br><small><code>react-markdown<\/code>: builds React elements, no raw HTML by default<\/small><\/div><div class=\"box rise ok\" style=\"--d:0.36s\"><b>If HTML is needed<\/b><br><small>sanitize with DOMPurify and allowlist tags<\/small><\/div><\/div>", "p": "Treat model output like user-submitted content from a stranger. It can contain whatever a document in its context told it to write."}, {"k": "Markdown", "h": "Rendering it safely", "cmp": [["TSX", "import ReactMarkdown from 'react-markdown';\nimport remarkGfm from 'remark-gfm';\n\n<ReactMarkdown\n  remarkPlugins={[remarkGfm]}\n  components={{\n    a: ({ href, children }) => (\n      <a href={safeUrl(href)} target=\"_blank\" rel=\"noopener noreferrer\">{children}<\/a>\n    ),\n    code: CodeBlock,                // your highlighter\n  }}\n>\n  {message.text}\n<\/ReactMarkdown>\n\nfunction safeUrl(u?: string) {\n  return u && /^https?:\\/\\//.test(u) ? u : undefined; // drop javascript:, data:\n}", "Message.tsx"]], "p": "Streaming markdown is often incomplete (an unclosed code fence). A good renderer tolerates it; test with half-finished input.", "lab": true}, {"k": "UX checklist", "h": "States every chat UI needs", "v": "<ul class=\"chk\"><li class=\"rise\" style=\"--d:0.00s\"><b>Empty<\/b>: suggested prompts, what the assistant can do<\/li><li class=\"rise\" style=\"--d:0.12s\"><b>Streaming<\/b>: typing indicator, Stop button, input disabled or queued<\/li><li class=\"rise\" style=\"--d:0.24s\"><b>Error mid-stream<\/b>: keep partial text, show Retry<\/li><li class=\"rise\" style=\"--d:0.36s\"><b>Rate-limited<\/b> (429): explain and back off<\/li><li class=\"rise\" style=\"--d:0.48s\"><b>Long answers<\/b>: auto-scroll only when pinned to bottom, \"jump to latest\" button<\/li><li class=\"rise\" style=\"--d:0.60s\"><b>Accessibility<\/b>: an <code>aria-live=\"polite\"<\/code> region announces completed messages, not every token<\/li><\/ul>"}, {"k": "UX · AI", "h": "What AI often gets wrong", "v": "<div class=\"vwrap\"><div class=\"box warn rise\" style=\"--d:0.00s\">✗ <code>dangerouslySetInnerHTML<\/code> with a markdown library<br><small style=\"color:#3ddc97\">✓ <code>react-markdown<\/code> or sanitize with DOMPurify<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.15s\">✗ Optimistic add with no failure path<br><small style=\"color:#3ddc97\">✓ <code>failed<\/code> state + Retry<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.30s\">✗ <code>aria-live<\/code> on the streaming bubble (announces every token)<br><small style=\"color:#3ddc97\">✓ announce once when the message completes<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.45s\">✗ Scrolls to bottom on every delta<br><small style=\"color:#3ddc97\">✓ only if the user is already at the bottom<\/small><\/div><\/div>"}, {"quiz": true, "k": "Quiz 4 / 7 · Safety", "h": "A model response includes <code>[click](javascript:alert(1))<\/code>. Your renderer uses react-markdown with a custom link component. What should the link component do?", "opts": [["Render it as-is, react-markdown is safe", 0], ["Allow only http(s) URLs and drop the rest", 1], ["Escape the link text", 0]], "right": "Allowlisting schemes is the standard defense; recent react-markdown versions also filter dangerous protocols by default, but a custom component must keep that guarantee.", "wrong": "<b>Allowlist schemes<\/b>. A custom <code>a<\/code> component can bypass the library's default URL filtering."}, {"k": "Section 4 · Go deeper", "h": "Go deeper", "v": "<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.00s;text-decoration:none;display:block\" href=\"https://react.dev/reference/react/useOptimistic\" target=\"_blank\" rel=\"noopener\"><b>React docs: useOptimistic ↗<\/b><br><small>the official optimistic-state hook<\/small><\/a><a class=\"box rise\" style=\"--d:0.15s;text-decoration:none;display:block\" href=\"https://github.com/remarkjs/react-markdown\" target=\"_blank\" rel=\"noopener\"><b>react-markdown ↗<\/b><br><small>safe-by-default markdown rendering in React<\/small><\/a><a class=\"box rise\" style=\"--d:0.30s;text-decoration:none;display:block\" href=\"https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html\" target=\"_blank\" rel=\"noopener\"><b>OWASP: XSS Prevention Cheat Sheet ↗<\/b><br><small>why output encoding and sanitizing matter<\/small><\/a><\/div>", "p": "Optional, but worth it. Tap a card to open it in a new tab."}, {"sect": 1, "num": "5", "kicker": "Section 5 · Agents &amp; releases", "h": "Rules for coding agents, and shipping safely", "p": "Two practical topics: telling coding agents how your repo works, and releasing UI that talks to an independently deployed service."}, {"k": "AGENTS.md", "h": "A README for coding agents", "v": "<div class=\"g2\"><div class=\"box rise \" style=\"--d:0.00s\"><b>What<\/b><br><small>a markdown file at the repo root that agents read before working<\/small><\/div><div class=\"box rise ok\" style=\"--d:0.12s\"><b>Why<\/b><br><small>agents follow written conventions; they do not guess yours<\/small><\/div><div class=\"box rise \" style=\"--d:0.24s\"><b>Contains<\/b><br><small>setup and test commands, code style, do/don't rules, where things live<\/small><\/div><div class=\"box rise \" style=\"--d:0.36s\"><b>Scope<\/b><br><small>nested files in subfolders override for that package<\/small><\/div><\/div>", "p": "AGENTS.md is an open convention read by many coding agents; some tools use their own file name (e.g. CLAUDE.md, Copilot instructions) with the same purpose."}, {"k": "AGENTS.md", "h": "A good example", "cmp": [["Bash", "# AGENTS.md\n## Commands\n- Install: `pnpm install`  · Test: `pnpm test` · Types: `pnpm typecheck`\n- Before pushing: `pnpm lint && pnpm typecheck && pnpm test`\n\n## Rules\n- TypeScript strict. No `any`, no `as` casts unless validated at runtime.\n- Data fetching via TanStack Query hooks in `src/api/`. No fetch in components.\n- Tests: React Testing Library + MSW. Query by role. No snapshots of pages.\n- UI: use components from `src/ui/`. Do not add new UI libraries.\n- Never commit secrets or edit generated files in `src/gen/`.\n\n## Where things live\n- Chat bridge protocol: `src/bridge/protocol.ts` (additive changes only)", "AGENTS.md"]], "p": "Specific, checkable rules beat vague advice. \"Write clean code\" changes nothing; \"no <code>as<\/code> casts\" is something an agent (and a reviewer) can verify."}, {"k": "Releases", "h": "Two apps, two release trains", "v": "<svg viewBox=\"0 0 320 160\"><text x=\"8\" y=\"20\" fill=\"#a3acc2\" font-size=\"10\" font-weight=\"700\">host app<\/text><line x1=\"8\" y1=\"40\" x2=\"312\" y2=\"40\" stroke=\"#2a3145\" stroke-width=\"2\"/><circle class=\"pop\" style=\"--d:0.0s\" cx=\"30\" cy=\"40\" r=\"7\" fill=\"#4ea8ff\"/><circle class=\"pop\" style=\"--d:0.2s\" cx=\"100\" cy=\"40\" r=\"7\" fill=\"#4ea8ff\"/><circle class=\"pop\" style=\"--d:0.4s\" cx=\"170\" cy=\"40\" r=\"7\" fill=\"#4ea8ff\"/><circle class=\"pop\" style=\"--d:0.6s\" cx=\"240\" cy=\"40\" r=\"7\" fill=\"#4ea8ff\"/><circle class=\"pop\" style=\"--d:0.8s\" cx=\"310\" cy=\"40\" r=\"7\" fill=\"#4ea8ff\"/><text x=\"8\" y=\"80\" fill=\"#a3acc2\" font-size=\"10\" font-weight=\"700\">chat app<\/text><line x1=\"8\" y1=\"100\" x2=\"312\" y2=\"100\" stroke=\"#2a3145\" stroke-width=\"2\"/><circle class=\"pop\" style=\"--d:0.5s\" cx=\"60\" cy=\"100\" r=\"7\" fill=\"#a78bfa\"/><circle class=\"pop\" style=\"--d:0.7s\" cx=\"170\" cy=\"100\" r=\"7\" fill=\"#a78bfa\"/><circle class=\"pop\" style=\"--d:0.9s\" cx=\"280\" cy=\"100\" r=\"7\" fill=\"#a78bfa\"/><text x=\"8\" y=\"140\" fill=\"#5d6680\" font-size=\"9\">any host version must work with any live chat version (and back)<\/text><\/svg>", "p": "When the host and the embedded app deploy independently, every bridge change is live in mixed versions for a while. Rollbacks make it worse: the old version comes back."}, {"k": "Releases", "h": "Practices that keep it safe", "v": "<ul class=\"chk\"><li class=\"rise\" style=\"--d:0.00s\"><b>Additive protocol changes<\/b>: new optional fields, new message types; remove old ones only after both sides stopped using them<\/li><li class=\"rise\" style=\"--d:0.12s\"><b>Feature flags<\/b>: ship code dark, enable per user or percentage, kill switch without a deploy<\/li><li class=\"rise\" style=\"--d:0.24s\"><b>Version handshake<\/b>: <code>READY<\/code> carries a protocol version; the host degrades gracefully<\/li><li class=\"rise\" style=\"--d:0.36s\"><b>Contract tests<\/b>: both repos test against the same schema<\/li><li class=\"rise\" style=\"--d:0.48s\"><b>Staged rollout<\/b>: dev → staging → small % of production → everyone, with error-rate dashboards<\/li><li class=\"rise\" style=\"--d:0.60s\"><b>Observability<\/b>: log bridge errors and stream failures with a request id<\/li><\/ul>"}, {"k": "Release gotchas", "h": "Caveats &amp; gotchas", "v": "<ul class=\"chk\"><li class=\"rise\" style=\"--d:0.00s\">Long-lived browser tabs run old JavaScript for days. Your server must tolerate yesterday's client.<\/li><li class=\"rise\" style=\"--d:0.12s\">A flag removed from code but still referenced in config (or vice versa) is a classic outage.<\/li><li class=\"rise\" style=\"--d:0.24s\">Streaming endpoints need timeouts on both sides; a stuck stream holds connections.<\/li><li class=\"rise\" style=\"--d:0.36s\">Breaking a message shape \"in both repos on the same day\" still breaks: they never deploy at the same instant.<\/li><\/ul>"}, {"quiz": true, "k": "Quiz 5 / 7 · Agents", "h": "An agent wrote <code>const user = res as User;<\/code> to fix a type error. Your AGENTS.md says no unvalidated casts. Best fix?", "opts": [["Use <code>res as unknown as User<\/code>", 0], ["Validate at runtime (e.g. a schema parse) and let TypeScript infer <code>User<\/code>", 1], ["Add <code>// @ts-ignore<\/code>", 0]], "right": "A cast hides exactly the bug the type checker found. Validate, then the type is earned.", "wrong": "<b>Runtime validation<\/b>. The other options silence the checker without making the data correct."}, {"quiz": true, "k": "Quiz 6 / 7 · Releases", "h": "You rename the <code>CONTEXT<\/code> message field <code>page<\/code> to <code>path<\/code> in both apps and deploy both today. What happens?", "opts": [["Nothing, both deploy together", 0], ["For a window (and on any rollback) one side sends <code>page<\/code> while the other reads <code>path<\/code>", 1], ["The browser converts field names automatically", 0]], "right": "Independent deploys always overlap. Add <code>path<\/code>, keep reading <code>page<\/code>, remove later.", "wrong": "They <b>deploy at different times<\/b>. Make it additive and clean up later."}, {"quiz": true, "k": "Quiz 7 / 7 · Streaming state", "h": "Inside the read loop, <code>setMessages([...messages, ...])<\/code> produces a message with only the last token. Why?", "opts": [["React drops fast updates", 0], ["<code>messages<\/code> is the value captured when <code>send<\/code> started (a stale closure); use the functional updater", 1], ["Strict Mode doubles updates", 0]], "right": "Each iteration reads the same old array. <code>setMessages(m =&gt; ...)<\/code> always gets the latest.", "wrong": "It is a <b>stale closure<\/b>. Use the functional updater form."}, {"k": "Section 5 · Go deeper", "h": "Go deeper", "v": "<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.00s;text-decoration:none;display:block\" href=\"https://agents.md/\" target=\"_blank\" rel=\"noopener\"><b>AGENTS.md ↗<\/b><br><small>the open format, with examples<\/small><\/a><a class=\"box rise\" style=\"--d:0.15s;text-decoration:none;display:block\" href=\"https://martinfowler.com/articles/feature-toggles.html\" target=\"_blank\" rel=\"noopener\"><b>Martin Fowler: Feature Toggles ↗<\/b><br><small>types of flags and how to retire them<\/small><\/a><a class=\"box rise\" style=\"--d:0.30s;text-decoration:none;display:block\" href=\"https://semver.org/\" target=\"_blank\" rel=\"noopener\"><b>Semantic Versioning ↗<\/b><br><small>a vocabulary for compatible vs breaking changes<\/small><\/a><\/div>", "p": "Optional, but worth it. Tap a card to open it in a new tab."}, {"recap": true, "h": "AI/chat UIs on one card", "items": ["<b>Stream<\/b> with fetch + a buffered SSE parser; abort on stop/unmount; functional state updates.", "<b>Embed<\/b> with an iframe + typed, versioned postMessage bridge; always check origin and name the target.", "<b>Auth<\/b> via short-lived token over the bridge or a popup OAuth (PKCE); cookies do not cross sites.", "<b>Optimistic UI<\/b> needs a failure state; <b>markdown<\/b> from a model is untrusted: no raw HTML, allowlist link schemes.", "<b>AGENTS.md<\/b> with checkable rules; release with additive protocols, flags and staged rollouts."], "next": "Next: <b>Part 11<\/b>, Playwright end-to-end testing."}];
</script>
<script>(function(){
  "use strict";
  var KW='const|let|var|function|return|if|else|async|await|new|class|interface|type|import|export|default|from|def|end|public|private|static|final|void|try|catch|throw|typeof|record|enum|module|for|of|in|null|undefined|true|false|this|self|nil|package|implements|extends|describe|it|test|expect|before|beforeEach|afterEach|require|do';
  var RE=new RegExp('(\\/\\/[^\\n]*|#(?!\\{)[^\\n]*)|("[^"\\n]*"|\'[^\'\\n]*\'|`[^`]*`)|\\b('+KW+')\\b','g');
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function hl(src){ var out='',last=0,m; RE.lastIndex=0;
    while((m=RE.exec(src))){ out+=esc(src.slice(last,m.index)); out+= m[1]?'<span class="c">'+esc(m[1])+'</span>': m[2]?'<span class="s">'+esc(m[2])+'</span>':'<span class="k">'+m[3]+'</span>'; last=RE.lastIndex; }
    return out+esc(src.slice(last)); }
  var LC={JS:['#2a2510','#f7d046'],TS:['#13243a','#4ea8ff'],JSX:['#102a2a','#4ee6e0'],TSX:['#102a2a','#4ee6e0'],Java:['#2a1a14','#ff7a45'],JUnit:['#2a1a14','#ff7a45'],Ruby:['#3a1624','#ff5c8a'],RSpec:['#3a1624','#ff5c8a'],Bash:['#1a2a1a','#3ddc97'],Rails:['#3a1624','#ff5c8a'],JSON:['#22183a','#a78bfa']};
  var stage=document.getElementById('stage'), anchor=document.getElementById('bottomBar');
  CARDS.forEach(function(c){
    var s=document.createElement('section'); s.className='card'; var h='';
    if(c.sect){ s.className+=' sect';
      h='<div class="visual"><div class="num pop">'+c.num+'</div></div>'+(c.badge?'<div class="titlebadge"><i></i>'+c.badge+'</div>':'')+'<div class="kicker">'+c.kicker+'</div><h1>'+c.h+'</h1><p>'+c.p+'</p>'+(c.first?'<div class="tapme">Tap the right side or swipe left →</div>':'');
    } else if(c.quiz){ s.className+=' quiz'; s.setAttribute('data-quiz','');
      h='<div class="kicker">'+c.k+'</div><h2>'+c.h+'</h2>'+(c.code?'<div class="qcode">'+hl(c.code)+'</div>':'<div style="height:10px"></div>')+'<div class="opts">'+c.opts.map(function(o,i){return '<button class="opt" type="button" data-ok="'+o[1]+'"><span class="l">'+'ABCD'[i]+'</span>'+o[0]+'</button>';}).join('')+'</div><div class="fb"></div>';
    } else if(c.recap){
      h='<div class="kicker">Recap</div><h2>'+c.h+'</h2><ul class="take">'+
        c.items.map(function(t,i){return '<li class="rise" style="--d:'+(i*0.15)+'s">'+t+'</li>';}).join('')+
        '</ul><div class="score" id="score"></div><p style="font-size:13px;margin-top:8px">'+c.next+'</p><a class="btn ghost" href="index.html" style="margin-top:6px">← Course home</a>';
    } else {
      var inner='';
      if(c.cmp){ inner='<div class="stack">'+c.cmp.map(function(b,i){ var col=LC[b[0]]||LC.JS; return '<div class="cb rise" style="--d:'+(i*0.25)+'s"><div class="cb-h">'+(b[2]||(i===0?'modern':'compare'))+' <span class="tagc" style="background:'+col[0]+';color:'+col[1]+'">'+b[0]+'</span></div><pre>'+hl(b[1])+'</pre></div>'; }).join('')+'</div>'; }
      if(c.v){ inner=c.v+inner; }
      if(c.lab){ s.className+=' lab'; inner='<div class="scrollv demo">'+inner+'</div>'; }
      h='<div class="kicker">'+c.k+'</div><div class="visual">'+inner+'</div><h2>'+c.h+'</h2>'+(c.p?'<p>'+c.p+'</p>':'')+(c.an?'<div class="analogy"><span>'+c.an+'</span></div>':'');
    }
    s.innerHTML=h; if(c.quiz){ var fb=s.querySelector('.fb'); fb.setAttribute('data-right',c.right); fb.setAttribute('data-wrong',c.wrong); }
    stage.insertBefore(s, anchor);
  });
})();
</script>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var stage=$('stage'), cards=[].slice.call(document.querySelectorAll('.card')), segsEl=$('segs'), countEl=$('count'), prevBtn=$('prev'), nextBtn=$('next');
  var cur=0, N=cards.length, answered=0, correct=0, NQ=document.querySelectorAll('[data-quiz]').length;
  cards.forEach(function(){ var s=document.createElement('div'); s.className='seg'; s.appendChild(document.createElement('i')); segsEl.appendChild(s); });
  var segs=segsEl.children;
  function go(n){
    n=Math.max(0,Math.min(N-1,n));
    cards.forEach(function(c,k){ c.classList.toggle('past',k<n); if(k!==n) c.classList.remove('active'); c.setAttribute('aria-hidden',k!==n); });
    var card=cards[n]; card.classList.remove('active'); void card.offsetWidth; card.classList.add('active');
    for(var k=0;k<N;k++) segs[k].classList.toggle('done',k<=n);
    countEl.textContent=(n+1)+' / '+N; prevBtn.disabled=n===0; nextBtn.disabled=n===N-1; cur=n; try{var _k='lp:'+location.pathname.split('/').pop(),_o=JSON.parse(localStorage.getItem(_k)||'{}');localStorage.setItem(_k,JSON.stringify({max:Math.max(_o.max||0,n+1),total:N}));}catch(_e){} updateScore();
    try{ history.replaceState(null,'','#'+(n+1)); }catch(e){}
  }
  function next(){ if(cur<N-1) go(cur+1); } function prev(){ if(cur>0) go(cur-1); }
  prevBtn.addEventListener('click',function(e){e.stopPropagation();prev();});
  nextBtn.addEventListener('click',function(e){e.stopPropagation();next();});
  
  var lastSwipe=0;
  stage.addEventListener('click',function(e){
    if(Date.now()-lastSwipe<450) return;
    if(e.target.closest('button, a, .opts, .demo, textarea, iframe')) return;
    var r=stage.getBoundingClientRect(); if((e.clientX-r.left)/r.width<0.3) prev(); else next();
  });
  var sx=0,sy=0,tr=false;
  stage.addEventListener('touchstart',function(e){ if(e.target.closest('textarea')) return; var t=e.touches[0]; sx=t.clientX; sy=t.clientY; tr=true; },{passive:true});
  stage.addEventListener('touchend',function(e){ if(!tr) return; tr=false; var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){ lastSwipe=Date.now(); if(dx<0) next(); else prev(); } },{passive:true});
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='TEXTAREA') return;
    if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter')) return;
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
    else if(e.key==='Home') go(0); else if(e.key==='End') go(N-1);
  });
  [].forEach.call(document.querySelectorAll('[data-quiz]'),function(q){
    var opts=q.querySelector('.opts'), fb=q.querySelector('.fb');
    [].forEach.call(opts.querySelectorAll('.opt'),function(b){
      b.addEventListener('click',function(e){
        e.stopPropagation(); if(opts.classList.contains('done')) return;
        opts.classList.add('done'); answered++;
        var ok=b.getAttribute('data-ok')==='1'; if(ok) correct++; else b.classList.add('wrong');
        opts.querySelector('[data-ok="1"]').classList.add('right');
        fb.innerHTML='<span class="tag" style="color:'+(ok?'var(--green)':'var(--pink)')+'">'+(ok?'✓ Correct.':'✗ Not quite.')+'</span> '+fb.getAttribute(ok?'data-right':'data-wrong')+'<br><span style="color:var(--dim);font-size:12px">Tap or swipe to continue →</span>';
        fb.classList.add('show');
      });
    });
  });
  function updateScore(){ var s=$('score'); s.textContent=answered?('Quiz score: '+correct+' / '+NQ+(answered<NQ?' ('+(NQ-answered)+' skipped)':'')):''; }

  var start=parseInt((location.hash||'').slice(1),10); go(isNaN(start)?0:start-1);
})();
</script>
