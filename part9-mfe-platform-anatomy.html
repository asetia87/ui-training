<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07080d"><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Part 9 · Anatomy of a real-world micro-frontend platform</title><style>
:root{
  --bg:#07080d; --panel:#121622; --panel2:#181d2b; --line:#2a3145; --text:#eef1f8; --muted:#a3acc2; --dim:#5d6680;
  --html:#ff7a45; --css:#4ea8ff; --js:#f7d046; --green:#3ddc97; --purple:#a78bfa; --pink:#ff5c8a; --cyan:#4ee6e0;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
.app{position:fixed;inset:0;display:flex;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#141a2e 0,transparent 60%),var(--bg)}
.stage{position:relative;width:100%;max-width:460px;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y}
@media (min-width:600px){.stage{height:min(100%,900px);margin:auto;border-radius:28px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 300px at 85% 10%,rgba(167,139,250,.10),transparent 70%),radial-gradient(500px 300px at 0% 90%,rgba(78,168,255,.08),transparent 70%);pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
.segs{display:flex;gap:3px}
.seg{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--css),var(--purple));transition:width .35s ease}
.seg.done i{width:100%}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.meta b{color:var(--text);font-weight:600}
.card{position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 58px) 22px calc(env(safe-area-inset-bottom) + 64px);display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(40px) scale(.98);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s linear .45s}
.card.past{transform:translateX(-40px) scale(.98)}
.card.active{opacity:1;visibility:visible;transform:none;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
.kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);margin-bottom:6px}
.visual{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;margin:4px 0 14px}
.visual svg{width:100%;height:100%;max-height:330px;overflow:visible}
h1,h2{margin:0 0 10px;line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(30px,9vw,40px)}
h2{font-size:clamp(22px,6.4vw,28px)}
p{margin:0 0 8px;font-size:clamp(15px,4.2vw,17px);line-height:1.5;color:var(--muted)}
p b,p strong{color:var(--text);font-weight:600}
code,.mono{font-family:var(--mono);font-size:.9em}
p code,.analogy code{background:#1b2131;border:1px solid var(--line);padding:1px 5px;border-radius:6px;color:#dfe5f5}
.analogy{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,rgba(78,168,255,.10),rgba(167,139,250,.10));border:1px solid rgba(120,140,255,.25);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;color:#cfd6ea;margin-top:6px}
.analogy::before{content:"⚙";font-size:15px;color:var(--css);line-height:1.3}
.analogy b{color:#fff}
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:0 14px calc(env(safe-area-inset-bottom) + 12px)}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(18,22,34,.8);color:var(--text);font-size:20px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
.nav:disabled{opacity:.3}
.hint{font-size:12px;color:var(--dim)}
svg *{transform-box:fill-box;transform-origin:center}
.active .pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.35) both;animation-delay:var(--d,0s)}
.active .fade{animation:fade .6s ease both;animation-delay:var(--d,0s)}
.active .rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.growx{transform-origin:left center}
.active .growx{animation:growx .6s ease both;animation-delay:var(--d,0s)}
.active .draw{stroke-dasharray:var(--len,300);animation:draw 1s ease both;animation-delay:var(--d,0s)}
.flow{stroke-dasharray:4 6;animation:flow 1s linear infinite}
.pulse{animation:pulse 2s ease-in-out infinite;animation-delay:var(--pd,0s)}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:var(--len,300)}to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes goR{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(60px);opacity:0}}
@keyframes goL{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(-72px);opacity:0}}
.req{animation:goR 2.4s ease-in-out infinite}
.chunk{opacity:0;animation:goL 2.4s linear infinite;animation-delay:var(--d,0s)}
.titlebadge{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;margin-bottom:14px;align-self:flex-start;background:rgba(255,255,255,.03)}
.titlebadge i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.tapme{margin-top:6px;font-size:13px;color:var(--dim);animation:pulse 1.8s infinite}
.grad{background:linear-gradient(90deg,var(--html),var(--js) 35%,var(--css) 70%,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.lay{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.lay-frame{width:100%;border:1px solid var(--line);border-radius:14px;padding:8px;background:#0d111b;display:flex;flex-direction:column;gap:6px;animation:resize 5s ease-in-out infinite alternate;position:relative}
@keyframes resize{0%,15%{width:100%}85%,100%{width:52%}}
.lay .b{border-radius:8px;font:600 11px/1 var(--mono);display:flex;align-items:center;justify-content:center;color:#0b0e16;padding:0 4px;overflow:hidden;white-space:nowrap}
.lay .hdr{height:26px;background:var(--css)}
.lay-row{display:flex;gap:6px}
.lay .side{flex:0 0 26%;height:54px;background:var(--purple)}
.lay .main{flex:1;height:54px;background:var(--green)}
.lay-cards{display:flex;flex-wrap:wrap;gap:6px}
.lay .c{flex:1 1 64px;height:30px;background:var(--js)}
.ruler{font:12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.ruler span{display:inline-block;height:2px;width:40px;background:linear-gradient(90deg,var(--pink),var(--js));border-radius:2px}
.comp{position:relative;width:250px;height:230px;perspective:800px}
.comp-in{position:absolute;inset:0;transform-style:preserve-3d}
.layer{position:absolute;left:25px;top:30px;width:200px;height:170px;border-radius:14px;border:1px solid rgba(255,255,255,.18);transform-origin:center;animation:explode 6s ease-in-out infinite;--z:0px;display:flex;align-items:flex-end;justify-content:flex-end;padding:8px;font:600 10px var(--mono);color:rgba(255,255,255,.85)}
.l1{--z:-60px;background-color:#151b30;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:16px 16px}
.l2{--z:0px;background:rgba(78,168,255,.18)}
.l2::before{content:"";position:absolute;left:66px;top:16px;width:112px;height:10px;border-radius:5px;background:rgba(255,255,255,.75);box-shadow:0 22px 0 rgba(255,255,255,.4),0 40px 0 rgba(255,255,255,.4),0 58px 0 rgba(255,255,255,.4),0 86px 0 -1px rgba(61,220,151,.7)}
.l3{--z:60px;width:56px;background:rgba(167,139,250,.6);animation-name:explode3;align-items:flex-start;justify-content:center;padding-top:10px;text-align:center}
@keyframes explode{0%,22%,100%{transform:rotateX(56deg) rotateZ(-38deg) translateZ(var(--z))}48%,80%{transform:rotateX(0) rotateZ(0) translateZ(0)}}
@keyframes explode3{0%,22%,100%{transform:rotateX(56deg) rotateZ(-38deg) translateZ(var(--z))}48%{transform:translateX(-60px)}62%,80%{transform:translateX(0)}}
.comp-tag{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font:12px var(--mono);color:var(--muted)}
.cost{width:100%;display:grid;grid-template-columns:92px repeat(5,1fr);gap:6px;font-size:10.5px;align-items:center}
.cost .h{color:var(--dim);text-align:center;font-weight:600;letter-spacing:.02em}
.cost .lbl{font:600 11px var(--mono);color:var(--text);line-height:1.3}
.cost .lbl small{display:block;color:var(--dim);font-weight:400}
.cell{height:30px;border-radius:8px;background:#151a27;border:1px dashed #262d40}
.cell.on{background:var(--c);border:0;box-shadow:0 0 14px var(--c)}
.active .cell.on{animation:light .45s ease both;animation-delay:var(--d,0s)}
@keyframes light{from{opacity:.1;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.costtag{grid-column:2/7;font-size:11px;color:var(--muted);text-align:right;margin-top:-2px}
.qcode{font:13px/1.55 var(--mono);background:#0d111b;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0 14px;color:#cdd5ea;white-space:pre;overflow-x:auto}
.qcode .k{color:var(--purple)}.qcode .s{color:var(--green)}.qcode .t{color:var(--html)}.qcode .c{color:var(--dim)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:15px;line-height:1.35;cursor:pointer;transition:transform .15s,border-color .2s,background .2s,opacity .2s}
.opt:active{transform:scale(.98)}
.opt:focus-visible{outline:2px solid var(--css)}
.opt .l{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#1e2436;font:700 12px var(--mono);color:var(--muted)}
.opt code{font-size:13px}
.opt.right{border-color:var(--green);background:rgba(61,220,151,.12)}
.opt.right .l{background:var(--green);color:#06210f}
.opt.wrong{border-color:var(--pink);background:rgba(255,92,138,.12);animation:shake .4s}
.opt.wrong .l{background:var(--pink);color:#2a0612}
.opts.done .opt:not(.right):not(.wrong){opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.fb{margin-top:12px;font-size:14px;line-height:1.45;color:var(--muted);opacity:0;transform:translateY(8px);transition:.3s}
.fb.show{opacity:1;transform:none}
.fb b{color:var(--text)}
.fb code{background:#1b2131;padding:1px 4px;border-radius:5px;color:#dfe5f5}
.fb .tag{display:inline-block;font-weight:800;margin-right:4px}
.qspacer{flex:1}
.rx{width:100%;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.rx-row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.rx-box{flex:1;background:#0d111b;border:1px solid var(--line);border-radius:12px;padding:10px 8px;font:11px/1.4 var(--mono);color:#cdd5ea;min-height:62px;display:flex;flex-direction:column;justify-content:center}
.rx-box .cap{font:700 9px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.rx-arrow{color:var(--purple);font:700 13px var(--mono);flex:0 0 auto}
.rx-f{flex:0 0 auto;background:linear-gradient(135deg,rgba(167,139,250,.25),rgba(78,168,255,.2));border:1px solid rgba(167,139,250,.5);border-radius:12px;padding:10px 7px;font:700 12px var(--mono)}
.rx-ui{background:#f5f6fa;color:#141824;border-radius:14px;padding:9px 10px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);min-height:62px}
.rx-ui .bar{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.rx-ui .badge{background:#ff5c1a;color:#fff;border-radius:999px;padding:1px 8px;font-size:11px}
.rx-ui ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.rx-ui li{background:#e7e9f2;border-radius:6px;padding:3px 6px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px #3ddc97}100%{box-shadow:0 0 0 0 transparent}}
.rx-note{font-size:12px;color:var(--dim);text-align:center}
.btn{all:unset;cursor:pointer;align-self:center;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,var(--purple),var(--css));color:#fff;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(120,120,255,.35)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--text);align-self:flex-start}
.flowchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;width:100%}
.chip{padding:7px 10px;border-radius:10px;font:700 12px var(--mono);color:#0b0e16;display:inline-block}
.arr{color:var(--dim);font-size:12px}
.take{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px;width:100%}
.take li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.4;color:#cfd6ea}
.take li b{color:#fff}
.score{font-size:13px;color:var(--muted);margin-top:10px}
.next-tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.next-tags span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);font-family:var(--mono)}
@media (max-height:700px){.visual svg{max-height:230px}.qcode{font-size:12px;padding:8px 10px;margin:4px 0 8px}.opt{padding:10px 12px}.analogy{font-size:13px;padding:8px 10px}p{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ---- lesson 1b additions ---- */
.net{width:100%;background:#0d111b;border:1px solid var(--line);border-radius:12px;overflow:hidden;font:10.5px/1.2 var(--mono)}
.net-h,.net-r{display:grid;grid-template-columns:1.35fr 46px 40px 1fr;gap:6px;align-items:center;padding:6px 9px}
.net-h{color:var(--dim);font:700 8.5px system-ui;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line);background:#121622}
.net-r{border-bottom:1px solid #161b28;color:#cdd5ea}
.net-r:last-of-type{border-bottom:0}
.net-r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net-r .t{color:var(--muted);font-size:9.5px}
.net-r .z{color:var(--muted);text-align:right;font-size:9.5px}
.net-r.dim{color:#59627a}.net-r.dim .t,.net-r.dim .z{color:#454d63}.net-r.dim .wf i{opacity:.35}
.net-r.hl{background:rgba(78,168,255,.09);box-shadow:inset 3px 0 0 var(--css)}
.wf{position:relative;height:9px;background:repeating-linear-gradient(90deg,transparent 0 19.6%,#1a2030 19.6% 20%)}
.wf i{position:absolute;top:0;height:100%;border-radius:3px;left:var(--s);width:var(--w);background:var(--c);transform-origin:left center}
.active .net-r{animation:rise .4s ease both;animation-delay:var(--d,0s)}
.active .wf i{animation:growx .5s ease both;animation-delay:calc(var(--d,0s) + .15s)}
.net-foot{padding:5px 9px;color:var(--dim);font-size:9px;display:flex;justify-content:space-between;border-top:1px solid var(--line);background:#121622}
.netwrap{width:100%;display:flex;flex-direction:column;gap:10px}
.cb{width:100%;font:11.5px/1.5 var(--mono);background:#0d111b;border:1px solid var(--line);border-radius:12px;color:#cdd5ea;overflow:hidden}
.cb pre{margin:0;padding:9px 11px;white-space:pre;overflow-x:auto;font:inherit}
.cb-h{display:flex;justify-content:space-between;align-items:center;padding:5px 11px;background:#121622;border-bottom:1px solid var(--line);font:700 9px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.cb-h .tagc{font:700 9.5px var(--mono);letter-spacing:0;text-transform:none;padding:2px 7px;border-radius:999px}
.k{color:var(--purple)}.s{color:var(--green)}.t{color:var(--html)}.c{color:var(--dim)}.y{color:var(--js)}.bl{color:var(--css)}
.mk{background:rgba(247,208,70,.18);color:var(--js);border-radius:4px;padding:0 2px}
.stack{width:100%;display:flex;flex-direction:column;gap:8px}
.down{align-self:center;color:var(--purple);font:700 13px var(--mono);line-height:1}
/* phone mock */
.phone{width:178px;height:300px;border-radius:26px;border:2px solid #2a3145;background:#0b0e16;padding:12px 10px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.5);flex:0 0 auto;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.url{font:10px var(--mono);background:#181d2b;border-radius:8px;padding:6px 8px;color:var(--muted);white-space:nowrap;overflow:hidden}

.swap-a{animation:none}
.active .later{animation:fade .5s ease both;animation-delay:var(--d,1.5s)}

/* comparison table */
.vs{width:100%;display:grid;grid-template-columns:76px 1fr 1fr;gap:5px;font-size:12px;line-height:1.3}
.vs div{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 8px;color:#cfd6ea}

.trio{width:100%;display:flex;flex-direction:column;gap:7px}

.find{font-size:12px;color:var(--muted);text-align:center}

<script>var CARDS = [{"sect":1,"num":"UI","kicker":"Part 9 · Micro-frontends in production","h":"Anatomy of a <span class=\"grad\">real-world micro-frontend platform<\/span>","p":"The parts every large MFE platform ends up building: an app shell, a registry, routing ownership, custom-element boundaries, shared SDKs, a design system, dev overrides, CDN hosting and CI/CD.","first":true,"badge":"~30 min · 51 cards · 7 quizzes"},{"sect":1,"num":"1","kicker":"Section 1","h":"The big picture","p":"What sits on the page, who owns each part, and the different ways to compose MFEs."},{"k":"Section 1 · Overview","h":"The whole platform on one screen","v":"<svg viewBox=\"0 0 320 230\"><rect class=\"pop\" x=\"6\" y=\"6\" width=\"308\" height=\"150\" rx=\"14\" fill=\"#121622\" stroke=\"#a78bfa\"/><text x=\"18\" y=\"24\" fill=\"#a78bfa\" font-size=\"10\" font-weight=\"700\">APP SHELL (platform team)<\/text><rect class=\"rise\" x=\"18\" y=\"32\" width=\"284\" height=\"20\" rx=\"6\" fill=\"rgba(78,168,255,.2)\"/><text x=\"160\" y=\"46\" fill=\"#fff\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">top nav · auth · router · error boundary<\/text><rect class=\"rise\" style=\"--d:.3s\" x=\"18\" y=\"60\" width=\"60\" height=\"86\" rx=\"8\" fill=\"rgba(167,139,250,.18)\"/><text x=\"48\" y=\"106\" fill=\"#fff\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">side nav<\/text><rect class=\"rise\" style=\"--d:.6s\" x=\"86\" y=\"60\" width=\"216\" height=\"86\" rx=\"8\" fill=\"rgba(61,220,151,.14)\" stroke=\"#3ddc97\" stroke-dasharray=\"4 3\"/><text x=\"194\" y=\"98\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-family=\"monospace\">&lt;orders-app&gt;<\/text><text x=\"194\" y=\"114\" fill=\"#a3acc2\" font-size=\"8\" text-anchor=\"middle\">MFE owned by the Orders team<\/text><g class=\"rise\" style=\"--d:.9s\"><rect x=\"6\" y=\"172\" width=\"96\" height=\"50\" rx=\"10\" fill=\"#13243a\" stroke=\"#4ea8ff\"/><text x=\"54\" y=\"194\" fill=\"#fff\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">registry.json<\/text><text x=\"54\" y=\"208\" fill=\"#a3acc2\" font-size=\"8\" text-anchor=\"middle\">who · where<\/text><\/g><g class=\"rise\" style=\"--d:1.1s\"><rect x=\"112\" y=\"172\" width=\"96\" height=\"50\" rx=\"10\" fill=\"#2a2510\" stroke=\"#f7d046\"/><text x=\"160\" y=\"194\" fill=\"#fff\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">shared SDK<\/text><text x=\"160\" y=\"208\" fill=\"#a3acc2\" font-size=\"8\" text-anchor=\"middle\">http · events · flags<\/text><\/g><g class=\"rise\" style=\"--d:1.3s\"><rect x=\"218\" y=\"172\" width=\"96\" height=\"50\" rx=\"10\" fill=\"#3a1624\" stroke=\"#ff5c8a\"/><text x=\"266\" y=\"194\" fill=\"#fff\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">CDN<\/text><text x=\"266\" y=\"208\" fill=\"#a3acc2\" font-size=\"8\" text-anchor=\"middle\">static assets<\/text><\/g><\/svg>","p":"The <b>shell<\/b> owns the frame and cross-cutting concerns. <b>Feature MFEs<\/b> plug into slots. A <b>registry<\/b> says which MFE lives where, <b>SDK packages<\/b> give every MFE the same building blocks, and a <b>CDN<\/b> serves it all as static files."},{"k":"Section 1 · Ownership","h":"Platform team vs feature teams","v":"<div class=\"vs\"><div class=\"vl\"><\/div><div class=\"vh code\">Platform team owns<\/div><div class=\"vh data\">Feature teams own<\/div><div class=\"vl\">Code<\/div><div class=\"rise\" style=\"--d:0.0s\">Shell, registry, SDKs, design system<\/div><div class=\"rise\" style=\"--d:0.1s\">Their MFE and its API<\/div><div class=\"vl\">Runtime<\/div><div class=\"rise\" style=\"--d:0.2s\">Auth, routing, error handling, telemetry<\/div><div class=\"rise\" style=\"--d:0.3s\">Their routes under a prefix<\/div><div class=\"vl\">Pipeline<\/div><div class=\"rise\" style=\"--d:0.4s\">Build templates, CDN, promotion<\/div><div class=\"rise\" style=\"--d:0.5s\">Their deploys and on-call<\/div><div class=\"vl\">Rules<\/div><div class=\"rise\" style=\"--d:0.6s\">Versions of shared singletons<\/div><div class=\"rise\" style=\"--d:0.7s\">Following the contract<\/div><\/div>","p":"A platform only works if the boundaries are written down. Without that, the shell slowly fills up with feature code and every team has to wait on the platform team again.","an":"Platform team ≈ an internal PaaS team. Feature teams ≈ product service owners deploying onto it."},{"k":"Section 1 · Composition","h":"Four ways to compose a page","v":"<div class=\"vs\"><div class=\"vl\"><\/div><div class=\"vh code\">How<\/div><div class=\"vh data\">Trade-off<\/div><div class=\"vl\">Build time<\/div><div class=\"rise\" style=\"--d:0.0s\">Remotes are npm packages imported by the shell<\/div><div class=\"rise\" style=\"--d:0.1s\">Simple, but every change needs a shell rebuild: not independent<\/div><div class=\"vl\">Server side<\/div><div class=\"rise\" style=\"--d:0.2s\">Edge or server stitches HTML fragments (SSI/ESI)<\/div><div class=\"rise\" style=\"--d:0.3s\">Fast first paint; harder interactivity<\/div><div class=\"vl\">Runtime JS<\/div><div class=\"rise\" style=\"--d:0.4s\">Module Federation, import maps, single-spa<\/div><div class=\"rise\" style=\"--d:0.5s\">Independent deploys; integration happens at runtime<\/div><div class=\"vl\">iframes<\/div><div class=\"rise\" style=\"--d:0.6s\">Each MFE in its own frame<\/div><div class=\"rise\" style=\"--d:0.7s\">Strong isolation; poor UX, hard sizing and routing<\/div><\/div>","p":"Most React platforms choose <b>runtime JS<\/b> (often Module Federation from Part 5) and wrap each MFE behind a stable boundary, often a <b>custom element<\/b>."},{"quiz":true,"k":"Quiz 1 / 7 · Principles","h":"In a shell-and-MFEs platform, who owns the browser URL and top-level routing?","opts":[["Each MFE registers its own BrowserRouter",0],["The shell; MFEs own sub-routes under their prefix",1],["Whichever MFE loaded last",0]],"right":"One owner for the URL: the shell maps prefixes to MFEs, and MFEs route inside their own prefix.","wrong":"The <b>shell<\/b> owns the URL. Several routers fighting over <code>history<\/code> is a classic MFE bug."},{"k":"Section 1 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://martinfowler.com/articles/micro-frontends.html\" target=\"_blank\" rel=\"noopener noreferrer\"><b>Micro Frontends · martinfowler.com<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>Integration approaches compared, including build-time, run-time and iframes.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://single-spa.js.org/docs/getting-started-overview/\" target=\"_blank\" rel=\"noopener noreferrer\"><b>single-spa · Overview<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>A mature framework for root configs, registered applications and lifecycles. Useful vocabulary even if you never use it.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"sect":1,"num":"2","kicker":"Section 2","h":"The MFE registry / manifest","p":"Discovery through data instead of imports: how the shell finds out which MFEs exist and where their code lives."},{"k":"Section 2 · Why","h":"A registry instead of hard-coded URLs","v":"<div class=\"vwrap\"><div class=\"box rise warn\" style=\"--d:0.00s\"><b>Hard-coded<\/b>: <code>remotes: { orders: 'orders@https://cdn/…' }<\/code> in the shell's build. Adding an MFE or moving a URL means a shell release.<\/div><div class=\"box rise ok\" style=\"--d:0.25s\"><b>Registry<\/b>: the shell fetches a JSON document at startup. Adding, moving, rolling back or flagging an MFE is a <b>data change<\/b>.<\/div><\/div>","p":"The registry turns \"deploy\" into two separate steps: <b>upload<\/b> immutable assets, then <b>point<\/b> at them. That separation is what makes promotion and rollback fast.","an":"Service discovery (Consul, Eureka, Kubernetes Services) for UI bundles."},{"k":"Section 2 · Format","h":"What a registry entry looks like","cmp":[["JSON","{\n  \"version\": 3,\n  \"mfes\": [\n    {\n      \"id\": \"orders\",\n      \"route\": \"/orders\",\n      \"element\": \"orders-app\",\n      \"entry\": \"https://cdn.example.com/orders/1.42.0/mf-manifest.json\",\n      \"owner\": \"team-orders\",\n      \"flags\": [\"orders-v2\"],\n      \"integrity\": \"sha384-…\"\n    },\n    { \"id\": \"account\", \"route\": \"/account\", \"element\": \"account-app\",\n      \"entry\": \"https://cdn.example.com/account/7.3.1/remoteEntry.js\" }\n  ]\n}","registry.json (per environment)"]],"p":"Typical fields: a stable <b>id<\/b>, the <b>route prefix<\/b> it owns, the <b>custom element<\/b> it defines, a <b>versioned entry URL<\/b>, ownership, and optional flags or integrity hashes. Keep one registry per environment (dev, staging, prod)."},{"k":"Section 2 · Load sequence","h":"From URL to rendered MFE","v":"<ol class=\"steps\"><li style=\"--d:0.0s\">Browser loads shell <code>index.html<\/code> (no-cache) + hashed shell bundle<\/li><li style=\"--d:0.7s\">Shell boots auth, fetches <code>registry.json<\/code> for this environment<\/li><li style=\"--d:1.4s\">Router matches <code>/orders/123<\/code> → registry entry <code>orders<\/code><\/li><li style=\"--d:2.1s\">Shell registers the remote and loads its entry/manifest from the CDN<\/li><li style=\"--d:2.8s\">MFE module runs and defines <code>&lt;orders-app&gt;<\/code><\/li><li style=\"--d:3.5s\">Shell renders <code>&lt;orders-app base-path=\"/orders\"&gt;<\/code> inside an error boundary<\/li><li style=\"--d:4.2s\">MFE reads context from the SDK and routes to <code>/123<\/code> internally<\/li><\/ol>","p":"Each step can fail on its own. Good shells show a <b>specific<\/b> fallback for each one: registry unavailable, MFE failed to load, MFE crashed."},{"k":"Section 2 · Gotchas","h":"Registry caveats","v":"<div class=\"vwrap\"><div class=\"box rise warn\" style=\"--d:0.00s\"><b>Availability<\/b>: the registry is now on the critical path. Cache it at the edge, and keep a last-known-good copy baked into the shell.<\/div><div class=\"box rise warn\" style=\"--d:0.25s\"><b>Consistency<\/b>: if two MFEs must change together, ship them in one registry update. Treat the update as a transaction.<\/div><div class=\"box rise warn\" style=\"--d:0.50s\"><b>Trust<\/b>: whoever can edit the registry decides what code runs on your domain. Protect writes like production deploy credentials.<\/div><\/div>","p":"A registry is small, but it is effectively the platform's deploy control plane. Review registry changes with the same care as infrastructure changes."},{"quiz":true,"k":"Quiz 2 / 7 · Registry","h":"Who decides which URL an MFE's entry file is fetched from in production?","opts":[["The MFE's own webpack config",0],["The environment's registry, which the shell reads at runtime",1],["The user's browser cache",0]],"right":"The shell asks the <b>registry<\/b>. The MFE build only produces assets; promotion decides which version is live.","wrong":"The <b>registry<\/b> decides. That is what lets you promote or roll back without rebuilding anything."},{"k":"Section 2 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://module-federation.io/configure/manifest.html\" target=\"_blank\" rel=\"noopener noreferrer\"><b>module-federation.io · manifest<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>The mf-manifest.json format many registries point at.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://developer.mozilla.org/en-US/docs/Web/HTML/Element/script/type/importmap\" target=\"_blank\" rel=\"noopener noreferrer\"><b>MDN · Import maps<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>The browser-native way to map module names to URLs, which some platforms use as their registry.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"sect":1,"num":"3","kicker":"Section 3","h":"Routing ownership","p":"One URL and one history, with routes split by prefix between the shell and the MFEs."},{"k":"Section 3 · Prefixes","h":"The shell maps prefixes, MFEs map the rest","v":"<div class=\"vwrap\"><div class=\"url rise\" style=\"font-size:12px\">https://app.example.com<b>/orders<\/b><span style=\"color:var(--green)\">/123/invoice<\/span><\/div><div class=\"g2\"><div class=\"box rise \" style=\"--d:0.00s\"><b>/orders<\/b><br><small>shell → registry → &lt;orders-app&gt;<\/small><\/div><div class=\"box rise ok\" style=\"--d:0.25s\"><b>/123/invoice<\/b><br><small>orders MFE's own router<\/small><\/div><\/div><\/div>","cmp":[["TSX","// shell: build routes from the registry\n{registry.mfes.map(m => (\n  <Route key={m.id} path={m.route + '/*'}\n         element={<MfeSlot entry={m} />} />\n))}\n<Route path=\"*\" element={<NotFound />} />"]],"p":"Deep links and refreshes must work: the CDN or edge serves the shell's <code>index.html<\/code> for <b>every<\/b> path (SPA fallback), then client-side routing takes over."},{"k":"Section 3 · Navigation","h":"Navigating across MFEs","cmp":[["TS","// inside the orders MFE: link to another MFE\nimport { navigate } from '@acme/shell-sdk';\nnavigate('/account/settings');   // shell updates history once, no reload\n\n// NOT this:\nwindow.location.href = '/account/settings'; // full page reload\nhistory.pushState({}, '', '/account');      // shell's router never hears about it","cross-MFE navigation"]],"p":"MFEs shouldn't import each other, so cross-MFE links go through a <b>shell-provided navigate<\/b> (an SDK function or a callback prop). The shell keeps one history and can still apply guards such as \"unsaved changes\"."},{"k":"Section 3 · Gotchas","h":"Routing caveats","v":"<div class=\"vwrap\"><div class=\"box rise warn\" style=\"--d:0.00s\"><b>Nested BrowserRouter<\/b> inside an MFE: two routers on one history, so back-button glitches and stale UI.<\/div><div class=\"box rise warn\" style=\"--d:0.25s\"><b>Absolute links<\/b> (<code>to=\"/123\"<\/code>) in an MFE ignore its mount prefix. Use relative paths or the provided base path.<\/div><div class=\"box rise warn\" style=\"--d:0.50s\"><b>Prefix collisions<\/b>: two registry entries claiming <code>/settings<\/code>. Validate uniqueness when the registry is built.<\/div><\/div>","p":"Some MFEs run inside their own <b>memory router<\/b> and sync only to the shell. That works, but it makes deep linking a deliberate extra feature."},{"quiz":true,"k":"Quiz 3 / 7 · Routing","h":"An agent-written MFE uses <code>window.location.href = '/account'<\/code> for a button. Review comment?","opts":[["Fine, it navigates",0],["Use the shell's navigate API: this forces a full reload and bypasses shell guards",1],["Wrap it in useEffect",0]],"right":"A full reload throws away shell state and re-downloads everything. Use the platform's navigation contract.","wrong":"It works, but it <b>reloads the whole app<\/b>. Ask for the shell's <code>navigate<\/code> (or a callback prop)."},{"sect":1,"num":"4","kicker":"Section 4","h":"Custom elements as the boundary","p":"Web Components give every MFE a framework-neutral, HTML-shaped API."},{"k":"Section 4 · Why","h":"A framework-agnostic contract","v":"<div class=\"vwrap\"><div class=\"box rise\" style=\"--d:0.00s\"><b>Stable API<\/b>: attributes, properties and DOM events. Every framework and plain HTML can use them.<\/div><div class=\"box rise\" style=\"--d:0.25s\"><b>Lifecycle<\/b>: the browser calls <code>connectedCallback<\/code> / <code>disconnectedCallback<\/code> when the element is added or removed, which is where the MFE mounts and unmounts React.<\/div><div class=\"box rise\" style=\"--d:0.50s\"><b>Version freedom<\/b>: in theory an MFE could use a different React (or Vue) inside, because the shell only sees <code>&lt;orders-app&gt;<\/code>.<\/div><div class=\"box rise\" style=\"--d:0.75s\"><b>Optional isolation<\/b>: Shadow DOM scopes CSS when you need hard isolation.<\/div><\/div>","p":"The shell doesn't need to know how an MFE is built, only that loading its entry defines a custom element.","an":"The custom element is the MFE's <b>interface<\/b>. Everything inside it is the implementation."},{"k":"Section 4 · Code","h":"Wrapping a React app in a custom element","cmp":[["TSX","// orders/src/element.tsx (exposed by the MFE)\nimport { createRoot, Root } from 'react-dom/client';\nimport { OrdersApp } from './OrdersApp';\n\nclass OrdersElement extends HTMLElement {\n  static observedAttributes = ['base-path'];\n  private root?: Root;\n\n  connectedCallback() {               // added to the DOM → mount\n    this.root = createRoot(this);\n    this.render();\n  }\n  attributeChangedCallback() { this.render(); }\n  disconnectedCallback() {            // removed → unmount, free memory\n    this.root?.unmount();\n    this.root = undefined;\n  }\n  private render() {\n    this.root?.render(<OrdersApp basePath={this.getAttribute('base-path') ?? '/'} />);\n  }\n}\nif (!customElements.get('orders-app')) customElements.define('orders-app', OrdersElement);","element.tsx"]],"p":"Three details matter: mount in <code>connectedCallback<\/code>, <b>unmount<\/b> in <code>disconnectedCallback<\/code>, and guard <code>define<\/code>, because defining the same tag twice throws."},{"k":"Section 4 · Data in/out","h":"Attributes, properties, events","v":"<div class=\"vs\"><div class=\"vl\"><\/div><div class=\"vh code\">Mechanism<\/div><div class=\"vh data\">Use for<\/div><div class=\"vl\">Attributes<\/div><div class=\"rise\" style=\"--d:0.0s\"><code>&lt;x base-path=\"/o\"&gt;<\/code><\/div><div class=\"rise\" style=\"--d:0.1s\">Strings only: config, ids<\/div><div class=\"vl\">Properties<\/div><div class=\"rise\" style=\"--d:0.2s\"><code>el.user = {…}<\/code><\/div><div class=\"rise\" style=\"--d:0.3s\">Objects, functions, rich data<\/div><div class=\"vl\">Events<\/div><div class=\"rise\" style=\"--d:0.4s\"><code>dispatchEvent(new CustomEvent('order:saved', {bubbles:true, composed:true}))<\/code><\/div><div class=\"rise\" style=\"--d:0.5s\">Telling the shell something happened<\/div><\/div>","p":"<code>composed: true<\/code> lets the event cross a shadow root boundary. Without it, listeners outside the shadow DOM never fire. In React 19, JSX passes rich props to custom elements as properties; older React versions need a ref to set properties."},{"k":"Section 4 · Shadow DOM","h":"To shadow or not to shadow","v":"<div class=\"vs\"><div class=\"vl\"><\/div><div class=\"vh code\">Light DOM<\/div><div class=\"vh data\">Shadow DOM<\/div><div class=\"vl\">CSS<\/div><div class=\"rise\" style=\"--d:0.0s\">Global styles apply (and leak)<\/div><div class=\"rise\" style=\"--d:0.1s\">Isolated both ways<\/div><div class=\"vl\">Design system<\/div><div class=\"rise\" style=\"--d:0.2s\">Just works<\/div><div class=\"rise\" style=\"--d:0.3s\">Must inject styles into each root<\/div><div class=\"vl\">Portals/modals<\/div><div class=\"rise\" style=\"--d:0.4s\">Work normally<\/div><div class=\"rise\" style=\"--d:0.5s\">Need a target inside the root<\/div><div class=\"vl\">Testing/a11y<\/div><div class=\"rise\" style=\"--d:0.6s\">Familiar<\/div><div class=\"rise\" style=\"--d:0.7s\">Testing tools must pierce the shadow root<\/div><\/div>","p":"Many platforms start in <b>light DOM with scoped class names<\/b> and use Shadow DOM only for MFEs embedded into pages they don't control."},{"quiz":true,"k":"Quiz 4 / 7 · Lifecycle","h":"Users navigate between MFEs and memory keeps climbing. The custom element has no <code>disconnectedCallback<\/code>. Why does it leak?","opts":[["Custom elements can't be garbage collected",0],["The React root is never unmounted, so its tree, listeners and timers stay alive",1],["The CDN caches too much",0]],"right":"Without <code>root.unmount()<\/code>, React never runs effect cleanups and keeps the whole tree in memory.","wrong":"Removing the element from the DOM doesn't unmount React. <b>Unmount in disconnectedCallback<\/b> so effects clean up."},{"k":"Section 4 · Review","h":"What AI often gets wrong","v":"<div class=\"vwrap\"><div class=\"box warn rise\" style=\"--d:0.00s\"><b>No unmount<\/b> in <code>disconnectedCallback<\/code>, or creating a new root on every <code>connectedCallback<\/code> without unmounting the old one.<\/div><div class=\"box warn rise\" style=\"--d:0.25s\"><b>Unguarded <code>customElements.define<\/code><\/b>: hot reload or a double load throws \"already been defined\".<\/div><div class=\"box warn rise\" style=\"--d:0.50s\"><b>Passing objects as attributes<\/b> (<code>user=\"[object Object]\"<\/code>) instead of properties.<\/div><div class=\"box warn rise\" style=\"--d:0.75s\"><b>Events without <code>bubbles<\/code>/<code>composed<\/code><\/b>, so the shell's listener never fires.<\/div><\/div>","p":"Look for these in AI-written diffs. They compile, they often pass a quick test, and they break later."},{"k":"Section 4 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://developer.mozilla.org/en-US/docs/Web/API/Web_components/Using_custom_elements\" target=\"_blank\" rel=\"noopener noreferrer\"><b>MDN · Using custom elements<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>Lifecycle callbacks, observed attributes, and autonomous vs customised elements.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://developer.mozilla.org/en-US/docs/Web/API/Web_components/Using_shadow_DOM\" target=\"_blank\" rel=\"noopener noreferrer\"><b>MDN · Using shadow DOM<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>Shadow roots, style encapsulation and composed events.<\/small><\/a><a class=\"box rise\" style=\"--d:0.4s;text-decoration:none;display:block\" href=\"https://frontendmasters.com/courses/web-components/\" target=\"_blank\" rel=\"noopener noreferrer\"><b>Frontend Masters · Web Components (Dave Rupert)<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>A video course on building and styling real web components.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"sect":1,"num":"5","kicker":"Section 5","h":"Shared SDK packages and the design system","p":"The building blocks every MFE gets from the platform, so teams don't each reinvent auth, HTTP and buttons."},{"k":"Section 5 · SDK","h":"What a platform SDK usually contains","v":"<div class=\"g2\"><div class=\"box rise \" style=\"--d:0.00s\"><b>@acme/http<\/b><br><small>fetch wrapper: base URL, auth, retries, error shape<\/small><\/div><div class=\"box rise \" style=\"--d:0.25s\"><b>@acme/shell-sdk<\/b><br><small>navigate, current user, tenant, locale<\/small><\/div><div class=\"box rise \" style=\"--d:0.50s\"><b>@acme/events<\/b><br><small>typed pub/sub between MFEs<\/small><\/div><div class=\"box rise \" style=\"--d:0.75s\"><b>@acme/flags<\/b><br><small>feature-flag client<\/small><\/div><div class=\"box rise \" style=\"--d:1.00s\"><b>@acme/telemetry<\/b><br><small>logs, metrics, errors tagged with MFE id<\/small><\/div><div class=\"box rise \" style=\"--d:1.25s\"><b>@acme/i18n<\/b><br><small>translations, number and date formatting<\/small><\/div><\/div>","p":"Published to the private registry and declared as <b>shared singletons<\/b> in Module Federation, so there is one instance, and therefore one auth state and one event bus, on the page."},{"k":"Section 5 · HTTP","h":"Calling APIs the platform way","cmp":[["TS","// GOOD: platform client handles base URL, auth, errors\nimport { http } from '@acme/http';\nexport const getOrder = (id: string) => http.get<Order>(`/orders/${id}`);\n\n// BAD (typical AI output):\nconst token = localStorage.getItem('token');            // XSS-readable secret\nfetch('https://api.example.com/v1/orders/' + id, {      // hard-coded host\n  headers: { Authorization: 'Bearer ' + token },\n}).then(r => r.json());                                 // no error handling","orders/api.ts"]],"p":"The platform client usually relies on <b>HttpOnly cookies<\/b> or a token held in memory by the shell, and knows the right API host for each environment. Hand-rolled fetches drift from that: wrong host in staging, no refresh, no consistent error handling."},{"k":"Section 5 · Flags","h":"Feature flags in MFEs","cmp":[["TSX","import { useFlag } from '@acme/flags';\n\nfunction OrdersPage() {\n  const v2 = useFlag('orders-v2', false);   // default when the flag service is down\n  return v2 ? <OrdersV2 /> : <OrdersV1 />;\n}","useFlag"]],"p":"Flags let you deploy code dark and turn it on per tenant or per user. Things to check in review: there is a <b>safe default<\/b>, the flag is evaluated through the shared client (not a fetch per component), and an <b>owner and removal date<\/b> are recorded so the flag doesn't live forever."},{"k":"Section 5 · Design system","h":"The design system is a product","v":"<ol class=\"steps\"><li style=\"--d:0.0s\"><b>Tokens<\/b>: colours, spacing and type as CSS variables (<code>--color-primary<\/code>)<\/li><li style=\"--d:0.7s\"><b>Components<\/b>: Button, Modal, DataTable, with accessibility built in<\/li><li style=\"--d:1.4s\"><b>Docs<\/b>: Storybook with usage rules and do/don't examples<\/li><li style=\"--d:2.1s\"><b>Distribution<\/b>: a versioned package, shared as a singleton<\/li><li style=\"--d:2.8s\"><b>Governance<\/b>: contribution model, deprecations, codemods for majors<\/li><\/ol>","p":"Consistent UX across ten teams comes from <b>one<\/b> component library, not from a style guide PDF. Shared at runtime, it also saves bytes and keeps one theme context."},{"k":"Section 5 · Versioning SDKs","h":"Upgrading a shared singleton","v":"<div class=\"vwrap\"><div class=\"box rise ok\" style=\"--d:0.00s\"><b>Minor/patch<\/b>: the shell provides the newest version, and every MFE's <code>^<\/code> range accepts it. No MFE redeploys needed.<\/div><div class=\"box rise warn\" style=\"--d:0.25s\"><b>Major<\/b>: MFEs built against v4 may break on v5. Plan it: publish v5, MFEs widen their ranges and test, then the shell switches.<\/div><div class=\"box rise ok\" style=\"--d:0.50s\"><b>Skew budget<\/b>: a policy like \"every MFE within one major of the shell\" plus a CI check that compares ranges against the shell's versions.<\/div><\/div>","p":"This is version negotiation from Part 5, applied to an organisation: the hard part is coordinating the teams, not the config."},{"quiz":true,"k":"Quiz 5 / 7 · API calls","h":"An agent-written hook calls <code>fetch('https://api.example.com/v1/…')<\/code> with a bearer token read from localStorage. Review?","opts":[["Approve, it works locally",0],["Use the platform HTTP client: no hard-coded host, no token in localStorage, consistent errors",1],["Move the token to sessionStorage",0]],"right":"The SDK client gives you environment-correct hosts, the platform auth model and uniform errors. Tokens in web storage can be read by any XSS.","wrong":"Ask for the <b>platform client<\/b>. sessionStorage has the same XSS exposure as localStorage, and the hard-coded host breaks in other environments."},{"k":"Section 5 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://storybook.js.org/docs\" target=\"_blank\" rel=\"noopener noreferrer\"><b>Storybook · Docs<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>The standard tool for documenting and testing design-system components.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://github.com/changesets/changesets\" target=\"_blank\" rel=\"noopener noreferrer\"><b>Changesets (GitHub)<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>Versioning and changelogs for the SDK and design-system packages in a monorepo.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"sect":1,"num":"6","kicker":"Section 6","h":"Local development and overrides","p":"Running your MFE against the real shell without running the whole platform on your laptop."},{"k":"Section 6 · Modes","h":"Three ways to develop an MFE","v":"<div class=\"vs\"><div class=\"vl\"><\/div><div class=\"vh code\">How<\/div><div class=\"vh data\">Good for<\/div><div class=\"vl\">Standalone<\/div><div class=\"rise\" style=\"--d:0.0s\">MFE's own dev server + a mock shell (fake user, router)<\/div><div class=\"rise\" style=\"--d:0.1s\">Fast UI work, unit tests<\/div><div class=\"vl\">Override<\/div><div class=\"rise\" style=\"--d:0.2s\">Real deployed shell (staging), but <b>your<\/b> MFE from localhost<\/div><div class=\"rise\" style=\"--d:0.3s\">Integration with real auth, nav and other MFEs<\/div><div class=\"vl\">Full local<\/div><div class=\"rise\" style=\"--d:0.4s\">Shell + several MFEs locally<\/div><div class=\"rise\" style=\"--d:0.5s\">Platform work, cross-MFE changes<\/div><\/div>","p":"<b>Override mode<\/b> is what makes large platforms practical: you run one dev server and everything else comes from staging."},{"k":"Section 6 · Overrides","h":"How an override works","v":"<ol class=\"steps\"><li style=\"--d:0.0s\">Open staging shell, run <code>localStorage.setItem('mfe-override:orders', 'http://localhost:3001/mf-manifest.json')<\/code> (or use an override UI)<\/li><li style=\"--d:0.7s\">Shell loads registry.json as usual<\/li><li style=\"--d:1.4s\">Before loading <code>orders<\/code>, it checks for an override and uses <b>your<\/b> URL<\/li><li style=\"--d:2.1s\">Your local MFE loads into the real page, with HMR<\/li><li style=\"--d:2.8s\">Clear the override when you're done<\/li><\/ol>","cmp":[["TS","function resolveEntry(m: RegistryEntry) {\n  const o = allowOverrides() && localStorage.getItem('mfe-override:' + m.id);\n  return o || m.entry;\n}","shell: resolveEntry"]],"p":"The same idea appears as <b>import-map-overrides<\/b> (single-spa), MF runtime plugins, and browser extensions."},{"k":"Section 6 · Safety","h":"Overrides are a security feature too","v":"<div class=\"vwrap\"><div class=\"box rise warn\" style=\"--d:0.00s\"><b>Risk<\/b>: an override means \"run code from this URL on our origin\". If it works in production, a phishing link could set one.<\/div><div class=\"box rise ok\" style=\"--d:0.25s\"><b>Guards<\/b>: enable only in non-prod or for authenticated internal users, allow-list hosts (<code>localhost<\/code>, preview domains), show a visible banner while active.<\/div><div class=\"box rise ok\" style=\"--d:0.50s\"><b>CSP<\/b>: a Content-Security-Policy <code>script-src<\/code> allow-list is the final backstop.<\/div><\/div>","p":"Review any change to override logic as a security change."},{"quiz":true,"k":"Quiz 6 / 7 · Preview","h":"A reviewer wants to click through your branch on staging without deploying a whole stack. Lightest path?","opts":[["Deploy a copy of the shell and every MFE",0],["A per-PR preview deploy of your MFE, loaded into staging via an override link",1],["Send screenshots",0]],"right":"Preview assets plus an override reuse the real staging shell and every other MFE. Only your bundle differs.","wrong":"Use a <b>preview deploy + override<\/b>. It is cheap, realistic, and doesn't need any infrastructure per branch."},{"k":"Section 6 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://github.com/single-spa/import-map-overrides\" target=\"_blank\" rel=\"noopener noreferrer\"><b>import-map-overrides (GitHub)<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>A widely used, well-documented implementation of the override pattern, with a dev-tools UI.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP\" target=\"_blank\" rel=\"noopener noreferrer\"><b>MDN · Content Security Policy<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>How script-src limits where code can be loaded from.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"sect":1,"num":"7","kicker":"Section 7","h":"CDN/edge hosting and CI/CD","p":"MFEs are static files. Deploying them means uploading files, then updating a pointer in the registry."},{"k":"Section 7 · Hosting","h":"Static assets on a CDN","v":"<div class=\"cb rise\"><div class=\"cb-h\">bucket layout <span class=\"tagc\" style=\"background:#1a2a1a;color:#3ddc97\">immutable<\/span><\/div><pre>cdn.example.com/\n  orders/1.41.0/mf-manifest.json\n  orders/1.41.0/src_Orders.ab12.js\n  orders/<span class=\"y\">1.42.0<\/span>/mf-manifest.json   <span class=\"c\">// new upload<\/span>\n  orders/<span class=\"y\">1.42.0<\/span>/src_Orders.c3d4.js\nregistry/prod.json  → orders: 1.42.0     <span class=\"c\">// the only mutable file<\/span><\/pre><\/div>","p":"Version folders are <b>never overwritten<\/b>, so they can be cached forever. Only the registry and the shell's <code>index.html<\/code> are mutable and served with <code>no-cache<\/code>. Old versions stay available for open tabs and rollbacks.","an":"Like immutable artifact versions in a Maven repo, plus a deploy manifest that points at one of them."},{"k":"Section 7 · Edge","h":"What the edge adds","v":"<div class=\"vwrap\"><div class=\"box rise\" style=\"--d:0.00s\"><b>SPA fallback<\/b>: any unknown path → shell <code>index.html<\/code><\/div><div class=\"box rise\" style=\"--d:0.25s\"><b>Headers<\/b>: CSP, HSTS, cache-control rules per path<\/div><div class=\"box rise\" style=\"--d:0.50s\"><b>Registry per environment or tenant<\/b>, served or composed at the edge<\/div><div class=\"box rise\" style=\"--d:0.75s\"><b>Preview domains<\/b> per PR (<code>pr-123.preview.example.com<\/code>)<\/div><div class=\"box rise\" style=\"--d:1.00s\"><b>Compression<\/b> (Brotli) and HTTP/2/3 close to the user<\/div><\/div>","p":"CDNs such as CloudFront, Cloudflare, Fastly and Akamai, and hosting products built on them, all support this pattern."},{"k":"Section 7 · Pipeline","h":"CI/CD for one MFE","v":"<ol class=\"steps\"><li style=\"--d:0.0s\">PR: install (immutable) → lint → type-check → unit tests → build<\/li><li style=\"--d:0.7s\">Upload <code>orders/pr-123/…<\/code>, post a preview override link on the PR<\/li><li style=\"--d:1.4s\">Contract checks: shared ranges vs the shell, exposes unchanged or additive<\/li><li style=\"--d:2.1s\">Merge: build once, upload <code>orders/1.42.0/<\/code> (immutable)<\/li><li style=\"--d:2.8s\">Promote: update <b>staging<\/b> registry → smoke and E2E tests<\/li><li style=\"--d:3.5s\">Promote: update <b>prod<\/b> registry (optionally to a canary % first)<\/li><li style=\"--d:4.2s\">Watch error rate tagged with MFE id; roll back = repoint<\/li><\/ol>","p":"Note the principle: <b>build once, promote the same artifact<\/b>. Rebuilding for production means production runs something you never tested."},{"k":"Section 7 · Observability","h":"Who gets paged?","v":"<div class=\"vwrap\"><div class=\"box rise \" style=\"--d:0.00s\">Every log, error and metric is tagged with <code>mfe.id<\/code> and <code>mfe.version<\/code> (the telemetry SDK does this).<\/div><div class=\"box rise \" style=\"--d:0.25s\">Error boundaries report which MFE failed to load and which one crashed, separately.<\/div><div class=\"box rise ok\" style=\"--d:0.50s\">The registry's <code>owner<\/code> field routes alerts to the right team.<\/div><div class=\"box rise \" style=\"--d:0.75s\">Core Web Vitals per route show which MFE made the page slow.<\/div><\/div>","p":"Without per-MFE tagging, every frontend error ends up with the platform team, which defeats the point of team ownership."},{"quiz":true,"k":"Quiz 7 / 7 · Rollback","h":"Orders 1.42.0 is live and errors spike. With the setup above, fastest safe rollback?","opts":[["Revert the commit and wait for a new build",0],["Point the prod registry back to orders 1.41.0",1],["Purge the whole CDN",0]],"right":"1.41.0 is still on the CDN, immutable and tested. A one-line registry change rolls back in seconds.","wrong":"<b>Repoint the registry<\/b>. Rebuilding is slow, and purging the CDN does nothing because the registry still points at 1.42.0."},{"k":"Section 7 · Review","h":"What AI often gets wrong","v":"<div class=\"vwrap\"><div class=\"box warn rise\" style=\"--d:0.00s\"><b>Overwriting a \"latest\" folder<\/b> on deploy: no rollback, and stale caches mix old and new chunks.<\/div><div class=\"box warn rise\" style=\"--d:0.25s\"><b>Long cache on mutable files<\/b> (registry, entry, index.html), so deploys take hours to reach users.<\/div><div class=\"box warn rise\" style=\"--d:0.50s\"><b>Environment-specific values baked into the build<\/b> (<code>API_URL<\/code> at build time), which forces a rebuild per environment and breaks build-once.<\/div><div class=\"box warn rise\" style=\"--d:0.75s\"><b>Skipping the integration stage<\/b>: unit tests pass in isolation, but the MFE fails in the real shell.<\/div><\/div>","p":"Look for these in AI-written diffs. They compile, they often pass a quick test, and they break later."},{"k":"Section 7 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching\" target=\"_blank\" rel=\"noopener noreferrer\"><b>MDN · HTTP caching<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>Cache-Control, revalidation and immutable, explained in depth.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://docs.github.com/en/actions\" target=\"_blank\" rel=\"noopener noreferrer\"><b>GitHub Actions · Docs<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>A widely used CI system for the build, preview and promotion pipeline.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"k":"Review checklist","h":"Ten questions for any MFE PR","v":"<ul class=\"chk\"><li>Does it stay inside its <b>route prefix<\/b> and use the shell's navigate?<\/li><li>Are new <b>exposes<\/b>, props or events additive and typed?<\/li><li>Are shared singletons unchanged, or is the bump coordinated?<\/li><li>HTTP through the <b>platform client<\/b>; no tokens in web storage?<\/li><li>UI from the <b>design system<\/b>; no global CSS?<\/li><li>Custom element <b>unmounts<\/b>; define is guarded?<\/li><li>Feature flag with a <b>safe default<\/b> and an owner?<\/li><li>Error and loading states inside its boundary?<\/li><li>No environment values baked into the build?<\/li><li>Telemetry tagged; registry owner correct?<\/li><\/ul>","p":"Keep this card open next to an AI-written MFE diff and go through it line by line."},{"recap":true,"h":"An MFE platform on one card","items":["<b>Shell<\/b> owns the frame, auth, URL and error handling. Teams own MFEs under route prefixes.","A per-environment <b>registry<\/b> maps ids → routes → versioned entry URLs.","<b>Custom elements<\/b> are the boundary: attributes and properties in, events out, unmount on disconnect.","<b>SDK packages<\/b> (http, events, flags, telemetry, i18n) and the <b>design system<\/b> are shared singletons.","<b>Overrides<\/b> load your localhost or preview MFE into the real shell. Guard them like a security feature.","<b>CDN<\/b>: immutable version folders, no-cache pointers, SPA fallback at the edge.","<b>CI/CD<\/b>: build once, preview per PR, promote and roll back by changing the registry."],"next":"Next: <b>Part 10<\/b>."}];
</script>

    var s=document.createElement('section'); s.className='card'; var h='';
    if(c.sect){ s.className+=' sect';
      h='<div class="visual"><div class="num pop">'+c.num+'</div></div>'+(c.badge?'<div class="titlebadge"><i></i>'+c.badge+'</div>':'')+'<div class="kicker">'+c.kicker+'</div><h1>'+c.h+'</h1><p>'+c.p+'</p>'+(c.first?'<div class="tapme">Tap the right side or swipe left →</div>':'');
    } else if(c.quiz){ s.className+=' quiz'; s.setAttribute('data-quiz','');
      h='<div class="kicker">'+c.k+'</div><h2>'+c.h+'</h2>'+(c.code?'<div class="qcode">'+hl(c.code)+'</div>':'<div style="height:10px"></div>')+'<div class="opts">'+c.opts.map(function(o,i){return '<button class="opt" type="button" data-ok="'+o[1]+'"><span class="l">'+'ABCD'[i]+'</span>'+o[0]+'</button>';}).join('')+'</div><div class="fb"></div>';
    } else if(c.recap){
      h='<div class="kicker">Recap</div><h2>'+c.h+'</h2><ul class="take">'+
        c.items.map(function(t,i){return '<li class="rise" style="--d:'+(i*0.15)+'s">'+t+'</li>';}).join('')+
        '</ul><div class="score" id="score"></div><p style="font-size:13px;margin-top:8px">'+c.next+'</p><a class="btn ghost" href="index.html" style="margin-top:6px">← Course home</a>';
    } else {
      var inner='';
      if(c.cmp){ inner='<div class="stack">'+c.cmp.map(function(b,i){ var col=LC[b[0]]||LC.JS; return '<div class="cb rise" style="--d:'+(i*0.25)+'s"><div class="cb-h">'+(b[2]||(i===0?'modern':'compare'))+' <span class="tagc" style="background:'+col[0]+';color:'+col[1]+'">'+b[0]+'</span></div><pre>'+hl(b[1])+'</pre></div>'; }).join('')+'</div>'; }
      if(c.v){ inner=c.v+inner; }
      if(c.lab){ s.className+=' lab'; inner='<div class="scrollv demo">'+inner+'</div>'; }
      h='<div class="kicker">'+c.k+'</div><div class="visual">'+inner+'</div><h2>'+c.h+'</h2>'+(c.p?'<p>'+c.p+'</p>':'')+(c.an?'<div class="analogy"><span>'+c.an+'</span></div>':'');
    }
    s.innerHTML=h; if(c.quiz){ var fb=s.querySelector('.fb'); fb.setAttribute('data-right',c.right); fb.setAttribute('data-wrong',c.wrong); }
    stage.insertBefore(s, anchor);
  });
})();
</script>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var stage=$('stage'), cards=[].slice.call(document.querySelectorAll('.card')), segsEl=$('segs'), countEl=$('count'), prevBtn=$('prev'), nextBtn=$('next');
  var cur=0, N=cards.length, answered=0, correct=0, NQ=document.querySelectorAll('[data-quiz]').length;
  cards.forEach(function(){ var s=document.createElement('div'); s.className='seg'; s.appendChild(document.createElement('i')); segsEl.appendChild(s); });
  var segs=segsEl.children;
  function go(n){
    n=Math.max(0,Math.min(N-1,n));
    cards.forEach(function(c,k){ c.classList.toggle('past',k<n); if(k!==n) c.classList.remove('active'); c.setAttribute('aria-hidden',k!==n); });
    var card=cards[n]; card.classList.remove('active'); void card.offsetWidth; card.classList.add('active');
    for(var k=0;k<N;k++) segs[k].classList.toggle('done',k<=n);
    countEl.textContent=(n+1)+' / '+N; prevBtn.disabled=n===0; nextBtn.disabled=n===N-1; cur=n; try{var _k='lp:'+location.pathname.split('/').pop(),_o=JSON.parse(localStorage.getItem(_k)||'{}');localStorage.setItem(_k,JSON.stringify({max:Math.max(_o.max||0,n+1),total:N}));}catch(_e){} updateScore();
    try{ history.replaceState(null,'','#'+(n+1)); }catch(e){}
  }
  function next(){ if(cur<N-1) go(cur+1); } function prev(){ if(cur>0) go(cur-1); }
  prevBtn.addEventListener('click',function(e){e.stopPropagation();prev();});
  nextBtn.addEventListener('click',function(e){e.stopPropagation();next();});
  
  var lastSwipe=0;
  stage.addEventListener('click',function(e){
    if(Date.now()-lastSwipe<450) return;
    if(e.target.closest('button, a, .opts, .demo, textarea, iframe')) return;
    var r=stage.getBoundingClientRect(); if((e.clientX-r.left)/r.width<0.3) prev(); else next();
  });
  var sx=0,sy=0,tr=false;
  stage.addEventListener('touchstart',function(e){ if(e.target.closest('textarea')) return; var t=e.touches[0]; sx=t.clientX; sy=t.clientY; tr=true; },{passive:true});
  stage.addEventListener('touchend',function(e){ if(!tr) return; tr=false; var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){ lastSwipe=Date.now(); if(dx<0) next(); else prev(); } },{passive:true});
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='TEXTAREA') return;
    if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter')) return;
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
    else if(e.key==='Home') go(0); else if(e.key==='End') go(N-1);
  });
  [].forEach.call(document.querySelectorAll('[data-quiz]'),function(q){
    var opts=q.querySelector('.opts'), fb=q.querySelector('.fb');
    [].forEach.call(opts.querySelectorAll('.opt'),function(b){
      b.addEventListener('click',function(e){
        e.stopPropagation(); if(opts.classList.contains('done')) return;
        opts.classList.add('done'); answered++;
        var ok=b.getAttribute('data-ok')==='1'; if(ok) correct++; else b.classList.add('wrong');
        opts.querySelector('[data-ok="1"]').classList.add('right');
        fb.innerHTML='<span class="tag" style="color:'+(ok?'var(--green)':'var(--pink)')+'">'+(ok?'✓ Correct.':'✗ Not quite.')+'</span> '+fb.getAttribute(ok?'data-right':'data-wrong')+'<br><span style="color:var(--dim);font-size:12px">Tap or swipe to continue →</span>';
        fb.classList.add('show');
      });
    });
  });
  function updateScore(){ var s=$('score'); s.textContent=answered?('Quiz score: '+correct+' / '+NQ+(answered<NQ?' ('+(NQ-answered)+' skipped)':'')):''; }

  var start=parseInt((location.hash||'').slice(1),10); go(isNaN(start)?0:start-1);
})();
</script>
