<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07080d"><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Part 3 · Modern UI Architecture</title><style>
:root{
  --bg:#07080d; --panel:#121622; --panel2:#181d2b; --line:#2a3145; --text:#eef1f8; --muted:#a3acc2; --dim:#5d6680;
  --html:#ff7a45; --css:#4ea8ff; --js:#f7d046; --green:#3ddc97; --purple:#a78bfa; --pink:#ff5c8a; --cyan:#4ee6e0;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
.app{position:fixed;inset:0;display:flex;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#141a2e 0,transparent 60%),var(--bg)}
.stage{position:relative;width:100%;max-width:460px;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y}
@media (min-width:600px){.stage{height:min(100%,900px);margin:auto;border-radius:28px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 300px at 85% 10%,rgba(167,139,250,.10),transparent 70%),radial-gradient(500px 300px at 0% 90%,rgba(78,168,255,.08),transparent 70%);pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
.segs{display:flex;gap:3px}
.seg{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--css),var(--purple));transition:width .35s ease}
.seg.done i{width:100%}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.meta b{color:var(--text);font-weight:600}
.card{position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 58px) 22px calc(env(safe-area-inset-bottom) + 64px);display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(40px) scale(.98);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s linear .45s}
.card.past{transform:translateX(-40px) scale(.98)}
.card.active{opacity:1;visibility:visible;transform:none;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
.kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);margin-bottom:6px}
.visual{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;margin:4px 0 14px}
.visual svg{width:100%;height:100%;max-height:330px;overflow:visible}
h1,h2{margin:0 0 10px;line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(30px,9vw,40px)}
h2{font-size:clamp(22px,6.4vw,28px)}
p{margin:0 0 8px;font-size:clamp(15px,4.2vw,17px);line-height:1.5;color:var(--muted)}
p b,p strong{color:var(--text);font-weight:600}
code,.mono{font-family:var(--mono);font-size:.9em}
p code,.analogy code{background:#1b2131;border:1px solid var(--line);padding:1px 5px;border-radius:6px;color:#dfe5f5}
.analogy{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,rgba(78,168,255,.10),rgba(167,139,250,.10));border:1px solid rgba(120,140,255,.25);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;color:#cfd6ea;margin-top:6px}
.analogy::before{content:"⚙";font-size:15px;color:var(--css);line-height:1.3}
.analogy b{color:#fff}
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:0 14px calc(env(safe-area-inset-bottom) + 12px)}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(18,22,34,.8);color:var(--text);font-size:20px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
.nav:disabled{opacity:.3}
.hint{font-size:12px;color:var(--dim)}
svg *{transform-box:fill-box;transform-origin:center}
.active .pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.35) both;animation-delay:var(--d,0s)}
.active .fade{animation:fade .6s ease both;animation-delay:var(--d,0s)}
.active .rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.growx{transform-origin:left center}
.active .growx{animation:growx .6s ease both;animation-delay:var(--d,0s)}
.active .draw{stroke-dasharray:var(--len,300);animation:draw 1s ease both;animation-delay:var(--d,0s)}
.flow{stroke-dasharray:4 6;animation:flow 1s linear infinite}
.pulse{animation:pulse 2s ease-in-out infinite;animation-delay:var(--pd,0s)}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:var(--len,300)}to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes goR{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(60px);opacity:0}}
@keyframes goL{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(-72px);opacity:0}}
.req{animation:goR 2.4s ease-in-out infinite}
.chunk{opacity:0;animation:goL 2.4s linear infinite;animation-delay:var(--d,0s)}
.titlebadge{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;margin-bottom:14px;align-self:flex-start;background:rgba(255,255,255,.03)}
.titlebadge i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.tapme{margin-top:6px;font-size:13px;color:var(--dim);animation:pulse 1.8s infinite}
.grad{background:linear-gradient(90deg,var(--html),var(--js) 35%,var(--css) 70%,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.lay{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.lay-frame{width:100%;border:1px solid var(--line);border-radius:14px;padding:8px;background:#0d111b;display:flex;flex-direction:column;gap:6px;animation:resize 5s ease-in-out infinite alternate;position:relative}
@keyframes resize{0%,15%{width:100%}85%,100%{width:52%}}
.lay .b{border-radius:8px;font:600 11px/1 var(--mono);display:flex;align-items:center;justify-content:center;color:#0b0e16;padding:0 4px;overflow:hidden;white-space:nowrap}
.lay .hdr{height:26px;background:var(--css)}
.lay-row{display:flex;gap:6px}
.lay .side{flex:0 0 26%;height:54px;background:var(--purple)}
.lay .main{flex:1;height:54px;background:var(--green)}
.lay-cards{display:flex;flex-wrap:wrap;gap:6px}
.lay .c{flex:1 1 64px;height:30px;background:var(--js)}
.ruler{font:12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.ruler span{display:inline-block;height:2px;width:40px;background:linear-gradient(90deg,var(--pink),var(--js));border-radius:2px}
.comp{position:relative;width:250px;height:230px;perspective:800px}
.comp-in{position:absolute;inset:0;transform-style:preserve-3d}
.layer{position:absolute;left:25px;top:30px;width:200px;height:170px;border-radius:14px;border:1px solid rgba(255,255,255,.18);transform-origin:center;animation:explode 6s ease-in-out infinite;--z:0px;display:flex;align-items:flex-end;justify-content:flex-end;padding:8px;font:600 10px var(--mono);color:rgba(255,255,255,.85)}
.l1{--z:-60px;background-color:#151b30;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:16px 16px}
.l2{--z:0px;background:rgba(78,168,255,.18)}
.l2::before{content:"";position:absolute;left:66px;top:16px;width:112px;height:10px;border-radius:5px;background:rgba(255,255,255,.75);box-shadow:0 22px 0 rgba(255,255,255,.4),0 40px 0 rgba(255,255,255,.4),0 58px 0 rgba(255,255,255,.4),0 86px 0 -1px rgba(61,220,151,.7)}
.l3{--z:60px;width:56px;background:rgba(167,139,250,.6);animation-name:explode3;align-items:flex-start;justify-content:center;padding-top:10px;text-align:center}
@keyframes explode{0%,22%,100%{transform:rotateX(56deg) rotateZ(-38deg) translateZ(var(--z))}48%,80%{transform:rotateX(0) rotateZ(0) translateZ(0)}}
@keyframes explode3{0%,22%,100%{transform:rotateX(56deg) rotateZ(-38deg) translateZ(var(--z))}48%{transform:translateX(-60px)}62%,80%{transform:translateX(0)}}
.comp-tag{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font:12px var(--mono);color:var(--muted)}
.cost{width:100%;display:grid;grid-template-columns:92px repeat(5,1fr);gap:6px;font-size:10.5px;align-items:center}
.cost .h{color:var(--dim);text-align:center;font-weight:600;letter-spacing:.02em}
.cost .lbl{font:600 11px var(--mono);color:var(--text);line-height:1.3}
.cost .lbl small{display:block;color:var(--dim);font-weight:400}
.cell{height:30px;border-radius:8px;background:#151a27;border:1px dashed #262d40}
.cell.on{background:var(--c);border:0;box-shadow:0 0 14px var(--c)}
.active .cell.on{animation:light .45s ease both;animation-delay:var(--d,0s)}
@keyframes light{from{opacity:.1;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.costtag{grid-column:2/7;font-size:11px;color:var(--muted);text-align:right;margin-top:-2px}
.qcode{font:13px/1.55 var(--mono);background:#0d111b;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0 14px;color:#cdd5ea;white-space:pre;overflow-x:auto}
.qcode .k{color:var(--purple)}.qcode .s{color:var(--green)}.qcode .t{color:var(--html)}.qcode .c{color:var(--dim)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:15px;line-height:1.35;cursor:pointer;transition:transform .15s,border-color .2s,background .2s,opacity .2s}
.opt:active{transform:scale(.98)}
.opt:focus-visible{outline:2px solid var(--css)}
.opt .l{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#1e2436;font:700 12px var(--mono);color:var(--muted)}
.opt code{font-size:13px}
.opt.right{border-color:var(--green);background:rgba(61,220,151,.12)}
.opt.right .l{background:var(--green);color:#06210f}
.opt.wrong{border-color:var(--pink);background:rgba(255,92,138,.12);animation:shake .4s}
.opt.wrong .l{background:var(--pink);color:#2a0612}
.opts.done .opt:not(.right):not(.wrong){opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.fb{margin-top:12px;font-size:14px;line-height:1.45;color:var(--muted);opacity:0;transform:translateY(8px);transition:.3s}
.fb.show{opacity:1;transform:none}
.fb b{color:var(--text)}
.fb code{background:#1b2131;padding:1px 4px;border-radius:5px;color:#dfe5f5}
.fb .tag{display:inline-block;font-weight:800;margin-right:4px}
.qspacer{flex:1}
.rx{width:100%;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.rx-row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.rx-box{flex:1;background:#0d111b;border:1px solid var(--line);border-radius:12px;padding:10px 8px;font:11px/1.4 var(--mono);color:#cdd5ea;min-height:62px;display:flex;flex-direction:column;justify-content:center}
.rx-box .cap{font:700 9px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.rx-arrow{color:var(--purple);font:700 13px var(--mono);flex:0 0 auto}
.rx-f{flex:0 0 auto;background:linear-gradient(135deg,rgba(167,139,250,.25),rgba(78,168,255,.2));border:1px solid rgba(167,139,250,.5);border-radius:12px;padding:10px 7px;font:700 12px var(--mono)}
.rx-ui{background:#f5f6fa;color:#141824;border-radius:14px;padding:9px 10px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);min-height:62px}
.rx-ui .bar{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.rx-ui .badge{background:#ff5c1a;color:#fff;border-radius:999px;padding:1px 8px;font-size:11px}
.rx-ui ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.rx-ui li{background:#e7e9f2;border-radius:6px;padding:3px 6px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px #3ddc97}100%{box-shadow:0 0 0 0 transparent}}
.rx-note{font-size:12px;color:var(--dim);text-align:center}
.btn{all:unset;cursor:pointer;align-self:center;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,var(--purple),var(--css));color:#fff;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(120,120,255,.35)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--text);align-self:flex-start}
.flowchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;width:100%}
.chip{padding:7px 10px;border-radius:10px;font:700 12px var(--mono);color:#0b0e16;display:inline-block}
.arr{color:var(--dim);font-size:12px}
.take{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px;width:100%}
.take li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.4;color:#cfd6ea}
.take li b{color:#fff}
.score{font-size:13px;color:var(--muted);margin-top:10px}
.next-tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.next-tags span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);font-family:var(--mono)}
@media (max-height:700px){.visual svg{max-height:230px}.qcode{font-size:12px;padding:8px 10px;margin:4px 0 8px}.opt{padding:10px 12px}.analogy{font-size:13px;padding:8px 10px}p{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ---- lesson 1b additions ---- */
.net{width:100%;background:#0d111b;border:1px solid var(--line);border-radius:12px;overflow:hidden;font:10.5px/1.2 var(--mono)}
.net-h,.net-r{display:grid;grid-template-columns:1.35fr 46px 40px 1fr;gap:6px;align-items:center;padding:6px 9px}
.net-h{color:var(--dim);font:700 8.5px system-ui;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line);background:#121622}
.net-r{border-bottom:1px solid #161b28;color:#cdd5ea}
.net-r:last-of-type{border-bottom:0}
.net-r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net-r .t{color:var(--muted);font-size:9.5px}
.net-r .z{color:var(--muted);text-align:right;font-size:9.5px}
.net-r.dim{color:#59627a}.net-r.dim .t,.net-r.dim .z{color:#454d63}.net-r.dim .wf i{opacity:.35}
.net-r.hl{background:rgba(78,168,255,.09);box-shadow:inset 3px 0 0 var(--css)}
.wf{position:relative;height:9px;background:repeating-linear-gradient(90deg,transparent 0 19.6%,#1a2030 19.6% 20%)}
.wf i{position:absolute;top:0;height:100%;border-radius:3px;left:var(--s);width:var(--w);background:var(--c);transform-origin:left center}
.active .net-r{animation:rise .4s ease both;animation-delay:var(--d,0s)}
.active .wf i{animation:growx .5s ease both;animation-delay:calc(var(--d,0s) + .15s)}
.net-foot{padding:5px 9px;color:var(--dim);font-size:9px;display:flex;justify-content:space-between;border-top:1px solid var(--line);background:#121622}
.netwrap{width:100%;display:flex;flex-direction:column;gap:10px}
.cb{width:100%;font:11.5px/1.5 var(--mono);background:#0d111b;border:1px solid var(--line);border-radius:12px;color:#cdd5ea;overflow:hidden}
.cb pre{margin:0;padding:9px 11px;white-space:pre;overflow-x:auto;font:inherit}
.cb-h{display:flex;justify-content:space-between;align-items:center;padding:5px 11px;background:#121622;border-bottom:1px solid var(--line);font:700 9px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.cb-h .tagc{font:700 9.5px var(--mono);letter-spacing:0;text-transform:none;padding:2px 7px;border-radius:999px}
.k{color:var(--purple)}.s{color:var(--green)}.t{color:var(--html)}.c{color:var(--dim)}.y{color:var(--js)}.bl{color:var(--css)}
.mk{background:rgba(247,208,70,.18);color:var(--js);border-radius:4px;padding:0 2px}
.stack{width:100%;display:flex;flex-direction:column;gap:8px}
.down{align-self:center;color:var(--purple);font:700 13px var(--mono);line-height:1}
/* phone mock */
.phone{width:178px;height:300px;border-radius:26px;border:2px solid #2a3145;background:#0b0e16;padding:12px 10px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.5);flex:0 0 auto;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.url{font:10px var(--mono);background:#181d2b;border-radius:8px;padding:6px 8px;color:var(--muted);white-space:nowrap;overflow:hidden}
.url b{color:var(--text);font-weight:600}
.pg{flex:1;border-radius:12px;background:#f3f5fa;padding:10px 9px;display:flex;flex-direction:column;gap:7px;color:#141824;font-size:11px;overflow:hidden;position:relative}
.pg.blank{background:#fff}
.pg .ttl{font-weight:800;font-size:12.5px;display:flex;justify-content:space-between;align-items:center}
.sk{height:30px;border-radius:8px;background:linear-gradient(90deg,#e1e5ee 0,#f0f2f7 40%,#e1e5ee 80%);background-size:250% 100%;animation:shimmer 1.3s linear infinite}
.sk.sm{height:12px;width:60%}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-150% 0}}
.prow{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e3e6ee;border-radius:8px;padding:7px 8px;font-size:10.5px;font-weight:600;color:#141824;cursor:pointer}
.prow span{font-weight:500;font-size:9px;color:#fff;background:#3ddc97;border-radius:999px;padding:1px 6px}
.prow span.pl{background:#f7a046}
.prow.tapme2{box-shadow:0 0 0 0 rgba(255,92,26,.6);animation:ring 1.6s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,92,26,.55)}70%{box-shadow:0 0 0 8px rgba(255,92,26,0)}100%{box-shadow:0 0 0 0 rgba(255,92,26,0)}}
.dom{font:10.5px/1.55 var(--mono);color:#cdd5ea;background:#0d111b;border:1px solid var(--line);border-radius:12px;padding:10px;flex:1;min-width:0;white-space:pre;overflow:hidden}
.row2{display:flex;gap:12px;align-items:center;width:100%;justify-content:center}
.swap-a{animation:none}
.active .later{animation:fade .5s ease both;animation-delay:var(--d,1.5s)}
.active .gone{animation:gone .4s ease both;animation-delay:var(--d,1.5s)}
@keyframes gone{to{opacity:0;height:0;margin:0;padding:0}}
/* comparison table */
.vs{width:100%;display:grid;grid-template-columns:76px 1fr 1fr;gap:5px;font-size:12px;line-height:1.3}
.vs div{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 8px;color:#cfd6ea}
.vs .vh{font-weight:800;text-align:center;border:0}
.vs .vh.code{background:rgba(247,208,70,.14);color:var(--js)}
.vs .vh.data{background:rgba(61,220,151,.14);color:var(--green)}
.vs .vl{background:transparent;border:0;color:var(--dim);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;padding:0}
.trio{width:100%;display:flex;flex-direction:column;gap:7px}
.trio .cb pre{padding:6px 10px;font-size:10.5px}
.find{font-size:12px;color:var(--muted);text-align:center}

<script>var CARDS = [{"sect": 1, "num": "3", "kicker": "Part 3 · Architecture", "h": "Modern UI <span class=\"grad\">architecture<\/span>", "p": "Where the HTML comes from (CSR, SSR, SSG), hydration, client-side routing, what the build pipeline does to your code, code splitting and caching.", "first": true, "badge": "~35 min · 46 cards · 6 quizzes"}, {"sect": 1, "num": "1", "kicker": "Section 1 · Rendering strategies", "h": "CSR, SSR, <span class=\"grad\">SSG<\/span>", "p": "Three answers to one question: who turns data into HTML, and when?", "first": false}, {"k": "Client-side rendering (CSR)", "h": "The server sends a shell; the browser builds the page", "steps": ["GET <code>/projects<\/code> → server returns a near-empty <code>index.html<\/code> (<code>&lt;div id=\"root\"&gt;&lt;/div&gt;<\/code>)", "Browser downloads and parses the JS bundle", "React runs, renders a loading state", "JS fetches <code>/api/projects<\/code> as JSON", "React renders the real UI. Every later navigation stays in the browser"], "p": "This is a classic single-page app (SPA) built with Vite + React. The server is just a static file host plus a JSON API. Pros: simple hosting, very fast after the first load, rich interactivity. Cons: blank or spinner screen until JS arrives and runs, and SEO depends on crawlers running JS."}, {"k": "Server-side rendering (SSR)", "h": "The server runs React and sends finished HTML", "steps": ["GET <code>/projects<\/code> → server fetches data and renders React to an HTML string", "Browser shows real content immediately (fast first paint)", "JS bundle downloads in the background", "<b>Hydration<\/b>: React attaches event handlers to the existing HTML", "Now it behaves like an SPA"], "p": "Frameworks like Next.js, Remix/React Router and Astro do this. Content is visible sooner and crawlable, but you now run a Node server per request, and the page isn't interactive until hydration finishes.", "an": "Closest to classic Rails ERB rendering, except the same components also run in the browser afterwards."}, {"k": "Static site generation (SSG)", "h": "Render at build time, serve files from a CDN", "p": "Pages are rendered to HTML <b>once during the build<\/b>, then served as static files. Perfect for docs, marketing pages and blogs: as fast and cheap as it gets. Content changes need a rebuild, or <b>incremental regeneration<\/b> (re-render a page in the background after N seconds).", "bul": ["<b>SSG<\/b>: data known at build time. Fastest, cheapest.", "<b>SSR<\/b>: per-user or per-request data, needs SEO or fast first paint.", "<b>CSR<\/b>: logged-in apps and dashboards behind auth, where SEO doesn't matter.", "Most real apps <b>mix<\/b> them per route."]}, {"k": "Timeline", "h": "What the user sees, and when", "v": "<svg viewBox=\"0 0 320 160\" font-family=\"monospace\" font-size=\"9\"><text x=\"4\" y=\"24\" fill=\"#a3acc2\">CSR<\/text><rect class=\"growx\" x=\"40\" y=\"12\" width=\"40\" height=\"16\" rx=\"3\" fill=\"#4ea8ff\"/><rect class=\"growx\" style=\"--d:.3s\" x=\"80\" y=\"12\" width=\"90\" height=\"16\" rx=\"3\" fill=\"#f7d046\"/><rect class=\"growx\" style=\"--d:.7s\" x=\"170\" y=\"12\" width=\"50\" height=\"16\" rx=\"3\" fill=\"#a78bfa\"/><rect class=\"growx\" style=\"--d:1s\" x=\"220\" y=\"12\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#3ddc97\"/><text x=\"4\" y=\"64\" fill=\"#a3acc2\">SSR<\/text><rect class=\"growx\" x=\"40\" y=\"52\" width=\"70\" height=\"16\" rx=\"3\" fill=\"#ff7a45\"/><rect class=\"growx\" style=\"--d:.4s\" x=\"110\" y=\"52\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#3ddc97\"/><rect class=\"growx\" style=\"--d:.6s\" x=\"126\" y=\"52\" width=\"90\" height=\"16\" rx=\"3\" fill=\"#f7d046\" opacity=\".6\"/><rect class=\"growx\" style=\"--d:1s\" x=\"216\" y=\"52\" width=\"24\" height=\"16\" rx=\"3\" fill=\"#a78bfa\"/><text x=\"4\" y=\"104\" fill=\"#a3acc2\">SSG<\/text><rect class=\"growx\" x=\"40\" y=\"92\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#4ea8ff\"/><rect class=\"growx\" style=\"--d:.2s\" x=\"60\" y=\"92\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#3ddc97\"/><rect class=\"growx\" style=\"--d:.4s\" x=\"76\" y=\"92\" width=\"90\" height=\"16\" rx=\"3\" fill=\"#f7d046\" opacity=\".6\"/><rect class=\"growx\" style=\"--d:.8s\" x=\"166\" y=\"92\" width=\"24\" height=\"16\" rx=\"3\" fill=\"#a78bfa\"/><g font-size=\"8\"><rect x=\"40\" y=\"128\" width=\"8\" height=\"8\" fill=\"#4ea8ff\"/><text x=\"51\" y=\"135\" fill=\"#a3acc2\">HTML<\/text><rect x=\"84\" y=\"128\" width=\"8\" height=\"8\" fill=\"#ff7a45\"/><text x=\"95\" y=\"135\" fill=\"#a3acc2\">server render<\/text><rect x=\"160\" y=\"128\" width=\"8\" height=\"8\" fill=\"#f7d046\"/><text x=\"171\" y=\"135\" fill=\"#a3acc2\">JS download<\/text><rect x=\"40\" y=\"144\" width=\"8\" height=\"8\" fill=\"#a78bfa\"/><text x=\"51\" y=\"151\" fill=\"#a3acc2\">React runs / hydrate<\/text><rect x=\"160\" y=\"144\" width=\"8\" height=\"8\" fill=\"#3ddc97\"/><text x=\"171\" y=\"151\" fill=\"#a3acc2\">content visible<\/text><\/g><\/svg>", "p": "CSR shows content <b>last<\/b>; SSR and SSG show it <b>before<\/b> JS loads but are only interactive after hydration. The metrics that capture this are Core Web Vitals: <b>LCP<\/b> (largest content painted), <b>INP<\/b> (input responsiveness) and <b>CLS<\/b> (layout shift)."}, {"k": "Gotchas", "h": "What goes wrong with each", "g": true, "bul": ["<b>CSR<\/b>: huge bundles = long blank screen on slow phones. Always measure on a throttled mid-range device.", "<b>SSR<\/b>: code that touches <code>window<\/code>, <code>document<\/code> or <code>localStorage<\/code> during render crashes on the server.", "<b>SSR<\/b>: slow data fetching blocks the whole HTML response unless you stream.", "<b>SSG<\/b>: stale content until rebuilt; per-user data can't be baked in.", "<b>All<\/b>: secrets must never be in client code. Anything in the bundle is public."]}, {"quiz": true, "k": "Quiz 1 / 6 · Strategies", "h": "An internal dashboard, behind login, very interactive, SEO irrelevant. Sensible default?", "opts": [["SSG for everything", 0], ["CSR (a Vite SPA) talking to a JSON API", 1], ["SSR every page for SEO", 0]], "right": "Behind auth, SEO is moot and the app is interactive, so a client-rendered SPA is simplest. Add SSR only if first-load speed becomes a real problem.", "wrong": "For a logged-in dashboard, <b>CSR<\/b> is the pragmatic default. SSG can't include per-user data and SSR's SEO benefit doesn't apply."}, {"k": "Go deeper · Rendering strategies", "h": "Go deeper", "links": [["Rendering on the Web", "https://web.dev/articles/rendering-on-the-web", "web.dev. The canonical comparison of CSR, SSR, SSG and hydration trade-offs."], ["Web Vitals", "https://web.dev/articles/vitals", "web.dev. What LCP, INP and CLS measure and their targets."], ["Intermediate React, v6 (Frontend Masters)", "https://frontendmasters.com/courses/intermediate-react-v6/", "Brian Holt on server components, SSR and performance."]]}, {"sect": 1, "num": "2", "kicker": "Section 2 · Hydration", "h": "Making server HTML <span class=\"grad\">come alive<\/span>", "p": "Hydration is where SSR apps get subtle bugs. Know how it works so you can spot them.", "first": false}, {"k": "How hydration works", "h": "React \"adopts\" existing DOM instead of creating it", "steps": ["Server renders <code>&lt;App/&gt;<\/code> to HTML and sends it", "Browser paints it. Buttons are visible but do nothing yet", "JS loads; <code>hydrateRoot(root, &lt;App/&gt;)<\/code> renders the same tree in memory", "React walks the existing DOM and matches it node by node", "It attaches event listeners and state. Now it's interactive"], "cmp": [["TSX", "// client entry of an SSR app\nimport { hydrateRoot } from 'react-dom/client';\nhydrateRoot(document.getElementById('root')!, <App />);\n\n// pure CSR app instead:\ncreateRoot(document.getElementById('root')!).render(<App />);", "entry point"]], "p": "Hydration assumes the client's first render produces <b>exactly the same markup<\/b> as the server's."}, {"k": "Hydration mismatches", "h": "When server and client render differently", "cmp": [["TSX", "function Header() {\n  return <p>Generated {new Date().toLocaleTimeString()}<\/p>;  // ✗ differs\n}\nfunction Nav() {\n  if (typeof window !== 'undefined' && window.innerWidth < 600)\n    return <MobileNav />;          // ✗ server always picks desktop\n  return <DesktopNav />;\n}\nconst id = Math.random();           // ✗ different per render", "✗ AI often writes"], ["TSX", "function Nav() {\n  const [isMobile, setIsMobile] = useState(false);   // same as server\n  useEffect(() => {                                   // client-only, after hydrate\n    const mq = window.matchMedia('(max-width: 600px)');\n    setIsMobile(mq.matches);\n    const on = () => setIsMobile(mq.matches);\n    mq.addEventListener('change', on);\n    return () => mq.removeEventListener('change', on);\n  }, []);\n  return isMobile ? <MobileNav /> : <DesktopNav />;\n}\nconst id = useId();                 // ✓ stable across server and client", "✓ Good"]], "p": "Sources of mismatch: dates and time zones, <code>Math.random()<\/code>, <code>window<\/code>/<code>localStorage<\/code> checks in render, locale formatting, and invalid HTML nesting (a <code>&lt;div&gt;<\/code> inside a <code>&lt;p&gt;<\/code>, which the browser silently \"fixes\"). React warns in the console and may re-render the whole subtree on the client, losing the SSR benefit."}, {"k": "The uncanny valley", "h": "Visible ≠ interactive", "p": "Between first paint and hydration the page <b>looks<\/b> ready but clicks do nothing (or worse, a native form submits). The bigger the JS, the longer this gap. Mitigations: ship less JS, split code, <b>stream<\/b> HTML so parts hydrate independently, and use real <code>&lt;form&gt;<\/code>/<code>&lt;a&gt;<\/code> elements that still work without JS."}, {"k": "Streaming & server components", "h": "Newer tools to shrink the gap", "bul": ["<b>Streaming SSR<\/b>: the server flushes HTML in chunks; slow sections wrapped in <code>&lt;Suspense&gt;<\/code> arrive later with a fallback first.", "<b>Selective hydration<\/b>: React hydrates the parts the user interacts with first.", "<b>React Server Components (RSC)<\/b>: components that run <b>only<\/b> on the server and send no JS. Not the same as SSR: SSR renders client components to HTML; RSC removes them from the bundle entirely.", "In Next.js App Router, files are server components by default; <code>'use client'<\/code> marks the interactive boundary."], "p": "When reviewing, check that <code>'use client'<\/code> is placed low (on the interactive leaf), not at the top of a page, which would pull everything into the client bundle."}, {"quiz": true, "k": "Quiz 2 / 6 · Hydration", "h": "React warns \"Text content did not match\" on a page that shows <code>Last updated {formatDistanceToNow(date)}<\/code>. Why?", "opts": [["The server and client computed different strings at different moments", 1], ["date-fns doesn't work in Node", 0], ["Hydration doesn't support text", 0]], "right": "Relative time (\"3 minutes ago\") differs between server render time and client hydrate time. Render it after mount, or render a stable absolute time.", "wrong": "The <b>output differs<\/b> between server and client. Time-dependent text must be stable or rendered client-side after hydration."}, {"k": "Go deeper · Hydration", "h": "Go deeper", "links": [["hydrateRoot", "https://react.dev/reference/react-dom/client/hydrateRoot", "react.dev reference, incl. causes of hydration errors and fixes."], ["The Perils of Rehydration", "https://www.joshwcomeau.com/react/the-perils-of-rehydration/", "Josh W. Comeau. A real-world mismatch bug, explained step by step."], ["Server and Client Components", "https://nextjs.org/docs/app/getting-started/server-and-client-components", "Next.js docs. Where the server/client boundary goes and why."]]}, {"sect": 1, "num": "3", "kicker": "Section 3 · Routing", "h": "Client-side <span class=\"grad\">routing<\/span>", "p": "How a URL change can avoid a full page load, and what that breaks if done carelessly.", "first": false}, {"k": "The History API", "h": "Change the URL without a request", "steps": ["User clicks a <code>&lt;Link&gt;<\/code>; the router calls <code>e.preventDefault()<\/code>", "<code>history.pushState({}, '', '/projects/42')<\/code>: URL changes, no request", "Router matches <code>/projects/:id<\/code>, renders <code>&lt;ProjectDetail&gt;<\/code>", "Back button fires <code>popstate<\/code>; router re-renders the previous route"], "p": "The router is a component that maps the current URL to a component tree. Only data (JSON) goes over the network, not HTML."}, {"raw": "<section class=\"card\"><div class=\"kicker\">pushState<\/div><div class=\"visual\"><div class=\"demo\"><div class=\"row2\"><div class=\"phone\" style=\"height:250px\"><div class=\"url\" id=\"psUrl\">app.example.com<b>/projects<\/b><\/div><div class=\"pg\" id=\"psPg\"><div class=\"ttl\">Projects<\/div><button class=\"prow\" data-go=\"42\">Riverside Tower <span>open<\/span><\/button><button class=\"prow\" data-go=\"43\">Harbor Clinic <span class=\"pl\">plan<\/span><\/button><\/div><\/div><div class=\"log\" id=\"psLog\" style=\"flex:1;min-width:0;font-size:9.5px\"><div class=\"c\">// tap a project<\/div><\/div><\/div><div class=\"tg\"><button type=\"button\" id=\"psBack\">← back (popstate)<\/button><\/div><\/div><\/div><h2>Change the URL without a request<\/h2><p>Tap a row: the router calls <code>history.pushState<\/code> to update the address bar, then renders the new view. The Network tab shows only a <b>JSON<\/b> request, not a page load.<\/p><\/section>\n"}, {"k": "React Router", "h": "Routes, links and params", "cmp": [["TSX", "const router = createBrowserRouter([\n  { path: '/', element: <Layout />, children: [\n    { index: true, element: <Home /> },\n    { path: 'projects', element: <ProjectList /> },\n    { path: 'projects/:id', element: <ProjectDetail /> },\n    { path: '*', element: <NotFound /> },\n  ]},\n]);\n\nfunction ProjectDetail() {\n  const { id } = useParams();        // string | undefined\n  …\n}", "example"], ["TSX", "<a href=\"/projects/42\">Open<\/a>            // ✗ full page reload, state lost\n<div onClick={() => navigate('/p/42')}>    // ✗ not a link: no ctrl-click, no a11y\n\n<Link to=\"/projects/42\">Open<\/Link>       // ✓ real <a>, client navigation", "✗ vs ✓"]], "an": "Like <code>config/routes.rb<\/code>, except the matching happens in the browser and nested routes render inside a parent layout's <code>&lt;Outlet /&gt;<\/code>."}, {"k": "Routing gotchas", "h": "Things AI code commonly misses", "g": true, "bul": ["<b>Deep links 404<\/b>: the server must return <code>index.html<\/code> for any unknown path (an SPA fallback / rewrite), or refreshing <code>/projects/42<\/code> fails.", "<b>URL is state<\/b>: filters, tabs and pagination that should survive refresh or be shareable belong in the URL (<code>useSearchParams<\/code>), not <code>useState<\/code>.", "<b>Params are strings<\/b>: <code>useParams().id<\/code> is <code>string | undefined<\/code>; parse and validate.", "<b>Scroll &amp; focus<\/b>: a client navigation doesn't reset scroll or move focus; use the router's scroll restoration and focus the new heading for screen readers.", "<b>Data waterfalls<\/b>: fetching in each nested component's effect loads sequentially; route loaders or parallel queries fetch together."]}, {"quiz": true, "k": "Quiz 3 / 6 · Routing", "h": "The app works when clicking around, but refreshing <code>/projects/42<\/code> shows the host's 404 page. Cause?", "opts": [["React Router is misconfigured", 0], ["The server has no SPA fallback: it looks for a file at /projects/42", 1], ["The browser cache is stale", 0]], "right": "Client routes only exist in JS. The server must serve <code>index.html<\/code> for unknown paths so the router can take over.", "wrong": "It's the <b>server<\/b>: without a fallback rewrite to <code>index.html<\/code>, a refresh asks for a file that doesn't exist."}, {"k": "Go deeper · Routing", "h": "Go deeper", "links": [["History API", "https://developer.mozilla.org/en-US/docs/Web/API/History_API", "MDN. pushState, replaceState and popstate, the primitives every router uses."], ["React Router: Picking a Mode", "https://reactrouter.com/start/modes", "Official docs. Declarative vs data vs framework mode and what each gives you."]]}, {"sect": 1, "num": "4", "kicker": "Section 4 · The build", "h": "The bundling <span class=\"grad\">pipeline<\/span>", "p": "Browsers can't run TSX or resolve <code>import 'react'<\/code>. Here's what the bundler does about it.", "first": false}, {"k": "Why bundle at all", "h": "Source code ≠ what browsers run", "bul": ["<b>TS and JSX<\/b> must be compiled to plain JS.", "<b>Bare imports<\/b> (<code>import { useState } from 'react'<\/code>) need resolving to files in <code>node_modules<\/code>.", "Thousands of small modules = thousands of requests; bundling <b>combines<\/b> them into a few chunks.", "Production wants <b>minified<\/b>, tree-shaken, content-hashed files."], "an": "Comparable to the Rails asset pipeline or a Maven build producing a JAR: source in, optimised artefacts out."}, {"k": "Pipeline step by step", "h": "From src/ to dist/", "steps": ["<b>Entry<\/b>: start at <code>src/main.tsx<\/code>", "<b>Resolve<\/b>: follow every <code>import<\/code> to build a module graph", "<b>Transform<\/b>: strip TS types, compile JSX, handle CSS/images", "<b>Tree-shake<\/b>: drop exports nothing imports", "<b>Chunk<\/b>: split into entry, vendor and lazy chunks", "<b>Minify<\/b>: shorten names, remove whitespace and dead code", "<b>Hash &amp; emit<\/b>: <code>index-3f9a1c.js<\/code> + <code>index.html<\/code> that references it"], "cmp": [["Bash", "$ vite build\ndist/index.html                   0.46 kB\ndist/assets/index-3f9a1c.css     8.12 kB │ gzip:  2.31 kB\ndist/assets/index-b71e02.js    142.80 kB │ gzip: 46.02 kB\ndist/assets/Reports-9c4d11.js   31.40 kB │ gzip: 10.11 kB", "output"]]}, {"k": "Dev vs production", "h": "Vite does two different things", "v": "<div class=\"g2\"><div class=\"box rise\"><b>vite (dev)<\/b><br><small>No bundling. Serves native ES modules, transforms each file on request with esbuild, pre-bundles deps. Hot Module Replacement swaps edited modules without losing state.<\/small><\/div><div class=\"box rise\" style=\"--d:.3s\"><b>vite build<\/b><br><small>Full bundle with Rollup: tree-shaking, chunking, minification, hashing. This is what ships.<\/small><\/div><\/div>", "p": "Bugs can hide in the difference: something that works in dev can break in the production build (e.g. a dynamic import path the bundler can't analyse, or case-sensitive filenames on Linux). CI should run the real <code>build<\/code> and tests against it."}, {"k": "Gotcha · types aren't checked", "h": "The bundler strips types, it doesn't verify them", "cmp": [["JSON", "\"scripts\": {\n  \"dev\": \"vite\",\n  \"build\": \"vite build\"            // ✗ ships even with type errors\n}", "✗ common setup"], ["JSON", "\"scripts\": {\n  \"dev\": \"vite\",\n  \"typecheck\": \"tsc --noEmit\",\n  \"build\": \"tsc --noEmit && vite build\"   // ✓ fail the build on type errors\n}", "✓ Good"]], "p": "esbuild and SWC remove TypeScript syntax for speed without type-checking. Make sure <code>tsc<\/code> runs in CI or in the build script."}, {"k": "Gotcha · env vars are public", "h": "Everything in the bundle is readable by anyone", "cmp": [["TS", "// only VITE_-prefixed vars are exposed to client code\nconst api = import.meta.env.VITE_API_URL;      // fine: public config\nconst key = import.meta.env.VITE_STRIPE_SECRET; // ✗ now in the JS bundle", "example"]], "p": "\"Environment variables\" in frontend code are <b>inlined at build time<\/b> as literal strings. Never put secrets there; keep them on the server. Also: changing one requires a rebuild, not a restart."}, {"k": "Tree-shaking", "h": "Dead code elimination needs static imports", "cmp": [["TS", "import _ from 'lodash';            // ✗ whole library (~70 kB)\nimport * as icons from './icons';  // ✗ may pull every icon\nexport * from './everything';      // ✗ huge barrel files slow builds and tests", "✗ watch for"], ["TS", "import debounce from 'lodash/debounce';    // ✓ just one function\nimport { SearchIcon } from './icons';      // ✓ named, analysable", "✓ Good"]], "p": "Bundlers remove unused <b>ES module<\/b> exports. CommonJS (<code>require<\/code>), side-effectful modules and dynamic access defeat it. Check bundle size in review with a visualiser (<code>rollup-plugin-visualizer<\/code>, <code>source-map-explorer<\/code>)."}, {"quiz": true, "k": "Quiz 4 / 6 · Build", "h": "CI passes <code>vite build<\/code>, but the code has an obvious type error. How?", "opts": [["Vite only strips types; nothing ran tsc", 1], ["TypeScript ignores .tsx files", 0], ["Minification hid it", 0]], "right": "Vite transforms with esbuild, which removes types without checking them. Add <code>tsc --noEmit<\/code> to CI.", "wrong": "The bundler <b>strips<\/b> TS types for speed. Type-checking is a separate <code>tsc<\/code> step."}, {"k": "Go deeper · Bundling", "h": "Go deeper", "links": [["Why Vite", "https://vite.dev/guide/why", "Vite docs. Why native-ESM dev servers and Rollup builds, explained clearly."], ["Learn Vite (Frontend Masters)", "https://frontendmasters.com/courses/vite/", "Video course on configuring and understanding Vite builds."]]}, {"sect": 1, "num": "5", "kicker": "Section 5 · Code splitting", "h": "Ship less <span class=\"grad\">JavaScript<\/span>", "p": "Load code for the screen the user is on, not the whole app.", "first": false}, {"k": "Dynamic import", "h": "The primitive behind all code splitting", "cmp": [["TS", "// static: always in the main bundle\nimport { exportCsv } from './exportCsv';\n\n// dynamic: separate chunk, fetched when this line runs\nbutton.onclick = async () => {\n  const { exportCsv } = await import('./exportCsv');\n  exportCsv(rows);\n};", "example"]], "p": "<code>import()<\/code> returns a promise. The bundler sees it and emits the module (and its dependencies) as a separate chunk file that is only downloaded on demand."}, {"k": "React.lazy + Suspense", "h": "Split by route or by heavy widget", "cmp": [["TSX", "const Reports = lazy(() => import('./Reports'));   // module scope\n\n<Suspense fallback={<Spinner />}>\n  <Routes>\n    <Route path=\"/reports\" element={<Reports />} />\n  <\/Routes>\n<\/Suspense>", "✓ route-level split"]], "steps": ["User navigates to <code>/reports<\/code>", "<code>&lt;Reports&gt;<\/code> isn't loaded yet: it suspends, nearest Suspense shows the fallback", "Browser fetches <code>Reports-9c4d11.js<\/code>", "Chunk evaluates; React renders Reports in place of the fallback"], "p": "Routes are the natural split points. Also good: charts, rich-text editors, PDF viewers, admin-only screens."}, {"k": "Code splitting gotchas", "h": "Mistakes to catch in review", "cmp": [["TSX", "function Page() {\n  const Chart = lazy(() => import('./Chart'));   // ✗ new component every render\n  return <Chart />;                               //   → remounts, refetches forever\n}", "✗ AI sometimes writes"], ["TSX", "const Chart = lazy(() => import('./Chart'));     // ✓ at module top level\nfunction Page() { return <Suspense fallback={<Skeleton />}><Chart /><\/Suspense>; }", "✓ Good"]], "bul": ["<b>Too fine<\/b>: dozens of tiny chunks = request overhead and waterfalls.", "<b>Waterfalls<\/b>: chunk loads, then it fetches data, then a nested chunk. Preload on hover/intent: call the <code>import()<\/code> early.", "<b>Default exports<\/b>: <code>lazy<\/code> expects <code>{ default: Component }<\/code>.", "<b>Failures<\/b>: a chunk can fail to load (offline, or deleted by a deploy). Wrap with an error boundary that offers reload."], "g": true}, {"quiz": true, "k": "Quiz 5 / 6 · Splitting", "h": "Where should <code>lazy(() =&gt; import('./Editor'))<\/code> be called?", "opts": [["Inside the component that renders the editor", 0], ["At module top level, once", 1], ["Inside a useEffect", 0]], "right": "Calling lazy during render creates a new component type each time, so React remounts it. Declare it once at module scope.", "wrong": "At <b>module scope<\/b>. Inside a component it creates a new type every render and remounts."}, {"k": "Go deeper · Code splitting", "h": "Go deeper", "links": [["React.lazy", "https://react.dev/reference/react/lazy", "react.dev reference with pitfalls (declare at top level, default export)."], ["Code Splitting (webpack guide)", "https://webpack.js.org/guides/code-splitting/", "The concepts (entry points, dynamic imports, shared chunks) apply to any bundler."]]}, {"sect": 1, "num": "6", "kicker": "Section 6 · Caching", "h": "Caching, <span class=\"grad\">layer by layer<\/span>", "p": "Why deploys sometimes show users a broken app, and how hashed filenames fix it.", "first": false}, {"k": "Cache layers", "h": "A request can be answered at many levels", "steps": ["<b>Memory / disk cache<\/b> in the browser (HTTP cache)", "<b>Service worker<\/b> cache, if the app installs one (PWA)", "<b>CDN edge<\/b> close to the user", "<b>Origin<\/b> server / object storage", "<b>App-level data cache<\/b> (TanStack Query) for API JSON, in JS memory"], "p": "HTTP caching is controlled by response headers, mainly <code>Cache-Control<\/code>. The app-level data cache is a separate concern, covered in Part 6."}, {"k": "The hashed-filename strategy", "h": "Cache assets forever, the HTML never", "cmp": [["HTTP", "# index.html: always check for a new version\nCache-Control: no-cache\n\n# /assets/index-b71e02.js: name changes when content changes\nCache-Control: public, max-age=31536000, immutable", "headers"]], "steps": ["Build emits <code>index-b71e02.js<\/code>; the hash is derived from the content", "Browsers cache it for a year and never revalidate (<code>immutable<\/code>)", "You change code → new build → <code>index-5d0c77.js<\/code>", "<code>index.html<\/code> (revalidated every time) now points to the new name → users get the new code"], "p": "<code>no-cache<\/code> does <b>not<\/b> mean \"don't cache\"; it means \"revalidate before use\". <code>no-store<\/code> means don't store at all."}, {"k": "Revalidation", "h": "ETag and 304 Not Modified", "cmp": [["HTTP", "GET /index.html\n← 200 OK  ETag: \"abc123\"  Cache-Control: no-cache\n\nGET /index.html   If-None-Match: \"abc123\"\n← 304 Not Modified          (no body, use your cached copy)", "flow"]], "an": "Same mechanism as Rails <code>fresh_when<\/code> / <code>stale?<\/code> conditional GETs."}, {"k": "Caching gotchas", "h": "Deploy-time bugs to know about", "g": true, "bul": ["<b>Long-cached index.html<\/b>: users keep loading old HTML pointing at old chunks for days.", "<b>Deleted old chunks<\/b>: a user with the old app open lazy-loads <code>Reports-9c4d11.js<\/code> after a deploy removed it → <code>ChunkLoadError<\/code>. Keep previous assets for a while, and catch chunk errors with a \"new version, reload\" prompt.", "<b>Unhashed assets<\/b> (<code>/logo.png<\/code>, <code>/config.js<\/code>) with long max-age never update.", "<b>Service workers<\/b> can serve stale apps aggressively; a buggy one is hard to remove.", "<b>API responses<\/b>: authenticated JSON usually needs <code>private<\/code> or <code>no-store<\/code> so CDNs don't share it between users."]}, {"quiz": true, "k": "Quiz 6 / 6 · Caching", "h": "After a deploy, some users get \"Failed to fetch dynamically imported module\" when opening Reports. Most likely cause?", "opts": [["Their browser doesn't support import()", 0], ["They're running the old app, whose chunk filename no longer exists on the server", 1], ["The CDN is down", 0]], "right": "The old <code>index.html<\/code>/main bundle references old hashed chunks that the deploy removed. Keep old assets around and prompt for reload on chunk errors.", "wrong": "Old app, missing old <b>chunk<\/b>. Hashing gives cache safety but requires keeping previous assets or handling the load error."}, {"k": "Go deeper · Caching", "h": "Go deeper", "links": [["HTTP caching (MDN)", "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching", "MDN. Cache-Control, freshness, validation and heuristics in depth."], ["Prevent unnecessary network requests with the HTTP Cache", "https://web.dev/articles/http-cache", "web.dev. Practical header recipes for hashed and unhashed assets."], ["Caching best practices & max-age gotchas", "https://jakearchibald.com/2016/caching-best-practices/", "Jake Archibald. Classic article on exactly the deploy problems above."]]}, {"recap": true, "h": "UI architecture on one card", "items": ["<b>CSR<\/b>: shell + JS + JSON. <b>SSR<\/b>: HTML per request, then hydrate. <b>SSG<\/b>: HTML at build time. Mix per route.", "<b>Hydration<\/b> attaches React to server HTML; the first client render must match. No <code>window<\/code>, dates or randomness in render.", "<b>Routing<\/b> = History API + a URL→component map. Use <code>&lt;Link&gt;<\/code>, add the SPA fallback, keep shareable state in the URL.", "<b>Build<\/b>: resolve → transform → tree-shake → chunk → minify → hash. Types aren't checked by the bundler; env vars are public.", "<b>Code splitting<\/b> with <code>import()<\/code> and <code>lazy<\/code> at module scope, mostly per route.", "<b>Caching<\/b>: hashed assets <code>immutable<\/code>, <code>index.html<\/code> <code>no-cache<\/code>, handle chunk load errors after deploys."], "next": "Next: <b>Part 4<\/b>, React fundamentals."}];
</script>
<script>(function(){
  "use strict";
  var KW='const|let|var|function|return|if|else|async|await|new|class|interface|type|import|export|default|from|def|end|public|private|static|final|void|try|catch|throw|typeof|record|enum|module|for|of|in|null|undefined|true|false|this|self|nil|package|implements|extends|describe|it|test|expect|before|beforeEach|afterEach|require|do|switch|case|while';
  var RE=new RegExp('(\\/\\/[^\\n]*|#(?!\\{)[^\\n]*)|("[^"\\n]*"|\'[^\'\\n]*\'|`[^`]*`)|\\b('+KW+')\\b','g');
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function hl(src){ var out='',last=0,m; RE.lastIndex=0;
    while((m=RE.exec(src))){ out+=esc(src.slice(last,m.index)); out+= m[1]?'<span class="c">'+esc(m[1])+'</span>': m[2]?'<span class="s">'+esc(m[2])+'</span>':'<span class="k">'+m[3]+'</span>'; last=RE.lastIndex; }
    return out+esc(src.slice(last)); }
  var LC={JS:['#2a2510','#f7d046'],TS:['#13243a','#4ea8ff'],JSX:['#102a2a','#4ee6e0'],TSX:['#102a2a','#4ee6e0'],Java:['#2a1a14','#ff7a45'],Ruby:['#3a1624','#ff5c8a'],Bash:['#1a2a1a','#3ddc97'],HTTP:['#22183a','#a78bfa'],HTML:['#2a1a14','#ff7a45'],JSON:['#22183a','#a78bfa'],Text:['#1b2131','#a3acc2']};
  var stage=document.getElementById('stage'), anchor=document.getElementById('bottomBar');
  CARDS.forEach(function(c){
    if(c.raw){ anchor.insertAdjacentHTML('beforebegin',c.raw); return; }
    var s=document.createElement('section'); s.className='card'; var h='';
    if(c.sect){ s.className+=' sect';
      h='<div class="visual"><div class="num pop">'+c.num+'</div></div>'+(c.badge?'<div class="titlebadge"><i></i>'+c.badge+'</div>':'')+'<div class="kicker">'+c.kicker+'</div><h1>'+c.h+'</h1><p>'+c.p+'</p>'+(c.first?'<div class="tapme">Tap the right side or swipe left →</div>':'');
    } else if(c.quiz){ s.className+=' quiz'; s.setAttribute('data-quiz','');
      h='<div class="kicker">'+c.k+'</div><h2>'+c.h+'</h2>'+(c.code?'<div class="qcode">'+hl(c.code)+'</div>':'<div style="height:10px"></div>')+'<div class="opts">'+c.opts.map(function(o,i){return '<button class="opt" type="button" data-ok="'+o[1]+'"><span class="l">'+'ABCD'[i]+'</span>'+o[0]+'</button>';}).join('')+'</div><div class="fb"></div>';
    } else if(c.recap){
      h='<div class="kicker">Recap</div><h2>'+c.h+'</h2><ul class="take">'+
        c.items.map(function(t,i){return '<li class="rise" style="--d:'+(i*0.15)+'s">'+t+'</li>';}).join('')+
        '</ul><div class="score" id="score"></div><p style="font-size:13px;margin-top:8px">'+c.next+'</p><a class="btn ghost" href="index.html" style="margin-top:6px">← Course home</a>';
    } else if(c.links){ s.className+=' deep';
      h='<div class="kicker">'+c.k+'</div><h2>'+c.h+'</h2>'+(c.p?'<p>'+c.p+'</p>':'')+'<ul class="links">'+c.links.map(function(l,i){return '<li class="rise" style="--d:'+(i*0.15)+'s"><a href="'+l[1]+'" target="_blank" rel="noopener"><b>'+l[0]+' ↗</b><small>'+l[2]+'</small></a></li>';}).join('')+'</ul>';
    } else {
      var inner='';
      if(c.v){ inner+=c.v; }
      if(c.steps){ var n=c.steps.length; inner+='<ol class="steps">'+c.steps.map(function(t,i){return '<li style="--d:'+(i*0.6)+'s"><span>'+t+'</span></li>';}).join('')+'</ol>'; }
      if(c.cmp){ inner+='<div class="stack">'+c.cmp.map(function(b,i){ var col=LC[b[0]]||LC.JS, lab=b[2]||'example', cls=lab.charAt(0)==='✗'?' warn':lab.charAt(0)==='✓'?' ok':''; return '<div class="cb rise'+cls+'" style="--d:'+(i*0.25)+'s"><div class="cb-h">'+lab+' <span class="tagc" style="background:'+col[0]+';color:'+col[1]+'">'+b[0]+'</span></div><pre>'+hl(b[1])+'</pre></div>'; }).join('')+'</div>'; }
      h='<div class="kicker">'+c.k+'</div>'+(inner?'<div class="visual">'+inner+'</div>':'')+'<h2>'+c.h+'</h2>'+(c.p?'<p>'+c.p+'</p>':'')+(c.bul?'<ul class="chk'+(c.g?' g':'')+'">'+c.bul.map(function(t,i){return '<li class="rise" style="--d:'+(i*0.12)+'s">'+t+'</li>';}).join('')+'</ul>':'')+(c.an?'<div class="analogy"><span>'+c.an+'</span></div>':'');
    }
    s.innerHTML=h; if(c.quiz){ var fb=s.querySelector('.fb'); fb.setAttribute('data-right',c.right); fb.setAttribute('data-wrong',c.wrong); }
    stage.insertBefore(s, anchor);
  });
})();
</script>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var stage=$('stage'), cards=[].slice.call(document.querySelectorAll('.card')), segsEl=$('segs'), countEl=$('count'), prevBtn=$('prev'), nextBtn=$('next');
  var cur=0, N=cards.length, answered=0, correct=0, NQ=document.querySelectorAll('[data-quiz]').length;
  cards.forEach(function(){ var s=document.createElement('div'); s.className='seg'; s.appendChild(document.createElement('i')); segsEl.appendChild(s); });
  var segs=segsEl.children;
  function go(n){
    n=Math.max(0,Math.min(N-1,n));
    cards.forEach(function(c,k){ c.classList.toggle('past',k<n); if(k!==n) c.classList.remove('active'); c.setAttribute('aria-hidden',k!==n); });
    var card=cards[n]; card.classList.remove('active'); void card.offsetWidth; card.classList.add('active');
    for(var k=0;k<N;k++) segs[k].classList.toggle('done',k<=n);
    countEl.textContent=(n+1)+' / '+N; prevBtn.disabled=n===0; nextBtn.disabled=n===N-1; cur=n; try{var _k='lp:'+location.pathname.split('/').pop(),_o=JSON.parse(localStorage.getItem(_k)||'{}');localStorage.setItem(_k,JSON.stringify({max:Math.max(_o.max||0,n+1),total:N}));}catch(_e){} updateScore();
    try{ history.replaceState(null,'','#'+(n+1)); }catch(e){}
  }
  function next(){ if(cur<N-1) go(cur+1); } function prev(){ if(cur>0) go(cur-1); }
  prevBtn.addEventListener('click',function(e){e.stopPropagation();prev();});
  nextBtn.addEventListener('click',function(e){e.stopPropagation();next();});
  
  var lastSwipe=0;
  stage.addEventListener('click',function(e){
    if(Date.now()-lastSwipe<450) return;
    if(e.target.closest('button, a, .opts, .demo, textarea, iframe')) return;
    var r=stage.getBoundingClientRect(); if((e.clientX-r.left)/r.width<0.3) prev(); else next();
  });
  var sx=0,sy=0,tr=false;
  stage.addEventListener('touchstart',function(e){ if(e.target.closest('textarea')) return; var t=e.touches[0]; sx=t.clientX; sy=t.clientY; tr=true; },{passive:true});
  stage.addEventListener('touchend',function(e){ if(!tr) return; tr=false; var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){ lastSwipe=Date.now(); if(dx<0) next(); else prev(); } },{passive:true});
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='TEXTAREA') return;
    if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter')) return;
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
    else if(e.key==='Home') go(0); else if(e.key==='End') go(N-1);
  });
  [].forEach.call(document.querySelectorAll('[data-quiz]'),function(q){
    var opts=q.querySelector('.opts'), fb=q.querySelector('.fb');
    [].forEach.call(opts.querySelectorAll('.opt'),function(b){
      b.addEventListener('click',function(e){
        e.stopPropagation(); if(opts.classList.contains('done')) return;
        opts.classList.add('done'); answered++;
        var ok=b.getAttribute('data-ok')==='1'; if(ok) correct++; else b.classList.add('wrong');
        opts.querySelector('[data-ok="1"]').classList.add('right');
        fb.innerHTML='<span class="tag" style="color:'+(ok?'var(--green)':'var(--pink)')+'">'+(ok?'✓ Correct.':'✗ Not quite.')+'</span> '+fb.getAttribute(ok?'data-right':'data-wrong')+'<br><span style="color:var(--dim);font-size:12px">Tap or swipe to continue →</span>';
        fb.classList.add('show');
      });
    });
  });
  function updateScore(){ var s=$('score'); s.textContent=answered?('Quiz score: '+correct+' / '+NQ+(answered<NQ?' ('+(NQ-answered)+' skipped)':'')):''; }

  var start=parseInt((location.hash||'').slice(1),10); go(isNaN(start)?0:start-1);
})();
</script>
