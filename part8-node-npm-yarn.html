<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07080d"><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Part 8 · Node, npm, Yarn &amp; pnpm</title><style>
:root{
  --bg:#07080d; --panel:#121622; --panel2:#181d2b; --line:#2a3145; --text:#eef1f8; --muted:#a3acc2; --dim:#5d6680;
  --html:#ff7a45; --css:#4ea8ff; --js:#f7d046; --green:#3ddc97; --purple:#a78bfa; --pink:#ff5c8a; --cyan:#4ee6e0;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
.app{position:fixed;inset:0;display:flex;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#141a2e 0,transparent 60%),var(--bg)}
.stage{position:relative;width:100%;max-width:460px;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y}
@media (min-width:600px){.stage{height:min(100%,900px);margin:auto;border-radius:28px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 300px at 85% 10%,rgba(167,139,250,.10),transparent 70%),radial-gradient(500px 300px at 0% 90%,rgba(78,168,255,.08),transparent 70%);pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
.segs{display:flex;gap:3px}
.seg{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--css),var(--purple));transition:width .35s ease}
.seg.done i{width:100%}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.meta b{color:var(--text);font-weight:600}
.card{position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 58px) 22px calc(env(safe-area-inset-bottom) + 64px);display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(40px) scale(.98);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s linear .45s}
.card.past{transform:translateX(-40px) scale(.98)}
.card.active{opacity:1;visibility:visible;transform:none;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
.kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);margin-bottom:6px}
.visual{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;margin:4px 0 14px}
.visual svg{width:100%;height:100%;max-height:330px;overflow:visible}
h1,h2{margin:0 0 10px;line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(30px,9vw,40px)}
h2{font-size:clamp(22px,6.4vw,28px)}
p{margin:0 0 8px;font-size:clamp(15px,4.2vw,17px);line-height:1.5;color:var(--muted)}
p b,p strong{color:var(--text);font-weight:600}
code,.mono{font-family:var(--mono);font-size:.9em}
p code,.analogy code{background:#1b2131;border:1px solid var(--line);padding:1px 5px;border-radius:6px;color:#dfe5f5}
.analogy{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,rgba(78,168,255,.10),rgba(167,139,250,.10));border:1px solid rgba(120,140,255,.25);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;color:#cfd6ea;margin-top:6px}
.analogy::before{content:"⚙";font-size:15px;color:var(--css);line-height:1.3}
.analogy b{color:#fff}
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:0 14px calc(env(safe-area-inset-bottom) + 12px)}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(18,22,34,.8);color:var(--text);font-size:20px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
.nav:disabled{opacity:.3}
.hint{font-size:12px;color:var(--dim)}
svg *{transform-box:fill-box;transform-origin:center}
.active .pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.35) both;animation-delay:var(--d,0s)}
.active .fade{animation:fade .6s ease both;animation-delay:var(--d,0s)}
.active .rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.growx{transform-origin:left center}
.active .growx{animation:growx .6s ease both;animation-delay:var(--d,0s)}
.active .draw{stroke-dasharray:var(--len,300);animation:draw 1s ease both;animation-delay:var(--d,0s)}
.flow{stroke-dasharray:4 6;animation:flow 1s linear infinite}
.pulse{animation:pulse 2s ease-in-out infinite;animation-delay:var(--pd,0s)}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:var(--len,300)}to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes goR{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(60px);opacity:0}}
@keyframes goL{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(-72px);opacity:0}}
.req{animation:goR 2.4s ease-in-out infinite}
.chunk{opacity:0;animation:goL 2.4s linear infinite;animation-delay:var(--d,0s)}
.titlebadge{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;margin-bottom:14px;align-self:flex-start;background:rgba(255,255,255,.03)}
.titlebadge i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.tapme{margin-top:6px;font-size:13px;color:var(--dim);animation:pulse 1.8s infinite}
.grad{background:linear-gradient(90deg,var(--html),var(--js) 35%,var(--css) 70%,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.lay{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.lay-frame{width:100%;border:1px solid var(--line);border-radius:14px;padding:8px;background:#0d111b;display:flex;flex-direction:column;gap:6px;animation:resize 5s ease-in-out infinite alternate;position:relative}
@keyframes resize{0%,15%{width:100%}85%,100%{width:52%}}
.lay .b{border-radius:8px;font:600 11px/1 var(--mono);display:flex;align-items:center;justify-content:center;color:#0b0e16;padding:0 4px;overflow:hidden;white-space:nowrap}
.lay .hdr{height:26px;background:var(--css)}
.lay-row{display:flex;gap:6px}
.lay .side{flex:0 0 26%;height:54px;background:var(--purple)}
.lay .main{flex:1;height:54px;background:var(--green)}
.lay-cards{display:flex;flex-wrap:wrap;gap:6px}
.lay .c{flex:1 1 64px;height:30px;background:var(--js)}
.ruler{font:12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.ruler span{display:inline-block;height:2px;width:40px;background:linear-gradient(90deg,var(--pink),var(--js));border-radius:2px}
.comp{position:relative;width:250px;height:230px;perspective:800px}
.comp-in{position:absolute;inset:0;transform-style:preserve-3d}
.layer{position:absolute;left:25px;top:30px;width:200px;height:170px;border-radius:14px;border:1px solid rgba(255,255,255,.18);transform-origin:center;animation:explode 6s ease-in-out infinite;--z:0px;display:flex;align-items:flex-end;justify-content:flex-end;padding:8px;font:600 10px var(--mono);color:rgba(255,255,255,.85)}
.l1{--z:-60px;background-color:#151b30;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:16px 16px}
.l2{--z:0px;background:rgba(78,168,255,.18)}
.l2::before{content:"";position:absolute;left:66px;top:16px;width:112px;height:10px;border-radius:5px;background:rgba(255,255,255,.75);box-shadow:0 22px 0 rgba(255,255,255,.4),0 40px 0 rgba(255,255,255,.4),0 58px 0 rgba(255,255,255,.4),0 86px 0 -1px rgba(61,220,151,.7)}
.l3{--z:60px;width:56px;background:rgba(167,139,250,.6);animation-name:explode3;align-items:flex-start;justify-content:center;padding-top:10px;text-align:center}
@keyframes explode{0%,22%,100%{transform:rotateX(56deg) rotateZ(-38deg) translateZ(var(--z))}48%,80%{transform:rotateX(0) rotateZ(0) translateZ(0)}}
@keyframes explode3{0%,22%,100%{transform:rotateX(56deg) rotateZ(-38deg) translateZ(var(--z))}48%{transform:translateX(-60px)}62%,80%{transform:translateX(0)}}
.comp-tag{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font:12px var(--mono);color:var(--muted)}
.cost{width:100%;display:grid;grid-template-columns:92px repeat(5,1fr);gap:6px;font-size:10.5px;align-items:center}
.cost .h{color:var(--dim);text-align:center;font-weight:600;letter-spacing:.02em}
.cost .lbl{font:600 11px var(--mono);color:var(--text);line-height:1.3}
.cost .lbl small{display:block;color:var(--dim);font-weight:400}
.cell{height:30px;border-radius:8px;background:#151a27;border:1px dashed #262d40}
.cell.on{background:var(--c);border:0;box-shadow:0 0 14px var(--c)}
.active .cell.on{animation:light .45s ease both;animation-delay:var(--d,0s)}
@keyframes light{from{opacity:.1;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.costtag{grid-column:2/7;font-size:11px;color:var(--muted);text-align:right;margin-top:-2px}
.qcode{font:13px/1.55 var(--mono);background:#0d111b;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0 14px;color:#cdd5ea;white-space:pre;overflow-x:auto}
.qcode .k{color:var(--purple)}.qcode .s{color:var(--green)}.qcode .t{color:var(--html)}.qcode .c{color:var(--dim)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:15px;line-height:1.35;cursor:pointer;transition:transform .15s,border-color .2s,background .2s,opacity .2s}
.opt:active{transform:scale(.98)}
.opt:focus-visible{outline:2px solid var(--css)}
.opt .l{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#1e2436;font:700 12px var(--mono);color:var(--muted)}
.opt code{font-size:13px}
.opt.right{border-color:var(--green);background:rgba(61,220,151,.12)}
.opt.right .l{background:var(--green);color:#06210f}
.opt.wrong{border-color:var(--pink);background:rgba(255,92,138,.12);animation:shake .4s}
.opt.wrong .l{background:var(--pink);color:#2a0612}
.opts.done .opt:not(.right):not(.wrong){opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.fb{margin-top:12px;font-size:14px;line-height:1.45;color:var(--muted);opacity:0;transform:translateY(8px);transition:.3s}
.fb.show{opacity:1;transform:none}
.fb b{color:var(--text)}
.fb code{background:#1b2131;padding:1px 4px;border-radius:5px;color:#dfe5f5}
.fb .tag{display:inline-block;font-weight:800;margin-right:4px}
.qspacer{flex:1}
.rx{width:100%;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.rx-row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.rx-box{flex:1;background:#0d111b;border:1px solid var(--line);border-radius:12px;padding:10px 8px;font:11px/1.4 var(--mono);color:#cdd5ea;min-height:62px;display:flex;flex-direction:column;justify-content:center}
.rx-box .cap{font:700 9px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.rx-arrow{color:var(--purple);font:700 13px var(--mono);flex:0 0 auto}
.rx-f{flex:0 0 auto;background:linear-gradient(135deg,rgba(167,139,250,.25),rgba(78,168,255,.2));border:1px solid rgba(167,139,250,.5);border-radius:12px;padding:10px 7px;font:700 12px var(--mono)}
.rx-ui{background:#f5f6fa;color:#141824;border-radius:14px;padding:9px 10px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);min-height:62px}
.rx-ui .bar{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.rx-ui .badge{background:#ff5c1a;color:#fff;border-radius:999px;padding:1px 8px;font-size:11px}
.rx-ui ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.rx-ui li{background:#e7e9f2;border-radius:6px;padding:3px 6px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px #3ddc97}100%{box-shadow:0 0 0 0 transparent}}
.rx-note{font-size:12px;color:var(--dim);text-align:center}
.btn{all:unset;cursor:pointer;align-self:center;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,var(--purple),var(--css));color:#fff;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(120,120,255,.35)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--text);align-self:flex-start}
.flowchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;width:100%}
.chip{padding:7px 10px;border-radius:10px;font:700 12px var(--mono);color:#0b0e16;display:inline-block}
.arr{color:var(--dim);font-size:12px}
.take{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px;width:100%}
.take li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.4;color:#cfd6ea}
.take li b{color:#fff}
.score{font-size:13px;color:var(--muted);margin-top:10px}
.next-tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.next-tags span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);font-family:var(--mono)}
@media (max-height:700px){.visual svg{max-height:230px}.qcode{font-size:12px;padding:8px 10px;margin:4px 0 8px}.opt{padding:10px 12px}.analogy{font-size:13px;padding:8px 10px}p{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ---- lesson 1b additions ---- */
.net{width:100%;background:#0d111b;border:1px solid var(--line);border-radius:12px;overflow:hidden;font:10.5px/1.2 var(--mono)}
.net-h,.net-r{display:grid;grid-template-columns:1.35fr 46px 40px 1fr;gap:6px;align-items:center;padding:6px 9px}
.net-h{color:var(--dim);font:700 8.5px system-ui;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line);background:#121622}
.net-r{border-bottom:1px solid #161b28;color:#cdd5ea}
.net-r:last-of-type{border-bottom:0}
.net-r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net-r .t{color:var(--muted);font-size:9.5px}
.net-r .z{color:var(--muted);text-align:right;font-size:9.5px}
.net-r.dim{color:#59627a}.net-r.dim .t,.net-r.dim .z{color:#454d63}.net-r.dim .wf i{opacity:.35}
.net-r.hl{background:rgba(78,168,255,.09);box-shadow:inset 3px 0 0 var(--css)}
.wf{position:relative;height:9px;background:repeating-linear-gradient(90deg,transparent 0 19.6%,#1a2030 19.6% 20%)}
.wf i{position:absolute;top:0;height:100%;border-radius:3px;left:var(--s);width:var(--w);background:var(--c);transform-origin:left center}
.active .net-r{animation:rise .4s ease both;animation-delay:var(--d,0s)}
.active .wf i{animation:growx .5s ease both;animation-delay:calc(var(--d,0s) + .15s)}
.net-foot{padding:5px 9px;color:var(--dim);font-size:9px;display:flex;justify-content:space-between;border-top:1px solid var(--line);background:#121622}
.netwrap{width:100%;display:flex;flex-direction:column;gap:10px}
.cb{width:100%;font:11.5px/1.5 var(--mono);background:#0d111b;border:1px solid var(--line);border-radius:12px;color:#cdd5ea;overflow:hidden}
.cb pre{margin:0;padding:9px 11px;white-space:pre;overflow-x:auto;font:inherit}
.cb-h{display:flex;justify-content:space-between;align-items:center;padding:5px 11px;background:#121622;border-bottom:1px solid var(--line);font:700 9px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.cb-h .tagc{font:700 9.5px var(--mono);letter-spacing:0;text-transform:none;padding:2px 7px;border-radius:999px}
.k{color:var(--purple)}.s{color:var(--green)}.t{color:var(--html)}.c{color:var(--dim)}.y{color:var(--js)}.bl{color:var(--css)}
.mk{background:rgba(247,208,70,.18);color:var(--js);border-radius:4px;padding:0 2px}
.stack{width:100%;display:flex;flex-direction:column;gap:8px}
.down{align-self:center;color:var(--purple);font:700 13px var(--mono);line-height:1}
/* phone mock */
.phone{width:178px;height:300px;border-radius:26px;border:2px solid #2a3145;background:#0b0e16;padding:12px 10px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.5);flex:0 0 auto;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.url{font:10px var(--mono);background:#181d2b;border-radius:8px;padding:6px 8px;color:var(--muted);white-space:nowrap;overflow:hidden}
.url b{color:var(--text);font-weight:600}
.pg{flex:1;border-radius:12px;background:#f3f5fa;padding:10px 9px;display:flex;flex-direction:column;gap:7px;color:#141824;font-size:11px;overflow:hidden;position:relative}
.pg.blank{background:#fff}
.pg .ttl{font-weight:800;font-size:12.5px;display:flex;justify-content:space-between;align-items:center}
.sk{height:30px;border-radius:8px;background:linear-gradient(90deg,#e1e5ee 0,#f0f2f7 40%,#e1e5ee 80%);background-size:250% 100%;animation:shimmer 1.3s linear infinite}
.sk.sm{height:12px;width:60%}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-150% 0}}
.prow{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e3e6ee;border-radius:8px;padding:7px 8px;font-size:10.5px;font-weight:600;color:#141824;cursor:pointer}
.prow span{font-weight:500;font-size:9px;color:#fff;background:#3ddc97;border-radius:999px;padding:1px 6px}
.prow span.pl{background:#f7a046}
.prow.tapme2{box-shadow:0 0 0 0 rgba(255,92,26,.6);animation:ring 1.6s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,92,26,.55)}70%{box-shadow:0 0 0 8px rgba(255,92,26,0)}100%{box-shadow:0 0 0 0 rgba(255,92,26,0)}}
.dom{font:10.5px/1.55 var(--mono);color:#cdd5ea;background:#0d111b;border:1px solid var(--line);border-radius:12px;padding:10px;flex:1;min-width:0;white-space:pre;overflow:hidden}
.row2{display:flex;gap:12px;align-items:center;width:100%;justify-content:center}
.swap-a{animation:none}
.active .later{animation:fade .5s ease both;animation-delay:var(--d,1.5s)}
.active .gone{animation:gone .4s ease both;animation-delay:var(--d,1.5s)}
@keyframes gone{to{opacity:0;height:0;margin:0;padding:0}}
/* comparison table */
.vs{width:100%;display:grid;grid-template-columns:76px 1fr 1fr;gap:5px;font-size:12px;line-height:1.3}
.vs div{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 8px;color:#cfd6ea}
.vs .vh{font-weight:800;text-align:center;border:0}
.vs .vh.code{background:rgba(247,208,70,.14);color:var(--js)}
.vs .vh.data{background:rgba(61,220,151,.14);color:var(--green)}
.vs .vl{background:transparent;border:0;color:var(--dim);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;padding:0}
.trio{width:100%;display:flex;flex-direction:column;gap:7px}
.trio .cb pre{padding:6px 10px;font-size:10.5px}
.find{font-size:12px;color:var(--muted);text-align:center}

<script>var CARDS = [{"sect":1,"num":"PM","kicker":"Part 8 · Package management","h":"Node, npm, Yarn &amp; pnpm <span class=\"grad\">without the mystery<\/span>","p":"The runtime, the manifest, semver ranges, lockfiles, the three package managers, workspaces, private registries and supply-chain safety. Enough to review any <code>package.json<\/code> diff with confidence.","first":true,"badge":"~30 min · 62 cards · 8 quizzes"},{"sect":1,"num":"1","kicker":"Section 1","h":"Node, the runtime","p":"What Node is, how it differs from the browser, and how to pin its version."},{"k":"Section 1 · Runtime","h":"JavaScript outside the browser","v":"<svg viewBox=\"0 0 320 170\"><rect class=\"pop\" x=\"10\" y=\"20\" width=\"140\" height=\"130\" rx=\"12\" fill=\"#151b30\" stroke=\"#4ea8ff\"/><text x=\"80\" y=\"42\" fill=\"#fff\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Browser<\/text><text x=\"80\" y=\"64\" fill=\"#a3acc2\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">V8 engine<\/text><text x=\"80\" y=\"84\" fill=\"#a3acc2\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">+ DOM, fetch, window<\/text><text x=\"80\" y=\"104\" fill=\"#a3acc2\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">sandboxed: no files<\/text><rect class=\"pop\" style=\"--d:.3s\" x=\"170\" y=\"20\" width=\"140\" height=\"130\" rx=\"12\" fill=\"#10261c\" stroke=\"#3ddc97\"/><text x=\"240\" y=\"42\" fill=\"#fff\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Node.js<\/text><text x=\"240\" y=\"64\" fill=\"#a3acc2\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">V8 engine<\/text><text x=\"240\" y=\"84\" fill=\"#a3acc2\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">+ fs, net, process<\/text><text x=\"240\" y=\"104\" fill=\"#a3acc2\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">full OS access<\/text><text x=\"160\" y=\"166\" fill=\"#5d6680\" font-size=\"9\" text-anchor=\"middle\">same language, different built-in APIs<\/text><\/svg>","p":"Node is the V8 engine plus OS APIs (files, network, processes). For frontend work you rarely write Node servers, but <b>every tool you use runs on Node<\/b>: the bundler, the dev server, TypeScript, Jest, ESLint and the package manager itself.","an":"Node is to JS what the JVM plus the JDK is to Java: the runtime and the standard library you need to run the build tools."},{"k":"Section 1 · Event loop","h":"One thread, an event loop, async I/O","v":"<ol class=\"steps\"><li style=\"--d:0.0s\">Your script runs top to bottom on <b>one thread<\/b><\/li><li style=\"--d:0.7s\"><code>fs.readFile<\/code> / <code>fetch<\/code> hand work to the OS or a thread pool and return immediately<\/li><li style=\"--d:1.4s\">When the I/O finishes, a callback is queued<\/li><li style=\"--d:2.1s\">The event loop runs queued callbacks one at a time<\/li><li style=\"--d:2.8s\">Promises (microtasks) run before the next timer or I/O callback<\/li><\/ol>","p":"That's why Node tools use <code>async/await<\/code> everywhere. A synchronous CPU-heavy loop blocks <b>everything<\/b>, including the dev server's file watcher.","an":"Closer to Puma with one thread plus non-blocking I/O, or Netty, than to a thread-per-request Tomcat."},{"k":"Section 1 · Versions","h":"Pin the Node version","cmp":[["Bash","# .nvmrc / .node-version (read by nvm, fnm, volta, asdf, CI)\n22\n\n# package.json\n\"engines\": { \"node\": \">=22 <23\" }\n\n# switch locally\nnvm use        # or: fnm use / volta pin node@22\nnode -v        # v22.x","version files"]],"p":"Use an <b>LTS<\/b> (even-numbered) release. Pin it in a version file so local, CI and production all agree. <code>engines<\/code> documents the requirement; npm only warns about it unless you set <code>engine-strict<\/code>.","an":"The same job as <code>.ruby-version<\/code> with rbenv, or a Java toolchain in Gradle."},{"k":"Section 1 · Modules","h":"CommonJS vs ES modules","v":"<div class=\"vs\"><div class=\"vl\"><\/div><div class=\"vh code\">CommonJS (CJS)<\/div><div class=\"vh data\">ES modules (ESM)<\/div><div class=\"vl\">Syntax<\/div><div class=\"rise\" style=\"--d:0.0s\"><code>require()<\/code> / <code>module.exports<\/code><\/div><div class=\"rise\" style=\"--d:0.1s\"><code>import<\/code> / <code>export<\/code><\/div><div class=\"vl\">Loading<\/div><div class=\"rise\" style=\"--d:0.2s\">Synchronous, at runtime<\/div><div class=\"rise\" style=\"--d:0.3s\">Static, analysable, async<\/div><div class=\"vl\">Opt in<\/div><div class=\"rise\" style=\"--d:0.4s\">default for .js<\/div><div class=\"rise\" style=\"--d:0.5s\"><code>\"type\":\"module\"<\/code> or .mjs<\/div><div class=\"vl\">Where<\/div><div class=\"rise\" style=\"--d:0.6s\">Older Node tools and config files<\/div><div class=\"rise\" style=\"--d:0.7s\">Browsers, modern packages, bundlers<\/div><\/div>","p":"Bundlers let you write ESM everywhere. Node itself cares about the file extension and the <code>type<\/code> field. Errors like \"require() of ES Module not supported\" or \"Cannot use import statement outside a module\" mean the two styles were mixed."},{"quiz":true,"k":"Quiz 1 / 8 · Runtime","h":"CI passes, but a teammate gets syntax errors running the build locally. Their <code>node -v<\/code> is 16. Best fix?","opts":[["Rewrite the code for Node 16",0],["Commit .nvmrc + engines and have everyone use that version",1],["Delete node_modules",0]],"right":"Pin the runtime in a version file and in <code>engines<\/code>. Then version managers and CI all pick the same Node.","wrong":"It's a <b>runtime version mismatch<\/b>. Pin it with <code>.nvmrc<\/code> and <code>engines<\/code>, the way you would pin a Ruby or JDK version."},{"k":"Section 1 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://nodejs.org/en/learn/getting-started/introduction-to-nodejs\" target=\"_blank\" rel=\"noopener noreferrer\"><b>Node.js · Introduction to Node.js<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>The official starting point: what Node is and how it runs your code.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://nodejs.org/en/learn/asynchronous-work/event-loop-timers-and-nexttick\" target=\"_blank\" rel=\"noopener noreferrer\"><b>Node.js · The event loop, timers and process.nextTick<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>The event loop phases, explained by the Node team.<\/small><\/a><a class=\"box rise\" style=\"--d:0.4s;text-decoration:none;display:block\" href=\"https://frontendmasters.com/courses/node-js-v3/\" target=\"_blank\" rel=\"noopener noreferrer\"><b>Frontend Masters · Introduction to Node.js, v3 (Scott Moss)<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>A video course on modules, the file system, CLIs and servers.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"sect":1,"num":"2","kicker":"Section 2","h":"package.json","p":"The manifest: the dependency list and the task runner in one file."},{"k":"Section 2 · Anatomy","h":"Read it top to bottom","cmp":[["JSON","{\n  \"name\": \"@acme/storefront\",\n  \"version\": \"3.4.0\",\n  \"private\": true,              // never publish by accident\n  \"type\": \"module\",\n  \"packageManager\": \"pnpm@9.12.0\",\n  \"engines\": { \"node\": \">=22\" },\n  \"scripts\": { \"dev\": \"vite\", \"build\": \"tsc -b && vite build\", \"test\": \"vitest\" },\n  \"dependencies\":    { \"react\": \"^18.3.1\", \"react-dom\": \"^18.3.1\" },\n  \"devDependencies\": { \"typescript\": \"~5.6.2\", \"vite\": \"^5.4.0\" },\n  \"peerDependencies\": {}\n}","package.json"]],"p":"In order: <b>identity<\/b> (name, version, private), <b>runtime<\/b> (type, engines, packageManager), <b>tasks<\/b> (scripts), and <b>dependencies<\/b>.","an":"Gemfile + Rakefile + gemspec in one JSON file. The lockfile plays the role of Gemfile.lock."},{"k":"Section 2 · Dependency kinds","h":"dependencies, dev, peer, optional","v":"<div class=\"vwrap\"><div class=\"box rise\" style=\"--d:0.00s\"><b>dependencies<\/b>: needed at runtime by your code. For an app, everything that ends up in the bundle.<\/div><div class=\"box rise\" style=\"--d:0.25s\"><b>devDependencies<\/b>: build and test tools (TypeScript, Vite, Jest, ESLint). Not installed when someone installs <b>your<\/b> published package.<\/div><div class=\"box rise\" style=\"--d:0.50s\"><b>peerDependencies<\/b>: \"my host must provide this\". A UI library declares <code>react<\/code> as a peer so the app's single React is used.<\/div><div class=\"box rise\" style=\"--d:0.75s\"><b>optionalDependencies<\/b>: install if possible, don't fail otherwise (platform-specific binaries).<\/div><\/div>","p":"For an <b>app<\/b> (not published), dependencies vs devDependencies mostly helps readability and lets production images skip dev tools. For a <b>library<\/b>, getting this wrong ships duplicate Reacts to your users."},{"k":"Section 2 · Entry points","h":"main, module, exports","cmp":[["JSON","{\n  \"name\": \"@acme/ui\",\n  \"type\": \"module\",\n  \"exports\": {\n    \".\":          { \"types\": \"./dist/index.d.ts\", \"import\": \"./dist/index.js\", \"require\": \"./dist/index.cjs\" },\n    \"./button\":   \"./dist/button.js\",\n    \"./styles.css\": \"./dist/styles.css\"\n  },\n  \"sideEffects\": [\"*.css\"]\n}","a library's package.json"]],"p":"<code>exports<\/code> is the package's public API: only listed paths can be imported, so <code>@acme/ui/dist/internal<\/code> is blocked. <code>sideEffects<\/code> tells bundlers which files are safe to tree-shake."},{"k":"Section 2 · Scripts","h":"scripts: read these first in any new repo","cmp":[["Bash","npm run build        # runs \"build\"\nnpm test             # shortcut for \"test\"\nnpm run lint -- --fix   # args after -- go to the script\n\n# lifecycle hooks run automatically:\n#   prebuild → build → postbuild\n#   preinstall / install / postinstall  (also for DEPENDENCIES!)\n#   prepare  (after install, e.g. husky git hooks)\n\n# scripts can call local binaries directly:\n\"build\": \"tsc -b\"    # resolves node_modules/.bin/tsc","scripts"]],"p":"Scripts add <code>node_modules/.bin<\/code> to <code>PATH<\/code>, so <code>tsc<\/code> means the repo's own pinned TypeScript, not a global one. <code>npx tsc<\/code>, <code>yarn dlx<\/code> and <code>pnpm dlx<\/code> run a binary without a global install."},{"quiz":true,"k":"Quiz 2 / 8 · Dependency kinds","h":"You're building a shared React component library. Where should <code>react<\/code> go?","opts":[["dependencies",0],["peerDependencies (plus devDependencies for local tests)",1],["optionalDependencies",0]],"right":"A library should use the <b>host app's<\/b> React. Declare it as a peer, and as a dev dependency so tests can run.","wrong":"Use <b>peerDependencies<\/b>. Putting react in dependencies can install a second copy inside your library's folder, and then you get \"Invalid hook call\"."},{"k":"Section 2 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://docs.npmjs.com/cli/v10/configuring-npm/package-json\" target=\"_blank\" rel=\"noopener noreferrer\"><b>npm docs · package.json<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>The authoritative reference for every field.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://nodejs.org/api/packages.html\" target=\"_blank\" rel=\"noopener noreferrer\"><b>Node.js · Packages (exports, type, conditions)<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>How Node resolves exports, conditional entry points and ESM/CJS.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"sect":1,"num":"3","kicker":"Section 3","h":"Semver and ranges","p":"What <code>^<\/code> and <code>~<\/code> really allow, and the 0.x trap."},{"k":"Section 3 · Semver","h":"MAJOR.MINOR.PATCH is a promise","v":"<div class=\"vwrap\"><div style=\"font:800 34px var(--mono);text-align:center\"><span class=\"pop\" style=\"color:var(--pink)\">5<\/span>.<span class=\"pop\" style=\"--d:.3s;color:var(--js)\">12<\/span>.<span class=\"pop\" style=\"--d:.6s;color:var(--green)\">3<\/span><\/div><div class=\"g3\"><div class=\"box rise \" style=\"--d:0.00s\"><b style=\"color:var(--pink)\">MAJOR<\/b><br><small>breaking change<\/small><\/div><div class=\"box rise \" style=\"--d:0.25s\"><b style=\"color:var(--js)\">MINOR<\/b><br><small>new feature, compatible<\/small><\/div><div class=\"box rise \" style=\"--d:0.50s\"><b style=\"color:var(--green)\">PATCH<\/b><br><small>bug fix only<\/small><\/div><\/div><\/div>","p":"Semver is a <b>social contract<\/b>, not something the registry enforces. Maintainers do sometimes break things in a minor release, which is exactly why lockfiles exist."},{"k":"Section 3 · Ranges","h":"Walkthrough: what each range accepts","v":"<div class=\"vs\"><div class=\"vl\"><\/div><div class=\"vh code\">Range<\/div><div class=\"vh data\">Allows<\/div><div class=\"vl\"><code>5.12.3<\/code><\/div><div class=\"rise\" style=\"--d:0.0s\">exactly that<\/div><div class=\"rise\" style=\"--d:0.1s\">undefined<\/div><div class=\"vl\"><code>~5.12.3<\/code><\/div><div class=\"rise\" style=\"--d:0.2s\">5.12.x ≥ .3 (patches)<\/div><div class=\"rise\" style=\"--d:0.3s\">undefined<\/div><div class=\"vl\"><code>^5.12.3<\/code><\/div><div class=\"rise\" style=\"--d:0.4s\">5.x.x ≥ 5.12.3 (minor + patch)<\/div><div class=\"rise\" style=\"--d:0.5s\">undefined<\/div><div class=\"vl\"><code>^0.4.1<\/code><\/div><div class=\"rise\" style=\"--d:0.6s\">0.4.x only! (0.x: minor acts as major)<\/div><div class=\"rise\" style=\"--d:0.7s\">undefined<\/div><div class=\"vl\"><code>&gt;=5 &lt;6<\/code><\/div><div class=\"rise\" style=\"--d:0.8s\">explicit window<\/div><div class=\"rise\" style=\"--d:0.9s\">undefined<\/div><div class=\"vl\"><code>*<\/code> / <code>latest<\/code><\/div><div class=\"rise\" style=\"--d:1.0s\">anything (avoid)<\/div><div class=\"rise\" style=\"--d:1.1s\">undefined<\/div><\/div>","p":"<code>^<\/code> is the npm default when you add a package. Remember the <b>0.x rule<\/b>: before 1.0, every minor release is treated as potentially breaking, so <code>^0.4.1<\/code> won't take 0.5.0."},{"k":"Section 3 · Prerelease","h":"Prereleases and tags","v":"<div class=\"vwrap\"><div class=\"box rise\" style=\"--d:0.00s\"><code>6.0.0-beta.2<\/code> is a <b>prerelease<\/b>. A normal range like <code>^5.12.0<\/code> never picks it, and <code>^6.0.0-beta.1<\/code> opts in.<\/div><div class=\"box rise\" style=\"--d:0.25s\"><b>dist-tags<\/b> name versions: <code>latest<\/code> (the default install), <code>next<\/code>, <code>beta<\/code>. So <code>npm i react@next<\/code> follows a moving tag.<\/div><div class=\"box rise\" style=\"--d:0.50s\"><b>Ranges live in package.json; exact versions live in the lockfile.<\/b> The range says what is acceptable, and the lock records what was actually chosen.<\/div><\/div>","p":"When you see a range widen in a diff (<code>~<\/code> → <code>^<\/code>, or <code>^5<\/code> → <code>*<\/code>), ask why."},{"quiz":true,"k":"Quiz 3 / 8 · Ranges","h":"<code>\"@acme/ui\": \"^12.29.0\"<\/code>. Which version can the resolver pick?","opts":[["13.0.0",0],["12.31.4",1],["12.28.9",0]],"right":"<code>^12.29.0<\/code> means ≥12.29.0 and &lt;13.0.0, so 12.31.4 is in range.","wrong":"The caret allows newer <b>minor and patch<\/b> versions inside major 12, and nothing below 12.29.0. So <b>12.31.4<\/b>."},{"k":"Section 3 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://semver.org/\" target=\"_blank\" rel=\"noopener noreferrer\"><b>semver.org · Semantic Versioning 2.0.0<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>The spec itself. Short and precise.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://semver.npmjs.com/\" target=\"_blank\" rel=\"noopener noreferrer\"><b>npm semver calculator<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>Type a package and a range to see exactly which published versions match.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"sect":1,"num":"4","kicker":"Section 4","h":"Lockfiles and installs","p":"The lockfile is what makes builds reproducible. Learn the install command CI should use."},{"k":"Section 4 · Lockfile","h":"What a lockfile records","cmp":[["JSON","// package-lock.json (excerpt)\n\"node_modules/react\": {\n  \"version\": \"18.3.1\",\n  \"resolved\": \"https://registry.npmjs.org/react/-/react-18.3.1.tgz\",\n  \"integrity\": \"sha512-wS+hAgJShR0KhEvPJArfuPVN1+Hz1t0Y6n5jLrGQbkb4urgPE/0Rve+1kMB1v/oWgHgm4WIcV+i7F2pTVj+2iQ==\",\n  \"dependencies\": { \"loose-envify\": \"^1.1.0\" }\n}","package-lock.json"]],"v":"<div class=\"g3\"><div class=\"box rise \" style=\"--d:0.00s\"><code>package-lock.json<\/code><br><small>npm<\/small><\/div><div class=\"box rise \" style=\"--d:0.25s\"><code>yarn.lock<\/code><br><small>Yarn<\/small><\/div><div class=\"box rise \" style=\"--d:0.50s\"><code>pnpm-lock.yaml<\/code><br><small>pnpm<\/small><\/div><\/div>","p":"For <b>every<\/b> package in the tree, direct and transitive, it records the exact version, the URL it came from, and an <b>integrity hash<\/b>. Commit it. Never hand-edit it. Keep exactly <b>one<\/b> kind of lockfile per repo.","an":"Gemfile.lock, plus a checksum for every artifact."},{"k":"Section 4 · Two commands","h":"install vs clean install","v":"<div class=\"vs\"><div class=\"vl\"><\/div><div class=\"vh code\">npm install<\/div><div class=\"vh data\">npm ci<\/div><div class=\"vl\">Reads<\/div><div class=\"rise\" style=\"--d:0.0s\">package.json, then the lock<\/div><div class=\"rise\" style=\"--d:0.1s\">the lock only<\/div><div class=\"vl\">Lock<\/div><div class=\"rise\" style=\"--d:0.2s\">may update it<\/div><div class=\"rise\" style=\"--d:0.3s\">never writes; fails on drift<\/div><div class=\"vl\">node_modules<\/div><div class=\"rise\" style=\"--d:0.4s\">updates in place<\/div><div class=\"rise\" style=\"--d:0.5s\">deletes and rebuilds<\/div><div class=\"vl\">Use<\/div><div class=\"rise\" style=\"--d:0.6s\">locally, when adding deps<\/div><div class=\"rise\" style=\"--d:0.7s\">CI, Docker, deploys<\/div><\/div>","p":"Equivalents: <code>yarn install --immutable<\/code> (Yarn 2+) and <code>pnpm install --frozen-lockfile<\/code> (the default in CI). If CI runs plain <code>npm install<\/code>, every build can resolve different versions."},{"k":"Section 4 · Walkthrough","h":"Adding a dependency, step by step","v":"<ol class=\"steps\"><li style=\"--d:0.0s\"><code>npm i zod<\/code> resolves <code>latest<\/code> → 3.23.8<\/li><li style=\"--d:0.7s\">Writes <code>\"zod\": \"^3.23.8\"<\/code> to package.json<\/li><li style=\"--d:1.4s\">Resolves its transitive deps, records versions + hashes in the lock<\/li><li style=\"--d:2.1s\">Downloads tarballs, verifies integrity, extracts into <code>node_modules<\/code><\/li><li style=\"--d:2.8s\">Runs install scripts of any dependency that has them<\/li><li style=\"--d:3.5s\">You commit <b>both<\/b> package.json and the lockfile in the same PR<\/li><\/ol>","p":"A PR that changes package.json but not the lockfile (or the other way round) is incomplete, and an immutable CI install will fail on it."},{"k":"Section 4 · Conflicts","h":"Lockfile merge conflicts","cmp":[["Bash","# don't hand-merge the lockfile. Instead:\ngit checkout --theirs package-lock.json   # or take main's version\nnpm install                               # regenerate from merged package.json\ngit add package-lock.json\n\n# yarn / pnpm: just run install; both can auto-resolve conflict markers\nyarn install      # or: pnpm install","resolve"]],"p":"The lockfile is generated output. Resolve the conflict in <code>package.json<\/code> by hand, then let the tool regenerate the lock."},{"k":"Section 4 · Reviewing","h":"Reading a lockfile diff","v":"<div class=\"vwrap\"><div class=\"box rise ok\" style=\"--d:0.00s\"><b>Expected<\/b>: one direct dep bumped plus a handful of transitive changes.<\/div><div class=\"box rise warn\" style=\"--d:0.25s\"><b>Suspicious<\/b>: hundreds of lines changing for a one-line package.json edit. Someone probably deleted and regenerated the lock and pulled in many unrelated upgrades.<\/div><div class=\"box rise warn\" style=\"--d:0.50s\"><b>Red flag<\/b>: <code>resolved<\/code> URLs pointing to an unexpected host, or a changed <code>integrity<\/code> hash for the same version.<\/div><\/div>","p":"GitHub collapses lockfile diffs by default. Expand them anyway, or use the dependency-review view."},{"quiz":true,"k":"Quiz 4 / 8 · Immutable","h":"A PR adds a dependency to package.json, but the lockfile is unchanged. What does CI's <code>npm ci<\/code> do?","opts":[["Installs it and updates the lock",0],["Fails because package.json and the lock are out of sync",1],["Silently skips the new package",0]],"right":"Clean or immutable installs refuse to change the lockfile. The author has to run an install locally and commit the updated lock.","wrong":"It <b>fails<\/b>. That's the point of <code>npm ci<\/code> / <code>--immutable<\/code> / <code>--frozen-lockfile<\/code>: CI never resolves new versions."},{"k":"Section 4 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://docs.npmjs.com/cli/v10/configuring-npm/package-lock-json\" target=\"_blank\" rel=\"noopener noreferrer\"><b>npm docs · package-lock.json<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>The lockfile format and what each field means.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://docs.npmjs.com/cli/v10/commands/npm-ci\" target=\"_blank\" rel=\"noopener noreferrer\"><b>npm docs · npm ci<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>Exactly how clean install differs from npm install.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"sect":1,"num":"5","kicker":"Section 5","h":"npm vs Yarn vs pnpm","p":"Three tools that do the same job, how their node_modules layouts differ, and how corepack picks the right one."},{"k":"Section 5 · Comparison","h":"Same ideas, different spellings","v":"<div class=\"vwrap\" style=\"font-size:11px\"><div class=\"vs\"><div class=\"vl\"><\/div><div class=\"vh code\">npm<\/div><div class=\"vh data\">Yarn (2+) / pnpm<\/div><div class=\"vl\">install<\/div><div class=\"rise\" style=\"--d:0.0s\"><code>npm ci<\/code><\/div><div class=\"rise\" style=\"--d:0.1s\"><code>yarn install --immutable<\/code> · <code>pnpm i --frozen-lockfile<\/code><\/div><div class=\"vl\">add<\/div><div class=\"rise\" style=\"--d:0.2s\"><code>npm i x<\/code><\/div><div class=\"rise\" style=\"--d:0.3s\"><code>yarn add x<\/code> · <code>pnpm add x<\/code><\/div><div class=\"vl\">dev dep<\/div><div class=\"rise\" style=\"--d:0.4s\"><code>npm i -D x<\/code><\/div><div class=\"rise\" style=\"--d:0.5s\"><code>yarn add -D x<\/code> · <code>pnpm add -D x<\/code><\/div><div class=\"vl\">run<\/div><div class=\"rise\" style=\"--d:0.6s\"><code>npm run build<\/code><\/div><div class=\"rise\" style=\"--d:0.7s\"><code>yarn build<\/code> · <code>pnpm build<\/code><\/div><div class=\"vl\">one-off<\/div><div class=\"rise\" style=\"--d:0.8s\"><code>npx x<\/code><\/div><div class=\"rise\" style=\"--d:0.9s\"><code>yarn dlx x<\/code> · <code>pnpm dlx x<\/code><\/div><div class=\"vl\">why<\/div><div class=\"rise\" style=\"--d:1.0s\"><code>npm explain x<\/code><\/div><div class=\"rise\" style=\"--d:1.1s\"><code>yarn why x<\/code> · <code>pnpm why x<\/code><\/div><\/div><\/div>","p":"All three read the same <code>package.json<\/code> and talk to the same registry. They differ in the lockfile format, the <code>node_modules<\/code> layout, speed, and workspace features."},{"k":"Section 5 · Layouts","h":"Where the files actually go","v":"<div class=\"vwrap\"><div class=\"box rise\" style=\"--d:0.00s\"><b>npm / Yarn classic: hoisted.<\/b> Most packages are flattened into the top-level <code>node_modules<\/code>. Simple, but your code can import packages you never declared (\"phantom dependencies\").<\/div><div class=\"box rise\" style=\"--d:0.25s\"><b>pnpm: content-addressed store + symlinks.<\/b> Each file is stored once on disk (<code>~/.pnpm-store<\/code>). <code>node_modules<\/code> contains only your declared deps, symlinked. It is strict and fast.<\/div><div class=\"box rise\" style=\"--d:0.50s\"><b>Yarn 2+ Plug'n'Play (PnP).<\/b> No <code>node_modules<\/code> at all; a <code>.pnp.cjs<\/code> map tells Node where each package lives. Many teams set <code>nodeLinker: node-modules<\/code> for compatibility.<\/div><\/div>","p":"Strict layouts catch undeclared imports early. Code that \"works on npm\" can fail on pnpm because it was relying on a hoisted package it never declared."},{"k":"Section 5 · Phantom deps","h":"Gotcha: phantom dependencies","cmp":[["TS","// package.json declares only \"some-ui-kit\"\n// some-ui-kit depends on \"clsx\", which npm hoisted to the top level\nimport clsx from 'clsx';   // works with npm... by accident\n\n// pnpm (strict):  Cannot find module 'clsx'\n// later npm: ui-kit drops clsx → your build breaks with no change on your side","the bug"]],"p":"Rule: <b>if you import it, declare it<\/b>. AI-generated code regularly imports packages that happen to be in <code>node_modules<\/code> but not in package.json."},{"k":"Section 5 · corepack","h":"corepack: the right manager, automatically","cmp":[["Bash","# package.json\n\"packageManager\": \"yarn@4.5.0\"    # or \"pnpm@9.12.0\"\n\ncorepack enable          # once per machine (ships with Node 16.9–24)\nyarn --version           # 4.5.0, downloaded and pinned for this repo\n# Node 25+ no longer bundles corepack: npm i -g corepack","corepack"]],"p":"Corepack reads <code>packageManager<\/code> and transparently runs that exact version of Yarn or pnpm. That way nobody runs Yarn 1 against a Yarn 4 lockfile.","an":"Like the Gradle wrapper: the repo pins the build tool version, and a shim fetches it."},{"k":"Section 5 · Which one?","h":"Detect the manager from the repo","v":"<div class=\"vwrap\"><div class=\"box rise \" style=\"--d:0.00s\"><code>package-lock.json<\/code> → <b>npm<\/b><\/div><div class=\"box rise \" style=\"--d:0.25s\"><code>yarn.lock<\/code> + <code>.yarnrc.yml<\/code> → <b>Yarn 2+<\/b> (<code>yarn.lock<\/code> alone → maybe Yarn 1)<\/div><div class=\"box rise \" style=\"--d:0.50s\"><code>pnpm-lock.yaml<\/code> / <code>pnpm-workspace.yaml<\/code> → <b>pnpm<\/b><\/div><div class=\"box rise ok\" style=\"--d:0.75s\">Also check <code>packageManager<\/code> in package.json and the CI install step.<\/div><\/div>","p":"Running the wrong tool creates a <b>second lockfile<\/b> and an install that doesn't match CI. Never commit two kinds of lockfile."},{"quiz":true,"k":"Quiz 5 / 8 · Which manager","h":"You open a repo with <code>yarn.lock<\/code>, <code>.yarnrc.yml<\/code> and <code>\"packageManager\": \"yarn@4.5.0\"<\/code>. Which install is right?","opts":[["npm install",0],["corepack enable, then yarn install",1],["pnpm import",0]],"right":"Corepack provides the pinned Yarn 4. <code>yarn install<\/code> then honours <code>.yarnrc.yml<\/code> and the lock.","wrong":"It's <b>Yarn 4<\/b>: enable corepack and run <code>yarn install<\/code>. npm would ignore yarn.lock and write a package-lock.json."},{"k":"Section 5 · Review","h":"What AI often gets wrong","v":"<div class=\"vwrap\"><div class=\"box warn rise\" style=\"--d:0.00s\"><b>Mixing managers<\/b>: an AI agent runs <code>npm install<\/code> in a pnpm repo and commits a new <code>package-lock.json<\/code>.<\/div><div class=\"box warn rise\" style=\"--d:0.25s\"><b>Undeclared imports<\/b> (phantom deps) that only work because of hoisting.<\/div><div class=\"box warn rise\" style=\"--d:0.50s\"><b>Global installs in instructions<\/b> (<code>npm i -g typescript<\/code>) instead of a pinned devDependency run through scripts.<\/div><div class=\"box warn rise\" style=\"--d:0.75s\"><b>Outdated syntax<\/b>: <code>yarn install --frozen-lockfile<\/code> (Yarn 1) in a Yarn 4 repo, where it is <code>--immutable<\/code>.<\/div><\/div>","p":"Look for these in AI-written diffs. They compile, they often pass a quick test, and they break later."},{"k":"Section 5 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://pnpm.io/motivation\" target=\"_blank\" rel=\"noopener noreferrer\"><b>pnpm · Motivation<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>A clear explanation of the store, symlinks and strictness, with diagrams.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://yarnpkg.com/getting-started\" target=\"_blank\" rel=\"noopener noreferrer\"><b>Yarn · Getting started<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>Modern Yarn, corepack setup, PnP and linkers.<\/small><\/a><a class=\"box rise\" style=\"--d:0.4s;text-decoration:none;display:block\" href=\"https://nodejs.org/api/corepack.html\" target=\"_blank\" rel=\"noopener noreferrer\"><b>Node.js · Corepack<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>How packageManager pinning works.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"sect":1,"num":"6","kicker":"Section 6","h":"Workspaces and monorepos","p":"Many packages, one repo, one install, plus tools that only rebuild what changed."},{"k":"Section 6 · Workspaces","h":"Many packages, one install","cmp":[["JSON","// root package.json\n{\n  \"private\": true,\n  \"workspaces\": [\"apps/*\", \"packages/*\"]      // npm / Yarn\n}\n// pnpm uses pnpm-workspace.yaml:  packages: [\"apps/*\", \"packages/*\"]\n\n// apps/storefront/package.json\n\"dependencies\": { \"@acme/ui\": \"workspace:*\" }  // link the local package","root + app"]],"v":"<div class=\"cb rise\"><div class=\"cb-h\">layout <span class=\"tagc\" style=\"background:#1a2a1a;color:#3ddc97\">tree<\/span><\/div><pre>repo/\n├─ apps/storefront     <span class=\"c\">// the app<\/span>\n├─ packages/ui         <span class=\"c\">// @acme/ui<\/span>\n├─ packages/config     <span class=\"c\">// shared eslint/tsconfig<\/span>\n└─ pnpm-lock.yaml      <span class=\"c\">// ONE lock for all<\/span><\/pre><\/div>","p":"One lockfile, one install. Local packages are <b>symlinked<\/b>, so an edit in <code>packages/ui<\/code> is visible to the app immediately, without publishing.","an":"Like a multi-module Maven/Gradle build, or a Rails app with engines under <code>engines/<\/code> referenced by <code>path:<\/code>."},{"k":"Section 6 · Task runners","h":"Only rebuild what changed","v":"<ol class=\"steps\"><li style=\"--d:0.0s\">Tool reads the workspace graph (who depends on whom)<\/li><li style=\"--d:0.7s\">You change <code>packages/ui<\/code><\/li><li style=\"--d:1.4s\"><code>nx affected -t test<\/code> / <code>turbo run test --filter=...[origin/main]<\/code><\/li><li style=\"--d:2.1s\">Runs tests for <b>ui<\/b> and the apps that depend on it, nothing else<\/li><li style=\"--d:2.8s\">Task outputs are cached by input hash, so an unchanged package is a cache hit<\/li><\/ol>","p":"<b>Nx<\/b> and <b>Turborepo<\/b> are the common choices. Without them, a monorepo CI ends up running everything on every PR."},{"k":"Section 6 · Peers in monorepos","h":"One React for the whole repo","v":"<div class=\"vwrap\"><div class=\"box rise warn\" style=\"--d:0.00s\"><b>Problem<\/b>: <code>packages/ui<\/code> has <code>react@18.2<\/code> in dependencies while the app uses 18.3. Two copies get installed and hooks break.<\/div><div class=\"box rise ok\" style=\"--d:0.25s\"><b>Fix<\/b>: the library declares <code>react<\/code> as a <b>peer<\/b> (plus a dev dep). The app provides it. Keep one version across the workspace (pnpm catalogs, syncpack, or a lint rule).<\/div><\/div>","p":"The same singleton problem as Module Federation (Part 5), but at install time instead of at runtime."},{"k":"Section 6 · Versioning","h":"Releasing packages from a monorepo","cmp":[["Bash","# changesets: describe the change in the PR\nnpx changeset          # pick packages + bump type, write a summary\n# merge → a bot opens \"Version Packages\" PR\n#   bumps versions, writes CHANGELOGs\n# merge that → CI publishes to the registry","changesets flow"]],"p":"Version bumps become a <b>reviewed file in the PR<\/b> instead of a manual step. Tools: Changesets, semantic-release, or Nx release."},{"quiz":true,"k":"Quiz 6 / 8 · Workspaces","h":"In a pnpm workspace, the app depends on <code>\"@acme/ui\": \"workspace:*\"<\/code>. What does it get when you run install?","opts":[["The latest @acme/ui from the registry",0],["A symlink to the local packages/ui",1],["Nothing until ui is published",0]],"right":"<code>workspace:<\/code> always resolves to the local package. On publish it is replaced by the real version number.","wrong":"The <b>workspace protocol<\/b> links the local folder, so changes show up immediately and nothing has to be published."},{"k":"Section 6 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://docs.npmjs.com/cli/v10/using-npm/workspaces\" target=\"_blank\" rel=\"noopener noreferrer\"><b>npm docs · Workspaces<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>How npm workspaces work, with commands.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://pnpm.io/workspaces\" target=\"_blank\" rel=\"noopener noreferrer\"><b>pnpm · Workspaces<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>The workspace protocol, filtering and publishing.<\/small><\/a><a class=\"box rise\" style=\"--d:0.4s;text-decoration:none;display:block\" href=\"https://frontendmasters.com/courses/monorepos-v2/\" target=\"_blank\" rel=\"noopener noreferrer\"><b>Frontend Masters · TypeScript Monorepos (Mike North)<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>A video course on workspaces, Nx and Lerna for TS projects.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"sect":1,"num":"7","kicker":"Section 7","h":"Private registries","p":"Scopes, .npmrc, auth tokens, registry proxies, and the dependency-confusion attack."},{"k":"Section 7 · Scopes","h":"<code>@scope/name<\/code> groups packages by owner","v":"<div class=\"flowchips\"><span class=\"chip pop\" style=\"--d:0.00s;background:#4ea8ff\">@acme/ui<\/span><span class=\"arr pop\" style=\"--d:0.15s\">→<\/span><span class=\"chip pop\" style=\"--d:0.30s;background:#a78bfa\">private registry<\/span><span class=\"arr pop\" style=\"--d:0.45s\">·<\/span><span class=\"chip pop\" style=\"--d:0.60s;background:#3ddc97\">react<\/span><span class=\"arr pop\" style=\"--d:0.75s\">→<\/span><span class=\"chip pop\" style=\"--d:0.90s;background:#f7d046\">public npm<\/span><\/div>","p":"A scope is a namespace (<code>@types<\/code>, <code>@babel<\/code>, <code>@acme<\/code>). You can route a whole scope to a different registry, which is how companies publish internal packages without them ever appearing on public npm."},{"k":"Section 7 · .npmrc","h":"Config: where to fetch, how to auth","cmp":[["Bash","# .npmrc (committed: NO secrets)\n@acme:registry=https://npm.example.com/\n//npm.example.com/:_authToken=${NPM_TOKEN}   # read from env at runtime\nalways-auth=true\n\n# .yarnrc.yml (Yarn 2+)\nnpmScopes:\n  acme:\n    npmRegistryServer: \"https://npm.example.com\"\n    npmAuthToken: \"${NPM_TOKEN}\"",".npmrc / .yarnrc.yml"]],"p":"Commit the registry <b>URL<\/b>. Keep the <b>token<\/b> in an environment variable or in your user-level <code>~/.npmrc<\/code>. A real token in a committed .npmrc is a secret leak."},{"k":"Section 7 · Proxies","h":"A registry proxy in front of the world","v":"<svg viewBox=\"0 0 320 150\"><rect class=\"pop\" x=\"6\" y=\"55\" width=\"80\" height=\"40\" rx=\"10\" fill=\"#151b30\" stroke=\"#a78bfa\"/><text x=\"46\" y=\"79\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-family=\"monospace\">dev / CI<\/text><rect class=\"pop\" style=\"--d:.3s\" x=\"120\" y=\"45\" width=\"90\" height=\"60\" rx=\"10\" fill=\"rgba(78,168,255,.16)\" stroke=\"#4ea8ff\"/><text x=\"165\" y=\"70\" fill=\"#fff\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\">registry proxy<\/text><text x=\"165\" y=\"86\" fill=\"#a3acc2\" font-size=\"8\" text-anchor=\"middle\">cache · scan · host<\/text><rect class=\"pop\" style=\"--d:.6s\" x=\"240\" y=\"20\" width=\"76\" height=\"40\" rx=\"10\" fill=\"#10261c\" stroke=\"#3ddc97\"/><text x=\"278\" y=\"44\" fill=\"#fff\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">npmjs.org<\/text><rect class=\"pop\" style=\"--d:.8s\" x=\"240\" y=\"90\" width=\"76\" height=\"40\" rx=\"10\" fill=\"#2a2510\" stroke=\"#f7d046\"/><text x=\"278\" y=\"114\" fill=\"#fff\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">@acme/*<\/text><g stroke=\"#4ea8ff\" stroke-width=\"2\" fill=\"none\"><path class=\"flow\" d=\"M86 75 H120\"/><path class=\"flow\" d=\"M210 65 L240 42\"/><path class=\"flow\" d=\"M210 85 L240 108\"/><\/g><\/svg>","p":"Most companies point every install at one internal URL (products such as JFrog Artifactory, Sonatype Nexus, GitHub Packages, or Verdaccio). It caches public packages, hosts private ones, and can block known-bad versions.","an":"The same pattern as a Maven repository manager or a private gem server mirroring rubygems.org."},{"k":"Section 7 · Dependency confusion","h":"The attack scopes prevent","v":"<ol class=\"steps\"><li style=\"--d:0.0s\">Your company uses an internal, <b>unscoped<\/b> package <code>acme-auth<\/code><\/li><li style=\"--d:0.7s\">An attacker publishes <code>acme-auth@99.0.0<\/code> to public npm<\/li><li style=\"--d:1.4s\">A misconfigured install checks both registries and takes the <b>highest<\/b> version<\/li><li style=\"--d:2.1s\">The attacker's postinstall script runs on dev laptops and CI<\/li><\/ol>","p":"Defences: put every internal package under a <b>scope<\/b> routed to the private registry, make the proxy prefer internal over public for those names, and reserve the scope on public npm."},{"quiz":true,"k":"Quiz 7 / 8 · Diagnose","h":"Install fails: <code>404 Not Found - GET https://registry.npmjs.org/@acme%2fui<\/code>. Most likely cause?","opts":[["@acme/ui was unpublished",0],["The scope isn't routed to the private registry (missing .npmrc / scope config or token)",1],["The lockfile is corrupt",0]],"right":"The request went to <b>public npm<\/b>, which never had the private package. Check the scope registry line and the auth token.","wrong":"Look at the URL: it hit <b>registry.npmjs.org<\/b>. The <code>@acme<\/code> scope isn't mapped to the private registry on this machine."},{"k":"Section 7 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://docs.npmjs.com/cli/v10/configuring-npm/npmrc\" target=\"_blank\" rel=\"noopener noreferrer\"><b>npm docs · .npmrc<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>Config file locations, scoped registries and auth settings.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"sect":1,"num":"8","kicker":"Section 8","h":"Supply-chain safety","p":"Every dependency is code you run with your own permissions. Here's how to keep that risk under control."},{"k":"Section 8 · Threats","h":"How packages get you","v":"<div class=\"vwrap\"><div class=\"box rise warn\" style=\"--d:0.00s\"><b>Typosquatting<\/b>: <code>reqeusts<\/code>, <code>react-dom-router<\/code>. A typo installs a lookalike package.<\/div><div class=\"box rise warn\" style=\"--d:0.25s\"><b>Compromised maintainer<\/b>: a real, popular package publishes a malicious patch version. <code>^<\/code> ranges pick it up on the next fresh resolve.<\/div><div class=\"box rise warn\" style=\"--d:0.50s\"><b>Install scripts<\/b>: <code>postinstall<\/code> runs arbitrary code at install time, before you ever import the package.<\/div><div class=\"box rise warn\" style=\"--d:0.75s\"><b>Abandoned packages<\/b>: no fixes, and a takeover target.<\/div><\/div>","p":"Because an npm tree often has 1,000+ transitive packages, your exposure grows with every dependency you add."},{"k":"Section 8 · Defences","h":"Layers that actually help","v":"<ul class=\"chk\"><li><b>Commit the lockfile<\/b> and use <code>npm ci<\/code>/<code>--immutable<\/code> in CI, so nothing new arrives silently<\/li><li><b>Review new dependencies<\/b>: maintainers, weekly downloads, last publish date, install scripts, size<\/li><li><b>Limit install scripts<\/b>: <code>ignore-scripts<\/code>, or pnpm/Yarn allow-lists for packages that really need them<\/li><li><b><code>npm audit<\/code><\/b> / Dependabot / Renovate for known vulnerabilities<\/li><li><b>Provenance<\/b>: <code>npm audit signatures<\/code> verifies packages were built from their claimed source<\/li><li><b>Delay fresh releases<\/b> (e.g. a minimum release age in Renovate or pnpm) so community detection has time to work<\/li><\/ul>","p":"No single control is enough. The lockfile plus careful review of every new dependency covers most of it."},{"k":"Section 8 · Bot PRs","h":"What a dependency-bot PR asks of you","v":"<ol class=\"steps\"><li style=\"--d:0.0s\">Read the title: which package, from what version to what (patch? major?)<\/li><li style=\"--d:0.7s\">Open the <b>changelog / release notes<\/b> the bot links<\/li><li style=\"--d:1.4s\">Check the lockfile diff only touches that package's subtree<\/li><li style=\"--d:2.1s\">Did CI (tests, build, type-check) actually run and pass?<\/li><li style=\"--d:2.8s\">Majors: search the code for the APIs the changelog says changed<\/li><\/ol>","p":"A green patch bump of a well-known package: approve. A major bump, or a package nobody recognises: slow down."},{"k":"Section 8 · Review","h":"Five questions for every package.json change","v":"<ul class=\"chk\"><li>Is the new dependency <b>necessary<\/b>, or does the platform or stdlib already do this?<\/li><li>Is it in the <b>right section<\/b> (dependencies vs dev vs peer)?<\/li><li>Is the <b>range<\/b> sensible (not <code>*<\/code>, not widened for no reason)?<\/li><li>Did the <b>lockfile<\/b> change consistently, and with the repo's manager?<\/li><li>Any new <b>scripts<\/b> or <b>postinstall<\/b> hooks?<\/li><\/ul>","p":"Those five questions catch most problems in agent-written dependency changes."},{"k":"Section 8 · Troubleshooting","h":"When install breaks: a fixed order","v":"<ol class=\"steps\"><li style=\"--d:0.0s\">Right Node? <code>node -v<\/code> vs .nvmrc<\/li><li style=\"--d:0.7s\">Right manager and version? Check the lockfile type and <code>packageManager<\/code>, run <code>corepack enable<\/code><\/li><li style=\"--d:1.4s\">Registry and auth? Read the failing URL (public vs private), check the token<\/li><li style=\"--d:2.1s\">Peer conflict? Read <code>ERESOLVE<\/code> output; don't reach for <code>--force<\/code> first<\/li><li style=\"--d:2.8s\">Corrupted cache? <code>npm cache verify<\/code> / <code>pnpm store prune<\/code><\/li><li style=\"--d:3.5s\">Last resort: delete <code>node_modules<\/code> (keep the lock!) and reinstall<\/li><\/ol>","p":"Deleting the lockfile \"to fix it\" re-resolves every package and can quietly upgrade hundreds of them. That should be a last resort, not a first move."},{"quiz":true,"k":"Quiz 8 / 8 · Bot PR","h":"A bot PR bumps <code>dompurify 3.1.5 → 3.1.6<\/code>, touching only package.json and the lock. Before approving, you…","opts":[["Approve; bots are always right",0],["Skim the release notes, check the lock diff is limited to dompurify, confirm CI passed",1],["Delete the lockfile and reinstall to be safe",0]],"right":"Patch bump, small diff, green CI, release notes read. That's a proportionate review.","wrong":"Do a <b>proportionate check<\/b>: release notes, a lock diff limited to that package, and green CI. Deleting the lockfile creates far more risk."},{"k":"Section 8 · Review","h":"What AI often gets wrong","v":"<div class=\"vwrap\"><div class=\"box warn rise\" style=\"--d:0.00s\"><b>Adding a package for a one-liner<\/b> (left-pad style) or one already covered by the platform (e.g. <code>uuid<\/code> when <code>crypto.randomUUID()<\/code> exists).<\/div><div class=\"box warn rise\" style=\"--d:0.25s\"><b>Hallucinated package names<\/b>: the import looks plausible but the package doesn't exist, or worse, someone has registered it (\"slopsquatting\"). Always check the registry page.<\/div><div class=\"box warn rise\" style=\"--d:0.50s\"><b><code>--force<\/code> / <code>--legacy-peer-deps<\/code><\/b> added to \"fix\" an ERESOLVE, hiding a real version conflict.<\/div><div class=\"box warn rise\" style=\"--d:0.75s\"><b>Real tokens in committed .npmrc<\/b> or in CI logs.<\/div><\/div>","p":"Look for these in AI-written diffs. They compile, they often pass a quick test, and they break later."},{"k":"Section 8 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://docs.npmjs.com/cli/v10/commands/npm-audit\" target=\"_blank\" rel=\"noopener noreferrer\"><b>npm docs · npm audit<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>Vulnerability audit and the audit signatures check.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://docs.npmjs.com/generating-provenance-statements\" target=\"_blank\" rel=\"noopener noreferrer\"><b>npm docs · Generating provenance statements<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>How packages prove where they were built, and how to verify that.<\/small><\/a><a class=\"box rise\" style=\"--d:0.4s;text-decoration:none;display:block\" href=\"https://docs.npmjs.com/cli/v10/using-npm/scripts\" target=\"_blank\" rel=\"noopener noreferrer\"><b>npm docs · scripts<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>Lifecycle scripts, including exactly when install scripts run.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"recap":true,"h":"Package management on one card","items":["<b>Node<\/b> runs all your tooling. Pin it with <code>.nvmrc<\/code> + <code>engines<\/code>.","<b>package.json<\/b> holds ranges and scripts. Know dependencies vs dev vs <b>peer<\/b>.","<code>^<\/code> = minor + patch, <code>~<\/code> = patch only, and 0.x is special.","<b>Lockfile<\/b> = exact versions + hashes. Commit it, and use <code>npm ci<\/code> / <code>--immutable<\/code> / <code>--frozen-lockfile<\/code> in CI.","npm (hoisted), pnpm (strict symlinks), Yarn 2+ (PnP or node-modules). <b>corepack<\/b> pins the manager.","Workspaces link local packages. Nx/Turborepo rebuild only what changed.","Scope private packages, keep tokens in env, review every new dependency and every install script."],"next":"Next: <b>Part 9<\/b>, the anatomy of a real-world micro-frontend platform."}];
</script>
<script>(function(){
  "use strict";
  var KW='const|let|var|function|return|if|else|async|await|new|class|interface|type|import|export|default|from|def|end|public|private|static|final|void|try|catch|throw|typeof|record|enum|module|for|of|in|null|undefined|true|false|this|self|nil|package|implements|extends|describe|it|test|expect|before|beforeEach|afterEach|require|do';
  var RE=new RegExp('(\\/\\/[^\\n]*|#(?!\\{)[^\\n]*)|("[^"\\n]*"|\'[^\'\\n]*\'|`[^`]*`)|\\b('+KW+')\\b','g');
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function hl(src){ var out='',last=0,m; RE.lastIndex=0;
    while((m=RE.exec(src))){ out+=esc(src.slice(last,m.index)); out+= m[1]?'<span class="c">'+esc(m[1])+'</span>': m[2]?'<span class="s">'+esc(m[2])+'</span>':'<span class="k">'+m[3]+'</span>'; last=RE.lastIndex; }
    return out+esc(src.slice(last)); }
  var LC={JS:['#2a2510','#f7d046'],TS:['#13243a','#4ea8ff'],JSX:['#102a2a','#4ee6e0'],TSX:['#102a2a','#4ee6e0'],Java:['#2a1a14','#ff7a45'],JUnit:['#2a1a14','#ff7a45'],Ruby:['#3a1624','#ff5c8a'],RSpec:['#3a1624','#ff5c8a'],Bash:['#1a2a1a','#3ddc97'],Rails:['#3a1624','#ff5c8a'],JSON:['#22183a','#a78bfa']};
  var stage=document.getElementById('stage'), anchor=document.getElementById('bottomBar');
  CARDS.forEach(function(c){
    var s=document.createElement('section'); s.className='card'; var h='';
    if(c.sect){ s.className+=' sect';
      h='<div class="visual"><div class="num pop">'+c.num+'</div></div>'+(c.badge?'<div class="titlebadge"><i></i>'+c.badge+'</div>':'')+'<div class="kicker">'+c.kicker+'</div><h1>'+c.h+'</h1><p>'+c.p+'</p>'+(c.first?'<div class="tapme">Tap the right side or swipe left →</div>':'');
    } else if(c.quiz){ s.className+=' quiz'; s.setAttribute('data-quiz','');
      h='<div class="kicker">'+c.k+'</div><h2>'+c.h+'</h2>'+(c.code?'<div class="qcode">'+hl(c.code)+'</div>':'<div style="height:10px"></div>')+'<div class="opts">'+c.opts.map(function(o,i){return '<button class="opt" type="button" data-ok="'+o[1]+'"><span class="l">'+'ABCD'[i]+'</span>'+o[0]+'</button>';}).join('')+'</div><div class="fb"></div>';
    } else if(c.recap){
      h='<div class="kicker">Recap</div><h2>'+c.h+'</h2><ul class="take">'+
        c.items.map(function(t,i){return '<li class="rise" style="--d:'+(i*0.15)+'s">'+t+'</li>';}).join('')+
        '</ul><div class="score" id="score"></div><p style="font-size:13px;margin-top:8px">'+c.next+'</p><a class="btn ghost" href="index.html" style="margin-top:6px">← Course home</a>';
    } else {
      var inner='';
      if(c.cmp){ inner='<div class="stack">'+c.cmp.map(function(b,i){ var col=LC[b[0]]||LC.JS; return '<div class="cb rise" style="--d:'+(i*0.25)+'s"><div class="cb-h">'+(b[2]||(i===0?'modern':'compare'))+' <span class="tagc" style="background:'+col[0]+';color:'+col[1]+'">'+b[0]+'</span></div><pre>'+hl(b[1])+'</pre></div>'; }).join('')+'</div>'; }
      if(c.v){ inner=c.v+inner; }
      if(c.lab){ s.className+=' lab'; inner='<div class="scrollv demo">'+inner+'</div>'; }
      h='<div class="kicker">'+c.k+'</div><div class="visual">'+inner+'</div><h2>'+c.h+'</h2>'+(c.p?'<p>'+c.p+'</p>':'')+(c.an?'<div class="analogy"><span>'+c.an+'</span></div>':'');
    }
    s.innerHTML=h; if(c.quiz){ var fb=s.querySelector('.fb'); fb.setAttribute('data-right',c.right); fb.setAttribute('data-wrong',c.wrong); }
    stage.insertBefore(s, anchor);
  });
})();
</script>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var stage=$('stage'), cards=[].slice.call(document.querySelectorAll('.card')), segsEl=$('segs'), countEl=$('count'), prevBtn=$('prev'), nextBtn=$('next');
  var cur=0, N=cards.length, answered=0, correct=0, NQ=document.querySelectorAll('[data-quiz]').length;
  cards.forEach(function(){ var s=document.createElement('div'); s.className='seg'; s.appendChild(document.createElement('i')); segsEl.appendChild(s); });
  var segs=segsEl.children;
  function go(n){
    n=Math.max(0,Math.min(N-1,n));
    cards.forEach(function(c,k){ c.classList.toggle('past',k<n); if(k!==n) c.classList.remove('active'); c.setAttribute('aria-hidden',k!==n); });
    var card=cards[n]; card.classList.remove('active'); void card.offsetWidth; card.classList.add('active');
    for(var k=0;k<N;k++) segs[k].classList.toggle('done',k<=n);
    countEl.textContent=(n+1)+' / '+N; prevBtn.disabled=n===0; nextBtn.disabled=n===N-1; cur=n; try{var _k='lp:'+location.pathname.split('/').pop(),_o=JSON.parse(localStorage.getItem(_k)||'{}');localStorage.setItem(_k,JSON.stringify({max:Math.max(_o.max||0,n+1),total:N}));}catch(_e){} updateScore();
    try{ history.replaceState(null,'','#'+(n+1)); }catch(e){}
  }
  function next(){ if(cur<N-1) go(cur+1); } function prev(){ if(cur>0) go(cur-1); }
  prevBtn.addEventListener('click',function(e){e.stopPropagation();prev();});
  nextBtn.addEventListener('click',function(e){e.stopPropagation();next();});
  
  var lastSwipe=0;
  stage.addEventListener('click',function(e){
    if(Date.now()-lastSwipe<450) return;
    if(e.target.closest('button, a, .opts, .demo, textarea, iframe')) return;
    var r=stage.getBoundingClientRect(); if((e.clientX-r.left)/r.width<0.3) prev(); else next();
  });
  var sx=0,sy=0,tr=false;
  stage.addEventListener('touchstart',function(e){ if(e.target.closest('textarea')) return; var t=e.touches[0]; sx=t.clientX; sy=t.clientY; tr=true; },{passive:true});
  stage.addEventListener('touchend',function(e){ if(!tr) return; tr=false; var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){ lastSwipe=Date.now(); if(dx<0) next(); else prev(); } },{passive:true});
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='TEXTAREA') return;
    if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter')) return;
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
    else if(e.key==='Home') go(0); else if(e.key==='End') go(N-1);
  });
  [].forEach.call(document.querySelectorAll('[data-quiz]'),function(q){
    var opts=q.querySelector('.opts'), fb=q.querySelector('.fb');
    [].forEach.call(opts.querySelectorAll('.opt'),function(b){
      b.addEventListener('click',function(e){
        e.stopPropagation(); if(opts.classList.contains('done')) return;
        opts.classList.add('done'); answered++;
        var ok=b.getAttribute('data-ok')==='1'; if(ok) correct++; else b.classList.add('wrong');
        opts.querySelector('[data-ok="1"]').classList.add('right');
        fb.innerHTML='<span class="tag" style="color:'+(ok?'var(--green)':'var(--pink)')+'">'+(ok?'✓ Correct.':'✗ Not quite.')+'</span> '+fb.getAttribute(ok?'data-right':'data-wrong')+'<br><span style="color:var(--dim);font-size:12px">Tap or swipe to continue →</span>';
        fb.classList.add('show');
      });
    });
  });
  function updateScore(){ var s=$('score'); s.textContent=answered?('Quiz score: '+correct+' / '+NQ+(answered<NQ?' ('+(NQ-answered)+' skipped)':'')):''; }

  var start=parseInt((location.hash||'').slice(1),10); go(isNaN(start)?0:start-1);
})();
</script>
