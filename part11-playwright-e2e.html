<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07080d"><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Part 11 · Playwright E2E in depth</title><style>
:root{
  --bg:#07080d; --panel:#121622; --panel2:#181d2b; --line:#2a3145; --text:#eef1f8; --muted:#a3acc2; --dim:#5d6680;
  --html:#ff7a45; --css:#4ea8ff; --js:#f7d046; --green:#3ddc97; --purple:#a78bfa; --pink:#ff5c8a; --cyan:#4ee6e0;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
.app{position:fixed;inset:0;display:flex;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#141a2e 0,transparent 60%),var(--bg)}
.stage{position:relative;width:100%;max-width:460px;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y}
@media (min-width:600px){.stage{height:min(100%,900px);margin:auto;border-radius:28px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 300px at 85% 10%,rgba(167,139,250,.10),transparent 70%),radial-gradient(500px 300px at 0% 90%,rgba(78,168,255,.08),transparent 70%);pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
.segs{display:flex;gap:3px}
.seg{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--css),var(--purple));transition:width .35s ease}
.seg.done i{width:100%}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.meta b{color:var(--text);font-weight:600}
.card{position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 58px) 22px calc(env(safe-area-inset-bottom) + 64px);display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(40px) scale(.98);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s linear .45s}
.card.past{transform:translateX(-40px) scale(.98)}
.card.active{opacity:1;visibility:visible;transform:none;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
.kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);margin-bottom:6px}
.visual{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;margin:4px 0 14px}
.visual svg{width:100%;height:100%;max-height:330px;overflow:visible}
h1,h2{margin:0 0 10px;line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(30px,9vw,40px)}
h2{font-size:clamp(22px,6.4vw,28px)}
p{margin:0 0 8px;font-size:clamp(15px,4.2vw,17px);line-height:1.5;color:var(--muted)}
p b,p strong{color:var(--text);font-weight:600}
code,.mono{font-family:var(--mono);font-size:.9em}
p code,.analogy code{background:#1b2131;border:1px solid var(--line);padding:1px 5px;border-radius:6px;color:#dfe5f5}
.analogy{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,rgba(78,168,255,.10),rgba(167,139,250,.10));border:1px solid rgba(120,140,255,.25);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;color:#cfd6ea;margin-top:6px}
.analogy::before{content:"⚙";font-size:15px;color:var(--css);line-height:1.3}
.analogy b{color:#fff}
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:0 14px calc(env(safe-area-inset-bottom) + 12px)}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(18,22,34,.8);color:var(--text);font-size:20px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
.nav:disabled{opacity:.3}
.hint{font-size:12px;color:var(--dim)}
svg *{transform-box:fill-box;transform-origin:center}
.active .pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.35) both;animation-delay:var(--d,0s)}
.active .fade{animation:fade .6s ease both;animation-delay:var(--d,0s)}
.active .rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.growx{transform-origin:left center}
.active .growx{animation:growx .6s ease both;animation-delay:var(--d,0s)}
.active .draw{stroke-dasharray:var(--len,300);animation:draw 1s ease both;animation-delay:var(--d,0s)}
.flow{stroke-dasharray:4 6;animation:flow 1s linear infinite}
.pulse{animation:pulse 2s ease-in-out infinite;animation-delay:var(--pd,0s)}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:var(--len,300)}to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes goR{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(60px);opacity:0}}
@keyframes goL{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(-72px);opacity:0}}
.req{animation:goR 2.4s ease-in-out infinite}
.chunk{opacity:0;animation:goL 2.4s linear infinite;animation-delay:var(--d,0s)}
.titlebadge{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;margin-bottom:14px;align-self:flex-start;background:rgba(255,255,255,.03)}
.titlebadge i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.tapme{margin-top:6px;font-size:13px;color:var(--dim);animation:pulse 1.8s infinite}
.grad{background:linear-gradient(90deg,var(--html),var(--js) 35%,var(--css) 70%,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.lay{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.lay-frame{width:100%;border:1px solid var(--line);border-radius:14px;padding:8px;background:#0d111b;display:flex;flex-direction:column;gap:6px;animation:resize 5s ease-in-out infinite alternate;position:relative}
@keyframes resize{0%,15%{width:100%}85%,100%{width:52%}}
.lay .b{border-radius:8px;font:600 11px/1 var(--mono);display:flex;align-items:center;justify-content:center;color:#0b0e16;padding:0 4px;overflow:hidden;white-space:nowrap}
.lay .hdr{height:26px;background:var(--css)}
.lay-row{display:flex;gap:6px}
.lay .side{flex:0 0 26%;height:54px;background:var(--purple)}
.lay .main{flex:1;height:54px;background:var(--green)}
.lay-cards{display:flex;flex-wrap:wrap;gap:6px}
.lay .c{flex:1 1 64px;height:30px;background:var(--js)}
.ruler{font:12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.ruler span{display:inline-block;height:2px;width:40px;background:linear-gradient(90deg,var(--pink),var(--js));border-radius:2px}
.comp{position:relative;width:250px;height:230px;perspective:800px}
.comp-in{position:absolute;inset:0;transform-style:preserve-3d}
.layer{position:absolute;left:25px;top:30px;width:200px;height:170px;border-radius:14px;border:1px solid rgba(255,255,255,.18);transform-origin:center;animation:explode 6s ease-in-out infinite;--z:0px;display:flex;align-items:flex-end;justify-content:flex-end;padding:8px;font:600 10px var(--mono);color:rgba(255,255,255,.85)}
.l1{--z:-60px;background-color:#151b30;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:16px 16px}
.l2{--z:0px;background:rgba(78,168,255,.18)}
.l2::before{content:"";position:absolute;left:66px;top:16px;width:112px;height:10px;border-radius:5px;background:rgba(255,255,255,.75);box-shadow:0 22px 0 rgba(255,255,255,.4),0 40px 0 rgba(255,255,255,.4),0 58px 0 rgba(255,255,255,.4),0 86px 0 -1px rgba(61,220,151,.7)}
.l3{--z:60px;width:56px;background:rgba(167,139,250,.6);animation-name:explode3;align-items:flex-start;justify-content:center;padding-top:10px;text-align:center}
@keyframes explode{0%,22%,100%{transform:rotateX(56deg) rotateZ(-38deg) translateZ(var(--z))}48%,80%{transform:rotateX(0) rotateZ(0) translateZ(0)}}
@keyframes explode3{0%,22%,100%{transform:rotateX(56deg) rotateZ(-38deg) translateZ(var(--z))}48%{transform:translateX(-60px)}62%,80%{transform:translateX(0)}}
.comp-tag{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font:12px var(--mono);color:var(--muted)}
.cost{width:100%;display:grid;grid-template-columns:92px repeat(5,1fr);gap:6px;font-size:10.5px;align-items:center}
.cost .h{color:var(--dim);text-align:center;font-weight:600;letter-spacing:.02em}
.cost .lbl{font:600 11px var(--mono);color:var(--text);line-height:1.3}
.cost .lbl small{display:block;color:var(--dim);font-weight:400}
.cell{height:30px;border-radius:8px;background:#151a27;border:1px dashed #262d40}
.cell.on{background:var(--c);border:0;box-shadow:0 0 14px var(--c)}
.active .cell.on{animation:light .45s ease both;animation-delay:var(--d,0s)}
@keyframes light{from{opacity:.1;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.costtag{grid-column:2/7;font-size:11px;color:var(--muted);text-align:right;margin-top:-2px}
.qcode{font:13px/1.55 var(--mono);background:#0d111b;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0 14px;color:#cdd5ea;white-space:pre;overflow-x:auto}
.qcode .k{color:var(--purple)}.qcode .s{color:var(--green)}.qcode .t{color:var(--html)}.qcode .c{color:var(--dim)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:15px;line-height:1.35;cursor:pointer;transition:transform .15s,border-color .2s,background .2s,opacity .2s}
.opt:active{transform:scale(.98)}
.opt:focus-visible{outline:2px solid var(--css)}
.opt .l{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#1e2436;font:700 12px var(--mono);color:var(--muted)}
.opt code{font-size:13px}
.opt.right{border-color:var(--green);background:rgba(61,220,151,.12)}
.opt.right .l{background:var(--green);color:#06210f}
.opt.wrong{border-color:var(--pink);background:rgba(255,92,138,.12);animation:shake .4s}
.opt.wrong .l{background:var(--pink);color:#2a0612}
.opts.done .opt:not(.right):not(.wrong){opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.fb{margin-top:12px;font-size:14px;line-height:1.45;color:var(--muted);opacity:0;transform:translateY(8px);transition:.3s}
.fb.show{opacity:1;transform:none}
.fb b{color:var(--text)}
.fb code{background:#1b2131;padding:1px 4px;border-radius:5px;color:#dfe5f5}
.fb .tag{display:inline-block;font-weight:800;margin-right:4px}
.qspacer{flex:1}
.rx{width:100%;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.rx-row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.rx-box{flex:1;background:#0d111b;border:1px solid var(--line);border-radius:12px;padding:10px 8px;font:11px/1.4 var(--mono);color:#cdd5ea;min-height:62px;display:flex;flex-direction:column;justify-content:center}
.rx-box .cap{font:700 9px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.rx-arrow{color:var(--purple);font:700 13px var(--mono);flex:0 0 auto}
.rx-f{flex:0 0 auto;background:linear-gradient(135deg,rgba(167,139,250,.25),rgba(78,168,255,.2));border:1px solid rgba(167,139,250,.5);border-radius:12px;padding:10px 7px;font:700 12px var(--mono)}
.rx-ui{background:#f5f6fa;color:#141824;border-radius:14px;padding:9px 10px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);min-height:62px}
.rx-ui .bar{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.rx-ui .badge{background:#ff5c1a;color:#fff;border-radius:999px;padding:1px 8px;font-size:11px}
.rx-ui ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.rx-ui li{background:#e7e9f2;border-radius:6px;padding:3px 6px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px #3ddc97}100%{box-shadow:0 0 0 0 transparent}}
.rx-note{font-size:12px;color:var(--dim);text-align:center}
.btn{all:unset;cursor:pointer;align-self:center;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,var(--purple),var(--css));color:#fff;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(120,120,255,.35)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--text);align-self:flex-start}
.flowchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;width:100%}
.chip{padding:7px 10px;border-radius:10px;font:700 12px var(--mono);color:#0b0e16;display:inline-block}
.arr{color:var(--dim);font-size:12px}
.take{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px;width:100%}
.take li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.4;color:#cfd6ea}
.take li b{color:#fff}
.score{font-size:13px;color:var(--muted);margin-top:10px}
.next-tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.next-tags span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);font-family:var(--mono)}
@media (max-height:700px){.visual svg{max-height:230px}.qcode{font-size:12px;padding:8px 10px;margin:4px 0 8px}.opt{padding:10px 12px}.analogy{font-size:13px;padding:8px 10px}p{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ---- lesson 1b additions ---- */
.net{width:100%;background:#0d111b;border:1px solid var(--line);border-radius:12px;overflow:hidden;font:10.5px/1.2 var(--mono)}
.net-h,.net-r{display:grid;grid-template-columns:1.35fr 46px 40px 1fr;gap:6px;align-items:center;padding:6px 9px}
.net-h{color:var(--dim);font:700 8.5px system-ui;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line);background:#121622}
.net-r{border-bottom:1px solid #161b28;color:#cdd5ea}
.net-r:last-of-type{border-bottom:0}
.net-r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net-r .t{color:var(--muted);font-size:9.5px}
.net-r .z{color:var(--muted);text-align:right;font-size:9.5px}
.net-r.dim{color:#59627a}.net-r.dim .t,.net-r.dim .z{color:#454d63}.net-r.dim .wf i{opacity:.35}
.net-r.hl{background:rgba(78,168,255,.09);box-shadow:inset 3px 0 0 var(--css)}

.wf i{position:absolute;top:0;height:100%;border-radius:3px;left:var(--s);width:var(--w);background:var(--c);transform-origin:left center}
.active .net-r{animation:rise .4s ease both;animation-delay:var(--d,0s)}
.active .wf i{animation:growx .5s ease both;animation-delay:calc(var(--d,0s) + .15s)}
.net-foot{padding:5px 9px;color:var(--dim);font-size:9px;display:flex;justify-content:space-between;border-top:1px solid var(--line);background:#121622}
.netwrap{width:100%;display:flex;flex-direction:column;gap:10px}
.cb{width:100%;font:11.5px/1.5 var(--mono);background:#0d111b;border:1px solid var(--line);border-radius:12px;color:#cdd5ea;overflow:hidden}

.cb-h{display:flex;justify-content:space-between;align-items:center;padding:5px 11px;background:#121622;border-bottom:1px solid var(--line);font:700 9px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.cb-h .tagc{font:700 9.5px var(--mono);letter-spacing:0;text-transform:none;padding:2px 7px;border-radius:999px}
.k{color:var(--purple)}.s{color:var(--green)}.t{color:var(--html)}.c{color:var(--dim)}.y{color:var(--js)}.bl{color:var(--css)}
.mk{background:rgba(247,208,70,.18);color:var(--js);border-radius:4px;padding:0 2px}
.stack{width:100%;display:flex;flex-direction:column;gap:8px}
.down{align-self:center;color:var(--purple);font:700 13px var(--mono);line-height:1}
/* phone mock */
.phone{width:178px;height:300px;border-radius:26px;border:2px solid #2a3145;background:#0b0e16;padding:12px 10px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.5);flex:0 0 auto;display:flex;flex-direction:column;gap:8px;overflow:hidden}

</style></head><body><style>
.sect h1{font-size:clamp(34px,10vw,46px)}
.sect .num{font:800 90px/1 system-ui;background:linear-gradient(135deg,var(--css),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.9}
.vwrap{width:100%;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.scrollv{width:100%;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;user-select:text;-webkit-user-select:text;padding-bottom:4px}

.steps li code{font-size:11px;color:var(--js)}
.active .steps li{animation:lit 7s ease infinite;animation-delay:var(--d,0s)}
@keyframes lit{0%{opacity:.3}4%,70%{opacity:1;border-color:var(--css);background:rgba(78,168,255,.10)}90%,100%{opacity:.3}}
.pill{display:inline-block;font:700 10px var(--mono);padding:2px 7px;border-radius:999px;margin:1px}
.warn{border-color:rgba(255,92,138,.5)!important;background:rgba(255,92,138,.08)!important}
.ok{border-color:rgba(61,220,151,.5)!important;background:rgba(61,220,151,.08)!important}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;width:100%}
.chk li{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 9px 6px 30px;font-size:12px;line-height:1.35;color:#cfd6ea;position:relative}
.chk li::before{content:"✓";position:absolute;left:9px;top:5px;color:var(--green);font-weight:800}
.chk li b{color:#fff}
.bleed button{all:unset;font:700 11px system-ui;padding:6px 10px;border-radius:8px;background:#ff5c1a;color:#fff}
.active .bleed .victim{animation:bleed 4s ease-in-out infinite}
@keyframes bleed{0%,35%{background:#ff5c1a;border-radius:8px}45%,85%{background:#c21d6b;border-radius:0;transform:skewX(-6deg)}100%{background:#ff5c1a}}
.flashr{animation:flashr 2.4s ease infinite;animation-delay:var(--d,0s)}
@keyframes flashr{0%,100%{fill:#151a27}20%,40%{fill:var(--pink)}}
.blink{animation:blink 2.4s steps(1) infinite;animation-delay:var(--d,0s)}
@keyframes blink{0%{opacity:1}50%{opacity:.2}}
.mv{animation:mv 3s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes mv{0%{transform:translate(0,0);opacity:0}10%{opacity:1}80%{opacity:1}100%{transform:translate(var(--tx,0),var(--ty,0));opacity:0}}
</style>

<script>var CARDS = [{"sect": 1, "num": "▶", "kicker": "Part 11 · End-to-end", "h": "Playwright <span class=\"grad\">in depth<\/span>", "p": "How Playwright drives real browsers, why its locators and assertions wait for you, fixtures and auth reuse, network mocking, traces, parallel runs, flake avoidance, page objects, CI, and a lab.", "badge": "~31 min · 52 cards · 8 quizzes", "first": true}, {"sect": 1, "num": "1", "kicker": "Section 1 · The model", "h": "How Playwright works", "p": "A test runner plus a browser automation library that talks to Chromium, Firefox and WebKit over a protocol, from outside the page."}, {"k": "Big picture", "h": "Where E2E fits", "v": "<svg viewBox=\"0 0 320 160\"><rect class=\"rise\" x=\"8\" y=\"40\" width=\"90\" height=\"70\" rx=\"12\" fill=\"#13243a\" stroke=\"#4ea8ff\"/><text x=\"53\" y=\"70\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\">test (Node)<\/text><text x=\"53\" y=\"86\" fill=\"#cfd6ea\" font-size=\"8\" text-anchor=\"middle\">@playwright/test<\/text><rect class=\"rise\" style=\"--d:.3s\" x=\"124\" y=\"40\" width=\"80\" height=\"70\" rx=\"12\" fill=\"rgba(167,139,250,.2)\" stroke=\"#a78bfa\"/><text x=\"164\" y=\"70\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\">protocol<\/text><text x=\"164\" y=\"86\" fill=\"#cfd6ea\" font-size=\"8\" text-anchor=\"middle\">CDP-like, over a pipe<\/text><rect class=\"rise\" style=\"--d:.6s\" x=\"230\" y=\"20\" width=\"84\" height=\"110\" rx=\"12\" fill=\"rgba(61,220,151,.12)\" stroke=\"#3ddc97\"/><text x=\"272\" y=\"44\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\">browser<\/text><text x=\"272\" y=\"64\" fill=\"#cfd6ea\" font-size=\"8\" text-anchor=\"middle\">context 1<\/text><text x=\"272\" y=\"80\" fill=\"#cfd6ea\" font-size=\"8\" text-anchor=\"middle\">context 2<\/text><text x=\"272\" y=\"96\" fill=\"#cfd6ea\" font-size=\"8\" text-anchor=\"middle\">real layout, CSS,<\/text><text x=\"272\" y=\"108\" fill=\"#cfd6ea\" font-size=\"8\" text-anchor=\"middle\">network<\/text><line class=\"flow\" x1=\"98\" y1=\"75\" x2=\"124\" y2=\"75\" stroke=\"#f7d046\" stroke-width=\"2\"/><line class=\"flow\" x1=\"204\" y1=\"75\" x2=\"230\" y2=\"75\" stroke=\"#f7d046\" stroke-width=\"2\"/><\/svg>", "p": "Your test code runs in Node; the page runs in a real browser. Every <code>page.click()<\/code> is a message across that boundary. Unlike jsdom, you get real layout, real CSS, real navigation and real network.", "an": "Closest to Capybara with a real driver, or Selenium, but with automatic waiting built into every action."}, {"k": "Concepts", "h": "Browser, context, page", "v": "<div class=\"g2\"><div class=\"box rise\" style=\"--d:0.00s\"><b>Browser<\/b><br><small>one launched process (expensive, shared by a worker)<\/small><\/div><div class=\"box rise ok\" style=\"--d:0.12s\"><b>BrowserContext<\/b><br><small>an incognito-like profile: own cookies, storage, cache. One per test<\/small><\/div><div class=\"box rise\" style=\"--d:0.24s\"><b>Page<\/b><br><small>a tab inside a context<\/small><\/div><div class=\"box rise ok\" style=\"--d:0.36s\"><b>Why it matters<\/b><br><small>fresh context per test = isolation without relaunching the browser<\/small><\/div><\/div>", "p": "The built-in <code>page<\/code> fixture gives every test a new context and page. Tests do not share cookies or localStorage unless you make them."}, {"k": "First test", "h": "Anatomy of a spec", "cmp": [["TS", "import { test, expect } from '@playwright/test';\n\ntest('user can create a task', async ({ page }) => {\n  await page.goto('/tasks');                                  // baseURL from config\n  await page.getByRole('button', { name: 'New task' }).click();\n  await page.getByLabel('Title').fill('Write docs');\n  await page.getByRole('button', { name: 'Create' }).click();\n  await expect(page.getByRole('listitem').filter({ hasText: 'Write docs' }))\n    .toBeVisible();\n});", "tasks.spec.ts"]], "p": "Every line is <code>await<\/code>ed. Every interaction waits for the element to be ready. The assertion retries until it passes or times out."}, {"k": "Config", "h": "playwright.config.ts essentials", "cmp": [["TS", "export default defineConfig({\n  testDir: './e2e',\n  fullyParallel: true,\n  retries: process.env.CI ? 2 : 0,\n  workers: process.env.CI ? 4 : undefined,\n  reporter: [['html'], ['list']],\n  use: {\n    baseURL: 'http://localhost:5173',\n    trace: 'on-first-retry',          // record traces when a retry happens\n    screenshot: 'only-on-failure',\n  },\n  projects: [\n    { name: 'chromium', use: { ...devices['Desktop Chrome'] } },\n    { name: 'mobile', use: { ...devices['iPhone 13'] } },\n  ],\n  webServer: { command: 'pnpm dev', url: 'http://localhost:5173', reuseExistingServer: !process.env.CI },\n});", "playwright.config.ts"]], "p": "<code>webServer<\/code> starts your app before tests and waits until the URL responds. <code>projects<\/code> run the same tests across browsers or devices.", "lab": true}, {"k": "Model gotchas", "h": "Caveats &amp; gotchas", "v": "<ul class=\"chk\"><li class=\"rise\" style=\"--d:0.00s\">Code inside <code>page.evaluate(() =&gt; ...)<\/code> runs in the <b>browser<\/b>: it cannot see your Node variables unless you pass them as arguments.<\/li><li class=\"rise\" style=\"--d:0.12s\">Forgetting <code>await<\/code> on an action is the #1 bug; enable the <code>@typescript-eslint/no-floating-promises<\/code> lint rule.<\/li><li class=\"rise\" style=\"--d:0.24s\">Tests run in parallel workers: never depend on another test having created data.<\/li><li class=\"rise\" style=\"--d:0.36s\">The default timeout per test is 30 s and per assertion 5 s. Raising them hides real problems.<\/li><\/ul>"}, {"quiz": true, "k": "Quiz 1 / 8 · Model", "h": "Two tests both log in. Test B sees test A's cart items. What is the most likely cause?", "opts": [["Playwright shares one context across tests by default", 0], ["They share server-side data (same user account), not browser state", 1], ["localStorage persists across pages", 0]], "right": "Each test gets a fresh context, so browser state is isolated; the backend is not. Use unique data per test or per worker.", "wrong": "Browser state is isolated per test. The <b>server<\/b> is shared: use unique users or data."}, {"k": "Section 1 · Go deeper", "h": "Go deeper", "v": "<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.00s;text-decoration:none;display:block\" href=\"https://playwright.dev/docs/intro\" target=\"_blank\" rel=\"noopener\"><b>Playwright docs: Installation ↗<\/b><br><small>install, first run, project layout<\/small><\/a><a class=\"box rise\" style=\"--d:0.15s;text-decoration:none;display:block\" href=\"https://playwright.dev/docs/test-configuration\" target=\"_blank\" rel=\"noopener\"><b>Playwright docs: Configuration ↗<\/b><br><small>every option above<\/small><\/a><a class=\"box rise\" style=\"--d:0.30s;text-decoration:none;display:block\" href=\"https://frontendmasters.com/courses/playwright/\" target=\"_blank\" rel=\"noopener\"><b>Frontend Masters: Playwright course ↗<\/b><br><small>Playwright as a verification loop, including for agentic coding tools<\/small><\/a><\/div>", "p": "Optional, but worth it. Tap a card to open it in a new tab."}, {"sect": 1, "num": "2", "kicker": "Section 2 · Locators &amp; waiting", "h": "Locators, auto-waiting and web-first assertions", "p": "The three ideas that make Playwright tests stable when written properly."}, {"k": "Locators", "h": "A locator is a recipe, not an element", "v": "<ol class=\"steps\"><li style=\"--d:0.0s\"><span><code>page.getByRole('button', { name: 'Save' })<\/code> returns a <b>Locator<\/b>: nothing is searched yet<\/span><\/li><li style=\"--d:0.6s\"><span>On <code>.click()<\/code>, Playwright resolves it against the live DOM<\/span><\/li><li style=\"--d:1.2s\"><span>If the DOM re-renders, the next action re-resolves: no stale element errors<\/span><\/li><li style=\"--d:1.8s\"><span>If it matches more than one element, actions fail (<b>strict mode<\/b>)<\/span><\/li><\/ol>", "p": "This is the big difference from Selenium's <code>findElement<\/code>: you never hold a reference to a node that React might replace."}, {"k": "Locators", "h": "Priority and chaining", "cmp": [["TS", "page.getByRole('button', { name: 'Save' });     // 1st choice\npage.getByLabel('Email');                       // form fields\npage.getByText('No tasks yet');                 // non-interactive text\npage.getByTestId('task-row');                   // stable escape hatch\n\n// narrowing\nconst row = page.getByRole('row').filter({ hasText: 'Write docs' });\nawait row.getByRole('button', { name: 'Delete' }).click();\n\npage.getByRole('listitem').nth(0);              // last resort\npage.locator('.btn-primary');                   // CSS: avoid", "locators"]], "p": "Same priority as RTL (Part 7): role and accessible name first. <code>filter({ hasText })<\/code> and chaining scope the search, like <code>within<\/code> in RTL."}, {"k": "Auto-waiting", "h": "What happens inside .click()", "v": "<ol class=\"steps\"><li style=\"--d:0.0s\"><span>Resolve locator to exactly one element<\/span><\/li><li style=\"--d:0.6s\"><span>Wait until it is <b>attached<\/b> and <b>visible<\/b><\/span><\/li><li style=\"--d:1.2s\"><span>Wait until it is <b>stable<\/b> (not animating)<\/span><\/li><li style=\"--d:1.8s\"><span>Wait until it <b>receives events<\/b> (not covered by an overlay)<\/span><\/li><li style=\"--d:2.4s\"><span>Wait until it is <b>enabled<\/b><\/span><\/li><li style=\"--d:3.0s\"><span>Scroll into view and click; retry from step 1 if the DOM changed<\/span><\/li><\/ol>", "p": "These are the actionability checks. They remove almost every <code>sleep<\/code> you would have written in Selenium."}, {"k": "Assertions", "h": "Web-first assertions retry", "v": "<div class=\"vs\" style=\"grid-template-columns:150px 1fr 1fr\"><div class=\"vl\"><\/div><div class=\"vh data\">retries?<\/div><div class=\"vh code\">result<\/div><div class=\"vl\" style=\"display:block;align-self:center;word-break:break-word;text-transform:none;letter-spacing:0;font-size:11px;color:#cfd6ea\"><code>expect(await loc.isVisible()).toBe(true)<\/code><\/div><div class=\"rise\" style=\"--d:0.0s\">no, checks once<\/div><div class=\"rise\" style=\"--d:0.0s\">flaky<\/div><div class=\"vl\" style=\"display:block;align-self:center;word-break:break-word;text-transform:none;letter-spacing:0;font-size:11px;color:#cfd6ea\"><code>await expect(loc).toBeVisible()<\/code><\/div><div class=\"rise\" style=\"--d:0.2s\">yes, until timeout<\/div><div class=\"rise\" style=\"--d:0.2s\">stable<\/div><\/div>", "cmp": [["TS", "await expect(page.getByRole('alert')).toHaveText(/saved/i);\nawait expect(page.getByRole('row')).toHaveCount(3);\nawait expect(page).toHaveURL(/\\/tasks\\/\\d+/);\nawait expect(page.getByLabel('Title')).toHaveValue('');\nawait expect(page.getByRole('button', { name: 'Save' })).toBeDisabled();\nawait expect.poll(() => api.countTasks()).toBe(3);   // non-DOM values", "expect"]], "p": "Always put <code>await<\/code> before <code>expect(locator)<\/code>. A web-first assertion without <code>await<\/code> is a promise nobody waits for: the test passes instantly.", "lab": true}, {"k": "Locator gotchas", "h": "Caveats &amp; gotchas", "v": "<ul class=\"chk\"><li class=\"rise\" style=\"--d:0.00s\"><code>getByText('Save')<\/code> matches substrings case-insensitively by default; use <code>{ exact: true }<\/code> when needed.<\/li><li class=\"rise\" style=\"--d:0.12s\">Strict-mode violations (\"resolved to 2 elements\") mean your locator is ambiguous. Narrow it; do not add <code>.first()<\/code> reflexively.<\/li><li class=\"rise\" style=\"--d:0.24s\"><code>page.waitForTimeout(1000)<\/code> is for debugging only. In committed tests it is a flake generator.<\/li><li class=\"rise\" style=\"--d:0.36s\"><code>isVisible()<\/code> does not wait. Use it for branching logic, never for assertions.<\/li><li class=\"rise\" style=\"--d:0.48s\">Text locators break when copy changes or is translated; roles with names are more stable but still tied to copy.<\/li><\/ul>"}, {"k": "Locators · AI", "h": "What AI often gets wrong", "v": "<div class=\"vwrap\"><div class=\"box warn rise\" style=\"--d:0.00s\">✗ <code>page.locator('div.css-1x2y3 &gt; button')<\/code><br><small style=\"color:#3ddc97\">✓ <code>getByRole('button', { name })<\/code><\/small><\/div><div class=\"box warn rise\" style=\"--d:0.15s\">✗ <code>await page.waitForTimeout(3000)<\/code><br><small style=\"color:#3ddc97\">✓ web-first assertion on the expected state<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.30s\">✗ <code>expect(await loc.textContent()).toBe(...)<\/code><br><small style=\"color:#3ddc97\">✓ <code>await expect(loc).toHaveText(...)<\/code><\/small><\/div><div class=\"box warn rise\" style=\"--d:0.45s\">✗ <code>.first()<\/code> everywhere to silence strict mode<br><small style=\"color:#3ddc97\">✓ a more specific locator or <code>filter<\/code><\/small><\/div><\/div>"}, {"quiz": true, "k": "Quiz 2 / 8 · Assertions", "h": "Which assertion retries until the toast appears?", "opts": [["<code>expect(await page.getByRole(\"status\").isVisible()).toBe(true)<\/code>", 0], ["<code>await expect(page.getByRole(\"status\")).toBeVisible()<\/code>", 1], ["<code>expect(page.getByRole(\"status\")).toBeTruthy()<\/code>", 0]], "right": "Web-first assertions take a locator and retry.", "wrong": "Only the <b>web-first<\/b> form retries; the others check once (or check nothing)."}, {"k": "Section 2 · Go deeper", "h": "Go deeper", "v": "<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.00s;text-decoration:none;display:block\" href=\"https://playwright.dev/docs/locators\" target=\"_blank\" rel=\"noopener\"><b>Playwright docs: Locators ↗<\/b><br><small>every getBy*, filtering and chaining<\/small><\/a><a class=\"box rise\" style=\"--d:0.15s;text-decoration:none;display:block\" href=\"https://playwright.dev/docs/actionability\" target=\"_blank\" rel=\"noopener\"><b>Playwright docs: Auto-waiting ↗<\/b><br><small>the full actionability table<\/small><\/a><a class=\"box rise\" style=\"--d:0.30s;text-decoration:none;display:block\" href=\"https://playwright.dev/docs/test-assertions\" target=\"_blank\" rel=\"noopener\"><b>Playwright docs: Assertions ↗<\/b><br><small>web-first assertions and expect.poll<\/small><\/a><\/div>", "p": "Optional, but worth it. Tap a card to open it in a new tab."}, {"sect": 1, "num": "3", "kicker": "Section 3 · Fixtures &amp; auth", "h": "Fixtures and reusing login state", "p": "Fixtures are Playwright's dependency injection. Auth state reuse is the most valuable thing you will build with them."}, {"k": "Fixtures", "h": "Built-in fixtures, by name", "v": "<div class=\"g2\"><div class=\"box rise\" style=\"--d:0.00s\"><b><code>page<\/code><\/b><br><small>fresh page in a fresh context<\/small><\/div><div class=\"box rise\" style=\"--d:0.12s\"><b><code>context<\/code><\/b><br><small>the BrowserContext of this test<\/small><\/div><div class=\"box rise\" style=\"--d:0.24s\"><b><code>browser<\/code><\/b><br><small>shared per worker<\/small><\/div><div class=\"box rise\" style=\"--d:0.36s\"><b><code>request<\/code><\/b><br><small>an API client (no browser) for setup calls<\/small><\/div><div class=\"box rise \" style=\"--d:0.48s\"><b><code>baseURL<\/code>, <code>testInfo<\/code><\/b><br><small>config values and metadata<\/small><\/div><\/div>", "p": "You ask for fixtures by destructuring the test argument. Playwright creates only what you ask for and tears it down afterwards.", "an": "Like RSpec <code>let<\/code> or JUnit 5 parameter resolvers: declared dependencies with managed lifecycle."}, {"k": "Fixtures", "h": "Writing a custom fixture", "cmp": [["TS", "type Fixtures = { tasksPage: TasksPage; seededTask: Task };\n\nexport const test = base.extend<Fixtures>({\n  seededTask: async ({ request }, use) => {\n    const res = await request.post('/api/tasks', { data: { title: `t-${Date.now()}` } });\n    const task = await res.json();\n    await use(task);                                // test runs here\n    await request.delete(`/api/tasks/${task.id}`);  // teardown\n  },\n  tasksPage: async ({ page }, use) => {\n    await use(new TasksPage(page));\n  },\n});\n\ntest('can rename', async ({ tasksPage, seededTask }) => { /* ... */ });", "fixtures.ts"]], "p": "Code before <code>use()<\/code> is setup, after is teardown, and it runs even if the test fails. Seed through the API, not the UI: it is 10–100× faster."}, {"k": "Auth", "h": "Log in once, reuse everywhere", "v": "<ol class=\"steps\"><li style=\"--d:0.0s\"><span>A <b>setup project<\/b> runs <code>auth.setup.ts<\/code> first<\/span><\/li><li style=\"--d:0.6s\"><span>It logs in through the UI (or API) once<\/span><\/li><li style=\"--d:1.2s\"><span><code>page.context().storageState({ path: '.auth/user.json' })<\/code> saves cookies + localStorage<\/span><\/li><li style=\"--d:1.8s\"><span>Other projects declare <code>dependencies: ['setup']<\/code> and <code>storageState: '.auth/user.json'<\/code><\/span><\/li><li style=\"--d:2.4s\"><span>Every test starts already signed in, in its own fresh context<\/span><\/li><\/ol>", "cmp": [["TS", "// auth.setup.ts\nsetup('authenticate', async ({ page }) => {\n  await page.goto('/login');\n  await page.getByLabel('Email').fill(process.env.E2E_USER!);\n  await page.getByLabel('Password').fill(process.env.E2E_PASS!);\n  await page.getByRole('button', { name: 'Sign in' }).click();\n  await expect(page).toHaveURL('/tasks');\n  await page.context().storageState({ path: '.auth/user.json' });\n});", "auth.setup.ts"]], "lab": true}, {"k": "Auth gotchas", "h": "Caveats &amp; gotchas", "v": "<ul class=\"chk\"><li class=\"rise\" style=\"--d:0.00s\">Add <code>.auth/<\/code> to <code>.gitignore<\/code>: the file contains live session tokens.<\/li><li class=\"rise\" style=\"--d:0.12s\">Tests that mutate the user (change password, log out) can invalidate the shared state for everyone. Give them their own account.<\/li><li class=\"rise\" style=\"--d:0.24s\">Session tokens expire; a cached state file from yesterday may be stale. Regenerate each run.<\/li><li class=\"rise\" style=\"--d:0.36s\">Multiple roles? One setup per role (<code>admin.json<\/code>, <code>viewer.json<\/code>) and pick per test with <code>test.use({ storageState })<\/code>.<\/li><\/ul>"}, {"quiz": true, "k": "Quiz 3 / 8 · Fixtures", "h": "Where should teardown code go in a custom fixture?", "opts": [["In <code>afterAll<\/code>", 0], ["After the <code>await use(value)<\/code> line", 1], ["Before <code>use<\/code>, so it runs first", 0]], "right": "<code>use<\/code> hands the value to the test and resumes when the test finishes, pass or fail.", "wrong": "<b>After <code>await use()<\/code><\/b>. That is the fixture's teardown phase."}, {"k": "Section 3 · Go deeper", "h": "Go deeper", "v": "<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.00s;text-decoration:none;display:block\" href=\"https://playwright.dev/docs/test-fixtures\" target=\"_blank\" rel=\"noopener\"><b>Playwright docs: Fixtures ↗<\/b><br><small>built-ins, custom, worker-scoped<\/small><\/a><a class=\"box rise\" style=\"--d:0.15s;text-decoration:none;display:block\" href=\"https://playwright.dev/docs/auth\" target=\"_blank\" rel=\"noopener\"><b>Playwright docs: Authentication ↗<\/b><br><small>setup projects and storageState<\/small><\/a><\/div>", "p": "Optional, but worth it. Tap a card to open it in a new tab."}, {"sect": 1, "num": "4", "kicker": "Section 4 · Network, traces, debugging", "h": "Mock the network, then read the trace", "p": "Control what the backend returns, and when a test fails, see exactly what happened."}, {"k": "Network", "h": "Intercepting requests with page.route", "cmp": [["TS", "// stub a response\nawait page.route('**/api/tasks', route =>\n  route.fulfill({ json: [{ id: 1, title: 'Mocked' }] }));\n\n// force an error\nawait page.route('**/api/tasks', route => route.fulfill({ status: 500 }));\n\n// modify a real response\nawait page.route('**/api/user', async route => {\n  const res = await route.fetch();\n  const json = await res.json();\n  await route.fulfill({ response: res, json: { ...json, plan: 'free' } });\n});\n\n// assert a request was made\nconst req = page.waitForRequest(r => r.url().endsWith('/api/tasks') && r.method() === 'POST');\nawait page.getByRole('button', { name: 'Create' }).click();\nexpect((await req).postDataJSON()).toEqual({ title: 'Write docs' });", "network"]], "p": "Register routes <b>before<\/b> the action that triggers the request (usually before <code>goto<\/code>).", "lab": true}, {"k": "Strategy", "h": "Mocked vs real backend", "v": "<div class=\"g2\"><div class=\"box rise ok\" style=\"--d:0.00s\"><b>Real backend<\/b><br><small>highest confidence; slower; needs seeded data and a stable env<\/small><\/div><div class=\"box rise \" style=\"--d:0.12s\"><b>Mocked network<\/b><br><small>fast, deterministic, easy error states; can drift from the real API<\/small><\/div><div class=\"box rise \" style=\"--d:0.24s\"><b>HAR replay<\/b><br><small>record real traffic once, replay it: <code>routeFromHAR<\/code><\/small><\/div><div class=\"box rise ok\" style=\"--d:0.36s\"><b>Common mix<\/b><br><small>a few real smoke flows + mocked tests for edge and error states<\/small><\/div><\/div>", "p": "E2E against mocks is really a component test in a real browser. That is valuable (real CSS, real routing) but say so in the test name."}, {"k": "Traces", "h": "The trace viewer", "v": "<svg viewBox=\"0 0 320 150\"><rect x=\"8\" y=\"10\" width=\"304\" height=\"130\" rx=\"12\" fill=\"#0d111b\" stroke=\"#2a3145\"/><rect class=\"pop\" style=\"--d:0.0s\" x=\"16\" y=\"20\" width=\"40\" height=\"28\" rx=\"4\" fill=\"#181d2b\" stroke=\"#4ea8ff\"/><rect class=\"pop\" style=\"--d:0.1s\" x=\"64\" y=\"20\" width=\"40\" height=\"28\" rx=\"4\" fill=\"#181d2b\" stroke=\"#4ea8ff\"/><rect class=\"pop\" style=\"--d:0.3s\" x=\"112\" y=\"20\" width=\"40\" height=\"28\" rx=\"4\" fill=\"#181d2b\" stroke=\"#4ea8ff\"/><rect class=\"pop\" style=\"--d:0.4s\" x=\"160\" y=\"20\" width=\"40\" height=\"28\" rx=\"4\" fill=\"#181d2b\" stroke=\"#4ea8ff\"/><rect class=\"pop\" style=\"--d:0.6s\" x=\"208\" y=\"20\" width=\"40\" height=\"28\" rx=\"4\" fill=\"#181d2b\" stroke=\"#4ea8ff\"/><rect class=\"pop\" style=\"--d:0.8s\" x=\"256\" y=\"20\" width=\"40\" height=\"28\" rx=\"4\" fill=\"#181d2b\" stroke=\"#4ea8ff\"/><text x=\"160\" y=\"62\" fill=\"#5d6680\" font-size=\"8\" text-anchor=\"middle\">filmstrip of screenshots<\/text><rect x=\"16\" y=\"72\" width=\"110\" height=\"60\" rx=\"6\" fill=\"#121622\"/><text x=\"24\" y=\"88\" fill=\"#cfd6ea\" font-size=\"8\">▸ goto /tasks<\/text><text x=\"24\" y=\"102\" fill=\"#cfd6ea\" font-size=\"8\">▸ click New task<\/text><text x=\"24\" y=\"116\" fill=\"#ff5c8a\" font-size=\"8\" class=\"blink\">▸ expect toBeVisible ✗<\/text><rect x=\"134\" y=\"72\" width=\"170\" height=\"60\" rx=\"6\" fill=\"#121622\"/><text x=\"142\" y=\"88\" fill=\"#cfd6ea\" font-size=\"8\">DOM snapshot · before / after<\/text><text x=\"142\" y=\"102\" fill=\"#cfd6ea\" font-size=\"8\">network · console · source<\/text><text x=\"142\" y=\"116\" fill=\"#cfd6ea\" font-size=\"8\">locator picker<\/text><\/svg>", "cmp": [["Bash", "npx playwright test --trace on        # force traces locally\nnpx playwright show-report             # open the HTML report\nnpx playwright show-trace trace.zip    # open a trace from CI artifacts", "commands"]], "p": "A trace is a zip with every action, a DOM snapshot before and after each one, network, console and source. It is the single best tool for \"passes locally, fails on CI\".", "lab": true}, {"k": "Debugging", "h": "The local debugging loop", "v": "<ol class=\"steps\"><li style=\"--d:0.0s\"><span><code>npx playwright test --ui<\/code>: UI mode, watch, time-travel through steps<\/span><\/li><li style=\"--d:0.6s\"><span><code>--debug<\/code> or <code>await page.pause()<\/code>: step through with the Inspector<\/span><\/li><li style=\"--d:1.2s\"><span><code>npx playwright codegen localhost:5173<\/code>: record actions to get locator ideas<\/span><\/li><li style=\"--d:1.8s\"><span><code>--headed --project=chromium -g \"create task\"<\/code>: run one test visibly<\/span><\/li><\/ol>", "p": "Codegen output is a starting point. Clean up its locators and add assertions; it records what you did, not what should be true."}, {"k": "Network · AI", "h": "What AI often gets wrong", "v": "<div class=\"vwrap\"><div class=\"box warn rise\" style=\"--d:0.00s\">✗ <code>page.route<\/code> registered after <code>page.goto<\/code><br><small style=\"color:#3ddc97\">✓ register routes before navigation<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.15s\">✗ Mocks every request, including the one under test<br><small style=\"color:#3ddc97\">✓ mock dependencies, exercise the feature<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.30s\">✗ <code>waitForResponse<\/code> set up after the click<br><small style=\"color:#3ddc97\">✓ create the wait promise before the action<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.45s\">✗ Commits raw codegen output<br><small style=\"color:#3ddc97\">✓ role-based locators + web-first assertions<\/small><\/div><\/div>"}, {"quiz": true, "k": "Quiz 4 / 8 · Debugging", "h": "A test fails only on CI. What do you look at first?", "opts": [["Re-run it locally ten times", 0], ["The trace from the failed or retried run", 1], ["Increase the timeout", 0]], "right": "The trace shows the DOM, network and console at the moment of failure on that machine.", "wrong": "Open the <b>trace<\/b>. It turns guessing into reading."}, {"k": "Section 4 · Go deeper", "h": "Go deeper", "v": "<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.00s;text-decoration:none;display:block\" href=\"https://playwright.dev/docs/mock\" target=\"_blank\" rel=\"noopener\"><b>Playwright docs: Mock APIs ↗<\/b><br><small>route, fulfill, HAR<\/small><\/a><a class=\"box rise\" style=\"--d:0.15s;text-decoration:none;display:block\" href=\"https://playwright.dev/docs/trace-viewer\" target=\"_blank\" rel=\"noopener\"><b>Playwright docs: Trace viewer ↗<\/b><br><small>recording and reading traces<\/small><\/a><a class=\"box rise\" style=\"--d:0.30s;text-decoration:none;display:block\" href=\"https://playwright.dev/docs/test-ui-mode\" target=\"_blank\" rel=\"noopener\"><b>Playwright docs: UI Mode ↗<\/b><br><small>the fastest local loop<\/small><\/a><\/div>", "p": "Optional, but worth it. Tap a card to open it in a new tab."}, {"sect": 1, "num": "5", "kicker": "Section 5 · Scale", "h": "Parallelism, flake, page objects, CI", "p": "What changes when the suite grows from 10 tests to 500."}, {"k": "Parallelism", "h": "Workers, files and sharding", "v": "<div class=\"g2\"><div class=\"box rise \" style=\"--d:0.00s\"><b>Workers<\/b><br><small>separate processes; each gets its own browser<\/small><\/div><div class=\"box rise \" style=\"--d:0.12s\"><b>Default<\/b><br><small>files in parallel, tests in a file in order<\/small><\/div><div class=\"box rise ok\" style=\"--d:0.24s\"><b><code>fullyParallel: true<\/code><\/b><br><small>tests within a file also spread across workers<\/small><\/div><div class=\"box rise ok\" style=\"--d:0.36s\"><b>Sharding<\/b><br><small><code>--shard=1/4<\/code> splits the suite across CI machines<\/small><\/div><\/div>", "p": "Parallel tests must not share mutable data. Unique names (<code>task-${testInfo.workerIndex}-${Date.now()}<\/code>) or per-worker accounts avoid collisions."}, {"k": "Flake", "h": "Where E2E flake comes from", "v": "<div class=\"g2\"><div class=\"box rise warn\" style=\"--d:0.00s\"><b>Timing<\/b><br><small>sleeps, missing awaits, non-retrying assertions<\/small><\/div><div class=\"box rise warn\" style=\"--d:0.12s\"><b>Shared data<\/b><br><small>two workers editing the same record<\/small><\/div><div class=\"box rise warn\" style=\"--d:0.24s\"><b>Animations<\/b><br><small>clicking during a transition<\/small><\/div><div class=\"box rise warn\" style=\"--d:0.36s\"><b>Environment<\/b><br><small>slow CI, cold caches, real third-party services<\/small><\/div><div class=\"box rise \" style=\"--d:0.48s\"><b>Order<\/b><br><small>test relies on state another test created<\/small><\/div><div class=\"box rise \" style=\"--d:0.60s\"><b>Clock/locale<\/b><br><small>dates, time zones, number formats<\/small><\/div><\/div>", "p": "Retries (<code>retries: 2<\/code>) keep the pipeline moving and mark tests as <b>flaky<\/b> in the report. Treat flaky as a bug to fix, not a green."}, {"k": "Flake", "h": "Avoiding it, concretely", "v": "<ul class=\"chk\"><li class=\"rise\" style=\"--d:0.00s\">Only web-first assertions; no <code>waitForTimeout<\/code><\/li><li class=\"rise\" style=\"--d:0.12s\">Seed data via API in fixtures, unique per test<\/li><li class=\"rise\" style=\"--d:0.24s\">Freeze time and locale where it matters: <code>page.clock<\/code>, <code>locale<\/code>, <code>timezoneId<\/code> in config<\/li><li class=\"rise\" style=\"--d:0.36s\">Mock third-party services (payments, maps, analytics)<\/li><li class=\"rise\" style=\"--d:0.48s\">Wait for the <b>result<\/b>, not the request: assert on what the user sees<\/li><li class=\"rise\" style=\"--d:0.60s\">Run new tests with <code>--repeat-each=20<\/code> before merging<\/li><\/ul>"}, {"k": "Page Object Model", "h": "Encapsulate the page, not the test", "cmp": [["TS", "export class TasksPage {\n  constructor(private page: Page) {}\n  readonly newButton = this.page.getByRole('button', { name: 'New task' });\n  readonly title = this.page.getByLabel('Title');\n  row(name: string) { return this.page.getByRole('listitem').filter({ hasText: name }); }\n\n  async goto() { await this.page.goto('/tasks'); }\n  async create(name: string) {\n    await this.newButton.click();\n    await this.title.fill(name);\n    await this.page.getByRole('button', { name: 'Create' }).click();\n  }\n}\n\ntest('create', async ({ page }) => {\n  const tasks = new TasksPage(page);\n  await tasks.goto();\n  await tasks.create('Write docs');\n  await expect(tasks.row('Write docs')).toBeVisible();   // assertion stays in the test\n});", "pages/TasksPage.ts"]], "p": "Page objects hold locators and actions; tests hold assertions. When the markup changes, you fix one class instead of forty tests.", "lab": true}, {"k": "CI", "h": "Running Playwright in CI", "cmp": [["Bash", "# .github/workflows/e2e.yml (excerpt)\n- uses: actions/setup-node@v4\n  with: { node-version: 20 }\n- run: npm ci\n- run: npx playwright install --with-deps chromium\n- run: npx playwright test --shard=${{ matrix.shard }}/4\n- uses: actions/upload-artifact@v4\n  if: ${{ !cancelled() }}\n  with: { name: playwright-report-${{ matrix.shard }}, path: playwright-report/ }", "CI"]], "p": "Install browsers with system deps, run against a built app (not the dev server) when possible, and always upload the report and traces as artifacts, even on failure."}, {"k": "Scale gotchas", "h": "Caveats &amp; gotchas", "v": "<ul class=\"chk\"><li class=\"rise\" style=\"--d:0.00s\">A page object with assertions inside every method hides what a test checks.<\/li><li class=\"rise\" style=\"--d:0.12s\">Over-abstracting: a helper per click makes tests unreadable. Keep POM thin.<\/li><li class=\"rise\" style=\"--d:0.24s\">Running all browsers on every PR is slow; Chromium on PRs, the full matrix nightly is common.<\/li><li class=\"rise\" style=\"--d:0.36s\">Visual comparisons (<code>toHaveScreenshot<\/code>) differ across OSes and fonts: generate baselines in the same container CI uses.<\/li><\/ul>"}, {"k": "Scale · AI", "h": "What AI often gets wrong", "v": "<div class=\"vwrap\"><div class=\"box warn rise\" style=\"--d:0.00s\">✗ Page object methods that assert and return nothing useful<br><small style=\"color:#3ddc97\">✓ actions in POM, assertions in tests<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.15s\">✗ <code>test.describe.serial<\/code> to make dependent tests pass<br><small style=\"color:#3ddc97\">✓ independent tests with fixture-seeded data<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.30s\">✗ <code>retries: 5<\/code> to make the suite green<br><small style=\"color:#3ddc97\">✓ fix the flaky cause; keep retries low<\/small><\/div><div class=\"box warn rise\" style=\"--d:0.45s\">✗ Hard-coded <code>http://localhost:3000<\/code> in tests<br><small style=\"color:#3ddc97\">✓ <code>baseURL<\/code> in config, relative <code>goto<\/code><\/small><\/div><\/div>"}, {"quiz": true, "k": "Quiz 5 / 8 · Flake", "h": "A test passes locally and flakes on CI with \"element is not stable\". Best fix?", "opts": [["<code>page.waitForTimeout(500)<\/code> before the click", 0], ["Wait for the state that ends the animation, or disable animations in tests", 1], ["<code>click({ force: true })<\/code>", 0]], "right": "Force skips actionability checks and can click the wrong thing. Fix the cause.", "wrong": "Address the <b>animation<\/b>: wait for the settled state or turn animations off for tests."}, {"quiz": true, "k": "Quiz 6 / 8 · POM", "h": "Where do assertions belong in the Page Object Model?", "opts": [["Inside every page object method", 0], ["In the test, using locators the page object exposes", 1], ["In a global afterEach", 0]], "right": "Tests should read as specifications; page objects are the vocabulary.", "wrong": "In the <b>test<\/b>. Page objects expose locators and actions."}, {"k": "Section 5 · Go deeper", "h": "Go deeper", "v": "<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.00s;text-decoration:none;display:block\" href=\"https://playwright.dev/docs/best-practices\" target=\"_blank\" rel=\"noopener\"><b>Playwright docs: Best Practices ↗<\/b><br><small>the team's own advice on stable tests<\/small><\/a><a class=\"box rise\" style=\"--d:0.15s;text-decoration:none;display:block\" href=\"https://playwright.dev/docs/pom\" target=\"_blank\" rel=\"noopener\"><b>Playwright docs: Page object models ↗<\/b><br><small>the canonical POM example<\/small><\/a><a class=\"box rise\" style=\"--d:0.30s;text-decoration:none;display:block\" href=\"https://playwright.dev/docs/ci-intro\" target=\"_blank\" rel=\"noopener\"><b>Playwright docs: Setting up CI ↗<\/b><br><small>GitHub Actions and artifacts<\/small><\/a><\/div>", "p": "Optional, but worth it. Tap a card to open it in a new tab."}, {"sect": 1, "num": "6", "kicker": "Section 6 · Lab", "h": "E2E for a task app", "p": "Write the specs a reviewer would want for create, error, and auth flows."}, {"k": "Lab 1 / 4 · Setup", "h": "Config and auth project", "cmp": [["TS", "export default defineConfig({\n  testDir: './e2e',\n  fullyParallel: true,\n  retries: process.env.CI ? 2 : 0,\n  use: { baseURL: 'http://localhost:4173', trace: 'on-first-retry' },\n  webServer: { command: 'pnpm build && pnpm preview', url: 'http://localhost:4173' },\n  projects: [\n    { name: 'setup', testMatch: /auth\\.setup\\.ts/ },\n    { name: 'chromium', dependencies: ['setup'],\n      use: { ...devices['Desktop Chrome'], storageState: '.auth/user.json' } },\n  ],\n});", "playwright.config.ts"]], "p": "Built app via <code>preview<\/code>, auth once, Chromium only. The nightly job can add more projects.", "lab": true}, {"k": "Lab 2 / 4 · Happy path", "h": "Create a task", "cmp": [["TS", "test('creates a task and shows it in the list', async ({ page }, testInfo) => {\n  const name = `Write docs ${testInfo.workerIndex}-${Date.now()}`;\n  const tasks = new TasksPage(page);\n  await tasks.goto();\n  await tasks.create(name);\n  await expect(tasks.row(name)).toBeVisible();\n  await page.reload();                          // persisted, not just optimistic\n  await expect(tasks.row(name)).toBeVisible();\n});", "create.spec.ts"]], "p": "The reload proves the server saved it. Unique names keep parallel workers from colliding.", "lab": true}, {"k": "Lab 3 / 4 · Error path", "h": "Server fails", "cmp": [["TS", "test('shows an error and keeps the input when saving fails', async ({ page }) => {\n  await page.route('**/api/tasks', route =>\n    route.request().method() === 'POST' ? route.fulfill({ status: 500 }) : route.continue());\n  const tasks = new TasksPage(page);\n  await tasks.goto();\n  await tasks.create('Will fail');\n  await expect(page.getByRole('alert')).toHaveText(/save failed/i);\n  await expect(tasks.title).toHaveValue('Will fail');\n});", "errors.spec.ts"]], "p": "Mock only the POST; GET stays real. Assert what the user sees and that their input survived.", "lab": true}, {"k": "Lab 4 / 4 · Signed out", "h": "Redirects and a fresh context", "cmp": [["TS", "test.describe('signed out', () => {\n  test.use({ storageState: { cookies: [], origins: [] } });\n\n  test('redirects to login', async ({ page }) => {\n    await page.goto('/tasks');\n    await expect(page).toHaveURL(/\\/login/);\n    await expect(page.getByRole('heading', { name: 'Sign in' })).toBeVisible();\n  });\n});", "auth.spec.ts"]], "p": "Then run <code>--repeat-each=10<\/code> and break the app on purpose (rename the Create button) to confirm each test fails for the right reason.", "lab": true}, {"quiz": true, "k": "Quiz 7 / 8 · Lab", "h": "Why does the happy-path test reload the page before the final assertion?", "opts": [["To clear the cache for the next test", 0], ["To prove the task was persisted by the server, not just shown optimistically", 1], ["Playwright requires a reload after a POST", 0]], "right": "An optimistic UI would pass without the reload even if the save failed.", "wrong": "It checks <b>persistence<\/b>. Optimistic UI can show a row the server never stored."}, {"quiz": true, "k": "Quiz 8 / 8 · Lab", "h": "The error test registers <code>page.route<\/code> for all methods with status 500. What breaks?", "opts": [["Nothing", 0], ["The initial GET also fails, so the page never shows the form state you meant to test", 1], ["Routes cannot return 500", 0]], "right": "Scope mocks narrowly: method and URL.", "wrong": "The <b>GET is mocked too<\/b>, so you test a different failure than intended."}, {"recap": true, "h": "Playwright on one card", "items": ["Tests run in Node; pages in real browsers; <b>fresh context per test<\/b>.", "<b>Locators<\/b> are lazy recipes; <b>auto-waiting<\/b> checks actionability; <b>web-first<\/b> <code>await expect(loc)<\/code> retries.", "<b>Fixtures<\/b> for setup/teardown; <b>storageState<\/b> + a setup project to log in once.", "<code>page.route<\/code> to mock; <b>traces<\/b> + UI mode to debug; unique data for <b>parallel<\/b> runs.", "Thin <b>page objects<\/b>, assertions in tests, low retries, artifacts on CI."], "next": "Next: <b>Part 12<\/b>, day one as a frontend dev with coding agents."}];

<script>(function(){
  "use strict";
  var KW='const|let|var|function|return|if|else|async|await|new|class|interface|type|import|export|default|from|def|end|public|private|static|final|void|try|catch|throw|typeof|record|enum|module|for|of|in|null|undefined|true|false|this|self|nil|package|implements|extends|describe|it|test|expect|before|beforeEach|afterEach|require|do';
  var RE=new RegExp('(\\/\\/[^\\n]*|#(?!\\{)[^\\n]*)|("[^"\\n]*"|\'[^\'\\n]*\'|`[^`]*`)|\\b('+KW+')\\b','g');
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function hl(src){ var out='',last=0,m; RE.lastIndex=0;
    while((m=RE.exec(src))){ out+=esc(src.slice(last,m.index)); out+= m[1]?'<span class="c">'+esc(m[1])+'</span>': m[2]?'<span class="s">'+esc(m[2])+'</span>':'<span class="k">'+m[3]+'</span>'; last=RE.lastIndex; }
    return out+esc(src.slice(last)); }
  var LC={JS:['#2a2510','#f7d046'],TS:['#13243a','#4ea8ff'],JSX:['#102a2a','#4ee6e0'],TSX:['#102a2a','#4ee6e0'],Java:['#2a1a14','#ff7a45'],JUnit:['#2a1a14','#ff7a45'],Ruby:['#3a1624','#ff5c8a'],RSpec:['#3a1624','#ff5c8a'],Bash:['#1a2a1a','#3ddc97'],Rails:['#3a1624','#ff5c8a'],JSON:['#22183a','#a78bfa']};
  var stage=document.getElementById('stage'), anchor=document.getElementById('bottomBar');
  CARDS.forEach(function(c){

    if(c.sect){ s.className+=' sect';
      h='<div class="visual"><div class="num pop">'+c.num+'</div></div>'+(c.badge?'<div class="titlebadge"><i></i>'+c.badge+'</div>':'')+'<div class="kicker">'+c.kicker+'</div><h1>'+c.h+'</h1><p>'+c.p+'</p>'+(c.first?'<div class="tapme">Tap the right side or swipe left →</div>':'');
    } else if(c.quiz){ s.className+=' quiz'; s.setAttribute('data-quiz','');
      h='<div class="kicker">'+c.k+'</div><h2>'+c.h+'</h2>'+(c.code?'<div class="qcode">'+hl(c.code)+'</div>':'<div style="height:10px"></div>')+'<div class="opts">'+c.opts.map(function(o,i){return '<button class="opt" type="button" data-ok="'+o[1]+'"><span class="l">'+'ABCD'[i]+'</span>'+o[0]+'</button>';}).join('')+'</div><div class="fb"></div>';
    } else if(c.recap){
      h='<div class="kicker">Recap</div><h2>'+c.h+'</h2><ul class="take">'+
        c.items.map(function(t,i){return '<li class="rise" style="--d:'+(i*0.15)+'s">'+t+'</li>';}).join('')+
        '</ul><div class="score" id="score"></div><p style="font-size:13px;margin-top:8px">'+c.next+'</p><a class="btn ghost" href="index.html" style="margin-top:6px">← Course home</a>';
    } else {
      var inner='';
      if(c.cmp){ inner='<div class="stack">'+c.cmp.map(function(b,i){ var col=LC[b[0]]||LC.JS; return '<div class="cb rise" style="--d:'+(i*0.25)+'s"><div class="cb-h">'+(b[2]||(i===0?'modern':'compare'))+' <span class="tagc" style="background:'+col[0]+';color:'+col[1]+'">'+b[0]+'</span></div><pre>'+hl(b[1])+'</pre></div>'; }).join('')+'</div>'; }
      if(c.v){ inner=c.v+inner; }
      if(c.lab){ s.className+=' lab'; inner='<div class="scrollv demo">'+inner+'</div>'; }
      h='<div class="kicker">'+c.k+'</div><div class="visual">'+inner+'</div><h2>'+c.h+'</h2>'+(c.p?'<p>'+c.p+'</p>':'')+(c.an?'<div class="analogy"><span>'+c.an+'</span></div>':'');
    }
    s.innerHTML=h; if(c.quiz){ var fb=s.querySelector('.fb'); fb.setAttribute('data-right',c.right); fb.setAttribute('data-wrong',c.wrong); }

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var stage=$('stage'), cards=[].slice.call(document.querySelectorAll('.card')), segsEl=$('segs'), countEl=$('count'), prevBtn=$('prev'), nextBtn=$('next');
  var cur=0, N=cards.length, answered=0, correct=0, NQ=document.querySelectorAll('[data-quiz]').length;
  cards.forEach(function(){ var s=document.createElement('div'); s.className='seg'; s.appendChild(document.createElement('i')); segsEl.appendChild(s); });
  var segs=segsEl.children;
  function go(n){
    n=Math.max(0,Math.min(N-1,n));
    cards.forEach(function(c,k){ c.classList.toggle('past',k<n); if(k!==n) c.classList.remove('active'); c.setAttribute('aria-hidden',k!==n); });
    var card=cards[n]; card.classList.remove('active'); void card.offsetWidth; card.classList.add('active');
    for(var k=0;k<N;k++) segs[k].classList.toggle('done',k<=n);
    countEl.textContent=(n+1)+' / '+N; prevBtn.disabled=n===0; nextBtn.disabled=n===N-1; cur=n; try{var _k='lp:'+location.pathname.split('/').pop(),_o=JSON.parse(localStorage.getItem(_k)||'{}');localStorage.setItem(_k,JSON.stringify({max:Math.max(_o.max||0,n+1),total:N}));}catch(_e){} updateScore();
    try{ history.replaceState(null,'','#'+(n+1)); }catch(e){}
  }
  function next(){ if(cur<N-1) go(cur+1); } function prev(){ if(cur>0) go(cur-1); }
  prevBtn.addEventListener('click',function(e){e.stopPropagation();prev();});
  nextBtn.addEventListener('click',function(e){e.stopPropagation();next();});
  
  var lastSwipe=0;
  stage.addEventListener('click',function(e){
    if(Date.now()-lastSwipe<450) return;
    if(e.target.closest('button, a, .opts, .demo, textarea, iframe')) return;
    var r=stage.getBoundingClientRect(); if((e.clientX-r.left)/r.width<0.3) prev(); else next();
  });
  var sx=0,sy=0,tr=false;
  stage.addEventListener('touchstart',function(e){ if(e.target.closest('textarea')) return; var t=e.touches[0]; sx=t.clientX; sy=t.clientY; tr=true; },{passive:true});
  stage.addEventListener('touchend',function(e){ if(!tr) return; tr=false; var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){ lastSwipe=Date.now(); if(dx<0) next(); else prev(); } },{passive:true});
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='TEXTAREA') return;
    if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter')) return;
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
    else if(e.key==='Home') go(0); else if(e.key==='End') go(N-1);
  });
  [].forEach.call(document.querySelectorAll('[data-quiz]'),function(q){
    var opts=q.querySelector('.opts'), fb=q.querySelector('.fb');
    [].forEach.call(opts.querySelectorAll('.opt'),function(b){
      b.addEventListener('click',function(e){
        e.stopPropagation(); if(opts.classList.contains('done')) return;
        opts.classList.add('done'); answered++;
        var ok=b.getAttribute('data-ok')==='1'; if(ok) correct++; else b.classList.add('wrong');
        opts.querySelector('[data-ok="1"]').classList.add('right');
        fb.innerHTML='<span class="tag" style="color:'+(ok?'var(--green)':'var(--pink)')+'">'+(ok?'✓ Correct.':'✗ Not quite.')+'</span> '+fb.getAttribute(ok?'data-right':'data-wrong')+'<br><span style="color:var(--dim);font-size:12px">Tap or swipe to continue →</span>';
        fb.classList.add('show');
      });
    });
  });
  function updateScore(){ var s=$('score'); s.textContent=answered?('Quiz score: '+correct+' / '+NQ+(answered<NQ?' ('+(NQ-answered)+' skipped)':'')):''; }

  var start=parseInt((location.hash||'').slice(1),10); go(isNaN(start)?0:start-1);
})();
</script>
