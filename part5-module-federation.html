<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07080d">
<title>Part 5 · Module Federation</title><style>
:root{
  --bg:#07080d; --panel:#121622; --panel2:#181d2b; --line:#2a3145; --text:#eef1f8; --muted:#a3acc2; --dim:#5d6680;
  --html:#ff7a45; --css:#4ea8ff; --js:#f7d046; --green:#3ddc97; --purple:#a78bfa; --pink:#ff5c8a; --cyan:#4ee6e0;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
.app{position:fixed;inset:0;display:flex;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#141a2e 0,transparent 60%),var(--bg)}
.stage{position:relative;width:100%;max-width:460px;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y}
@media (min-width:600px){.stage{height:min(100%,900px);margin:auto;border-radius:28px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 300px at 85% 10%,rgba(167,139,250,.10),transparent 70%),radial-gradient(500px 300px at 0% 90%,rgba(78,168,255,.08),transparent 70%);pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
.segs{display:flex;gap:3px}
.seg{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--css),var(--purple));transition:width .35s ease}
.seg.done i{width:100%}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.meta b{color:var(--text);font-weight:600}
.card{position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 58px) 22px calc(env(safe-area-inset-bottom) + 64px);display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(40px) scale(.98);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s linear .45s}
.card.past{transform:translateX(-40px) scale(.98)}
.card.active{opacity:1;visibility:visible;transform:none;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
.kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);margin-bottom:6px}
.visual{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;margin:4px 0 14px}
.visual svg{width:100%;height:100%;max-height:330px;overflow:visible}
h1,h2{margin:0 0 10px;line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(30px,9vw,40px)}
h2{font-size:clamp(22px,6.4vw,28px)}
p{margin:0 0 8px;font-size:clamp(15px,4.2vw,17px);line-height:1.5;color:var(--muted)}
p b,p strong{color:var(--text);font-weight:600}
code,.mono{font-family:var(--mono);font-size:.9em}
p code,.analogy code{background:#1b2131;border:1px solid var(--line);padding:1px 5px;border-radius:6px;color:#dfe5f5}
.analogy{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,rgba(78,168,255,.10),rgba(167,139,250,.10));border:1px solid rgba(120,140,255,.25);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;color:#cfd6ea;margin-top:6px}
.analogy::before{content:"⚙";font-size:15px;color:var(--css);line-height:1.3}
.analogy b{color:#fff}
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:0 14px calc(env(safe-area-inset-bottom) + 12px)}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(18,22,34,.8);color:var(--text);font-size:20px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
.nav:disabled{opacity:.3}
.hint{font-size:12px;color:var(--dim)}
svg *{transform-box:fill-box;transform-origin:center}
.active .pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.35) both;animation-delay:var(--d,0s)}
.active .fade{animation:fade .6s ease both;animation-delay:var(--d,0s)}
.active .rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.growx{transform-origin:left center}
.active .growx{animation:growx .6s ease both;animation-delay:var(--d,0s)}
.active .draw{stroke-dasharray:var(--len,300);animation:draw 1s ease both;animation-delay:var(--d,0s)}
.flow{stroke-dasharray:4 6;animation:flow 1s linear infinite}
.pulse{animation:pulse 2s ease-in-out infinite;animation-delay:var(--pd,0s)}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:var(--len,300)}to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes goR{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(60px);opacity:0}}
@keyframes goL{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(-72px);opacity:0}}
.req{animation:goR 2.4s ease-in-out infinite}
.chunk{opacity:0;animation:goL 2.4s linear infinite;animation-delay:var(--d,0s)}
.titlebadge{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;margin-bottom:14px;align-self:flex-start;background:rgba(255,255,255,.03)}
.titlebadge i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.tapme{margin-top:6px;font-size:13px;color:var(--dim);animation:pulse 1.8s infinite}
.grad{background:linear-gradient(90deg,var(--html),var(--js) 35%,var(--css) 70%,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.lay{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.lay-frame{width:100%;border:1px solid var(--line);border-radius:14px;padding:8px;background:#0d111b;display:flex;flex-direction:column;gap:6px;animation:resize 5s ease-in-out infinite alternate;position:relative}
@keyframes resize{0%,15%{width:100%}85%,100%{width:52%}}
.lay .b{border-radius:8px;font:600 11px/1 var(--mono);display:flex;align-items:center;justify-content:center;color:#0b0e16;padding:0 4px;overflow:hidden;white-space:nowrap}
.lay .hdr{height:26px;background:var(--css)}
.lay-row{display:flex;gap:6px}
.lay .side{flex:0 0 26%;height:54px;background:var(--purple)}
.lay .main{flex:1;height:54px;background:var(--green)}
.lay-cards{display:flex;flex-wrap:wrap;gap:6px}
.lay .c{flex:1 1 64px;height:30px;background:var(--js)}
.ruler{font:12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.ruler span{display:inline-block;height:2px;width:40px;background:linear-gradient(90deg,var(--pink),var(--js));border-radius:2px}
.comp{position:relative;width:250px;height:230px;perspective:800px}
.comp-in{position:absolute;inset:0;transform-style:preserve-3d}
.layer{position:absolute;left:25px;top:30px;width:200px;height:170px;border-radius:14px;border:1px solid rgba(255,255,255,.18);transform-origin:center;animation:explode 6s ease-in-out infinite;--z:0px;display:flex;align-items:flex-end;justify-content:flex-end;padding:8px;font:600 10px var(--mono);color:rgba(255,255,255,.85)}
.l1{--z:-60px;background-color:#151b30;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:16px 16px}
.l2{--z:0px;background:rgba(78,168,255,.18)}
.l2::before{content:"";position:absolute;left:66px;top:16px;width:112px;height:10px;border-radius:5px;background:rgba(255,255,255,.75);box-shadow:0 22px 0 rgba(255,255,255,.4),0 40px 0 rgba(255,255,255,.4),0 58px 0 rgba(255,255,255,.4),0 86px 0 -1px rgba(61,220,151,.7)}
.l3{--z:60px;width:56px;background:rgba(167,139,250,.6);animation-name:explode3;align-items:flex-start;justify-content:center;padding-top:10px;text-align:center}
@keyframes explode{0%,22%,100%{transform:rotateX(56deg) rotateZ(-38deg) translateZ(var(--z))}48%,80%{transform:rotateX(0) rotateZ(0) translateZ(0)}}
@keyframes explode3{0%,22%,100%{transform:rotateX(56deg) rotateZ(-38deg) translateZ(var(--z))}48%{transform:translateX(-60px)}62%,80%{transform:translateX(0)}}
.comp-tag{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font:12px var(--mono);color:var(--muted)}
.cost{width:100%;display:grid;grid-template-columns:92px repeat(5,1fr);gap:6px;font-size:10.5px;align-items:center}
.cost .h{color:var(--dim);text-align:center;font-weight:600;letter-spacing:.02em}
.cost .lbl{font:600 11px var(--mono);color:var(--text);line-height:1.3}
.cost .lbl small{display:block;color:var(--dim);font-weight:400}
.cell{height:30px;border-radius:8px;background:#151a27;border:1px dashed #262d40}
.cell.on{background:var(--c);border:0;box-shadow:0 0 14px var(--c)}
.active .cell.on{animation:light .45s ease both;animation-delay:var(--d,0s)}
@keyframes light{from{opacity:.1;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.costtag{grid-column:2/7;font-size:11px;color:var(--muted);text-align:right;margin-top:-2px}
.qcode{font:13px/1.55 var(--mono);background:#0d111b;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0 14px;color:#cdd5ea;white-space:pre;overflow-x:auto}
.qcode .k{color:var(--purple)}.qcode .s{color:var(--green)}.qcode .t{color:var(--html)}.qcode .c{color:var(--dim)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:15px;line-height:1.35;cursor:pointer;transition:transform .15s,border-color .2s,background .2s,opacity .2s}
.opt:active{transform:scale(.98)}
.opt:focus-visible{outline:2px solid var(--css)}
.opt .l{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#1e2436;font:700 12px var(--mono);color:var(--muted)}
.opt code{font-size:13px}
.opt.right{border-color:var(--green);background:rgba(61,220,151,.12)}
.opt.right .l{background:var(--green);color:#06210f}
.opt.wrong{border-color:var(--pink);background:rgba(255,92,138,.12);animation:shake .4s}
.opt.wrong .l{background:var(--pink);color:#2a0612}
.opts.done .opt:not(.right):not(.wrong){opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.fb{margin-top:12px;font-size:14px;line-height:1.45;color:var(--muted);opacity:0;transform:translateY(8px);transition:.3s}
.fb.show{opacity:1;transform:none}
.fb b{color:var(--text)}
.fb code{background:#1b2131;padding:1px 4px;border-radius:5px;color:#dfe5f5}
.fb .tag{display:inline-block;font-weight:800;margin-right:4px}
.qspacer{flex:1}
.rx{width:100%;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.rx-row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.rx-box{flex:1;background:#0d111b;border:1px solid var(--line);border-radius:12px;padding:10px 8px;font:11px/1.4 var(--mono);color:#cdd5ea;min-height:62px;display:flex;flex-direction:column;justify-content:center}
.rx-box .cap{font:700 9px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.rx-arrow{color:var(--purple);font:700 13px var(--mono);flex:0 0 auto}
.rx-f{flex:0 0 auto;background:linear-gradient(135deg,rgba(167,139,250,.25),rgba(78,168,255,.2));border:1px solid rgba(167,139,250,.5);border-radius:12px;padding:10px 7px;font:700 12px var(--mono)}
.rx-ui{background:#f5f6fa;color:#141824;border-radius:14px;padding:9px 10px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);min-height:62px}
.rx-ui .bar{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.rx-ui .badge{background:#ff5c1a;color:#fff;border-radius:999px;padding:1px 8px;font-size:11px}
.rx-ui ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.rx-ui li{background:#e7e9f2;border-radius:6px;padding:3px 6px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px #3ddc97}100%{box-shadow:0 0 0 0 transparent}}
.rx-note{font-size:12px;color:var(--dim);text-align:center}
.btn{all:unset;cursor:pointer;align-self:center;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,var(--purple),var(--css));color:#fff;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(120,120,255,.35)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--text);align-self:flex-start}
.flowchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;width:100%}
.chip{padding:7px 10px;border-radius:10px;font:700 12px var(--mono);color:#0b0e16;display:inline-block}
.arr{color:var(--dim);font-size:12px}
.take{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px;width:100%}
.take li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.4;color:#cfd6ea}
.take li b{color:#fff}
.score{font-size:13px;color:var(--muted);margin-top:10px}
.next-tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.next-tags span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);font-family:var(--mono)}
@media (max-height:700px){.visual svg{max-height:230px}.qcode{font-size:12px;padding:8px 10px;margin:4px 0 8px}.opt{padding:10px 12px}.analogy{font-size:13px;padding:8px 10px}p{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ---- lesson 1b additions ---- */
.net{width:100%;background:#0d111b;border:1px solid var(--line);border-radius:12px;overflow:hidden;font:10.5px/1.2 var(--mono)}
.net-h,.net-r{display:grid;grid-template-columns:1.35fr 46px 40px 1fr;gap:6px;align-items:center;padding:6px 9px}
.net-h{color:var(--dim);font:700 8.5px system-ui;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line);background:#121622}
.net-r{border-bottom:1px solid #161b28;color:#cdd5ea}
.net-r:last-of-type{border-bottom:0}
.net-r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net-r .t{color:var(--muted);font-size:9.5px}
.net-r .z{color:var(--muted);text-align:right;font-size:9.5px}
.net-r.dim{color:#59627a}.net-r.dim .t,.net-r.dim .z{color:#454d63}.net-r.dim .wf i{opacity:.35}
.net-r.hl{background:rgba(78,168,255,.09);box-shadow:inset 3px 0 0 var(--css)}
.wf{position:relative;height:9px;background:repeating-linear-gradient(90deg,transparent 0 19.6%,#1a2030 19.6% 20%)}
.wf i{position:absolute;top:0;height:100%;border-radius:3px;left:var(--s);width:var(--w);background:var(--c);transform-origin:left center}
.active .net-r{animation:rise .4s ease both;animation-delay:var(--d,0s)}
.active .wf i{animation:growx .5s ease both;animation-delay:calc(var(--d,0s) + .15s)}
.net-foot{padding:5px 9px;color:var(--dim);font-size:9px;display:flex;justify-content:space-between;border-top:1px solid var(--line);background:#121622}
.netwrap{width:100%;display:flex;flex-direction:column;gap:10px}
.cb{width:100%;font:11.5px/1.5 var(--mono);background:#0d111b;border:1px solid var(--line);border-radius:12px;color:#cdd5ea;overflow:hidden}
.cb pre{margin:0;padding:9px 11px;white-space:pre;overflow-x:auto;font:inherit}
.cb-h{display:flex;justify-content:space-between;align-items:center;padding:5px 11px;background:#121622;border-bottom:1px solid var(--line);font:700 9px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.cb-h .tagc{font:700 9.5px var(--mono);letter-spacing:0;text-transform:none;padding:2px 7px;border-radius:999px}
.k{color:var(--purple)}.s{color:var(--green)}.t{color:var(--html)}.c{color:var(--dim)}.y{color:var(--js)}.bl{color:var(--css)}
.mk{background:rgba(247,208,70,.18);color:var(--js);border-radius:4px;padding:0 2px}
.stack{width:100%;display:flex;flex-direction:column;gap:8px}
.down{align-self:center;color:var(--purple);font:700 13px var(--mono);line-height:1}
/* phone mock */
.phone{width:178px;height:300px;border-radius:26px;border:2px solid #2a3145;background:#0b0e16;padding:12px 10px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.5);flex:0 0 auto;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.url{font:10px var(--mono);background:#181d2b;border-radius:8px;padding:6px 8px;color:var(--muted);white-space:nowrap;overflow:hidden}
.url b{color:var(--text);font-weight:600}
.pg{flex:1;border-radius:12px;background:#f3f5fa;padding:10px 9px;display:flex;flex-direction:column;gap:7px;color:#141824;font-size:11px;overflow:hidden;position:relative}
.pg.blank{background:#fff}
.pg .ttl{font-weight:800;font-size:12.5px;display:flex;justify-content:space-between;align-items:center}
.sk{height:30px;border-radius:8px;background:linear-gradient(90deg,#e1e5ee 0,#f0f2f7 40%,#e1e5ee 80%);background-size:250% 100%;animation:shimmer 1.3s linear infinite}
.sk.sm{height:12px;width:60%}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-150% 0}}
.prow{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e3e6ee;border-radius:8px;padding:7px 8px;font-size:10.5px;font-weight:600;color:#141824;cursor:pointer}
.prow span{font-weight:500;font-size:9px;color:#fff;background:#3ddc97;border-radius:999px;padding:1px 6px}
.prow span.pl{background:#f7a046}
.prow.tapme2{box-shadow:0 0 0 0 rgba(255,92,26,.6);animation:ring 1.6s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,92,26,.55)}70%{box-shadow:0 0 0 8px rgba(255,92,26,0)}100%{box-shadow:0 0 0 0 rgba(255,92,26,0)}}
.dom{font:10.5px/1.55 var(--mono);color:#cdd5ea;background:#0d111b;border:1px solid var(--line);border-radius:12px;padding:10px;flex:1;min-width:0;white-space:pre;overflow:hidden}
.row2{display:flex;gap:12px;align-items:center;width:100%;justify-content:center}
.swap-a{animation:none}
.active .later{animation:fade .5s ease both;animation-delay:var(--d,1.5s)}
.active .gone{animation:gone .4s ease both;animation-delay:var(--d,1.5s)}
@keyframes gone{to{opacity:0;height:0;margin:0;padding:0}}
/* comparison table */
.vs{width:100%;display:grid;grid-template-columns:76px 1fr 1fr;gap:5px;font-size:12px;line-height:1.3}
.vs div{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 8px;color:#cfd6ea}
.vs .vh{font-weight:800;text-align:center;border:0}
.vs .vh.code{background:rgba(247,208,70,.14);color:var(--js)}
.vs .vh.data{background:rgba(61,220,151,.14);color:var(--green)}
.vs .vl{background:transparent;border:0;color:var(--dim);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;padding:0}
.trio{width:100%;display:flex;flex-direction:column;gap:7px}
.trio .cb pre{padding:6px 10px;font-size:10.5px}
.find{font-size:12px;color:var(--muted);text-align:center}
.reload{display:inline-block;font:700 10px var(--mono);padding:3px 8px;border-radius:999px;background:rgba(61,220,151,.15);color:var(--green);border:1px solid rgba(61,220,151,.4)}

<script>var CARDS = [{"sect": 1, "num": "MF", "kicker": "Part 5 · Micro-frontends", "h": "Module Federation <span class=\"grad\">from the shell out<\/span>", "p": "How Procore-style React micro-frontends get stitched into one page at runtime, explained with the service architecture you already run.", "badge": "~12 min · 31 cards · 5 quizzes", "first": true}, {"k": "Why micro-frontends", "h": "Split the UI the way you split services", "v": "<svg viewBox=\"0 0 320 200\"><rect class=\"pop\" x=\"10\" y=\"20\" width=\"120\" height=\"160\" rx=\"12\" fill=\"#151b30\" stroke=\"#ff7a45\"/><text x=\"70\" y=\"96\" fill=\"#eef1f8\" font-size=\"12\" text-anchor=\"middle\" font-family=\"monospace\">one SPA<\/text><text x=\"70\" y=\"114\" fill=\"#a3acc2\" font-size=\"10\" text-anchor=\"middle\">1 repo · 1 deploy<\/text>\n<path class=\"flow\" d=\"M135 100 H170\" stroke=\"#a78bfa\" stroke-width=\"2\"/>\n<g class=\"rise\" style=\"--d:.3s\"><rect x=\"178\" y=\"20\" width=\"132\" height=\"44\" rx=\"10\" fill=\"rgba(78,168,255,.18)\" stroke=\"#4ea8ff\"/><text x=\"244\" y=\"47\" fill=\"#eef1f8\" font-size=\"11\" text-anchor=\"middle\" font-family=\"monospace\">Projects team<\/text><\/g>\n<g class=\"rise\" style=\"--d:.6s\"><rect x=\"178\" y=\"78\" width=\"132\" height=\"44\" rx=\"10\" fill=\"rgba(61,220,151,.16)\" stroke=\"#3ddc97\"/><text x=\"244\" y=\"105\" fill=\"#eef1f8\" font-size=\"11\" text-anchor=\"middle\" font-family=\"monospace\">RFIs team<\/text><\/g>\n<g class=\"rise\" style=\"--d:.9s\"><rect x=\"178\" y=\"136\" width=\"132\" height=\"44\" rx=\"10\" fill=\"rgba(247,208,70,.14)\" stroke=\"#f7d046\"/><text x=\"244\" y=\"163\" fill=\"#eef1f8\" font-size=\"11\" text-anchor=\"middle\" font-family=\"monospace\">Budget team<\/text><\/g><\/svg>", "p": "One giant SPA means one repo, one build, one release train. Micro-frontends cut the UI into <b>vertical slices<\/b> owned by the teams that own the domain.", "an": "Same move as carving a Rails monolith into services, except the pieces are joined in the <b>browser<\/b>, not over HTTP."}, {"k": "Team ownership", "h": "A team owns a slice, top to bottom", "v": "<div class=\"g3\"><div class=\"box rise\"><b>Projects<\/b><br><small>UI · API · DB · on-call<\/small><\/div><div class=\"box rise\" style=\"--d:.2s\"><b>RFIs<\/b><br><small>UI · API · DB · on-call<\/small><\/div><div class=\"box rise\" style=\"--d:.4s\"><b>Budget<\/b><br><small>UI · API · DB · on-call<\/small><\/div><\/div><div class=\"box pop\" style=\"--d:.7s;margin-top:8px;text-align:center;width:100%\"><b>Platform team<\/b> owns the host shell: nav, auth, routing, design system<\/div>", "p": "Conway's law, applied on purpose: the boundary in the code matches the boundary in the org chart, so most changes stay inside one team."}, {"k": "Independent deploys", "h": "Ship Projects without shipping RFIs", "v": "<svg viewBox=\"0 0 320 170\"><g font-family=\"monospace\" font-size=\"10\" fill=\"#a3acc2\"><text x=\"4\" y=\"34\">Projects<\/text><text x=\"4\" y=\"84\">RFIs<\/text><text x=\"4\" y=\"134\">Shell<\/text><\/g>\n<g stroke=\"#2a3145\" stroke-width=\"2\"><line x1=\"70\" y1=\"30\" x2=\"316\" y2=\"30\"/><line x1=\"70\" y1=\"80\" x2=\"316\" y2=\"80\"/><line x1=\"70\" y1=\"130\" x2=\"316\" y2=\"130\"/><\/g>\n<g><circle class=\"pop\" style=\"--d:.2s\" cx=\"100\" cy=\"30\" r=\"7\" fill=\"#4ea8ff\"/><circle class=\"pop\" style=\"--d:.5s\" cx=\"170\" cy=\"30\" r=\"7\" fill=\"#4ea8ff\"/><circle class=\"pop\" style=\"--d:.8s\" cx=\"215\" cy=\"30\" r=\"7\" fill=\"#4ea8ff\"/><circle class=\"pop\" style=\"--d:1.1s\" cx=\"290\" cy=\"30\" r=\"7\" fill=\"#4ea8ff\"/>\n<circle class=\"pop\" style=\"--d:.4s\" cx=\"140\" cy=\"80\" r=\"7\" fill=\"#3ddc97\"/><circle class=\"pop\" style=\"--d:1s\" cx=\"260\" cy=\"80\" r=\"7\" fill=\"#3ddc97\"/>\n<circle class=\"pop\" style=\"--d:1.3s\" cx=\"200\" cy=\"130\" r=\"7\" fill=\"#f7d046\"/><\/g>\n<text x=\"190\" y=\"162\" fill=\"#5d6680\" font-size=\"10\" text-anchor=\"middle\">time → each dot = a production deploy<\/text><\/svg>", "p": "Each remote has its own pipeline and CDN path. The host fetches the <b>latest<\/b> remote at runtime, so a Projects fix goes live without rebuilding the shell.", "an": "Like deploying one service behind a stable API gateway route instead of waiting for the monolith deploy."}, {"k": "Trade-offs", "h": "Not free: you buy autonomy with complexity", "v": "<div class=\"vs\"><div class=\"vl\"><\/div><div class=\"vh data\">Gains<\/div><div class=\"vh code\" style=\"background:rgba(255,92,138,.14);color:var(--pink)\">Costs<\/div>\n<div class=\"vl\">Teams<\/div><div class=\"rise\">Own a slice end-to-end, pick release cadence<\/div><div class=\"rise\" style=\"--d:.2s\">Cross-team UX consistency needs a design system<\/div>\n<div class=\"vl\">Deploy<\/div><div class=\"rise\" style=\"--d:.3s\">Ship without a monolith-wide release train<\/div><div class=\"rise\" style=\"--d:.4s\">Runtime integration: breakage shows up in prod, not at build<\/div>\n<div class=\"vl\">Code<\/div><div class=\"rise\" style=\"--d:.5s\">Smaller repos, faster builds<\/div><div class=\"rise\" style=\"--d:.6s\">Duplicate deps, version drift, more bytes<\/div>\n<div class=\"vl\">Ops<\/div><div class=\"rise\" style=\"--d:.7s\">Isolate failures per remote<\/div><div class=\"rise\" style=\"--d:.8s\">More pipelines, CDNs, observability to run<\/div><\/div>", "p": "Rule of thumb: worth it with <b>several teams<\/b> stepping on each other. For one team, a well-structured single app wins."}, {"k": "Compared with microservices", "h": "Same idea, different runtime", "v": "<div class=\"vs\"><div class=\"vl\"><\/div><div class=\"vh code\">Microservices<\/div><div class=\"vh data\">Micro-frontends<\/div>\n<div class=\"vl\">Unit<\/div><div class=\"rise\">Service + DB<\/div><div class=\"rise\">UI slice (+ its BFF/API)<\/div>\n<div class=\"vl\">Glue<\/div><div class=\"rise\" style=\"--d:.2s\">HTTP / Kafka over network<\/div><div class=\"rise\" style=\"--d:.2s\">JS modules in ONE browser tab<\/div>\n<div class=\"vl\">Contract<\/div><div class=\"rise\" style=\"--d:.4s\">OpenAPI / Avro schema<\/div><div class=\"rise\" style=\"--d:.4s\">Exposed module + props + events<\/div>\n<div class=\"vl\">Shared libs<\/div><div class=\"rise\" style=\"--d:.6s\">Each has its own jar/gem copy<\/div><div class=\"rise\" style=\"--d:.6s\">Should SHARE React (singleton)<\/div>\n<div class=\"vl\">Failure<\/div><div class=\"rise\" style=\"--d:.8s\">Timeouts, circuit breakers<\/div><div class=\"rise\" style=\"--d:.8s\">Error boundaries, fallbacks<\/div><\/div>", "p": "The biggest difference: microservices each bring their own libraries, but micro-frontends must <b>share<\/b> React. Two Reacts in one tab break hooks."}, {"quiz": true, "k": "Quiz 1 / 5 · When to use", "h": "Which situation most justifies micro-frontends?", "opts": [["A 3-person team building a new dashboard", 0], ["Five teams blocked on one shared release train for a big UI", 1], ["An app that needs faster page loads", 0]], "right": "Micro-frontends solve an <b>organisational<\/b> problem: independent ownership and deploys. They usually add bytes, not remove them.", "wrong": "It's the <b>five blocked teams<\/b>. MFEs trade complexity for team autonomy; they don't make small apps or page loads better."}, {"k": "Webpack 5 Module Federation", "h": "One host, many remotes", "v": "<svg viewBox=\"0 0 320 220\"><rect class=\"pop\" x=\"110\" y=\"80\" width=\"100\" height=\"60\" rx=\"12\" fill=\"rgba(167,139,250,.25)\" stroke=\"#a78bfa\"/><text x=\"160\" y=\"106\" fill=\"#fff\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\">HOST<\/text><text x=\"160\" y=\"122\" fill=\"#cfd6ea\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">shell: nav, auth, router<\/text>\n<g stroke-width=\"2\" fill=\"none\"><path class=\"flow\" d=\"M110 100 L60 50\" stroke=\"#4ea8ff\"/><path class=\"flow\" d=\"M210 100 L262 50\" stroke=\"#3ddc97\"/><path class=\"flow\" d=\"M160 140 L160 178\" stroke=\"#f7d046\"/><\/g>\n<g class=\"rise\" style=\"--d:.3s\"><rect x=\"8\" y=\"14\" width=\"104\" height=\"40\" rx=\"10\" fill=\"#13243a\" stroke=\"#4ea8ff\"/><text x=\"60\" y=\"32\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-family=\"monospace\">projects<\/text><text x=\"60\" y=\"46\" fill=\"#a3acc2\" font-size=\"8\" text-anchor=\"middle\" font-family=\"monospace\">:3001/remoteEntry.js<\/text><\/g>\n<g class=\"rise\" style=\"--d:.5s\"><rect x=\"210\" y=\"14\" width=\"104\" height=\"40\" rx=\"10\" fill=\"#10261c\" stroke=\"#3ddc97\"/><text x=\"262\" y=\"32\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-family=\"monospace\">rfis<\/text><text x=\"262\" y=\"46\" fill=\"#a3acc2\" font-size=\"8\" text-anchor=\"middle\" font-family=\"monospace\">cdn/rfis/remoteEntry.js<\/text><\/g>\n<g class=\"rise\" style=\"--d:.7s\"><rect x=\"108\" y=\"178\" width=\"104\" height=\"38\" rx=\"10\" fill=\"#2a2510\" stroke=\"#f7d046\"/><text x=\"160\" y=\"195\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-family=\"monospace\">budget<\/text><text x=\"160\" y=\"208\" fill=\"#a3acc2\" font-size=\"8\" text-anchor=\"middle\" font-family=\"monospace\">cdn/budget/remoteEntry.js<\/text><\/g><\/svg>", "p": "The <b>host<\/b> (shell) is the page you open. <b>Remotes<\/b> are separately built and deployed apps that <b>expose<\/b> modules. The host imports them like local code, but the bytes arrive at runtime.", "an": "Host ≈ API gateway, remotes ≈ services, <code>remoteEntry.js<\/code> ≈ the service's discovery endpoint."}, {"k": "Remote config", "h": "<code>exposes<\/code>: the public API of a remote", "cmp": [["JS", "new ModuleFederationPlugin({\n  name: 'projects',            // window.projects\n  filename: 'remoteEntry.js',\n  exposes: {\n    './ProjectsApp': './src/ProjectsApp',\n    './ProjectCard': './src/components/ProjectCard',\n  },\n  shared: { react: { singleton: true } },\n})", "projects/webpack.config.js"], ["Java", "// like module-info.java\nmodule com.procore.projects {\n  exports com.procore.projects.api;   // only this is public\n}"]], "p": "Only exposed paths are importable. Everything else is private, so treat <code>exposes<\/code> like a versioned API."}, {"k": "Host config", "h": "<code>remotes<\/code>: where to find them", "cmp": [["JS", "new ModuleFederationPlugin({\n  name: 'host',\n  remotes: {\n    projects: 'projects@https://cdn.procore.com/projects/remoteEntry.js',\n  },\n  shared: { react: { singleton: true } },\n})\n\n// anywhere in host code:\nconst ProjectsApp = lazy(() => import('projects/ProjectsApp'));", "host/webpack.config.js"]], "p": "<code>projects@url<\/code> = \"the global named <code>projects<\/code> defined by the script at this URL\". The import specifier is <code>alias/exposedPath<\/code>.", "an": "Like a <code>database.yml<\/code> entry: a name in code, the real address in config, swappable per environment."}, {"k": "remoteEntry.js", "h": "A tiny manifest and loader", "v": "<div class=\"vwrap\"><div class=\"cb rise\"><div class=\"cb-h\">remoteEntry.js (tiny, ~5–20 KB) <span class=\"tagc\" style=\"background:#2a2510;color:#f7d046\">manifest + loader<\/span><\/div><pre><span class=\"c\">// roughly what it exposes on window.projects<\/span>\n{ <span class=\"k\">init<\/span>(shareScope),   <span class=\"c\">// \"here are the libs I can share\"<\/span>\n  <span class=\"k\">get<\/span>(<span class=\"s\">'./ProjectsApp'<\/span>) }  <span class=\"c\">// → Promise of a module factory<\/span>\n<span class=\"c\">// './ProjectsApp' → src_ProjectsApp_tsx.8f3a.js<\/span>\n<span class=\"c\">// shared react    → node_modules_react.js (maybe skipped)<\/span><\/pre><\/div>\n<div class=\"g3\"><div class=\"box pop\" style=\"--d:.3s\"><b>remoteEntry.js<\/b><br><small>no-cache, small<\/small><\/div><div class=\"box pop\" style=\"--d:.5s\"><b>8f3a.js<\/b><br><small>hashed chunk, cache forever<\/small><\/div><div class=\"box pop\" style=\"--d:.7s\"><b>react.js<\/b><br><small>only if host lacks it<\/small><\/div><\/div><\/div>", "p": "The host never downloads the whole remote. <code>remoteEntry.js<\/code> maps exposed names to <b>hashed chunks<\/b>, which load only when needed. Serve it with <b>no-cache<\/b>, so new deploys are picked up."}, {"k": "Shared singletons", "h": "Everybody uses the same React", "v": "<svg viewBox=\"0 0 320 200\"><rect class=\"pop\" x=\"115\" y=\"140\" width=\"90\" height=\"46\" rx=\"12\" fill=\"rgba(78,168,255,.22)\" stroke=\"#4ea8ff\"/><text x=\"160\" y=\"160\" fill=\"#fff\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">react 18.3.1<\/text><text x=\"160\" y=\"176\" fill=\"#cfd6ea\" font-size=\"9\" text-anchor=\"middle\">ONE instance<\/text>\n<g class=\"rise\" style=\"--d:.2s\"><rect x=\"10\" y=\"14\" width=\"88\" height=\"40\" rx=\"10\" fill=\"#151b30\" stroke=\"#a78bfa\"/><text x=\"54\" y=\"38\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-family=\"monospace\">host<\/text><\/g>\n<g class=\"rise\" style=\"--d:.4s\"><rect x=\"116\" y=\"14\" width=\"88\" height=\"40\" rx=\"10\" fill=\"#151b30\" stroke=\"#a78bfa\"/><text x=\"160\" y=\"38\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-family=\"monospace\">projects<\/text><\/g>\n<g class=\"rise\" style=\"--d:.6s\"><rect x=\"222\" y=\"14\" width=\"88\" height=\"40\" rx=\"10\" fill=\"#151b30\" stroke=\"#a78bfa\"/><text x=\"266\" y=\"38\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-family=\"monospace\">rfis<\/text><\/g>\n<g stroke=\"#4ea8ff\" stroke-width=\"2\" fill=\"none\"><path class=\"flow\" d=\"M54 56 L140 138\"/><path class=\"flow\" d=\"M160 56 L160 138\"/><path class=\"flow\" d=\"M266 56 L180 138\"/><\/g>\n<text x=\"160\" y=\"104\" fill=\"#5d6680\" font-size=\"9\" text-anchor=\"middle\">share scope<\/text><\/svg>", "p": "Hooks store state inside the React module instance. If the host and a remote each load their own copy, you get <b>\"Invalid hook call\"<\/b>. <code>singleton: true<\/code> forces one copy.", "an": "Like parent-first classloading in an app server: the shared jar is loaded once by the parent, not once per WAR."}, {"k": "Shared options", "h": "The knobs on <code>shared<\/code>", "cmp": [["JS", "shared: {\n  react: {\n    singleton: true,         // only one copy may exist\n    requiredVersion: '^18.2.0', // what I'm compatible with\n    strictVersion: false,    // true = throw on mismatch\n    eager: false,            // true = bundle in entry (avoid)\n  },\n  'react-dom': { singleton: true, requiredVersion: '^18.2.0' },\n  '@procore/design-system': { singleton: true },\n}"]], "p": "Share things with <b>global state<\/b> (React, router, design system context). Don't bother sharing small pure utilities like lodash functions."}, {"k": "Version negotiation", "h": "Highest compatible version wins", "v": "<div class=\"vwrap\"><div class=\"g3\"><div class=\"box rise\"><b>host<\/b><br><code>react 18.3.1<\/code><br><small>provides<\/small><\/div><div class=\"box rise\" style=\"--d:.3s\"><b>projects<\/b><br><code>^18.2.0<\/code><br><small>provides 18.2.0<\/small><\/div><div class=\"box rise\" style=\"--d:.6s\"><b>rfis<\/b><br><code>^18.0.0<\/code><br><small>provides 18.1.0<\/small><\/div><\/div>\n<div class=\"down rise\" style=\"--d:.9s\">↓ highest version satisfying everyone's range<\/div>\n<div class=\"box ok pop\" style=\"--d:1.2s;text-align:center\"><b>everyone uses 18.3.1<\/b> · loaded once<\/div>\n<div class=\"box warn pop\" style=\"--d:1.8s;font-size:11px\">If a remote needs <code>^19.0.0<\/code>: with <code>singleton<\/code> you get a console <b>warning<\/b> and it runs on 18 anyway; with <code>strictVersion<\/code> it <b>throws<\/b> at load time.<\/div><\/div>", "p": "At <code>init<\/code> time, every container registers the versions it can provide. The runtime picks the highest one that satisfies the <code>requiredVersion<\/code> ranges.", "an": "Bundler-style dependency resolution, but done in the browser on every page load."}, {"quiz": true, "k": "Quiz 2 / 5 · Sharing", "h": "Host provides react 18.3.1. A remote declares this. What happens?", "code": "react: { singleton: true,\n         requiredVersion: '^19.0.0' }  // no strictVersion", "opts": [["The remote loads its own React 19", 0], ["A console warning; the remote runs on 18.3.1", 1], ["The page fails to load", 0]], "right": "With <code>singleton<\/code> only one copy is allowed, so the loaded 18.3.1 is used, plus a warning. <code>strictVersion: true<\/code> would make it throw.", "wrong": "<code>singleton<\/code> forbids a second copy, so it uses <b>18.3.1 and warns<\/b>. Only <code>strictVersion: true<\/code> turns that into an error."}, {"k": "Lazy loading", "h": "<code>React.lazy<\/code> + <code>Suspense<\/code> + an async boundary", "cmp": [["JSX", "// index.js: the async boundary\nimport('./bootstrap');   // gives MF time to negotiate shared deps\n\n// App.jsx\nconst ProjectsApp = lazy(() => import('projects/ProjectsApp'));\n\n<Suspense fallback={<Spinner />}>\n  <ProjectsApp companyId={42} />\n<\/Suspense>"]], "p": "<code>lazy<\/code> turns a dynamic import into a component; <code>Suspense<\/code> shows a fallback while the chunk downloads. The <code>bootstrap<\/code> trick avoids \"Shared module is not available for eager consumption\"."}, {"k": "Runtime loading flow", "h": "What happens when you click Projects", "v": "<ol class=\"steps\"><li style=\"--d:0s\">Browser loads <code>host/main.js<\/code> → <code>import('./bootstrap')<\/code><\/li><li style=\"--d:.8s\">Host runtime registers its shared libs (react, react-dom) in the <b>share scope<\/b><\/li><li style=\"--d:1.6s\">User clicks <b>Projects<\/b> → <code>React.lazy<\/code> calls <code>import('projects/ProjectsApp')<\/code><\/li><li style=\"--d:2.4s\">Runtime injects <code>&lt;script src=\":3001/remoteEntry.js\"&gt;<\/code><\/li><li style=\"--d:3.2s\"><code>projects.init(shareScope)<\/code>: negotiate versions, reuse host React<\/li><li style=\"--d:4s\"><code>projects.get('./ProjectsApp')<\/code> → fetch hashed chunk<\/li><li style=\"--d:4.8s\">Module resolves, <code>&lt;Suspense&gt;<\/code> swaps fallback for the real UI<\/li><\/ol>", "p": "No remote code is fetched until it's needed. Steps 4–6 are a plain <b>script tag + chunk fetch<\/b>, visible in the Network tab."}, {"quiz": true, "k": "Quiz 3 / 5 · Loading", "h": "The user opens the Projects page for the first time. Which remote file is fetched first?", "opts": [["The full projects bundle", 0], ["projects/remoteEntry.js", 1], ["A copy of React from the remote", 0]], "right": "<code>remoteEntry.js<\/code> comes first: it negotiates shared deps and knows which hashed chunk holds <code>./ProjectsApp<\/code>.", "wrong": "It's <b>remoteEntry.js<\/b>: the manifest is fetched first, then only the chunks needed. React is usually reused from the host."}, {"k": "Communication · Routing", "h": "Host owns the URL, remotes own sub-routes", "cmp": [["JSX", "// host\n<Route path=\"/projects/*\" element={<ProjectsApp basename=\"/projects\" />} />\n\n// remote: nested routes, relative to basename\n<Routes>\n  <Route index element={<ProjectList />} />\n  <Route path=\":id\" element={<ProjectDetail />} />\n<\/Routes>"], ["Rails", "# like mounting an engine\nmount Projects::Engine, at: '/projects'"]], "p": "Share the router (singleton) so there's one history. Remotes should never hard-code the host's paths."}, {"k": "Communication · Events", "h": "Loose coupling with browser events", "v": "<svg viewBox=\"0 0 320 120\"><rect x=\"6\" y=\"40\" width=\"96\" height=\"40\" rx=\"10\" fill=\"#13243a\" stroke=\"#4ea8ff\"/><text x=\"54\" y=\"64\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-family=\"monospace\">projects MFE<\/text>\n<rect x=\"218\" y=\"40\" width=\"96\" height=\"40\" rx=\"10\" fill=\"#10261c\" stroke=\"#3ddc97\"/><text x=\"266\" y=\"64\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-family=\"monospace\">rfis MFE<\/text>\n<line x1=\"102\" y1=\"60\" x2=\"218\" y2=\"60\" stroke=\"#2a3145\" stroke-width=\"2\"/><text x=\"160\" y=\"30\" fill=\"#a78bfa\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">window: \"project:selected\"<\/text>\n<circle class=\"mv\" style=\"--tx:110px\" cx=\"108\" cy=\"60\" r=\"6\" fill=\"#a78bfa\"/><text x=\"160\" y=\"104\" fill=\"#5d6680\" font-size=\"9\" text-anchor=\"middle\">no imports between remotes, only an event contract<\/text><\/svg>", "cmp": [["JS", "// publisher (projects)\nwindow.dispatchEvent(new CustomEvent('projects:selected',\n  { detail: { id: 42 } }));\n// subscriber (rfis)\nwindow.addEventListener('projects:selected', e => load(e.detail.id));"]], "an": "Pub/sub like Kafka topics or <code>ActiveSupport::Notifications<\/code>: name events by domain and treat the payload as a schema."}, {"k": "Shared state &amp; contracts", "h": "Props in, events out, types published", "cmp": [["TS", "// @procore/projects-contract (versioned npm package)\nexport interface ProjectsAppProps {\n  companyId: number;\n  user: { id: number; locale: string };\n  onNavigate?: (path: string) => void;\n}\nexport type ProjectsEvents = {\n  'projects:selected': { id: number };\n};"]], "p": "Pass context (user, company, tokens) as <b>props<\/b> from the host; keep remote state private. Use a shared store only for truly global things, and treat it like a shared database: risky.", "an": "The contract package is your OpenAPI spec. Make <b>additive<\/b> changes; breaking changes need a major version."}, {"quiz": true, "k": "Quiz 4 / 5 · Communication", "h": "The RFIs remote must react when a project is picked in Projects. Best option?", "opts": [["RFIs imports Projects' internal store", 0], ["A documented CustomEvent (or host callback) with a typed payload", 1], ["Both read a global variable", 0]], "right": "A <b>typed event or host callback<\/b> is a contract; internal store imports couple deploys and break on refactors.", "wrong": "Use a <b>documented event or callback<\/b>. Reaching into another remote's internals is like querying another service's database."}, {"k": "Pitfall 1 &amp; 2", "h": "Duplicate React and version drift", "v": "<div class=\"vwrap\"><div class=\"box warn rise\"><b>Duplicate React<\/b>: \"Invalid hook call\" or context that silently doesn't reach the remote. Cause: missing <code>singleton<\/code>, or <code>eager<\/code> in one app.<\/div><div class=\"box warn rise\" style=\"--d:.3s\"><b>Version drift<\/b>: remotes upgrade at different speeds; one ships with React 19 types against an 18 host. Works locally, fails in prod.<\/div><div class=\"box ok rise\" style=\"--d:.6s\">Fix: platform-owned version policy, <code>requiredVersion<\/code> from package.json, CI check that compares remote ranges to the host, contract tests.<\/div><\/div>", "p": "Integration happens at <b>runtime<\/b>, so test against the real host in staging."}, {"k": "Pitfall 3", "h": "CSS bleed", "v": "<div class=\"vwrap\"><div class=\"cb\"><div class=\"cb-h\">projects remote ships global CSS <span class=\"tagc\" style=\"background:#3a1624;color:#ff5c8a\">leaks<\/span><\/div><pre>button { background: #c21d6b; border-radius: 0; }<\/pre><\/div>\n<div class=\"g2 bleed\"><div class=\"box\"><small>host nav<\/small><br><button class=\"victim\">Save<\/button><\/div><div class=\"box\"><small>rfis remote<\/small><br><button class=\"victim\">Submit RFI<\/button><\/div><\/div>\n<div class=\"box ok\" style=\"font-size:11px\">Fix: CSS Modules / prefixed class names (<code>.prj-btn<\/code>), a shared design system, Shadow DOM for hard isolation, and no element selectors in remotes.<\/div><\/div>", "p": "All remotes share one document, so one global selector can restyle everyone. Watch the host buttons change when the remote's CSS loads."}, {"k": "Pitfall 4", "h": "Error boundaries around every remote", "v": "<div class=\"g2\"><div class=\"box warn rise\"><b>No boundary<\/b><br><small>projects chunk 404s → whole shell white-screens<\/small><\/div><div class=\"box ok rise\" style=\"--d:.4s\"><b>Boundary per remote<\/b><br><small>\"Projects unavailable, retry\" · nav still works<\/small><\/div><\/div>", "cmp": [["JSX", "<ErrorBoundary fallback={<RemoteDown name=\"Projects\" />}>\n  <Suspense fallback={<Spinner />}>\n    <ProjectsApp />\n  <\/Suspense>\n<\/ErrorBoundary>"]], "an": "A circuit breaker for UI: a failed remote degrades one panel instead of taking down the page."}, {"quiz": true, "k": "Quiz 5 / 5 · Debugging", "h": "After a remote's deploy: \"Invalid hook call\". First suspect?", "opts": [["A bug in useState", 0], ["Two React copies: shared/singleton misconfigured", 1], ["The CDN is down", 0]], "right": "\"Invalid hook call\" across MFEs almost always means <b>two Reacts<\/b>. Check the Network tab for two react chunks.", "wrong": "Suspect <b>duplicate React<\/b> first: a remote stopped sharing it (missing <code>singleton<\/code>, wrong name, or <code>eager<\/code>)."}, {"k": "Lab 1 / 4 · Host shell", "h": "host/webpack.config.js", "lab": true, "cmp": [["JS", "// host/webpack.config.js\nconst HtmlWebpackPlugin = require('html-webpack-plugin');\nconst { ModuleFederationPlugin } = require('webpack').container;\nconst deps = require('./package.json').dependencies;\n\nmodule.exports = {\n  entry: './src/index.js',\n  mode: 'development',\n  devServer: { port: 3000, historyApiFallback: true },\n  output: { publicPath: 'auto', clean: true },\n  resolve: { extensions: ['.js', '.jsx'] },\n  module: {\n    rules: [{\n      test: /\\.jsx?$/, exclude: /node_modules/,\n      use: { loader: 'babel-loader',\n        options: { presets: ['@babel/preset-env',\n          ['@babel/preset-react', { runtime: 'automatic' }]] } },\n    }],\n  },\n  plugins: [\n    new ModuleFederationPlugin({\n      name: 'host',\n      remotes: {\n        // alias  : \"<remote name>@<url of remoteEntry.js>\"\n        projects: 'projects@http://localhost:3001/remoteEntry.js',\n      },\n      shared: {\n        react:      { singleton: true, requiredVersion: deps.react },\n        'react-dom':{ singleton: true, requiredVersion: deps['react-dom'] },\n      },\n    }),\n    new HtmlWebpackPlugin({ template: './public/index.html' }),\n  ],\n};", "full config"], ["JSX", "// host/src/index.js  (async boundary!)\nimport('./bootstrap');\n\n// host/src/bootstrap.jsx\nimport { createRoot } from 'react-dom/client';\nimport App from './App';\ncreateRoot(document.getElementById('root')).render(<App />);\n\n// host/src/App.jsx\nimport { lazy, Suspense } from 'react';\nimport ErrorBoundary from './ErrorBoundary';\nconst ProjectsApp = lazy(() => import('projects/ProjectsApp'));\n\nexport default function App() {\n  return (\n    <div>\n      <header>Procore shell · Projects<\/header>\n      <ErrorBoundary fallback={<p>Projects is unavailable.<\/p>}>\n        <Suspense fallback={<p>Loading Projects…<\/p>}>\n          <ProjectsApp companyId={42} />\n        <\/Suspense>\n      <\/ErrorBoundary>\n    <\/div>\n  );\n}\n\n// host/src/ErrorBoundary.jsx\nimport { Component } from 'react';\nexport default class ErrorBoundary extends Component {\n  state = { error: null };\n  static getDerivedStateFromError(error) { return { error }; }\n  componentDidCatch(error) { console.error('remote failed', error); }\n  render() { return this.state.error ? this.props.fallback : this.props.children; }\n}", "host/src"]], "p": "Scroll the code. The host declares <code>remotes<\/code> and lazy-loads the remote behind Suspense and an ErrorBoundary."}, {"k": "Lab 2 / 4 · Projects remote", "h": "projects/webpack.config.js", "lab": true, "cmp": [["JS", "// projects/webpack.config.js\nconst HtmlWebpackPlugin = require('html-webpack-plugin');\nconst { ModuleFederationPlugin } = require('webpack').container;\nconst deps = require('./package.json').dependencies;\n\nmodule.exports = {\n  entry: './src/index.js',\n  mode: 'development',\n  devServer: { port: 3001, historyApiFallback: true,\n    headers: { 'Access-Control-Allow-Origin': '*' } },   // host is :3000\n  output: { publicPath: 'auto', clean: true },\n  resolve: { extensions: ['.js', '.jsx'] },\n  module: {\n    rules: [{\n      test: /\\.jsx?$/, exclude: /node_modules/,\n      use: { loader: 'babel-loader',\n        options: { presets: ['@babel/preset-env',\n          ['@babel/preset-react', { runtime: 'automatic' }]] } },\n    }],\n  },\n  plugins: [\n    new ModuleFederationPlugin({\n      name: 'projects',                 // global var: window.projects\n      filename: 'remoteEntry.js',       // the manifest file\n      exposes: {\n        './ProjectsApp': './src/ProjectsApp',   // public API\n      },\n      shared: {\n        react:      { singleton: true, requiredVersion: deps.react },\n        'react-dom':{ singleton: true, requiredVersion: deps['react-dom'] },\n      },\n    }),\n    // lets you run the remote standalone on :3001 too\n    new HtmlWebpackPlugin({ template: './public/index.html' }),\n  ],\n};", "full config"], ["JSX", "// projects/src/index.js\nimport('./bootstrap');\n\n// projects/src/bootstrap.jsx  (standalone dev mode)\nimport { createRoot } from 'react-dom/client';\nimport ProjectsApp from './ProjectsApp';\ncreateRoot(document.getElementById('root')).render(<ProjectsApp companyId={1} />);\n\n// projects/src/ProjectsApp.jsx\nimport { useState } from 'react';\nconst SEED = [{ id: 1, name: 'Riverside Tower' }, { id: 2, name: 'Harbor Bridge' }];\n\nexport default function ProjectsApp({ companyId }) {\n  const [projects] = useState(SEED);\n  const select = (p) => window.dispatchEvent(\n    new CustomEvent('projects:selected', { detail: { id: p.id } }));\n  return (\n    <section className=\"prj-root\">\n      <h2>Projects for company {companyId}<\/h2>\n      <ul>{projects.map(p => (\n        <li key={p.id}><button className=\"prj-btn\" onClick={() => select(p)}>{p.name}<\/button><\/li>\n      ))}<\/ul>\n    <\/section>\n  );\n}\n\n// both apps: public/index.html\n<!doctype html><html><body><div id=\"root\"><\/div><\/body><\/html>", "projects/src"]], "p": "The remote <b>exposes<\/b> <code>./ProjectsApp<\/code>, writes <code>remoteEntry.js<\/code> and allows CORS, since the host runs on another port."}, {"k": "Lab 3 / 4 · Run it", "h": "Step-by-step", "lab": true, "cmp": [["Bash", "mkdir mf-lab && cd mf-lab && mkdir host projects\n# in EACH folder (host, projects):\nnpm init -y\nnpm i react@18 react-dom@18\nnpm i -D webpack webpack-cli webpack-dev-server \\\n  html-webpack-plugin babel-loader @babel/core \\\n  @babel/preset-env @babel/preset-react\n# add the webpack.config.js + src/ + public/ files\n# package.json scripts: \"start\": \"webpack serve\"\n\n# terminal 1 — start the REMOTE first\ncd projects && npm start      # http://localhost:3001\ncurl -I localhost:3001/remoteEntry.js   # 200 = exposed\n\n# terminal 2\ncd host && npm start          # http://localhost:3000", "terminal"]], "p": "Start the remote first, then the host. Same folder layout in both: <code>webpack.config.js<\/code>, <code>src/<\/code>, <code>public/index.html<\/code>."}, {"k": "Lab 4 / 4 · Verify &amp; break it", "h": "Prove each concept in DevTools", "v": "<ol class=\"steps\"><li style=\"--d:0s\">Open <code>:3000<\/code>, DevTools → Network: <code>remoteEntry.js<\/code> loads from <code>:3001<\/code><\/li><li style=\"--d:.8s\">Filter \"react\": only <b>one<\/b> react chunk, served by the host<\/li><li style=\"--d:1.6s\">Console: <code>addEventListener('projects:selected', e =&gt; console.log(e.detail))<\/code>, click a project<\/li><li style=\"--d:2.4s\">Edit <code>ProjectsApp.jsx<\/code>, refresh <code>:3000<\/code>: host was never rebuilt<\/li><li style=\"--d:3.2s\">Stop the remote, refresh: the <b>ErrorBoundary<\/b> fallback shows, shell survives<\/li><li style=\"--d:4s\">Break it: remove <code>singleton<\/code> in one config → \"Invalid hook call\"<\/li><\/ol>", "p": "Each step maps to a card in this lesson. Breaking things on purpose is the fastest way to recognise the errors at work."}, {"recap": true, "h": "Module Federation on one card", "items": ["MFEs split UI by <b>team and domain<\/b> for independent deploys, at the cost of runtime integration.", "<b>Host<\/b> declares <code>remotes<\/code>; <b>remotes<\/b> <code>exposes<\/code> modules via <code>remoteEntry.js<\/code>.", "<code>shared<\/code> + <b>singleton<\/b> keeps one React; the highest compatible version wins.", "<code>React.lazy<\/code> + <code>Suspense<\/code> + <code>import('./bootstrap')<\/code> load remotes on demand.", "Communicate via routes, typed events and props contracts; guard each remote with an <b>error boundary<\/b> and scoped CSS."], "next": "Next: <b>Part 6<\/b>, deeper React patterns."}];
</script>
<script>(function(){
  "use strict";
  var KW='const|let|var|function|return|if|else|async|await|new|class|interface|type|import|export|default|from|def|end|public|private|static|final|void|try|catch|throw|typeof|record|enum|module|for|of|in|null|undefined|true|false|this|self|nil|package|implements|extends|describe|it|test|expect|before|beforeEach|afterEach|require|do';
  var RE=new RegExp('(\\/\\/[^\\n]*|#(?!\\{)[^\\n]*)|("[^"\\n]*"|\'[^\'\\n]*\'|`[^`]*`)|\\b('+KW+')\\b','g');
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function hl(src){ var out='',last=0,m; RE.lastIndex=0;
    while((m=RE.exec(src))){ out+=esc(src.slice(last,m.index)); out+= m[1]?'<span class="c">'+esc(m[1])+'</span>': m[2]?'<span class="s">'+esc(m[2])+'</span>':'<span class="k">'+m[3]+'</span>'; last=RE.lastIndex; }
    return out+esc(src.slice(last)); }
  var LC={JS:['#2a2510','#f7d046'],TS:['#13243a','#4ea8ff'],JSX:['#102a2a','#4ee6e0'],TSX:['#102a2a','#4ee6e0'],Java:['#2a1a14','#ff7a45'],JUnit:['#2a1a14','#ff7a45'],Ruby:['#3a1624','#ff5c8a'],RSpec:['#3a1624','#ff5c8a'],Bash:['#1a2a1a','#3ddc97'],Rails:['#3a1624','#ff5c8a'],JSON:['#22183a','#a78bfa']};
  var stage=document.getElementById('stage'), anchor=document.getElementById('bottomBar');
  CARDS.forEach(function(c){
    var s=document.createElement('section'); s.className='card'; var h='';
    if(c.sect){ s.className+=' sect';
      h='<div class="visual"><div class="num pop">'+c.num+'</div></div>'+(c.badge?'<div class="titlebadge"><i></i>'+c.badge+'</div>':'')+'<div class="kicker">'+c.kicker+'</div><h1>'+c.h+'</h1><p>'+c.p+'</p>'+(c.first?'<div class="tapme">Tap the right side or swipe left →</div>':'');
    } else if(c.quiz){ s.className+=' quiz'; s.setAttribute('data-quiz','');
      h='<div class="kicker">'+c.k+'</div><h2>'+c.h+'</h2>'+(c.code?'<div class="qcode">'+hl(c.code)+'</div>':'<div style="height:10px"></div>')+'<div class="opts">'+c.opts.map(function(o,i){return '<button class="opt" type="button" data-ok="'+o[1]+'"><span class="l">'+'ABCD'[i]+'</span>'+o[0]+'</button>';}).join('')+'</div><div class="fb"></div>';
    } else if(c.recap){
      h='<div class="kicker">Recap</div><h2>'+c.h+'</h2><ul class="take">'+
        c.items.map(function(t,i){return '<li class="rise" style="--d:'+(i*0.15)+'s">'+t+'</li>';}).join('')+
        '</ul><div class="score" id="score"></div><p style="font-size:13px;margin-top:8px">'+c.next+'</p><a class="btn ghost" href="index.html" style="margin-top:6px">← Course home</a>';
    } else {
      var inner='';
      if(c.cmp){ inner='<div class="stack">'+c.cmp.map(function(b,i){ var col=LC[b[0]]||LC.JS; return '<div class="cb rise" style="--d:'+(i*0.25)+'s"><div class="cb-h">'+(b[2]||(i===0?'modern':'compare'))+' <span class="tagc" style="background:'+col[0]+';color:'+col[1]+'">'+b[0]+'</span></div><pre>'+hl(b[1])+'</pre></div>'; }).join('')+'</div>'; }
      if(c.v){ inner=c.v+inner; }
      if(c.lab){ s.className+=' lab'; inner='<div class="scrollv demo">'+inner+'</div>'; }
      h='<div class="kicker">'+c.k+'</div><div class="visual">'+inner+'</div><h2>'+c.h+'</h2>'+(c.p?'<p>'+c.p+'</p>':'')+(c.an?'<div class="analogy"><span>'+c.an+'</span></div>':'');
    }
    s.innerHTML=h; if(c.quiz){ var fb=s.querySelector('.fb'); fb.setAttribute('data-right',c.right); fb.setAttribute('data-wrong',c.wrong); }
    stage.insertBefore(s, anchor);
  });
})();
</script>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var stage=$('stage'), cards=[].slice.call(document.querySelectorAll('.card')), segsEl=$('segs'), countEl=$('count'), prevBtn=$('prev'), nextBtn=$('next');
  var cur=0, N=cards.length, answered=0, correct=0, NQ=document.querySelectorAll('[data-quiz]').length;
  cards.forEach(function(){ var s=document.createElement('div'); s.className='seg'; s.appendChild(document.createElement('i')); segsEl.appendChild(s); });
  var segs=segsEl.children;
  function go(n){
    n=Math.max(0,Math.min(N-1,n));
    cards.forEach(function(c,k){ c.classList.toggle('past',k<n); if(k!==n) c.classList.remove('active'); c.setAttribute('aria-hidden',k!==n); });
    var card=cards[n]; card.classList.remove('active'); void card.offsetWidth; card.classList.add('active');
    for(var k=0;k<N;k++) segs[k].classList.toggle('done',k<=n);
    countEl.textContent=(n+1)+' / '+N; prevBtn.disabled=n===0; nextBtn.disabled=n===N-1; cur=n; try{var _k='lp:'+location.pathname.split('/').pop(),_o=JSON.parse(localStorage.getItem(_k)||'{}');localStorage.setItem(_k,JSON.stringify({max:Math.max(_o.max||0,n+1),total:N}));}catch(_e){} updateScore();
    try{ history.replaceState(null,'','#'+(n+1)); }catch(e){}
  }
  function next(){ if(cur<N-1) go(cur+1); } function prev(){ if(cur>0) go(cur-1); }
  prevBtn.addEventListener('click',function(e){e.stopPropagation();prev();});
  nextBtn.addEventListener('click',function(e){e.stopPropagation();next();});
  
  var lastSwipe=0;
  stage.addEventListener('click',function(e){
    if(Date.now()-lastSwipe<450) return;
    if(e.target.closest('button, a, .opts, .demo, textarea, iframe')) return;
    var r=stage.getBoundingClientRect(); if((e.clientX-r.left)/r.width<0.3) prev(); else next();
  });
  var sx=0,sy=0,tr=false;
  stage.addEventListener('touchstart',function(e){ if(e.target.closest('textarea')) return; var t=e.touches[0]; sx=t.clientX; sy=t.clientY; tr=true; },{passive:true});
  stage.addEventListener('touchend',function(e){ if(!tr) return; tr=false; var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){ lastSwipe=Date.now(); if(dx<0) next(); else prev(); } },{passive:true});
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='TEXTAREA') return;
    if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter')) return;
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
    else if(e.key==='Home') go(0); else if(e.key==='End') go(N-1);
  });
  [].forEach.call(document.querySelectorAll('[data-quiz]'),function(q){
    var opts=q.querySelector('.opts'), fb=q.querySelector('.fb');
    [].forEach.call(opts.querySelectorAll('.opt'),function(b){
      b.addEventListener('click',function(e){
        e.stopPropagation(); if(opts.classList.contains('done')) return;
        opts.classList.add('done'); answered++;
        var ok=b.getAttribute('data-ok')==='1'; if(ok) correct++; else b.classList.add('wrong');
        opts.querySelector('[data-ok="1"]').classList.add('right');
        fb.innerHTML='<span class="tag" style="color:'+(ok?'var(--green)':'var(--pink)')+'">'+(ok?'✓ Correct.':'✗ Not quite.')+'</span> '+fb.getAttribute(ok?'data-right':'data-wrong')+'<br><span style="color:var(--dim);font-size:12px">Tap or swipe to continue →</span>';
        fb.classList.add('show');
      });
    });
  });
  function updateScore(){ var s=$('score'); s.textContent=answered?('Quiz score: '+correct+' / '+NQ+(answered<NQ?' ('+(NQ-answered)+' skipped)':'')):''; }

  var start=parseInt((location.hash||'').slice(1),10); go(isNaN(start)?0:start-1);
})();
</script>
