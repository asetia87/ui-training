<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07080d"><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Part 5 · Module Federation</title><style>
:root{
  --bg:#07080d; --panel:#121622; --panel2:#181d2b; --line:#2a3145; --text:#eef1f8; --muted:#a3acc2; --dim:#5d6680;
  --html:#ff7a45; --css:#4ea8ff; --js:#f7d046; --green:#3ddc97; --purple:#a78bfa; --pink:#ff5c8a; --cyan:#4ee6e0;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
.app{position:fixed;inset:0;display:flex;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#141a2e 0,transparent 60%),var(--bg)}
.stage{position:relative;width:100%;max-width:460px;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y}
@media (min-width:600px){.stage{height:min(100%,900px);margin:auto;border-radius:28px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 300px at 85% 10%,rgba(167,139,250,.10),transparent 70%),radial-gradient(500px 300px at 0% 90%,rgba(78,168,255,.08),transparent 70%);pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
.segs{display:flex;gap:3px}
.seg{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--css),var(--purple));transition:width .35s ease}
.seg.done i{width:100%}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.meta b{color:var(--text);font-weight:600}
.card{position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 58px) 22px calc(env(safe-area-inset-bottom) + 64px);display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(40px) scale(.98);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s linear .45s}
.card.past{transform:translateX(-40px) scale(.98)}
.card.active{opacity:1;visibility:visible;transform:none;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
.kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);margin-bottom:6px}
.visual{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;margin:4px 0 14px}
.visual svg{width:100%;height:100%;max-height:330px;overflow:visible}
h1,h2{margin:0 0 10px;line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(30px,9vw,40px)}
h2{font-size:clamp(22px,6.4vw,28px)}
p{margin:0 0 8px;font-size:clamp(15px,4.2vw,17px);line-height:1.5;color:var(--muted)}
p b,p strong{color:var(--text);font-weight:600}
code,.mono{font-family:var(--mono);font-size:.9em}
p code,.analogy code{background:#1b2131;border:1px solid var(--line);padding:1px 5px;border-radius:6px;color:#dfe5f5}
.analogy{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,rgba(78,168,255,.10),rgba(167,139,250,.10));border:1px solid rgba(120,140,255,.25);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;color:#cfd6ea;margin-top:6px}
.analogy::before{content:"⚙";font-size:15px;color:var(--css);line-height:1.3}
.analogy b{color:#fff}
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:0 14px calc(env(safe-area-inset-bottom) + 12px)}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(18,22,34,.8);color:var(--text);font-size:20px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
.nav:disabled{opacity:.3}
.hint{font-size:12px;color:var(--dim)}
svg *{transform-box:fill-box;transform-origin:center}
.active .pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.35) both;animation-delay:var(--d,0s)}
.active .fade{animation:fade .6s ease both;animation-delay:var(--d,0s)}
.active .rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.growx{transform-origin:left center}
.active .growx{animation:growx .6s ease both;animation-delay:var(--d,0s)}
.active .draw{stroke-dasharray:var(--len,300);animation:draw 1s ease both;animation-delay:var(--d,0s)}
.flow{stroke-dasharray:4 6;animation:flow 1s linear infinite}
.pulse{animation:pulse 2s ease-in-out infinite;animation-delay:var(--pd,0s)}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:var(--len,300)}to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes goR{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(60px);opacity:0}}
@keyframes goL{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(-72px);opacity:0}}
.req{animation:goR 2.4s ease-in-out infinite}
.chunk{opacity:0;animation:goL 2.4s linear infinite;animation-delay:var(--d,0s)}
.titlebadge{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;margin-bottom:14px;align-self:flex-start;background:rgba(255,255,255,.03)}
.titlebadge i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.tapme{margin-top:6px;font-size:13px;color:var(--dim);animation:pulse 1.8s infinite}
.grad{background:linear-gradient(90deg,var(--html),var(--js) 35%,var(--css) 70%,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.lay{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.lay-frame{width:100%;border:1px solid var(--line);border-radius:14px;padding:8px;background:#0d111b;display:flex;flex-direction:column;gap:6px;animation:resize 5s ease-in-out infinite alternate;position:relative}
@keyframes resize{0%,15%{width:100%}85%,100%{width:52%}}
.lay .b{border-radius:8px;font:600 11px/1 var(--mono);display:flex;align-items:center;justify-content:center;color:#0b0e16;padding:0 4px;overflow:hidden;white-space:nowrap}
.lay .hdr{height:26px;background:var(--css)}
.lay-row{display:flex;gap:6px}
.lay .side{flex:0 0 26%;height:54px;background:var(--purple)}
.lay .main{flex:1;height:54px;background:var(--green)}
.lay-cards{display:flex;flex-wrap:wrap;gap:6px}
.lay .c{flex:1 1 64px;height:30px;background:var(--js)}
.ruler{font:12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.ruler span{display:inline-block;height:2px;width:40px;background:linear-gradient(90deg,var(--pink),var(--js));border-radius:2px}
.comp{position:relative;width:250px;height:230px;perspective:800px}
.comp-in{position:absolute;inset:0;transform-style:preserve-3d}
.layer{position:absolute;left:25px;top:30px;width:200px;height:170px;border-radius:14px;border:1px solid rgba(255,255,255,.18);transform-origin:center;animation:explode 6s ease-in-out infinite;--z:0px;display:flex;align-items:flex-end;justify-content:flex-end;padding:8px;font:600 10px var(--mono);color:rgba(255,255,255,.85)}
.l1{--z:-60px;background-color:#151b30;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:16px 16px}
.l2{--z:0px;background:rgba(78,168,255,.18)}
.l2::before{content:"";position:absolute;left:66px;top:16px;width:112px;height:10px;border-radius:5px;background:rgba(255,255,255,.75);box-shadow:0 22px 0 rgba(255,255,255,.4),0 40px 0 rgba(255,255,255,.4),0 58px 0 rgba(255,255,255,.4),0 86px 0 -1px rgba(61,220,151,.7)}
.l3{--z:60px;width:56px;background:rgba(167,139,250,.6);animation-name:explode3;align-items:flex-start;justify-content:center;padding-top:10px;text-align:center}
@keyframes explode{0%,22%,100%{transform:rotateX(56deg) rotateZ(-38deg) translateZ(var(--z))}48%,80%{transform:rotateX(0) rotateZ(0) translateZ(0)}}
@keyframes explode3{0%,22%,100%{transform:rotateX(56deg) rotateZ(-38deg) translateZ(var(--z))}48%{transform:translateX(-60px)}62%,80%{transform:translateX(0)}}
.comp-tag{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font:12px var(--mono);color:var(--muted)}
.cost{width:100%;display:grid;grid-template-columns:92px repeat(5,1fr);gap:6px;font-size:10.5px;align-items:center}
.cost .h{color:var(--dim);text-align:center;font-weight:600;letter-spacing:.02em}
.cost .lbl{font:600 11px var(--mono);color:var(--text);line-height:1.3}
.cost .lbl small{display:block;color:var(--dim);font-weight:400}
.cell{height:30px;border-radius:8px;background:#151a27;border:1px dashed #262d40}
.cell.on{background:var(--c);border:0;box-shadow:0 0 14px var(--c)}
.active .cell.on{animation:light .45s ease both;animation-delay:var(--d,0s)}
@keyframes light{from{opacity:.1;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.costtag{grid-column:2/7;font-size:11px;color:var(--muted);text-align:right;margin-top:-2px}
.qcode{font:13px/1.55 var(--mono);background:#0d111b;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0 14px;color:#cdd5ea;white-space:pre;overflow-x:auto}
.qcode .k{color:var(--purple)}.qcode .s{color:var(--green)}.qcode .t{color:var(--html)}.qcode .c{color:var(--dim)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:15px;line-height:1.35;cursor:pointer;transition:transform .15s,border-color .2s,background .2s,opacity .2s}
.opt:active{transform:scale(.98)}
.opt:focus-visible{outline:2px solid var(--css)}
.opt .l{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#1e2436;font:700 12px var(--mono);color:var(--muted)}
.opt code{font-size:13px}
.opt.right{border-color:var(--green);background:rgba(61,220,151,.12)}
.opt.right .l{background:var(--green);color:#06210f}
.opt.wrong{border-color:var(--pink);background:rgba(255,92,138,.12);animation:shake .4s}
.opt.wrong .l{background:var(--pink);color:#2a0612}
.opts.done .opt:not(.right):not(.wrong){opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.fb{margin-top:12px;font-size:14px;line-height:1.45;color:var(--muted);opacity:0;transform:translateY(8px);transition:.3s}
.fb.show{opacity:1;transform:none}
.fb b{color:var(--text)}
.fb code{background:#1b2131;padding:1px 4px;border-radius:5px;color:#dfe5f5}
.fb .tag{display:inline-block;font-weight:800;margin-right:4px}
.qspacer{flex:1}
.rx{width:100%;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.rx-row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.rx-box{flex:1;background:#0d111b;border:1px solid var(--line);border-radius:12px;padding:10px 8px;font:11px/1.4 var(--mono);color:#cdd5ea;min-height:62px;display:flex;flex-direction:column;justify-content:center}
.rx-box .cap{font:700 9px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.rx-arrow{color:var(--purple);font:700 13px var(--mono);flex:0 0 auto}
.rx-f{flex:0 0 auto;background:linear-gradient(135deg,rgba(167,139,250,.25),rgba(78,168,255,.2));border:1px solid rgba(167,139,250,.5);border-radius:12px;padding:10px 7px;font:700 12px var(--mono)}
.rx-ui{background:#f5f6fa;color:#141824;border-radius:14px;padding:9px 10px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);min-height:62px}
.rx-ui .bar{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.rx-ui .badge{background:#ff5c1a;color:#fff;border-radius:999px;padding:1px 8px;font-size:11px}
.rx-ui ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.rx-ui li{background:#e7e9f2;border-radius:6px;padding:3px 6px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px #3ddc97}100%{box-shadow:0 0 0 0 transparent}}
.rx-note{font-size:12px;color:var(--dim);text-align:center}
.btn{all:unset;cursor:pointer;align-self:center;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,var(--purple),var(--css));color:#fff;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(120,120,255,.35)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--text);align-self:flex-start}
.flowchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;width:100%}
.chip{padding:7px 10px;border-radius:10px;font:700 12px var(--mono);color:#0b0e16;display:inline-block}
.arr{color:var(--dim);font-size:12px}
.take{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px;width:100%}
.take li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.4;color:#cfd6ea}
.take li b{color:#fff}
.score{font-size:13px;color:var(--muted);margin-top:10px}
.next-tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.next-tags span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);font-family:var(--mono)}
@media (max-height:700px){.visual svg{max-height:230px}.qcode{font-size:12px;padding:8px 10px;margin:4px 0 8px}.opt{padding:10px 12px}.analogy{font-size:13px;padding:8px 10px}p{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ---- lesson 1b additions ---- */
.net{width:100%;background:#0d111b;border:1px solid var(--line);border-radius:12px;overflow:hidden;font:10.5px/1.2 var(--mono)}
.net-h,.net-r{display:grid;grid-template-columns:1.35fr 46px 40px 1fr;gap:6px;align-items:center;padding:6px 9px}
.net-h{color:var(--dim);font:700 8.5px system-ui;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line);background:#121622}
.net-r{border-bottom:1px solid #161b28;color:#cdd5ea}
.net-r:last-of-type{border-bottom:0}
.net-r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net-r .t{color:var(--muted);font-size:9.5px}
.net-r .z{color:var(--muted);text-align:right;font-size:9.5px}
.net-r.dim{color:#59627a}.net-r.dim .t,.net-r.dim .z{color:#454d63}.net-r.dim .wf i{opacity:.35}
.net-r.hl{background:rgba(78,168,255,.09);box-shadow:inset 3px 0 0 var(--css)}
.wf{position:relative;height:9px;background:repeating-linear-gradient(90deg,transparent 0 19.6%,#1a2030 19.6% 20%)}
.wf i{position:absolute;top:0;height:100%;border-radius:3px;left:var(--s);width:var(--w);background:var(--c);transform-origin:left center}
.active .net-r{animation:rise .4s ease both;animation-delay:var(--d,0s)}
.active .wf i{animation:growx .5s ease both;animation-delay:calc(var(--d,0s) + .15s)}
.net-foot{padding:5px 9px;color:var(--dim);font-size:9px;display:flex;justify-content:space-between;border-top:1px solid var(--line);background:#121622}
.netwrap{width:100%;display:flex;flex-direction:column;gap:10px}
.cb{width:100%;font:11.5px/1.5 var(--mono);background:#0d111b;border:1px solid var(--line);border-radius:12px;color:#cdd5ea;overflow:hidden}
.cb pre{margin:0;padding:9px 11px;white-space:pre;overflow-x:auto;font:inherit}
.cb-h{display:flex;justify-content:space-between;align-items:center;padding:5px 11px;background:#121622;border-bottom:1px solid var(--line);font:700 9px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.cb-h .tagc{font:700 9.5px var(--mono);letter-spacing:0;text-transform:none;padding:2px 7px;border-radius:999px}
.k{color:var(--purple)}.s{color:var(--green)}.t{color:var(--html)}.c{color:var(--dim)}.y{color:var(--js)}.bl{color:var(--css)}
.mk{background:rgba(247,208,70,.18);color:var(--js);border-radius:4px;padding:0 2px}
.stack{width:100%;display:flex;flex-direction:column;gap:8px}
.down{align-self:center;color:var(--purple);font:700 13px var(--mono);line-height:1}
/* phone mock */
.phone{width:178px;height:300px;border-radius:26px;border:2px solid #2a3145;background:#0b0e16;padding:12px 10px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.5);flex:0 0 auto;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.url{font:10px var(--mono);background:#181d2b;border-radius:8px;padding:6px 8px;color:var(--muted);white-space:nowrap;overflow:hidden}
.url b{color:var(--text);font-weight:600}
.pg{flex:1;border-radius:12px;background:#f3f5fa;padding:10px 9px;display:flex;flex-direction:column;gap:7px;color:#141824;font-size:11px;overflow:hidden;position:relative}
.pg.blank{background:#fff}
.pg .ttl{font-weight:800;font-size:12.5px;display:flex;justify-content:space-between;align-items:center}
.sk{height:30px;border-radius:8px;background:linear-gradient(90deg,#e1e5ee 0,#f0f2f7 40%,#e1e5ee 80%);background-size:250% 100%;animation:shimmer 1.3s linear infinite}
.sk.sm{height:12px;width:60%}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-150% 0}}
.prow{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e3e6ee;border-radius:8px;padding:7px 8px;font-size:10.5px;font-weight:600;color:#141824;cursor:pointer}
.prow span{font-weight:500;font-size:9px;color:#fff;background:#3ddc97;border-radius:999px;padding:1px 6px}
.prow span.pl{background:#f7a046}
.prow.tapme2{box-shadow:0 0 0 0 rgba(255,92,26,.6);animation:ring 1.6s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,92,26,.55)}70%{box-shadow:0 0 0 8px rgba(255,92,26,0)}100%{box-shadow:0 0 0 0 rgba(255,92,26,0)}}
.dom{font:10.5px/1.55 var(--mono);color:#cdd5ea;background:#0d111b;border:1px solid var(--line);border-radius:12px;padding:10px;flex:1;min-width:0;white-space:pre;overflow:hidden}
.row2{display:flex;gap:12px;align-items:center;width:100%;justify-content:center}
.swap-a{animation:none}
.active .later{animation:fade .5s ease both;animation-delay:var(--d,1.5s)}
.active .gone{animation:gone .4s ease both;animation-delay:var(--d,1.5s)}
@keyframes gone{to{opacity:0;height:0;margin:0;padding:0}}
/* comparison table */
.vs{width:100%;display:grid;grid-template-columns:76px 1fr 1fr;gap:5px;font-size:12px;line-height:1.3}
.vs div{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 8px;color:#cfd6ea}
.vs .vh{font-weight:800;text-align:center;border:0}
.vs .vh.code{background:rgba(247,208,70,.14);color:var(--js)}
.vs .vh.data{background:rgba(61,220,151,.14);color:var(--green)}
.vs .vl{background:transparent;border:0;color:var(--dim);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;padding:0}
.trio{width:100%;display:flex;flex-direction:column;gap:7px}
.trio .cb pre{padding:6px 10px;font-size:10.5px}
.find{font-size:12px;color:var(--muted);text-align:center}

<script>var CARDS = [{"sect":1,"num":"MF","kicker":"Part 5 · Micro-frontends","h":"Module Federation <span class=\"grad\">from the shell out<\/span>","p":"How separately built and deployed React apps are stitched into one page at runtime: the config, the loading sequence, shared dependencies, MF 2.0 tooling, and the failure modes you will review in real PRs.","first":true,"badge":"~35 min · 66 cards · 8 quizzes"},{"k":"Section 1 · Why","h":"The problem MF solves","v":"<svg viewBox=\"0 0 320 200\"><rect class=\"pop\" x=\"10\" y=\"20\" width=\"120\" height=\"160\" rx=\"12\" fill=\"#151b30\" stroke=\"#ff7a45\"/><text x=\"70\" y=\"96\" fill=\"#eef1f8\" font-size=\"12\" text-anchor=\"middle\" font-family=\"monospace\">one SPA<\/text><text x=\"70\" y=\"114\" fill=\"#a3acc2\" font-size=\"10\" text-anchor=\"middle\">1 repo · 1 build · 1 deploy<\/text><path class=\"flow\" d=\"M135 100 H170\" stroke=\"#a78bfa\" stroke-width=\"2\"/><g class=\"rise\" style=\"--d:.3s\"><rect x=\"178\" y=\"20\" width=\"132\" height=\"44\" rx=\"10\" fill=\"rgba(78,168,255,.18)\" stroke=\"#4ea8ff\"/><text x=\"244\" y=\"47\" fill=\"#eef1f8\" font-size=\"11\" text-anchor=\"middle\" font-family=\"monospace\">Catalog team<\/text><\/g><g class=\"rise\" style=\"--d:.6s\"><rect x=\"178\" y=\"78\" width=\"132\" height=\"44\" rx=\"10\" fill=\"rgba(61,220,151,.16)\" stroke=\"#3ddc97\"/><text x=\"244\" y=\"105\" fill=\"#eef1f8\" font-size=\"11\" text-anchor=\"middle\" font-family=\"monospace\">Checkout team<\/text><\/g><g class=\"rise\" style=\"--d:.9s\"><rect x=\"178\" y=\"136\" width=\"132\" height=\"44\" rx=\"10\" fill=\"rgba(247,208,70,.14)\" stroke=\"#f7d046\"/><text x=\"244\" y=\"163\" fill=\"#eef1f8\" font-size=\"11\" text-anchor=\"middle\" font-family=\"monospace\">Account team<\/text><\/g><\/svg>","p":"A big single-page app (SPA) has one build and one release train. With ten teams in it, every release waits for the slowest team. <b>Micro-frontends<\/b> (MFEs) split the UI into <b>vertical slices<\/b>, each built and deployed by the team that owns that part of the product.","an":"Like splitting a Rails monolith into services, except the pieces are joined inside <b>one browser tab<\/b>, not over HTTP."},{"k":"Section 1 · Why","h":"What \"Module Federation\" actually is","v":"<div class=\"vwrap\"><div class=\"box rise\" style=\"--d:0.00s\"><b>A bundler feature<\/b><br><small>Introduced in webpack 5 (2020). Now also in Rspack, and in Vite through a plugin.<\/small><\/div><div class=\"box rise\" style=\"--d:0.25s\"><b>A runtime<\/b><br><small>A small loader in the page that fetches other apps' code and wires up shared libraries.<\/small><\/div><div class=\"box rise\" style=\"--d:0.50s\"><b>A contract<\/b><br><small>Each app says which modules it <b>exposes<\/b> and which libraries it is willing to <b>share<\/b>.<\/small><\/div><\/div>","p":"Without MF you would need iframes, a script-tag convention, or a framework like single-spa. With MF, the host writes <code>import('catalog/ProductList')<\/code> and the bundler and runtime fetch that code from another deployment when it is needed."},{"k":"Section 1 · Why","h":"Trade-offs: autonomy costs complexity","v":"<div class=\"vs\"><div class=\"vl\"><\/div><div class=\"vh code\">Gains<\/div><div class=\"vh data\">Costs<\/div><div class=\"vl\">Teams<\/div><div class=\"rise\" style=\"--d:0.0s\">Own a slice end to end, pick their own release cadence<\/div><div class=\"rise\" style=\"--d:0.1s\">Keeping UX consistent across teams needs a design system<\/div><div class=\"vl\">Deploy<\/div><div class=\"rise\" style=\"--d:0.2s\">Ship without a company-wide release train<\/div><div class=\"rise\" style=\"--d:0.3s\">Integration happens at runtime, so breakage shows up in prod, not at build time<\/div><div class=\"vl\">Code<\/div><div class=\"rise\" style=\"--d:0.4s\">Smaller repos, faster builds<\/div><div class=\"rise\" style=\"--d:0.5s\">Duplicate deps, version drift, more bytes<\/div><div class=\"vl\">Ops<\/div><div class=\"rise\" style=\"--d:0.6s\">A failure stays inside one remote<\/div><div class=\"rise\" style=\"--d:0.7s\">More pipelines, CDNs and dashboards to run<\/div><\/div>","p":"Rule of thumb: MF pays off when <b>several teams<\/b> keep blocking each other in one UI. For one team, a well-structured single app wins every time."},{"k":"Section 1 · Why","h":"Compared with microservices","v":"<div class=\"vs\"><div class=\"vl\"><\/div><div class=\"vh code\">Microservices<\/div><div class=\"vh data\">Micro-frontends<\/div><div class=\"vl\">Unit<\/div><div class=\"rise\" style=\"--d:0.0s\">Service + DB<\/div><div class=\"rise\" style=\"--d:0.1s\">UI slice (+ its API)<\/div><div class=\"vl\">Glue<\/div><div class=\"rise\" style=\"--d:0.2s\">HTTP / queues over the network<\/div><div class=\"rise\" style=\"--d:0.3s\">JS modules in ONE tab, ONE document<\/div><div class=\"vl\">Contract<\/div><div class=\"rise\" style=\"--d:0.4s\">OpenAPI / schema<\/div><div class=\"rise\" style=\"--d:0.5s\">Exposed module + props + events<\/div><div class=\"vl\">Libraries<\/div><div class=\"rise\" style=\"--d:0.6s\">Each has its own copy<\/div><div class=\"rise\" style=\"--d:0.7s\">Must SHARE React (one copy)<\/div><div class=\"vl\">Failure<\/div><div class=\"rise\" style=\"--d:0.8s\">Timeouts, circuit breakers<\/div><div class=\"rise\" style=\"--d:0.9s\">Error boundaries, fallbacks<\/div><\/div>","p":"The big difference: services each bring their own libraries. Micro-frontends share one JavaScript heap, one DOM and one CSS cascade, so they have to <b>share<\/b> some libraries and be careful with global state."},{"quiz":true,"k":"Quiz 1 / 8 · When to use","h":"Which situation most justifies micro-frontends?","opts":[["A 3-person team building a new dashboard",0],["Five teams blocked on one shared release train for a big UI",1],["An app that needs faster page loads",0]],"right":"Micro-frontends solve an <b>organisational<\/b> problem: independent ownership and deploys. They usually add bytes rather than remove them.","wrong":"It's the <b>five blocked teams<\/b>. MFEs trade complexity for team autonomy. They don't help small apps, and they don't make pages load faster."},{"k":"Section 1 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://martinfowler.com/articles/micro-frontends.html\" target=\"_blank\" rel=\"noopener noreferrer\"><b>Micro Frontends · Cam Jackson on martinfowler.com<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>The standard long-form intro: integration approaches, trade-offs and a worked example.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://webpack.js.org/concepts/module-federation/\" target=\"_blank\" rel=\"noopener noreferrer\"><b>webpack docs · Module Federation concepts<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>The original design notes and terminology from the people who built it.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"sect":1,"num":"2","kicker":"Section 2","h":"Host and remote","p":"Two roles, two config blocks, one manifest file. This is the vocabulary every MF code review uses."},{"k":"Section 2 · Roles","h":"One host, many remotes","v":"<svg viewBox=\"0 0 320 220\"><rect class=\"pop\" x=\"110\" y=\"80\" width=\"100\" height=\"60\" rx=\"12\" fill=\"rgba(167,139,250,.25)\" stroke=\"#a78bfa\"/><text x=\"160\" y=\"106\" fill=\"#fff\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\">HOST<\/text><text x=\"160\" y=\"122\" fill=\"#cfd6ea\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">shell: nav, auth, router<\/text><g stroke-width=\"2\" fill=\"none\"><path class=\"flow\" d=\"M110 100 L60 50\" stroke=\"#4ea8ff\"/><path class=\"flow\" d=\"M210 100 L262 50\" stroke=\"#3ddc97\"/><path class=\"flow\" d=\"M160 140 L160 178\" stroke=\"#f7d046\"/><\/g><g class=\"rise\" style=\"--d:.3s\"><rect x=\"8\" y=\"14\" width=\"104\" height=\"40\" rx=\"10\" fill=\"#13243a\" stroke=\"#4ea8ff\"/><text x=\"60\" y=\"32\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-family=\"monospace\">catalog<\/text><text x=\"60\" y=\"46\" fill=\"#a3acc2\" font-size=\"8\" text-anchor=\"middle\" font-family=\"monospace\">:3001/remoteEntry.js<\/text><\/g><g class=\"rise\" style=\"--d:.5s\"><rect x=\"210\" y=\"14\" width=\"104\" height=\"40\" rx=\"10\" fill=\"#10261c\" stroke=\"#3ddc97\"/><text x=\"262\" y=\"32\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-family=\"monospace\">checkout<\/text><text x=\"262\" y=\"46\" fill=\"#a3acc2\" font-size=\"8\" text-anchor=\"middle\" font-family=\"monospace\">cdn/checkout/…<\/text><\/g><g class=\"rise\" style=\"--d:.7s\"><rect x=\"108\" y=\"178\" width=\"104\" height=\"38\" rx=\"10\" fill=\"#2a2510\" stroke=\"#f7d046\"/><text x=\"160\" y=\"195\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-family=\"monospace\">account<\/text><text x=\"160\" y=\"208\" fill=\"#a3acc2\" font-size=\"8\" text-anchor=\"middle\" font-family=\"monospace\">cdn/account/…<\/text><\/g><\/svg>","p":"The <b>host<\/b> (or shell) is the app whose HTML you open. <b>Remotes<\/b> are separately built and deployed apps that <b>expose<\/b> modules. The host imports them as if they were local, but their code arrives over the network at runtime. One app can be both: a remote that also consumes other remotes.","an":"Host ≈ API gateway, remotes ≈ services, <code>remoteEntry.js<\/code> ≈ each service's discovery endpoint."},{"k":"Section 2 · Remote config","h":"<code>exposes<\/code>: the public API of a remote","cmp":[["JS","// catalog/webpack.config.js\nconst { ModuleFederationPlugin } = require('webpack').container;\n\nnew ModuleFederationPlugin({\n  name: 'catalog',              // container name (unique!)\n  filename: 'remoteEntry.js',   // the entry file the host loads\n  exposes: {\n    './ProductList': './src/ProductList',\n    './ProductCard': './src/components/ProductCard',\n  },\n  shared: { react: { singleton: true }, 'react-dom': { singleton: true } },\n})","catalog/webpack.config.js"],["Java","// the same idea as module-info.java\nmodule com.example.catalog {\n  exports com.example.catalog.api;   // only this is public\n}"]],"p":"Only paths listed under <code>exposes<\/code> can be imported from outside. Everything else in the remote stays private. Treat the keys (<code>./ProductList<\/code>) as a <b>versioned public API<\/b>: renaming one breaks every host using it."},{"k":"Section 2 · Host config","h":"<code>remotes<\/code>: where to find them","cmp":[["JS","new ModuleFederationPlugin({\n  name: 'shell',\n  remotes: {\n    // alias in code : \"containerName@URL of its entry\"\n    catalog: 'catalog@https://cdn.example.com/catalog/remoteEntry.js',\n  },\n  shared: { react: { singleton: true }, 'react-dom': { singleton: true } },\n})\n\n// anywhere in host code:\nconst ProductList = lazy(() => import('catalog/ProductList'));","shell/webpack.config.js"]],"p":"The import specifier is <code>alias/exposedKey<\/code>. The bundler sees the <code>catalog/<\/code> prefix, recognises it as a remote, and instead of bundling it, emits code that loads it at runtime.","an":"Like a <code>database.yml<\/code> entry: a name in code, the real address in config, swappable per environment."},{"k":"Section 2 · Build output","h":"What a remote build produces","v":"<div class=\"vwrap\"><div class=\"cb rise\"><div class=\"cb-h\">dist/ after building catalog <span class=\"tagc\" style=\"background:#1a2a1a;color:#3ddc97\">output<\/span><\/div><pre><span class=\"y\">remoteEntry.js<\/span>          <span class=\"c\">// ~5–20 KB · the container<\/span>\n<span class=\"y\">mf-manifest.json<\/span>        <span class=\"c\">// MF 2.0 only · metadata<\/span>\nsrc_ProductList.8f3a.js  <span class=\"c\">// exposed module chunk<\/span>\nsrc_ProductCard.c12e.js\nvendors-react.41bb.js    <span class=\"c\">// fallback copy of shared react<\/span>\nmain.js / index.html     <span class=\"c\">// standalone dev mode<\/span><\/pre><\/div><div class=\"g3\"><div class=\"box rise \" style=\"--d:0.00s\"><b>remoteEntry.js<\/b><br><small>name stays fixed → serve no-cache<\/small><\/div><div class=\"box rise ok\" style=\"--d:0.25s\"><b>*.hash.js<\/b><br><small>content-hashed → cache forever<\/small><\/div><div class=\"box rise \" style=\"--d:0.50s\"><b>vendors-react<\/b><br><small>downloaded only if nobody provides react<\/small><\/div><\/div><\/div>","p":"A remote still bundles its own copy of shared libraries as a <b>fallback<\/b>. They are only downloaded if the page doesn't already provide a compatible version."},{"k":"Section 2 · remoteEntry.js","h":"Inside the container","cmp":[["JS","// roughly what remoteEntry.js defines (simplified)\nvar catalog = {\n  // 1. host hands over the shared-library registry\n  init(shareScope) { /* register my react 18.2 as a candidate */ },\n  // 2. host asks for an exposed module\n  get(request) {           // './ProductList'\n    return loadChunk('src_ProductList.8f3a.js')\n      .then(() => () => require('./src/ProductList'));  // a factory\n  },\n};","what the container exposes"]],"p":"Every remote is a <b>container<\/b> with two methods. <code>init(shareScope)<\/code> joins the page-wide registry of shared libraries. <code>get(key)<\/code> returns a promise of a <b>module factory<\/b>. The host calls the factory to get the module's exports."},{"k":"Section 2 · publicPath","h":"Gotcha: where do the chunks come from?","v":"<div class=\"vwrap\"><div class=\"box rise warn\" style=\"--d:0.00s\"><b>Symptom<\/b>: remoteEntry.js loads from the CDN, then <code>src_ProductList.js<\/code> 404s on the <b>host's<\/b> domain.<\/div><div class=\"box rise warn\" style=\"--d:0.25s\"><b>Cause<\/b>: the remote's <code>output.publicPath<\/code> was <code>'/'<\/code>, so its chunk URLs were relative to the page, not to the remote.<\/div><div class=\"box rise ok\" style=\"--d:0.50s\"><b>Fix<\/b>: <code>publicPath: 'auto'<\/code> (works out the base URL from the script's own src at runtime) or an absolute CDN URL per environment.<\/div><\/div>","p":"This is the most common first-day MF bug. Once you know it, you will spot it in the Network tab within a few seconds."},{"quiz":true,"k":"Quiz 2 / 8 · Config","h":"The shell imports <code>catalog/ProductCard<\/code>, but the build says the module is not found. The catalog config exposes <code>./Card<\/code>. What's wrong?","opts":[["The shell must list ProductCard under shared",0],["The import must match the exposed key: catalog/Card",1],["remoteEntry.js is cached",0]],"right":"The specifier is <code>alias/exposedKey<\/code>. Only keys listed in <code>exposes<\/code> exist from the outside.","wrong":"The part after the alias must match a key in the remote's <b>exposes<\/b>: <code>catalog/Card<\/code>, or rename the key (which is a breaking change)."},{"k":"Section 2 · Review","h":"What AI often gets wrong","v":"<div class=\"vwrap\"><div class=\"box warn rise\" style=\"--d:0.00s\"><b>Same <code>name<\/code> in two remotes<\/b> (often copy-pasted configs). Containers collide on the global, and one remote silently replaces the other.<\/div><div class=\"box warn rise\" style=\"--d:0.25s\"><b>Exposing whole folders or internals<\/b> (<code>./utils<\/code>, <code>./store<\/code>). That turns private code into public API that other teams start to depend on.<\/div><div class=\"box warn rise\" style=\"--d:0.50s\"><b>Hard-coded <code>localhost<\/code> remote URLs<\/b> left in the production config, or <code>publicPath: '/'<\/code> on a remote.<\/div><div class=\"box warn rise\" style=\"--d:0.75s\"><b>Mixing up host and remote options<\/b>: putting <code>exposes<\/code> in the shell \"just in case\", or <code>remotes<\/code> in a leaf remote that doesn't consume anything.<\/div><\/div>","p":"Look for these in AI-written diffs. They compile, they often pass a quick test, and they break later."},{"k":"Section 2 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://webpack.js.org/plugins/module-federation-plugin/\" target=\"_blank\" rel=\"noopener noreferrer\"><b>webpack · ModuleFederationPlugin reference<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>Every option: name, filename, exposes, remotes, shared, and their exact semantics.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://module-federation.io/guide/start/glossary.html\" target=\"_blank\" rel=\"noopener noreferrer\"><b>module-federation.io · Glossary<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>Precise definitions of host, remote, container, share scope and more.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"sect":1,"num":"3","kicker":"Section 3","h":"The runtime loading sequence","p":"What happens in the browser, step by step, from the first byte to a rendered remote."},{"k":"Section 3 · Sequence","h":"What happens when you click \"Catalog\"","v":"<ol class=\"steps\"><li style=\"--d:0.0s\">Browser loads <code>shell/main.js<\/code>, which runs <code>import('./bootstrap')<\/code><\/li><li style=\"--d:0.7s\">Shell runtime puts its shared libs (react, react-dom) into the <b>share scope<\/b><\/li><li style=\"--d:1.4s\">User navigates to <b>/catalog<\/b> → <code>React.lazy<\/code> calls <code>import('catalog/ProductList')<\/code><\/li><li style=\"--d:2.1s\">Runtime injects <code>&lt;script src=\".../catalog/remoteEntry.js\"&gt;<\/code><\/li><li style=\"--d:2.8s\"><code>catalog.init(shareScope)<\/code>: catalog adds its versions, and the runtime picks winners<\/li><li style=\"--d:3.5s\"><code>catalog.get('./ProductList')<\/code> → fetches the hashed chunk<\/li><li style=\"--d:4.2s\">Factory runs; <code>&lt;Suspense&gt;<\/code> swaps the spinner for the real UI<\/li><\/ol>","p":"No remote code is fetched until it's needed. Steps 4–6 are an ordinary <b>script tag and chunk fetch<\/b>, so you can see each one in the Network tab."},{"k":"Section 3 · Share scope","h":"The share scope is a page-wide registry","v":"<svg viewBox=\"0 0 320 200\"><rect class=\"pop\" x=\"80\" y=\"120\" width=\"160\" height=\"70\" rx=\"12\" fill=\"rgba(78,168,255,.14)\" stroke=\"#4ea8ff\"/><text x=\"160\" y=\"138\" fill=\"#fff\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\">shareScope.default.react<\/text><text class=\"fade\" style=\"--d:.6s\" x=\"160\" y=\"156\" fill=\"#cfd6ea\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">18.3.1 (from shell) ✓ loaded<\/text><text class=\"fade\" style=\"--d:1.4s\" x=\"160\" y=\"172\" fill=\"#a3acc2\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">18.2.0 (from catalog)<\/text><text class=\"fade\" style=\"--d:2.2s\" x=\"160\" y=\"186\" fill=\"#a3acc2\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">18.1.0 (from checkout)<\/text><g class=\"rise\"><rect x=\"10\" y=\"14\" width=\"88\" height=\"40\" rx=\"10\" fill=\"#151b30\" stroke=\"#a78bfa\"/><text x=\"54\" y=\"38\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-family=\"monospace\">shell<\/text><\/g><g class=\"rise\" style=\"--d:.8s\"><rect x=\"116\" y=\"14\" width=\"88\" height=\"40\" rx=\"10\" fill=\"#151b30\" stroke=\"#a78bfa\"/><text x=\"160\" y=\"38\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-family=\"monospace\">catalog<\/text><\/g><g class=\"rise\" style=\"--d:1.6s\"><rect x=\"222\" y=\"14\" width=\"88\" height=\"40\" rx=\"10\" fill=\"#151b30\" stroke=\"#a78bfa\"/><text x=\"266\" y=\"38\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-family=\"monospace\">checkout<\/text><\/g><g stroke=\"#4ea8ff\" stroke-width=\"2\" fill=\"none\"><path class=\"flow\" d=\"M54 56 L120 118\"/><path class=\"flow\" d=\"M160 56 L160 118\"/><path class=\"flow\" d=\"M266 56 L200 118\"/><\/g><\/svg>","p":"Think of it as a map: <code>package name → { version → loader }<\/code>. Each container registers what it <i>could<\/i> provide. Nothing is downloaded at registration time. A version is only loaded when someone first asks for that package.","an":"Like a dependency-injection container: everyone registers candidate beans, and resolution picks one when it's first needed."},{"k":"Section 3 · Network tab","h":"What it looks like in DevTools","v":"<div class=\"net\"><div class=\"net-h\"><span>Name<\/span><span>Status<\/span><span>Size<\/span><span>Waterfall<\/span><\/div><div class=\"net-r\" style=\"--d:0s\"><span class=\"n\">main.js<\/span><span class=\"t\">200<\/span><span class=\"z\">48 KB<\/span><div class=\"wf\"><i style=\"--s:0%;--w:18%;--c:#a78bfa\"><\/i><\/div><\/div><div class=\"net-r\" style=\"--d:.15s\"><span class=\"n\">vendors-react.js<\/span><span class=\"t\">200<\/span><span class=\"z\">44 KB<\/span><div class=\"wf\"><i style=\"--s:16%;--w:16%;--c:#4ea8ff\"><\/i><\/div><\/div><div class=\"net-r hl\" style=\"--d:.3s\"><span class=\"n\">catalog/remoteEntry.js<\/span><span class=\"t\">200<\/span><span class=\"z\">9 KB<\/span><div class=\"wf\"><i style=\"--s:40%;--w:10%;--c:#f7d046\"><\/i><\/div><\/div><div class=\"net-r\" style=\"--d:.45s\"><span class=\"n\">src_ProductList.8f3a.js<\/span><span class=\"t\">200<\/span><span class=\"z\">22 KB<\/span><div class=\"wf\"><i style=\"--s:52%;--w:16%;--c:#3ddc97\"><\/i><\/div><\/div><div class=\"net-r dim\" style=\"--d:.6s\"><span class=\"n\">catalog/vendors-react.js<\/span><span class=\"t\">—<\/span><span class=\"z\">not req.<\/span><div class=\"wf\"><i style=\"--s:0%;--w:0%;--c:#555\"><\/i><\/div><\/div><div class=\"net-foot\"><span>one react · remote entry before chunk<\/span><span>filter: JS<\/span><\/div><\/div>","p":"Healthy pattern: <b>one<\/b> react download, the remote entry file <b>before<\/b> its chunks, and nothing from catalog until you navigate there. Two react files in this list means sharing is broken."},{"k":"Section 3 · Dynamic remotes","h":"Static vs runtime-registered remotes","cmp":[["JS","// MF 2.0 runtime: decide remotes at runtime (e.g. from a registry)\nimport { init, loadRemote } from '@module-federation/enhanced/runtime';\n\nconst registry = await fetch('/mfe-registry.json').then(r => r.json());\ninit({\n  name: 'shell',\n  remotes: registry.remotes,    // [{ name:'catalog', entry:'https://…/mf-manifest.json' }]\n});\n\nconst mod = await loadRemote('catalog/ProductList');  // { default: Component }","runtime registration"]],"p":"Static remotes put the URL in the <b>build<\/b>, so changing environments means rebuilding. Big platforms register remotes at <b>runtime<\/b> from a registry JSON, so the same shell build can point at staging, prod or a developer's branch."},{"quiz":true,"k":"Quiz 3 / 8 · Loading","h":"A user opens /catalog for the first time. Which catalog file is fetched first?","opts":[["The full catalog bundle",0],["catalog's remoteEntry.js (or mf-manifest.json)",1],["Catalog's copy of React",0]],"right":"The entry file comes first: it joins the share scope and knows which hashed chunk holds <code>./ProductList<\/code>.","wrong":"It's the <b>entry/manifest<\/b>. Then only the chunks needed for that module. React is normally reused from the shell."},{"k":"Section 3 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://module-federation.io/guide/runtime/index.html\" target=\"_blank\" rel=\"noopener noreferrer\"><b>module-federation.io · Runtime access<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>How the MF runtime registers remotes and loads modules, with the APIs behind it.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://module-federation.io/guide/debug/chrome-devtool.html\" target=\"_blank\" rel=\"noopener noreferrer\"><b>module-federation.io · Chrome DevTools extension<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>Inspect the share scope and loaded remotes, and override remotes, from DevTools.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"sect":1,"num":"4","kicker":"Section 4","h":"Shared dependencies","p":"Singletons, version negotiation, eager vs lazy, and the bootstrap pattern. Most production MF bugs happen here."},{"k":"Section 4 · Why share","h":"Why two Reacts break hooks","v":"<ol class=\"steps\"><li style=\"--d:0.0s\">Shell loads <b>react copy A<\/b> and renders <code>&lt;App/&gt;<\/code> with react-dom A<\/li><li style=\"--d:0.7s\">Catalog bundled <b>react copy B<\/b> (no sharing)<\/li><li style=\"--d:1.4s\">Catalog's component calls <code>useState<\/code> → imported from <b>B<\/b><\/li><li style=\"--d:2.1s\">B looks for \"the component currently rendering\", which only <b>A's<\/b> renderer set<\/li><li style=\"--d:2.8s\">B finds nothing → <b>\"Invalid hook call\"<\/b><\/li><\/ol>","p":"Hooks rely on module-level state inside the React instance. A component rendered by react-dom A must call hooks from react A. The same applies to <b>Context<\/b>: a provider from copy A is invisible to <code>useContext<\/code> from copy B."},{"k":"Section 4 · Options","h":"The knobs on <code>shared<\/code>","cmp":[["JS","const deps = require('./package.json').dependencies;\nshared: {\n  react: {\n    singleton: true,             // at most one version on the page\n    requiredVersion: deps.react, // e.g. '^18.2.0' (what I can work with)\n    strictVersion: false,        // true = throw instead of warn on mismatch\n    eager: false,                // true = bundle into the entry (see later)\n  },\n  'react-dom':        { singleton: true, requiredVersion: deps['react-dom'] },\n  'react-router-dom': { singleton: true },   // one history/router context\n  '@acme/design-system': { singleton: true }, // theme context + CSS\n}"]],"p":"Share libraries that hold <b>global state or context<\/b>: React, the router, the design system, the state or query client. Small pure utilities (date helpers, lodash functions) gain little from sharing and add negotiation overhead."},{"k":"Section 4 · Negotiation","h":"Walkthrough: who wins?","v":"<div class=\"vwrap\"><div class=\"g3\"><div class=\"box rise\" style=\"--d:0.00s\"><b>shell<\/b><br><code>react 18.3.1<\/code><br><small>needs ^18.2.0<\/small><\/div><div class=\"box rise\" style=\"--d:0.25s\"><b>catalog<\/b><br><code>react 18.2.0<\/code><br><small>needs ^18.2.0<\/small><\/div><div class=\"box rise\" style=\"--d:0.50s\"><b>checkout<\/b><br><code>react 18.1.0<\/code><br><small>needs ^18.0.0<\/small><\/div><\/div><div class=\"down rise\" style=\"--d:.9s\">↓ singleton: pick the highest version registered<\/div><div class=\"box ok pop\" style=\"--d:1.2s;text-align:center\"><b>18.3.1 loads once<\/b>. It satisfies every range, so no warnings<\/div><div class=\"box warn pop\" style=\"--d:1.8s;font-size:11px\">If checkout needed <code>^17.0.0<\/code>: with <code>singleton<\/code> it still gets 18.3.1 plus a console <b>warning<\/b>; with <code>strictVersion<\/code> its load <b>throws<\/b>.<\/div><\/div>","p":"For singletons, the runtime takes the <b>highest registered version<\/b> and then checks each consumer's <code>requiredVersion<\/code>. Without <code>singleton<\/code>, each consumer gets the highest version <b>in its own range<\/b>, so two versions can end up on the page side by side.","an":"Like Bundler resolving a Gemfile, but it happens in the browser on every page load, with whatever versions are deployed today."},{"k":"Section 4 · Non-singletons","h":"When two versions are fine (and when not)","v":"<div class=\"vwrap\"><div class=\"box rise ok\" style=\"--d:0.00s\"><b>OK to duplicate<\/b>: pure libraries with no shared state (a date formatter, a validation lib). Two copies cost bytes, not correctness.<\/div><div class=\"box rise warn\" style=\"--d:0.25s\"><b>Never duplicate<\/b>: React, react-dom, router, styled-components/emotion, design-system theme, state stores. Two copies means two contexts and two registries.<\/div><div class=\"box rise warn\" style=\"--d:0.50s\"><b>Sneaky case<\/b>: a library that uses <code>instanceof<\/code> or a module-level registry (e.g. GraphQL client, i18n instance). Duplicates fail in confusing ways.<\/div><\/div>","p":"When you review a <code>shared<\/code> block, ask one question per entry: \"does this library keep state that has to be the same object everywhere on the page?\""},{"quiz":true,"k":"Quiz 4 / 8 · Negotiation","h":"The shell provides react 18.3.1. A remote declares this. What happens?","opts":[["The remote loads its own React 19",0],["A console warning; the remote runs on 18.3.1",1],["The page fails to build",0]],"right":"With <code>singleton<\/code>, only one copy is allowed, so the remote runs on 18.3.1 and you get a warning. <code>strictVersion: true<\/code> would make it throw instead.","wrong":"<code>singleton<\/code> forbids a second copy, so it <b>uses 18.3.1 and warns<\/b>. Only <code>strictVersion: true<\/code> turns that into an error, and only at runtime, because builds are independent.","code":"react: { singleton: true,\n         requiredVersion: '^19.0.0' }  // no strictVersion"},{"k":"Section 4 · Eager vs lazy","h":"Eager vs lazy shared modules","v":"<div class=\"vs\"><div class=\"vl\"><\/div><div class=\"vh code\">eager: false (default)<\/div><div class=\"vh data\">eager: true<\/div><div class=\"vl\">Where<\/div><div class=\"rise\" style=\"--d:0.0s\">Separate chunk, loaded after negotiation<\/div><div class=\"rise\" style=\"--d:0.1s\">Bundled inside the entry file itself<\/div><div class=\"vl\">Cost<\/div><div class=\"rise\" style=\"--d:0.2s\">One extra async step<\/div><div class=\"rise\" style=\"--d:0.3s\">Bigger entry and no real negotiation<\/div><div class=\"vl\">Who wins<\/div><div class=\"rise\" style=\"--d:0.4s\">Highest compatible version<\/div><div class=\"rise\" style=\"--d:0.5s\">Whoever loaded eagerly first<\/div><div class=\"vl\">Use<\/div><div class=\"rise\" style=\"--d:0.6s\">Almost always<\/div><div class=\"rise\" style=\"--d:0.7s\">Rare: tiny libs needed at entry time<\/div><\/div>","p":"\"Lazy\" here means the shared module is <b>loaded through the share scope<\/b> after every container has registered. \"Eager\" means it ships inside the entry file and is available immediately, without waiting for negotiation."},{"k":"Section 4 · The error","h":"\"Shared module is not available for eager consumption\"","cmp":[["JS","// src/index.js (BROKEN)\nimport React from 'react';               // static import at entry\nimport { createRoot } from 'react-dom/client';\nimport App from './App';\ncreateRoot(root).render(<App />);\n// webpack must hand over 'react' synchronously,\n// but it's a lazily shared module → the error is thrown","what triggers it"]],"p":"Your entry file runs <b>synchronously<\/b>. If it statically imports a shared module, the runtime has had no chance to negotiate yet, so it can't provide one. AI assistants usually \"fix\" this with <code>eager: true<\/code>. That silences the error and quietly breaks version negotiation."},{"k":"Section 4 · Bootstrap pattern","h":"The async boundary: one line that fixes it","cmp":[["JS","// src/index.js: the WHOLE file\nimport('./bootstrap');\n\n// src/bootstrap.jsx: what index.js used to be\nimport { createRoot } from 'react-dom/client';\nimport App from './App';\ncreateRoot(document.getElementById('root')).render(<App />);","index.js + bootstrap.jsx"]],"v":"<ol class=\"steps\"><li style=\"--d:0.0s\"><code>index.js<\/code> runs and hits a <b>dynamic<\/b> import<\/li><li style=\"--d:0.7s\">webpack treats it as an async chunk load and first initialises sharing<\/li><li style=\"--d:1.4s\">Remotes' versions are registered and winners are picked<\/li><li style=\"--d:2.1s\">Only then <code>bootstrap.jsx<\/code> runs, and its static imports resolve<\/li><\/ol>","p":"The dynamic <code>import()<\/code> creates an <b>async boundary<\/b>: a promise the runtime can wait on while it negotiates. Do this in <b>every<\/b> app that consumes shared modules, host and remotes alike."},{"quiz":true,"k":"Quiz 5 / 8 · Bootstrap","h":"A PR \"fixes\" the eager-consumption error by setting <code>eager: true<\/code> on react in the shell. Best review comment?","opts":[["LGTM, the error is gone",0],["Use an async boundary (index.js → import('./bootstrap')) and keep react lazy",1],["Also set eager on every remote",0]],"right":"The bootstrap pattern fixes the cause. <code>eager<\/code> bundles react into the entry and skips real negotiation.","wrong":"Ask for the <b>bootstrap pattern<\/b>. Making shared modules eager hides the error and turns negotiation into \"whoever loaded first wins\"."},{"k":"Section 4 · Review","h":"What AI often gets wrong","v":"<div class=\"vwrap\"><div class=\"box warn rise\" style=\"--d:0.00s\"><b><code>eager: true<\/code> to silence errors<\/b>, usually on React. Look for it in any PR that touches <code>shared<\/code>.<\/div><div class=\"box warn rise\" style=\"--d:0.25s\"><b>Missing <code>react-dom<\/code><\/b> from shared while <code>react<\/code> is shared, or sharing <code>react<\/code> but not <code>react/jsx-runtime<\/code> in setups that need it explicitly.<\/div><div class=\"box warn rise\" style=\"--d:0.50s\"><b>Hard-coded <code>requiredVersion: '18.2.0'<\/code><\/b> (exact) instead of reading from package.json, which creates mismatch warnings with every patch release.<\/div><div class=\"box warn rise\" style=\"--d:0.75s\"><b>Sharing everything<\/b> (<code>shared: deps<\/code> spread blindly) without singleton flags, so dozens of libraries get negotiated and context libs can still duplicate.<\/div><\/div>","p":"Look for these in AI-written diffs. They compile, they often pass a quick test, and they break later."},{"k":"Section 4 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://module-federation.io/configure/shared.html\" target=\"_blank\" rel=\"noopener noreferrer\"><b>module-federation.io · shared configuration<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>singleton, requiredVersion, strictVersion, eager, shareScope: the reference, with examples.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://module-federation.io/guide/troubleshooting/runtime.html\" target=\"_blank\" rel=\"noopener noreferrer\"><b>module-federation.io · Runtime troubleshooting<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>Real error codes (eager consumption, version mismatch, load failures) and their fixes.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"sect":1,"num":"5","kicker":"Section 5","h":"Module Federation 2.0 and tooling","p":"@module-federation/enhanced, the manifest, the runtime API, Rspack and Vite plugins, and type sharing."},{"k":"Section 5 · MF 2.0","h":"What changed in 2.0","v":"<div class=\"vwrap\"><div class=\"box rise\" style=\"--d:0.00s\"><b>Runtime split from the bundler<\/b><br><small><code>@module-federation/runtime<\/code> works the same way under webpack, Rspack, and Vite.<\/small><\/div><div class=\"box rise\" style=\"--d:0.25s\"><b>mf-manifest.json<\/b><br><small>A JSON description of a remote: exposes, shared deps, asset lists. It can be used instead of remoteEntry.js.<\/small><\/div><div class=\"box rise\" style=\"--d:0.50s\"><b>Runtime plugins and hooks<\/b><br><small>Change how remotes resolve, add retries, log loads, swap URLs for dev.<\/small><\/div><div class=\"box rise\" style=\"--d:0.75s\"><b>Type hints (dts)<\/b><br><small>The remote publishes its TS types and the host downloads them during dev.<\/small><\/div><div class=\"box rise\" style=\"--d:1.00s\"><b>Bridges<\/b><br><small>Helpers for mounting a whole app (with its own router or React version) inside another.<\/small><\/div><\/div>","p":"MF 1 (webpack 5's built-in plugin) still works. Most new setups use <code>@module-federation/enhanced<\/code>, which builds on the same ideas and adds these features."},{"k":"Section 5 · enhanced","h":"Same config, new package","cmp":[["JS","// webpack.config.js with MF 2.0\nconst { ModuleFederationPlugin } = require('@module-federation/enhanced/webpack');\n\nnew ModuleFederationPlugin({\n  name: 'catalog',\n  exposes: { './ProductList': './src/ProductList' },\n  shared: { react: { singleton: true }, 'react-dom': { singleton: true } },\n  manifest: true,   // also emit mf-manifest.json\n  dts: true,        // generate + consume federated types\n});\n\n// host side: point at the manifest instead of remoteEntry.js\nremotes: { catalog: 'catalog@https://cdn.example.com/catalog/mf-manifest.json' }","MF 2.0 plugin"]],"p":"Pointing a host at <code>mf-manifest.json<\/code> lets the runtime see a remote's assets <b>before<\/b> it runs any of that remote's code. That allows preloading, better error messages, and tooling like the DevTools extension."},{"k":"Section 5 · Runtime API","h":"Loading remotes from code","cmp":[["TS","import { loadRemote, registerRemotes } from '@module-federation/enhanced/runtime';\n\n// add or replace remotes at runtime (e.g. after reading a registry)\nregisterRemotes([{ name: 'catalog', entry: catalogManifestUrl }]);\n\n// typed load, with an explicit failure path\nconst mod = await loadRemote<{ default: React.ComponentType<Props> }>(\n  'catalog/ProductList',\n);\nif (!mod) throw new Error('catalog unavailable');","runtime API"]],"p":"<code>loadRemote<\/code> is the code-level equivalent of <code>import('catalog/ProductList')<\/code>. You need it when remote names come from data (a registry or feature flags) rather than from the build config."},{"k":"Section 5 · Bundlers","h":"webpack, Rspack, Vite","v":"<div class=\"vs\"><div class=\"vl\"><\/div><div class=\"vh code\">How MF is provided<\/div><div class=\"vh data\">Notes<\/div><div class=\"vl\">webpack 5<\/div><div class=\"rise\" style=\"--d:0.0s\">Built-in <code>container.ModuleFederationPlugin<\/code>, or the enhanced plugin<\/div><div class=\"rise\" style=\"--d:0.1s\">The original. Mature; slower builds<\/div><div class=\"vl\">Rspack<\/div><div class=\"rise\" style=\"--d:0.2s\">Built-in plugin (Rust bundler with a webpack-compatible API)<\/div><div class=\"rise\" style=\"--d:0.3s\">Mostly a drop-in replacement for webpack configs; much faster builds<\/div><div class=\"vl\">Vite<\/div><div class=\"rise\" style=\"--d:0.4s\"><code>@module-federation/vite<\/code> plugin<\/div><div class=\"rise\" style=\"--d:0.5s\">Dev server uses native ESM; check plugin maturity for your setup<\/div><div class=\"vl\">Rsbuild / Modern.js<\/div><div class=\"rise\" style=\"--d:0.6s\">Plugins on top of the MF 2.0 runtime<\/div><div class=\"rise\" style=\"--d:0.7s\">Higher-level wrappers around Rspack<\/div><\/div>","p":"A host built with one bundler can load a remote built with another, <b>as long as both use a compatible MF runtime<\/b>. In practice, keep each platform on one runtime version and upgrade them together."},{"k":"Section 5 · Types","h":"Type sharing across repos","v":"<ol class=\"steps\"><li style=\"--d:0.0s\">Remote builds with <code>dts: true<\/code> → emits <code>@mf-types.zip<\/code> with the .d.ts files for its exposes<\/li><li style=\"--d:0.7s\">Host dev server downloads it into <code>@mf-types/catalog/…<\/code><\/li><li style=\"--d:1.4s\">tsconfig <code>paths<\/code> maps <code>catalog/*<\/code> → those types<\/li><li style=\"--d:2.1s\"><code>import('catalog/ProductList')<\/code> is now typed in the editor<\/li><li style=\"--d:2.8s\">Alternative: publish a versioned <b>contract package<\/b> (props + event types) to your registry<\/li><\/ol>","p":"Without this, TypeScript treats remote imports as <code>any<\/code> or needs a hand-written <code>declare module 'catalog/*'<\/code>. Downloaded types reflect what is <b>deployed<\/b>. A contract package reflects what was <b>agreed<\/b>, and many teams use both."},{"quiz":true,"k":"Quiz 6 / 8 · Types","h":"A PR adds <code>declare module 'catalog/*';<\/code> to silence TS errors on remote imports. Main risk?","opts":[["None, that's the recommended setup",0],["Every remote import becomes any, so prop mismatches compile fine and fail at runtime",1],["It breaks the build",0]],"right":"A wildcard module declaration types everything as <code>any<\/code>. Use federated types (dts) or a contract package.","wrong":"It hides type errors: <b>props and exports become <code>any<\/code><\/b>. Ask for dts or a shared contract package."},{"k":"Section 5 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://module-federation.io/guide/start/index.html\" target=\"_blank\" rel=\"noopener noreferrer\"><b>module-federation.io · Introduction (MF 2.0)<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>The official guide for @module-federation/enhanced, runtime, manifest and bridges.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://rspack.rs/guide/advanced/module-federation\" target=\"_blank\" rel=\"noopener noreferrer\"><b>Rspack · Module Federation guide<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>How MF works in Rspack and how to migrate a webpack MF config.<\/small><\/a><a class=\"box rise\" style=\"--d:0.4s;text-decoration:none;display:block\" href=\"https://module-federation.io/guide/basic/type-prompt.html\" target=\"_blank\" rel=\"noopener noreferrer\"><b>module-federation.io · Type hinting<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>How dts generation and consumption work, plus their config options.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"sect":1,"num":"6","kicker":"Section 6","h":"Integration: routing, communication, CSS, errors","p":"Several remotes share one page. These are the contracts and safeguards that keep them out of each other's way."},{"k":"Section 6 · Routing","h":"Host owns the URL, remotes own sub-routes","cmp":[["JSX","// shell: mounts each remote under a prefix\n<Route path=\"/catalog/*\" element={<CatalogApp basePath=\"/catalog\" />} />\n\n// catalog remote: routes relative to where it is mounted\n<Routes>\n  <Route index element={<ProductList />} />\n  <Route path=\":id\" element={<ProductDetail />} />\n<\/Routes>"],["Rails","# like mounting an engine\nmount Catalog::Engine, at: '/catalog'"]],"p":"Share the router as a singleton so there is <b>one history<\/b>. A remote must never create its own <code>BrowserRouter<\/code> inside the shell (two routers fight over the URL), and must never hard-code the shell's paths."},{"k":"Section 6 · Communication","h":"Four ways remotes talk, best first","v":"<div class=\"vwrap\"><div class=\"box rise ok\" style=\"--d:0.00s\"><b>1. Props in, callbacks out<\/b>: the shell passes <code>user<\/code>, <code>locale<\/code>, <code>onNavigate<\/code>. This is explicit and typed.<\/div><div class=\"box rise ok\" style=\"--d:0.25s\"><b>2. URL<\/b>: share state through route params and query strings. It survives a refresh and can be linked to.<\/div><div class=\"box rise \" style=\"--d:0.50s\"><b>3. Browser events<\/b>: <code>CustomEvent<\/code> on <code>window<\/code> with a documented name and payload, for one-to-many notifications.<\/div><div class=\"box rise warn\" style=\"--d:0.75s\"><b>4. Shared store<\/b>: one singleton store or query client. This is powerful, but it couples the remotes like a shared database.<\/div><\/div>","p":"Prefer the options higher in the list. Communication should look like an API between services, not like reaching into another module's variables."},{"k":"Section 6 · Events","h":"A typed event contract","v":"<svg viewBox=\"0 0 320 110\"><rect x=\"6\" y=\"40\" width=\"96\" height=\"40\" rx=\"10\" fill=\"#13243a\" stroke=\"#4ea8ff\"/><text x=\"54\" y=\"64\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-family=\"monospace\">catalog<\/text><rect x=\"218\" y=\"40\" width=\"96\" height=\"40\" rx=\"10\" fill=\"#10261c\" stroke=\"#3ddc97\"/><text x=\"266\" y=\"64\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" font-family=\"monospace\">cart badge<\/text><line x1=\"102\" y1=\"60\" x2=\"218\" y2=\"60\" stroke=\"#2a3145\" stroke-width=\"2\"/><text x=\"160\" y=\"30\" fill=\"#a78bfa\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">\"cart:item-added\"<\/text><circle class=\"mv\" style=\"--tx:110px\" cx=\"108\" cy=\"60\" r=\"6\" fill=\"#a78bfa\"/><\/svg>","cmp":[["TS","// @acme/mfe-contracts (versioned package)\nexport type CartItemAdded = { sku: string; qty: number };\nexport const CART_ITEM_ADDED = 'cart:item-added';\n\n// publisher\nwindow.dispatchEvent(new CustomEvent<CartItemAdded>(CART_ITEM_ADDED,\n  { detail: { sku: 'A-42', qty: 1 } }));\n// subscriber: ALWAYS clean up\nuseEffect(() => {\n  const h = (e: Event) => refresh((e as CustomEvent<CartItemAdded>).detail);\n  window.addEventListener(CART_ITEM_ADDED, h);\n  return () => window.removeEventListener(CART_ITEM_ADDED, h);\n}, []);"]],"an":"Pub/sub like Kafka topics: name events by domain and version the payload like a schema."},{"k":"Section 6 · CSS isolation","h":"One document, one cascade","v":"<div class=\"vwrap\"><div class=\"cb\"><div class=\"cb-h\">catalog remote ships global CSS <span class=\"tagc\" style=\"background:#3a1624;color:#ff5c8a\">leaks<\/span><\/div><pre>button { background: tomato; border-radius: 0; }<\/pre><\/div><div class=\"g2 bleed\"><div class=\"box\"><small>shell nav<\/small><br><button class=\"victim\">Save<\/button><\/div><div class=\"box\"><small>checkout remote<\/small><br><button class=\"victim\">Pay now<\/button><\/div><\/div><div class=\"g2\"><div class=\"box rise ok\" style=\"--d:0.00s\"><b>Scope<\/b>: CSS Modules, CSS-in-JS, or a class prefix (<code>.cat-<\/code>). No bare element selectors in remotes.<\/div><div class=\"box rise ok\" style=\"--d:0.25s\"><b>Hard isolation<\/b>: Shadow DOM, if the remote renders inside a custom element. Note that design-system styles must then be injected into each shadow root.<\/div><\/div><\/div>","p":"Every remote's stylesheet applies to the whole page. Also watch out for <b>CSS that loads late<\/b>: a remote's CSS chunk arriving after its JS causes a flash of unstyled content, and a CSS reset in a remote can restyle the shell."},{"k":"Section 6 · Error boundaries","h":"Wrap every remote, twice","v":"<div class=\"g2\"><div class=\"box rise warn\" style=\"--d:0.00s\"><b>No boundary<\/b><br><small>a catalog chunk 404s or throws → the whole shell white-screens<\/small><\/div><div class=\"box rise ok\" style=\"--d:0.25s\"><b>Boundary per remote<\/b><br><small>\"Catalog is unavailable · Retry\" while nav still works<\/small><\/div><\/div>","cmp":[["JSX","<ErrorBoundary fallback={<RemoteDown name=\"Catalog\" />}>   {/* load + render errors */}\n  <Suspense fallback={<Skeleton />}>                       {/* loading state */}\n    <CatalogApp />\n  <\/Suspense>\n<\/ErrorBoundary>"]],"p":"A failed <code>import()<\/code> rejects, and <code>React.lazy<\/code> turns that rejection into a render error, so the <b>error boundary<\/b> catches both \"couldn't load\" and \"crashed while rendering\". Note: a lazy component that failed once stays failed, so \"Retry\" has to create a new <code>lazy()<\/code> or reload.","an":"A circuit breaker for UI: a failed remote degrades one panel instead of taking down the page."},{"quiz":true,"k":"Quiz 7 / 8 · Communication","h":"The cart badge (in the shell) must update when catalog adds an item. Best option?","opts":[["The shell imports catalog's internal cart store",0],["A documented CustomEvent (or a shell callback prop) with a typed payload",1],["Both read and write window.cartCount",0]],"right":"A <b>typed event or callback<\/b> is a contract. Importing another remote's internals couples their deploys and breaks when they refactor.","wrong":"Use a <b>documented event or callback<\/b>. Reaching into another remote's internals is like querying another service's database."},{"k":"Section 6 · Review","h":"What AI often gets wrong","v":"<div class=\"vwrap\"><div class=\"box warn rise\" style=\"--d:0.00s\"><b>A <code>BrowserRouter<\/code> inside a remote<\/b>, or <code>window.location.href = '/x'<\/code> for navigation (full reload, loses shell state).<\/div><div class=\"box warn rise\" style=\"--d:0.25s\"><b>Event listeners without cleanup<\/b> in <code>useEffect<\/code>: every remount adds another handler, so events fire twice, then three times.<\/div><div class=\"box warn rise\" style=\"--d:0.50s\"><b>One error boundary around the whole app<\/b> instead of one per remote, or a lazy remote with no <code>Suspense<\/code> fallback.<\/div><div class=\"box warn rise\" style=\"--d:0.75s\"><b>Global CSS or resets<\/b> in a remote (<code>* { margin:0 }<\/code>, <code>body { … }<\/code>, <code>button { … }<\/code>).<\/div><\/div>","p":"Look for these in AI-written diffs. They compile, they often pass a quick test, and they break later."},{"k":"Section 6 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://react.dev/reference/react/Component#catching-rendering-errors-with-an-error-boundary\" target=\"_blank\" rel=\"noopener noreferrer\"><b>react.dev · Catching rendering errors with an error boundary<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>The official explanation, including what boundaries do not catch.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://module-federation.io/guide/basic/css-isolate.html\" target=\"_blank\" rel=\"noopener noreferrer\"><b>module-federation.io · Style isolation<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>Options for keeping a remote's styles from leaking into the host.<\/small><\/a><a class=\"box rise\" style=\"--d:0.4s;text-decoration:none;display:block\" href=\"https://developer.mozilla.org/en-US/docs/Web/API/CustomEvent\" target=\"_blank\" rel=\"noopener noreferrer\"><b>MDN · CustomEvent<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>The browser API behind event-based MFE communication.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"sect":1,"num":"7","kicker":"Section 7","h":"Deploy and versioning pitfalls","p":"With runtime integration, a working build doesn't prove much. This section covers caching, version skew and rollbacks."},{"k":"Section 7 · Caching","h":"Two caching rules that matter","v":"<div class=\"vs\"><div class=\"vl\"><\/div><div class=\"vh code\">File<\/div><div class=\"vh data\">Cache header<\/div><div class=\"vl\">remoteEntry.js / mf-manifest.json<\/div><div class=\"rise\" style=\"--d:0.0s\"><code>no-cache<\/code> or a short max-age. Fixed name, so it must be revalidated<\/div><div class=\"rise\" style=\"--d:0.1s\">undefined<\/div><div class=\"vl\">*.[contenthash].js / .css<\/div><div class=\"rise\" style=\"--d:0.2s\"><code>max-age=31536000, immutable<\/code><\/div><div class=\"rise\" style=\"--d:0.3s\">undefined<\/div><div class=\"vl\">index.html of the shell<\/div><div class=\"rise\" style=\"--d:0.4s\"><code>no-cache<\/code><\/div><div class=\"rise\" style=\"--d:0.5s\">undefined<\/div><\/div>","p":"If the entry file is cached for a day, users keep running yesterday's remote after you deploy, and a hotfix takes a day to reach them. If hashed chunks are not kept around, users still holding an old entry file get <b>ChunkLoadError<\/b>."},{"k":"Section 7 · Skew","h":"Version skew: old tab, new remote","v":"<ol class=\"steps\"><li style=\"--d:0.0s\">User opens the app at 9:00 → shell v41 + catalog entry v12<\/li><li style=\"--d:0.7s\">10:00: catalog deploys v13 and the CDN <b>deletes<\/b> v12's chunks<\/li><li style=\"--d:1.4s\">User clicks a lazy route → v12 entry asks for <code>src_Detail.ab12.js<\/code><\/li><li style=\"--d:2.1s\">404 → <b>ChunkLoadError<\/b>, and the boundary shows \"unavailable\"<\/li><\/ol>","p":"Fixes: keep old hashed assets for days (deploy is <b>additive<\/b>), catch <code>ChunkLoadError<\/code> and offer a reload, and make contract changes backwards compatible so a v41 shell can run with a v13 remote."},{"k":"Section 7 · Contracts","h":"Breaking changes travel at runtime","v":"<div class=\"vwrap\"><div class=\"box rise warn\" style=\"--d:0.00s\"><b>Breaking<\/b>: renaming an exposed key, removing or renaming a required prop, changing an event payload, bumping a shared singleton's major version.<\/div><div class=\"box rise ok\" style=\"--d:0.25s\"><b>Safe<\/b>: adding a new expose, adding an optional prop, adding a new event, or a minor/patch bump inside the shared range.<\/div><div class=\"box rise ok\" style=\"--d:0.50s\"><b>Pattern<\/b>: expand → migrate → contract. Ship the new key alongside the old one, move consumers over, then delete the old one.<\/div><\/div>","p":"Nothing at build time will tell you that the shell still passes <code>userId<\/code> after catalog renamed it to <code>customerId<\/code>. Contract tests or an integration run against the <b>real<\/b> deployed shell are what catch it."},{"k":"Section 7 · Rollback","h":"Rollback = repoint, not rebuild","v":"<div class=\"flowchips\"><span class=\"chip pop\" style=\"--d:0.00s;background:#4ea8ff\">registry: catalog → v13<\/span><span class=\"arr pop\" style=\"--d:0.15s\">→<\/span><span class=\"chip pop\" style=\"--d:0.30s;background:#a78bfa\">errors spike<\/span><span class=\"arr pop\" style=\"--d:0.45s\">→<\/span><span class=\"chip pop\" style=\"--d:0.60s;background:#3ddc97\">registry: catalog → v12<\/span><span class=\"arr pop\" style=\"--d:0.75s\">→<\/span><span class=\"chip pop\" style=\"--d:0.90s;background:#f7d046\">recovered<\/span><\/div>","p":"If remote URLs are versioned (<code>/catalog/v13/mf-manifest.json<\/code>) and the shell reads them from a registry, rolling back means changing one pointer, and it takes seconds. If the URL is a fixed \"latest\" path, rollback means rebuilding and redeploying the old version."},{"quiz":true,"k":"Quiz 8 / 8 · Deploy","h":"After a remote deploy, some users see \"ChunkLoadError\" until they refresh. Most likely cause?","opts":[["A bug in React.lazy",0],["Old hashed chunks were deleted while users still had the previous entry loaded",1],["The shell needs strictVersion",0]],"right":"Long-lived tabs hold the old entry file, which asks for the old chunks. Keep previous assets around and handle ChunkLoadError with a reload prompt.","wrong":"It's <b>version skew<\/b>: deleting old chunks breaks tabs that are still open. Deploys should be additive."},{"k":"Section 7 · Go deeper","h":"Go deeper","v":"<div class=\"vwrap\"><a class=\"box rise\" style=\"--d:0.0s;text-decoration:none;display:block\" href=\"https://web.dev/articles/http-cache\" target=\"_blank\" rel=\"noopener noreferrer\"><b>web.dev · Prevent unnecessary network requests with the HTTP Cache<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>Cache-Control, immutable, and how to cache hashed assets versus entry files.<\/small><\/a><a class=\"box rise\" style=\"--d:0.2s;text-decoration:none;display:block\" href=\"https://github.com/module-federation/module-federation-examples\" target=\"_blank\" rel=\"noopener noreferrer\"><b>module-federation-examples (GitHub)<\/b> <span style=\"color:var(--css)\">↗<\/span><br><small>Dozens of runnable setups: dynamic remotes, error handling, Vite, Rspack, routing.<\/small><\/a><\/div>","p":"Optional reading. Each link opens in a new tab."},{"sect":1,"num":"LAB","kicker":"Section 8 · Hands-on","h":"Build a shell and a remote","p":"Two webpack apps on your laptop. Load one into the other, then break it on purpose so you recognise the errors when you see them in real work."},{"k":"Lab 1 / 4 · Shell (host)","h":"shell/webpack.config.js","lab":true,"cmp":[["JS","// shell/webpack.config.js\nconst HtmlWebpackPlugin = require('html-webpack-plugin');\nconst { ModuleFederationPlugin } = require('webpack').container;\nconst deps = require('./package.json').dependencies;\n\nmodule.exports = {\n  entry: './src/index.js',\n  mode: 'development',\n  devServer: { port: 3000, historyApiFallback: true },\n  output: { publicPath: 'auto', clean: true },\n  resolve: { extensions: ['.js', '.jsx'] },\n  module: {\n    rules: [{\n      test: /\\.jsx?$/, exclude: /node_modules/,\n      use: { loader: 'babel-loader',\n        options: { presets: ['@babel/preset-env',\n          ['@babel/preset-react', { runtime: 'automatic' }]] } },\n    }],\n  },\n  plugins: [\n    new ModuleFederationPlugin({\n      name: 'shell',\n      remotes: {\n        // alias  : \"<remote name>@<url of remoteEntry.js>\"\n        catalog: 'catalog@http://localhost:3001/remoteEntry.js',\n      },\n      shared: {\n        react:      { singleton: true, requiredVersion: deps.react },\n        'react-dom':{ singleton: true, requiredVersion: deps['react-dom'] },\n      },\n    }),\n    new HtmlWebpackPlugin({ template: './public/index.html' }),\n  ],\n};","full config"],["JSX","// shell/src/index.js  (async boundary!)\nimport('./bootstrap');\n\n// shell/src/bootstrap.jsx\nimport { createRoot } from 'react-dom/client';\nimport App from './App';\ncreateRoot(document.getElementById('root')).render(<App />);\n\n// shell/src/App.jsx\nimport { lazy, Suspense, useEffect, useState } from 'react';\nimport ErrorBoundary from './ErrorBoundary';\nconst ProductList = lazy(() => import('catalog/ProductList'));\n\nexport default function App() {\n  const [cart, setCart] = useState(0);\n  useEffect(() => {\n    const h = () => setCart(n => n + 1);\n    window.addEventListener('cart:item-added', h);\n    return () => window.removeEventListener('cart:item-added', h);\n  }, []);\n  return (\n    <div>\n      <header>Shop shell · cart: {cart}<\/header>\n      <ErrorBoundary fallback={<p>Catalog is unavailable.<\/p>}>\n        <Suspense fallback={<p>Loading catalog…<\/p>}>\n          <ProductList currency=\"USD\" />\n        <\/Suspense>\n      <\/ErrorBoundary>\n    <\/div>\n  );\n}\n\n// shell/src/ErrorBoundary.jsx\nimport { Component } from 'react';\nexport default class ErrorBoundary extends Component {\n  state = { error: null };\n  static getDerivedStateFromError(error) { return { error }; }\n  componentDidCatch(error) { console.error('remote failed', error); }\n  render() { return this.state.error ? this.props.fallback : this.props.children; }\n}","shell/src"]],"p":"Scroll the code. The shell declares <code>remotes<\/code>, uses the bootstrap pattern, and lazy-loads the remote behind Suspense and an ErrorBoundary."},{"k":"Lab 2 / 4 · Catalog (remote)","h":"catalog/webpack.config.js","lab":true,"cmp":[["JS","// catalog/webpack.config.js\nconst HtmlWebpackPlugin = require('html-webpack-plugin');\nconst { ModuleFederationPlugin } = require('webpack').container;\nconst deps = require('./package.json').dependencies;\n\nmodule.exports = {\n  entry: './src/index.js',\n  mode: 'development',\n  devServer: { port: 3001, historyApiFallback: true,\n    headers: { 'Access-Control-Allow-Origin': '*' } },   // shell is :3000\n  output: { publicPath: 'auto', clean: true },\n  resolve: { extensions: ['.js', '.jsx'] },\n  module: {\n    rules: [{\n      test: /\\.jsx?$/, exclude: /node_modules/,\n      use: { loader: 'babel-loader',\n        options: { presets: ['@babel/preset-env',\n          ['@babel/preset-react', { runtime: 'automatic' }]] } },\n    }],\n  },\n  plugins: [\n    new ModuleFederationPlugin({\n      name: 'catalog',                  // container name\n      filename: 'remoteEntry.js',       // the entry file\n      exposes: {\n        './ProductList': './src/ProductList',   // public API\n      },\n      shared: {\n        react:      { singleton: true, requiredVersion: deps.react },\n        'react-dom':{ singleton: true, requiredVersion: deps['react-dom'] },\n      },\n    }),\n    new HtmlWebpackPlugin({ template: './public/index.html' }),\n  ],\n};"
